[workspace]
resolver = "3"
members = ["crates/expanse", "crates/expanse-capi"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/orieg/expanse"
authors = ["Nicolas Brousse <nicolas@brousse.info>"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[workspace]
resolver = "3"
members = [
    "crates/expanse",
    "crates/expanse-capi",
    "crates/expanse-py",
    "crates/expanse-node",
    "crates/expanse-wasm",
]
default-members = [
    "crates/expanse",
    "crates/expanse-capi",
    "crates/expanse-node",
    "crates/expanse-wasm",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/orieg/expanse"
readme = "README.md"
homepage = "https://github.com/orieg/expanse"
authors = ["Nicolas Brousse <nicolas@brousse.info>"]

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1

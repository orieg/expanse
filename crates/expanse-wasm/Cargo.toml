[package]
name = "expanse-wasm"
version = "0.11.2"
edition = "2024"
rust-version.workspace = true
description = "WebAssembly bindings for Expanse: clean-room, pure-Rust Judy arrays for browser and edge runtimes"
repository = "https://github.com/orieg/expanse"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
expanse-trie = { version = "0.11.2", path = "../expanse" }

[dev-dependencies]

wasm-bindgen-test = "0.3"

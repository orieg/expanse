[package]
name = "expanse-wasm"
version = "0.5.0"
edition = "2024"
rust-version.workspace = true
description = "WebAssembly bindings for Expanse: clean-room, pure-Rust Judy arrays for browser and edge runtimes"
repository = "https://github.com/orieg/expanse"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
expanse-trie = { path = "../expanse" }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
console_error_panic_hook = ["dep:console_error_panic_hook"]

[dev-dependencies]

wasm-bindgen-test = "0.3"

[package]
name = "expanse-trie"
version = "0.1.0"
description = "Expanse: clean-room, pure-Rust Judy arrays (expanse-partitioned digital tries) modernized for current hardware"
keywords = ["judy", "trie", "radix", "sparse", "data-structures"]
categories = ["data-structures"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "expanse_trie"

[dependencies]

[dev-dependencies]
criterion = "0.8"

# Loom model-checks the OCC/EBR protocol (occ module) under
# `RUSTFLAGS="--cfg loom" cargo test -p expanse-trie --release loom_`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[bench]]
name = "compare"
harness = false

[lints]
workspace = true

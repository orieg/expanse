[package]
name = "expanse-trie"
version = "0.1.0"
description = "Expanse: clean-room, pure-Rust Judy arrays (expanse-partitioned digital tries) modernized for current hardware"
keywords = ["judy", "trie", "radix", "sparse", "data-structures"]
categories = ["data-structures"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/expanse-trie"
readme.workspace = true
authors.workspace = true

[lib]
name = "expanse_trie"

[dependencies]

[dev-dependencies]
criterion = "0.8"
# Property tests with shrinking: a failure reduces to a minimal op
# sequence (docs/TESTING.md layer 2).
proptest = "1"
# Deterministic instruction/cache-miss counts (docs/BENCHMARKING.md):
# wall-clock cannot resolve the few-percent changes the perf work makes
# (issue #1). Needs valgrind, so these run on Linux/CI only.
iai-callgrind = "0.16"

# Loom model-checks the OCC/EBR protocol (occ module) under
# `RUSTFLAGS="--cfg loom" cargo test -p expanse-trie --release loom_`.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[bench]]
name = "compare"
harness = false
test = false

[[bench]]
name = "instructions"
harness = false
test = false

[lints]
workspace = true

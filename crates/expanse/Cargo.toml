[package]
name = "expanse-trie"
version = "0.4.1"
description = "Expanse: clean-room, pure-Rust Judy arrays (expanse-partitioned digital tries) modernized for current hardware"
keywords = ["judy", "trie", "radix", "sparse", "data-structures"]
categories = ["data-structures"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/expanse-trie"
readme.workspace = true
authors.workspace = true

[lib]
name = "expanse_trie"

[features]
default = ["std"]
std = []
# Diagnostic-only: arms the `occ_stats` event counters (OCC retries,
# writer-lock fallbacks, epoch advances). Off by default and compiled
# out entirely — never enable it for a published benchmark.
occ-stats = []

[dependencies]

[dev-dependencies]
criterion = "0.8"
proptest = "1"
iai-callgrind = "0.16"
roaring = "0.10"
hashbrown = "0.15"
crossbeam-skiplist = "0.1"
dashmap = "6"
rand = "0.8"
rand_distr = "0.4"
hdrhistogram = "7.5"
serde_json = "1.0"

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[bench]]
name = "compare"
harness = false
test = false


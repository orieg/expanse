[package]
name = "expanse-trie"
version = "0.7.0"
description = "Expanse: clean-room, pure-Rust Judy arrays (expanse-partitioned digital tries) for 64-bit and 32-bit targets"
keywords = ["judy", "libjudy", "radix-trie", "trie", "sparse-array"]
categories = ["data-structures", "no-std"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/expanse-trie"
readme.workspace = true
authors.workspace = true

[lib]
name = "expanse_trie"

[features]
default = ["std"]
std = []
# Diagnostic-only: arms the `occ_stats` event counters (OCC retries,
# writer-lock fallbacks, epoch advances). Off by default and compiled
# out entirely — never enable it for a published benchmark.
occ-stats = []
# Retired name, promoted to the default (Refs #568, #930): the writer mutex,
# writer gate, tree population counter and version word are on their own cache
# lines in every build. Kept declared so Cargo does not reject an old
# `--features lock-padded` invocation; `lib.rs` turns it into a compiler error
# naming the inverse, and it is never a no-op (AGENTS.md §2.7).
lock-padded = []
# Diagnostic-only: restores the packed layout the default now pads away, so the
# promoted default can itself be ablated (AGENTS.md §2.7). With this on,
# `Line<X>` is a transparent alias again. Applies to the 64-bit `sync` wrappers
# only — `sync32` is single-writer, has no writer mutex, and already pads its
# version word.
ablation-unpadded-lock = []
# Diagnostic-only: epoch-advance interval variants, to measure what the advance
# scan costs the write path. `advance-never` is sound only for workloads that
# retire nothing. Features are additive: with both on, `advance-never` wins.
# 64-bit `sync` wrappers only (`sync32` has no epoch collector).
advance-every-4096 = []
advance-never = []
# Diagnostic-only: arms the AVX-512 arms of the `avx512_bitmap` bench and
# the `--force` path of the `avx512_probe` example. Off by default, and it
# must stay off: `core::arch`'s AVX-512 intrinsics are stable only since
# Rust 1.89, so enabling it raises the effective MSRV above the declared
# 1.88 floor. No library code is behind this feature.
avx512 = []
# Retired name, promoted to the default (Refs #568, #930) in its DEFERRED-GATED
# form: `NodeAlloc` keeps its three inline atomics and allocates one
# cache-line-aligned accounting shard per writer slot only in `defer_to`, in the
# same boxed cell as the collector handle, so a tree that never becomes
# concurrent carries no extra word and `size_of::<ExpanseMap>()` stays 712 B
# rather than the inline layout's 4,864 B. Kept
# declared so Cargo does not reject an old `--features ablation-sharded-alloc`
# invocation; `lib.rs` turns it into a compiler error naming the inverse, and it
# is never a no-op (AGENTS.md §2.7).
ablation-sharded-alloc = []
# Diagnostic-only: never allocates the shards, so the three accounting atomics
# (`bytes_in_use`, `live_allocs`, `total_allocs`) stay shared across writers as
# they were before the promotion — the state the per-slot shards replaced, so
# the promoted default can itself be ablated (AGENTS.md §2.7).
ablation-unsharded-alloc = []
# Retired name (Refs #568): striped epoch garbage bins are the production
# default. It was declared as a no-op alias, which AGENTS.md §2.7 forbids — a
# no-op silently compares the default with itself — so `lib.rs` now turns it
# into a compiler error naming `writer_scaling` instead.
ablation-striped-epoch = []
# Deprecated / Landed in production standard (Refs #568): Per-writer-stripe
# collector freelists are now the standard default architecture. Retained to
# prevent Cargo from rejecting `--features ablation-striped-freelist` so rustc
# emits an informative compiler error pointing to `ablation-unstriped-freelist`.
ablation-striped-freelist = []
# Diagnostic-only: reverts collector freelists to a single shared array across
# all writer stripes (reverting Hypothesis D Arm c to measure contention).
ablation-unstriped-freelist = []
# Diagnostic-only: serialises every `SyncExpanseStrMap` mutation on the writer
# mutex under the whole-operation tree bracket — the protocol the string
# wrapper's per-node optimistic write path replaced (Refs #929, METHODOLOGY
# section 17), kept so the default can be measured against it (AGENTS.md
# section 2.7). Readers are unchanged: the serialised path brackets the same
# per-node cover words the optimistic writers take as locks.
ablation-str-serial-writers = []
# Diagnostic-only: serialises every `SyncExpanseBlobMap` mutation on the writer
# mutex under the whole-operation tree bracket — the protocol the blob
# wrapper's per-node optimistic write path replaced (Refs #929, METHODOLOGY
# section 21), kept so the default can be measured against it (AGENTS.md
# section 2.7).
ablation-blob-serial-writers = []
# Diagnostic-only, default off: an interventional ablation (AGENTS.md section
# 8.20.3) of the one shared mutex on `SyncExpanseBlobMap`'s optimistic insert
# path (Refs #929, METHODOLOGY section 21). Each writer slot bump-allocates
# arena payloads into a chunk it owns privately, and takes the shared
# `arena_write` mutex only to obtain a new chunk; live-byte accounting is kept
# per slot and folded into the arena inside every quiesced section. Not a
# promotion candidate as it stands (AGENTS.md section 2.7): it exists to decide
# whether that mutex is what makes blob throughput retrograde past two writers.
# Mutually exclusive with `ablation-blob-serial-writers`.
ablation-blob-writer-arenas = []


[dependencies]

[dev-dependencies]
criterion = "0.8"
# benches/domain.rs pins glibc's heap-trim policy for the process (#701)
libc = "0.2"
proptest = "1"
iai-callgrind = "0.16"
roaring = "0.10"
hashbrown = "0.15"
crossbeam-skiplist = "0.1"
dashmap = "6"
rand = "0.8"
rand_distr = "0.4"
hdrhistogram = "7.5"
serde_json = "1.0"
blart = "0.5.0"

[target.'cfg(loom)'.dependencies]
loom = "0.7"


[package]
name = "expanse-trie"
version = "0.7.0"
description = "Expanse: clean-room, pure-Rust Judy arrays (expanse-partitioned digital tries) for 64-bit and 32-bit targets"
keywords = ["judy", "libjudy", "radix-trie", "trie", "sparse-array"]
categories = ["data-structures", "no-std"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/expanse-trie"
readme.workspace = true
authors.workspace = true

[lib]
name = "expanse_trie"

[features]
default = ["std"]
std = []
# Diagnostic-only: arms the `occ_stats` event counters (OCC retries,
# writer-lock fallbacks, epoch advances). Off by default and compiled
# out entirely — never enable it for a published benchmark.
occ-stats = []
# Diagnostic-only: put the writer mutex, writer gate, tree population counter
# and the version word on their own cache lines, to measure what their sharing
# costs. Extra lines per structure; never the default. Applies to the 64-bit
# `sync` wrappers only — `sync32` is single-writer, has no writer mutex, and
# already pads its version word.
lock-padded = []
# Diagnostic-only: epoch-advance interval variants, to measure what the advance
# scan costs the write path. `advance-never` is sound only for workloads that
# retire nothing. Features are additive: with both on, `advance-never` wins.
# 64-bit `sync` wrappers only (`sync32` has no epoch collector).
advance-every-4096 = []
advance-never = []
# Diagnostic-only: arms the AVX-512 arms of the `avx512_bitmap` bench and
# the `--force` path of the `avx512_probe` example. Off by default, and it
# must stay off: `core::arch`'s AVX-512 intrinsics are stable only since
# Rust 1.89, so enabling it raises the effective MSRV above the declared
# 1.88 floor. No library code is behind this feature.
avx512 = []
# Diagnostic-only: sharded allocator accounting counters (Hypothesis D Arm a),
# to measure what atomic ping-ponging in `bytes_in_use`, `live_allocs`, and
# `total_allocs` costs concurrent writer scaling.
ablation-sharded-alloc = []
# Diagnostic-only: striped epoch garbage bins and sharded retained bytes
# (Hypothesis D Arm b), to measure what the epoch bin mutex and retained_bytes
# sharing cost concurrent writer scaling.
ablation-striped-epoch = []
# Diagnostic-only: per-writer-stripe collector freelists (Hypothesis D Arm c),
# to measure what the shared per-class freelist mutex, taken on every OCC
# size-class allocation, costs concurrent writer scaling.
ablation-striped-freelist = []

[dependencies]

[dev-dependencies]
criterion = "0.8"
# benches/domain.rs pins glibc's heap-trim policy for the process (#701)
libc = "0.2"
proptest = "1"
iai-callgrind = "0.16"
roaring = "0.10"
hashbrown = "0.15"
crossbeam-skiplist = "0.1"
dashmap = "6"
rand = "0.8"
rand_distr = "0.4"
hdrhistogram = "7.5"
serde_json = "1.0"
blart = "0.5.0"

[target.'cfg(loom)'.dependencies]
loom = "0.7"


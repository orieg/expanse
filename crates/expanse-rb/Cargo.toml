[package]
name = "expanse-rb"
version = "0.5.0"
edition = "2024"
# Not a workspace member (built by the Ruby gem toolchain), so the MSRV is
# stated literally; keep in lockstep with [workspace.package] rust-version.
rust-version = "1.88"

[lib]
crate-type = ["cdylib"]

[dependencies]
magnus = { version = "0.7", features = ["rb-sys"] }
expanse-trie = { path = "../expanse" }

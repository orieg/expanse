[package]
name = "expanse-capi"
version = "0.5.0"
description = "libexpanse: C ABI for the Expanse trie engine, drop-in binary replacement for libjudy"
keywords = ["judy", "trie", "ffi", "capi", "c-api"]
categories = ["external-ffi-bindings", "data-structures"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/expanse-capi"
readme.workspace = true
authors.workspace = true

[lib]
# The C artifact is libexpanse.so / expanse.dll / libexpanse.a; a
# libjudy-compat package adds the libJudy soname symlink (COMPAT.md).
name = "expanse"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Enables the differential-oracle tests against a dlopen'd stock
# libjudy (Linux; CI installs libjudy-dev). See docs/COMPAT.md gate G1.
oracle = []

[dependencies]
expanse-trie = { version = "0.5.0", path = "../expanse" }

[lints]
workspace = true

[dev-dependencies]
# Deterministic vs-stock comparison (benches/vs_stock.rs).
iai-callgrind = "0.16"

[[bench]]
name = "vs_stock"
harness = false
test = false

[[bench]]
name = "smoke_instructions"
harness = false
test = false

# Detached from the root workspace on purpose.
#
# This crate compiles C++ (HOT) and is the only place in the repository that
# does. The root workspace's `cargo check --workspace --all-targets` — which the
# `Core / MSRV 1.88 Build` job runs — must never reach it, or every contributor
# and every CI lane would need a C++ toolchain and an initialised submodule for
# a benchmark they are not running. The empty `[workspace]` table below detaches
# it; the suite runner builds it explicitly with `--manifest-path`.
#
# Same reasoning as the `avx512` suite's off-by-default feature
# (docs/benchmarks/avx512/README.md §3), one level coarser.
[package]
name = "expanse-hot-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"
description = "HOT (Height Optimized Trie) FFI comparison arms for Expanse — bench-only, not published"

[workspace]

[features]
# The HOT-ROWEX concurrent arm (#692, METHODOLOGY.md §11). Off by default:
# it compiles a second shim and builds libtbb from HOT's nested submodule,
# which the single-threaded arms never need.
rowex = []
# Diagnostic-only, forwarded to the engine: arms the OCC event counters that
# the protocol-health cells read. A binary built with it publishes event
# ratios and never a timing (§11.3, decision 5).
occ-stats = ["expanse-trie/occ-stats"]

[dependencies]
expanse-trie = { path = "../expanse" }

[build-dependencies]
cc = "1"

[[bin]]
name = "hot_validate"
path = "src/bin/hot_validate.rs"

[[bin]]
name = "instrument_bridge"
path = "src/bin/instrument_bridge.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bin]]
name = "keyspace_density_probe"
path = "src/bin/keyspace_density_probe.rs"

[[bin]]
name = "hot_memory_curve"
path = "src/bin/hot_memory_curve.rs"

[[bin]]
name = "hot_probe_symmetry"
path = "src/bin/hot_probe_symmetry.rs"

[[bin]]
name = "hot_latency"
path = "src/bin/hot_latency.rs"

[[bin]]
name = "hot_string_validate"
path = "src/bin/hot_string_validate.rs"

[[bin]]
name = "hot_string_latency"
path = "src/bin/hot_string_latency.rs"

[[bin]]
name = "hot_string_memory"
path = "src/bin/hot_string_memory.rs"

[[bin]]
name = "hot_concurrent"
path = "src/bin/hot_concurrent.rs"
required-features = ["rowex"]

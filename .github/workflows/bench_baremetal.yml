name: Bare-Metal Benchmarks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to checkout (branch, tag, sha)'
        required: true
        default: 'main'
      base_ref:
        description: 'Base Git ref to compare against'
        required: false
      pr_number:
        description: 'PR number to post results to'
        required: false
      benchmark_suite:
        description: 'Benchmark suite to run (all, vs_stock, instructions, comparative)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - vs_stock
          - instructions
          - comparative
  issue_comment:
    types: [created]

jobs:
  bench-baremetal:
    name: Run Remote Bare-Metal Benchmarks
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (startsWith(github.event.comment.body, '/bench') || startsWith(github.event.comment.body, '/benchmark')))
    runs-on: ubuntu-latest
    steps:
      - name: Check permissions
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'write'].includes(permission.permission)) {
              core.setFailed('User does not have permission to trigger benchmarks.');
            }

      - name: Resolve PR info
        id: pr-info
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.head.sha);
            core.setOutput('base_ref', pr.base.sha);
            core.setOutput('pr_number', context.issue.number.toString());
            
            const comment = context.payload.comment.body;
            let suite = 'all';
            if (comment.includes('vs_stock')) suite = 'vs_stock';
            else if (comment.includes('instructions')) suite = 'instructions';
            else if (comment.includes('comparative')) suite = 'comparative';
            core.setOutput('benchmark_suite', suite);

      - name: Set input variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
            echo "base_ref=${{ github.event.inputs.base_ref }}" >> $GITHUB_OUTPUT
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "benchmark_suite=${{ github.event.inputs.benchmark_suite }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ steps.pr-info.outputs.ref }}" >> $GITHUB_OUTPUT
            echo "base_ref=${{ steps.pr-info.outputs.base_ref }}" >> $GITHUB_OUTPUT
            echo "pr_number=${{ steps.pr-info.outputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "benchmark_suite=${{ steps.pr-info.outputs.benchmark_suite }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.ref }}
          fetch-depth: 0

      - name: Setup SSH
        run: |
          if [ -z "${{ secrets.BENCH_SSH_HOST }}" ] || [ -z "${{ secrets.BENCH_SSH_USER }}" ] || [ -z "${{ secrets.BENCH_SSH_KEY }}" ] || [ -z "${{ secrets.BENCH_REMOTE_DIR }}" ]; then
            echo "Error: Benchmark secrets (BENCH_SSH_HOST, BENCH_SSH_USER, BENCH_SSH_KEY, BENCH_REMOTE_DIR) are not configured."
            echo "Please configure these secrets in the repository settings."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${{ secrets.BENCH_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.BENCH_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Run remote benchmark script
        id: bench
        env:
          BENCH_HOST: ${{ secrets.BENCH_SSH_USER }}@${{ secrets.BENCH_SSH_HOST }}
          BENCH_REPO: ${{ secrets.BENCH_REMOTE_DIR }}
        run: |
          bash scripts/run_remote_bench.sh "${{ steps.vars.outputs.benchmark_suite }}" > bench_output.txt 2>&1
          cat bench_output.txt
          echo "BENCH_SUMMARY<<EOF" >> $GITHUB_ENV
          cat bench_output.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          echo "## Bare-Metal Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat bench_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Find Comment
        if: steps.vars.outputs.pr_number != ''
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ steps.vars.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: Bare-Metal Benchmark Results

      - name: Create or update PR comment
        if: steps.vars.outputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ steps.vars.outputs.pr_number }}
          body: |
            ## Bare-Metal Benchmark Results
            
            Suite: `${{ steps.vars.outputs.benchmark_suite }}`
            Ref: `${{ steps.vars.outputs.ref }}`
            
            ```text
            ${{ env.BENCH_SUMMARY }}
            ```
          edit-mode: replace

name: Bare-Metal Benchmarks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to checkout (branch, tag, sha)'
        required: true
        default: 'main'
      base_ref:
        description: 'Base Git ref to compare against'
        required: false
      pr_number:
        description: 'PR number to post results to'
        required: false
      benchmark_suite:
        description: 'Benchmark suite to run (all, extended, vs_stock, instructions, comparative, ycsb, concurrency)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - extended
          - vs_stock
          - instructions
          - comparative
          - ycsb
          - concurrency
  issue_comment:
    types: [created]

# The job posts reactions, the start acknowledgment, and the results comment
# through the workflow token; the repository default token is read-only, so
# without this block every comment write 403s (run 33016450539: benchmarks
# succeeded, report posting failed).
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  bench-baremetal:
    name: Run Bare-Metal Benchmarks
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (startsWith(github.event.comment.body, '/bench') || startsWith(github.event.comment.body, '/benchmark')))
    runs-on: [self-hosted, linux]
    steps:
      - name: Check permissions
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'write'].includes(permission.permission)) {
              core.setFailed('User does not have permission to trigger benchmarks.');
            }

      - name: React to trigger comment
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket',
              });
            } catch (e) {
              core.warning(`Failed to add reaction to trigger comment: ${e.message}`);
            }

      - name: Resolve PR info
        id: pr-info
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.head.sha);
            core.setOutput('base_ref', pr.base.sha);
            core.setOutput('pr_number', context.issue.number.toString());
            
            const comment = context.payload.comment.body;
            let suite = 'all';
            if (comment.includes('extended') || comment.includes('full')) suite = 'extended';
            else if (comment.includes('vs_stock')) suite = 'vs_stock';
            else if (comment.includes('instructions')) suite = 'instructions';
            else if (comment.includes('comparative')) suite = 'comparative';
            else if (comment.includes('ycsb')) suite = 'ycsb';
            else if (comment.includes('concurrency')) suite = 'concurrency';
            core.setOutput('benchmark_suite', suite);

      - name: Set input variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
            echo "base_ref=${{ github.event.inputs.base_ref }}" >> $GITHUB_OUTPUT
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "benchmark_suite=${{ github.event.inputs.benchmark_suite }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ steps.pr-info.outputs.ref }}" >> $GITHUB_OUTPUT
            echo "base_ref=${{ steps.pr-info.outputs.base_ref }}" >> $GITHUB_OUTPUT
            echo "pr_number=${{ steps.pr-info.outputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "benchmark_suite=${{ steps.pr-info.outputs.benchmark_suite }}" >> $GITHUB_OUTPUT
          fi

      - name: Find comment for start acknowledgment
        id: fc-start
        if: steps.vars.outputs.pr_number != ''
        continue-on-error: true
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ steps.vars.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: Bare-Metal Benchmark Results

      - name: Post start acknowledgment
        if: steps.vars.outputs.pr_number != ''
        continue-on-error: true
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc-start.outputs.comment-id }}
          issue-number: ${{ steps.vars.outputs.pr_number }}
          body: |
            ⏳ Bare-Metal Benchmark Results pending — suite `${{ steps.vars.outputs.benchmark_suite }}` running on `honeycomb`: [view run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          edit-mode: replace

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.ref }}
          fetch-depth: 0

      - name: System Load Hygiene Check
        id: sysinfo
        # Captures the load snapshot into the report (non-gating, per
        # docs/BENCHMARKING.md rule 2) and derives an anonymized host
        # description from the runner itself. No hostnames, no command
        # paths: this output lands in a public PR comment.
        run: |
          echo "=== System Load & Host Snapshot ==="
          uname -srm
          uptime
          echo "Top CPU consumers:"
          ps -A -o %cpu= -o %mem= -o comm= | sort -rn | head -n 8 || true

          {
            echo "<details>"
            echo "<summary><b>System Load Snapshot (non-gating, captured at run start)</b></summary>"
            echo ""
            echo '```text'
            echo "kernel: $(uname -srm)"
            echo "uptime:$(uptime)"
            echo ""
            echo "top CPU consumers (%cpu %mem command):"
            { ps -A -o %cpu= -o %mem= -o comm= | sort -rn | head -n 8 || true; } \
              | awk '{cmd=$3; sub(".*/", "", cmd); printf "%7s %6s %s\n", $1, $2, cmd}'
            echo '```'
            echo ""
            echo "</details>"
          } > system-load.md

          MODEL=$(lscpu 2>/dev/null | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)
          [ -n "$MODEL" ] || MODEL="$(uname -m)"
          THREADS=$(nproc 2>/dev/null || echo "?")
          L3=$(lscpu 2>/dev/null | sed -n 's/^L3 cache:[[:space:]]*//p' | head -n 1 | sed 's/ (.*)//')
          KERNEL=$(uname -sr)
          DESC="$MODEL ($THREADS threads${L3:+, $L3 L3}, $KERNEL)"
          echo "host_desc=$DESC" >> "$GITHUB_OUTPUT"
          echo "Host description: $DESC"

      - name: Run Native Bare-Metal Benchmarks (Dual-Pass)
        id: bench
        # shell: bash implies pipefail: a benchmark that crashes must fail the
        # step instead of exiting 0 through tee. Base-pass commands keep
        # `|| true` deliberately (a broken base commit must not hard-block the
        # run); the report renders a loud NO BASELINE section instead.
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/.local/lib:$LD_LIBRARY_PATH"
          export LIBRARY_PATH="$HOME/.local/lib:$LIBRARY_PATH"
          export C_INCLUDE_PATH="$HOME/.local/include:$C_INCLUDE_PATH"

          git config --global --add safe.directory "$PWD"

          REF="${{ steps.vars.outputs.ref }}"
          BASE_REF="${{ steps.vars.outputs.base_ref }}"
          SUITE="${{ steps.vars.outputs.benchmark_suite }}"

          echo "Configured Ref: $REF"
          echo "Configured Base Ref: $BASE_REF"
          echo "Configured Suite: $SUITE"

          # Fail fast if the suite needs Callgrind and the host lacks the
          # tooling: an iai-callgrind run without valgrind or a runner binary
          # produces garbage/empty output, which must not become a report.
          case "$SUITE" in
            all|extended|instructions|vs_stock)
              for tool in valgrind iai-callgrind-runner; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  echo "::error::Suite '$SUITE' requires Callgrind, but '$tool' is not installed on this runner. Install valgrind and a version-matched iai-callgrind-runner (see the ci.yml callgrind jobs) before re-triggering."
                  exit 1
                fi
              done
              ;;
          esac

          # Host-wide benchmark lock (docs/BENCHMARKING.md, methodology rule
          # 8): one suite at a time per machine, across every checkout.
          # `mkdir` is atomic; the lock names its owner so a refused start
          # says who holds the host.
          BENCH_LOCK="${EXPANSE_BENCH_LOCK:-${TMPDIR:-/tmp}/expanse-bench.lock}"
          if ! mkdir "${BENCH_LOCK}" 2>/dev/null; then
            echo "::error::refusing to start: benchmark lock ${BENCH_LOCK} is held by:"
            { cat "${BENCH_LOCK}/owner" 2>/dev/null || true; } >&2
            exit 75
          fi
          printf 'suite=ci-%s pid=%s start=%s\n' "$SUITE" "$$" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${BENCH_LOCK}/owner"
          trap 'rm -rf "${BENCH_LOCK}"' EXIT

          # Detect / resolve base_ref if not explicitly provided
          if [ -z "$BASE_REF" ]; then
            BASE_REF=$(git merge-base origin/main "$REF" 2>/dev/null || echo "")
            if [ -z "$BASE_REF" ]; then
              if git rev-parse --verify origin/main >/dev/null 2>&1; then
                HEAD_SHA=$(git rev-parse "$REF" 2>/dev/null || git rev-parse HEAD)
                MAIN_SHA=$(git rev-parse origin/main 2>/dev/null || echo "")
                if [ -n "$MAIN_SHA" ] && [ "$HEAD_SHA" != "$MAIN_SHA" ]; then
                  BASE_REF="origin/main"
                fi
              fi
            fi
          fi

          # If BASE_REF resolves to the same commit as REF, don't run dual pass against self
          if [ -n "$BASE_REF" ]; then
            HEAD_SHA=$(git rev-parse "$REF" 2>/dev/null || git rev-parse HEAD)
            BASE_SHA=$(git rev-parse "$BASE_REF" 2>/dev/null || echo "")
            if [ "$HEAD_SHA" = "$BASE_SHA" ]; then
              echo "Base ref $BASE_REF resolves to head commit $HEAD_SHA; skipping separate base pass."
              BASE_REF=""
            fi
          fi

          # ====================================================================
          # PASS 1: Base Branch (Baseline)
          # ====================================================================
          if [ -n "$BASE_REF" ]; then
            echo "=== [Pass 1] Benchmarking Base Ref: $BASE_REF ==="
            if git checkout "$BASE_REF"; then
              # Pre-compile release C ABI. The whole base pass is non-fatal
              # (a broken base commit must not hard-block the run); the
              # degradation is reported loudly by perf_report.py's NO
              # BASELINE section and the sticky comment's Base Ref guard.
              if cargo build --release -p expanse-capi; then
                export EXPANSE_CDYLIB="$PWD/target/release/libexpanse.so"

                if [ "$SUITE" = "all" ] || [ "$SUITE" = "extended" ] || [ "$SUITE" = "instructions" ]; then
                  echo "Running base instructions benchmark..."
                  cargo bench --bench instructions -p expanse-trie -- --save-baseline=baremetal_base | tee base-instructions.txt || true
                fi

                if [ "$SUITE" = "all" ] || [ "$SUITE" = "extended" ] || [ "$SUITE" = "vs_stock" ]; then
                  echo "Running base vs_stock benchmark..."
                  cargo bench --bench vs_stock -p expanse-capi -- --save-baseline=baremetal_base_vs_stock | tee base-vs-stock.txt || true
                fi
              else
                echo "Warning: base ref $BASE_REF failed to build; continuing single pass."
                BASE_REF=""
              fi

              git checkout "$REF"
            else
              echo "Warning: Failed to checkout $BASE_REF, continuing single pass."
              BASE_REF=""
            fi
          fi

          # ====================================================================
          # PASS 2: Head Branch (Candidate)
          # ====================================================================
          echo "=== [Pass 2] Benchmarking Head Ref: $REF ==="
          git checkout "$REF"
          cargo build --release -p expanse-capi
          export EXPANSE_CDYLIB="$PWD/target/release/libexpanse.so"

          case "$SUITE" in
            "vs_stock")
              if [ -f base-vs-stock.txt ]; then
                cargo bench --bench vs_stock -p expanse-capi -- --baseline=baremetal_base_vs_stock | tee head-vs-stock.txt
              else
                cargo bench --bench vs_stock -p expanse-capi -- --save-baseline=baremetal_main_vs_stock | tee head-vs-stock.txt
              fi
              ;;
            "instructions")
              if [ -f base-instructions.txt ]; then
                cargo bench --bench instructions -p expanse-trie -- --baseline=baremetal_base | tee head-instructions.txt
              else
                cargo bench --bench instructions -p expanse-trie -- --save-baseline=baremetal_main | tee head-instructions.txt
              fi
              cargo run --release -p expanse-trie --example bytes_per_key | tee bytes-per-key.txt
              cargo run --release -p expanse-trie --example bytes_per_key_32 | tee bytes-per-key-32.txt
              ;;
            "comparative")
              cargo bench --bench comparative -p expanse-trie | tee comparative.txt
              python3 scripts/bench_report.py --quick --format markdown | tee head-to-head.md
              ;;
            "extended")
              if [ -f base-instructions.txt ]; then
                cargo bench --bench instructions -p expanse-trie -- --baseline=baremetal_base | tee head-instructions.txt
              else
                cargo bench --bench instructions -p expanse-trie -- --save-baseline=baremetal_main | tee head-instructions.txt
              fi

              if [ -f base-vs-stock.txt ]; then
                cargo bench --bench vs_stock -p expanse-capi -- --baseline=baremetal_base_vs_stock | tee head-vs-stock.txt
              else
                cargo bench --bench vs_stock -p expanse-capi -- --save-baseline=baremetal_main_vs_stock | tee head-vs-stock.txt
              fi

              cargo run --release -p expanse-trie --example bytes_per_key | tee bytes-per-key.txt
              cargo run --release -p expanse-trie --example bytes_per_key_32 | tee bytes-per-key-32.txt

              cargo bench --bench comparative -p expanse-trie | tee comparative.txt
              python3 scripts/bench_report.py --extended --arch-sweep --format markdown | tee head-to-head.md
              ;;
            "ycsb")
              cargo bench --bench ycsb -p expanse-trie | tee ycsb.txt
              ;;
            "concurrency")
              # Wall-clock Sync* scaling instrument (benches/concurrency.rs,
              # harness = false; configured via env, not CLI args). Reduced
              # sweep to stay within the job window; report-only.
              EXPANSE_BENCH_THREADS="1,4,16" EXPANSE_BENCH_WORKLOADS="100,50" \
                cargo bench --bench concurrency -p expanse-trie | tee concurrency.txt
              ;;
            "all"|*)
              if [ -f base-instructions.txt ]; then
                cargo bench --bench instructions -p expanse-trie -- --baseline=baremetal_base | tee head-instructions.txt
              else
                cargo bench --bench instructions -p expanse-trie -- --save-baseline=baremetal_main | tee head-instructions.txt
              fi

              if [ -f base-vs-stock.txt ]; then
                cargo bench --bench vs_stock -p expanse-capi -- --baseline=baremetal_base_vs_stock | tee head-vs-stock.txt
              else
                cargo bench --bench vs_stock -p expanse-capi -- --save-baseline=baremetal_main_vs_stock | tee head-vs-stock.txt
              fi

              cargo run --release -p expanse-trie --example bytes_per_key | tee bytes-per-key.txt
              cargo run --release -p expanse-trie --example bytes_per_key_32 | tee bytes-per-key-32.txt

              cargo bench --bench comparative -p expanse-trie | tee comparative.txt
              python3 scripts/bench_report.py --quick --format markdown | tee head-to-head.md
              ;;
          esac

          # ====================================================================
          # Report Generation Step
          # ====================================================================
          # The sticky comment must not print a Base Ref for a comparison
          # that never ran: only report the base when its output actually
          # parses as benchmark results (bench headers present), matching
          # what perf_report.py / criterion could compare against.
          BASE_OK=false
          if [ -n "$BASE_REF" ]; then
            if { [ -f base-instructions.txt ] && grep -qE '^[[:alpha:]_][[:alnum:]_:]*::[[:alnum:]_]+' base-instructions.txt; } \
               || { [ -f base-vs-stock.txt ] && grep -qE '^[[:alpha:]_][[:alnum:]_:]*::[[:alnum:]_]+' base-vs-stock.txt; }; then
              BASE_OK=true
            fi
          fi
          echo "base_ok=$BASE_OK" >> "$GITHUB_OUTPUT"
          if [ "$BASE_OK" = "true" ]; then
            echo "base_line=- **Base Ref**: \`$BASE_REF\`" >> "$GITHUB_OUTPUT"
          else
            echo "base_line=- **Base Ref**: _none — no base comparison ran_" >> "$GITHUB_OUTPUT"
          fi

          if [ -f head-instructions.txt ]; then
            BASE_ARGS=""
            if [ -f base-instructions.txt ]; then
              BASE_ARGS="--base base-instructions.txt --base-ref $BASE_REF"
            fi
            HEAD_TO_HEAD_ARGS=""
            if [ -f head-to-head.md ]; then
              HEAD_TO_HEAD_ARGS="--head-to-head head-to-head.md"
            fi
            VS_STOCK_ARGS=""
            if [ -f head-vs-stock.txt ]; then
              VS_STOCK_ARGS="--vs-stock head-vs-stock.txt"
            fi
            BYTES_ARGS=""
            if [ -f bytes-per-key.txt ]; then
              BYTES_ARGS="--bytes bytes-per-key.txt"
            fi
            BYTES32_ARGS=""
            if [ -f bytes-per-key-32.txt ]; then
              BYTES32_ARGS="--bytes32 bytes-per-key-32.txt"
            fi

            python3 scripts/perf_report.py \
              --head head-instructions.txt \
              $BASE_ARGS \
              $HEAD_TO_HEAD_ARGS \
              $BYTES_ARGS \
              $BYTES32_ARGS \
              $VS_STOCK_ARGS \
              > baremetal-report.md
          fi

          if [ -f baremetal-report.md ]; then
            if [ -f system-load.md ]; then
              cat system-load.md >> baremetal-report.md
            fi
            echo "BENCH_REPORT<<EOF" >> $GITHUB_ENV
            cat baremetal-report.md >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            cat baremetal-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            # The whole heredoc body is redirected into GITHUB_ENV as a
            # group; the previous form only redirected the delimiters,
            # leaving the report content on stdout and the comment empty.
            {
              echo "BENCH_REPORT<<EOF"
              if [ -f head-vs-stock.txt ]; then
                echo '```text'
                cat head-vs-stock.txt
                echo '```'
              elif [ -f comparative.txt ]; then
                if [ -f head-to-head.md ]; then
                  cat head-to-head.md
                  echo ""
                fi
                echo '```text'
                cat comparative.txt
                echo '```'
              elif [ -f ycsb.txt ]; then
                echo '```text'
                cat ycsb.txt
                echo '```'
              elif [ -f concurrency.txt ]; then
                echo '```text'
                cat concurrency.txt
                echo '```'
              fi
              if [ -f system-load.md ]; then
                cat system-load.md
              fi
              echo "EOF"
            } >> $GITHUB_ENV

            echo "## Bare-Metal Benchmark Results ($SUITE)" >> "$GITHUB_STEP_SUMMARY"
            if [ -f head-vs-stock.txt ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat head-vs-stock.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            elif [ -f comparative.txt ]; then
              if [ -f head-to-head.md ]; then
                cat head-to-head.md >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat comparative.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            elif [ -f ycsb.txt ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat ycsb.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            elif [ -f concurrency.txt ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat concurrency.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -f system-load.md ]; then
              cat system-load.md >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Find Comment
        if: steps.vars.outputs.pr_number != ''
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ steps.vars.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: Bare-Metal Benchmark Results

      - name: Create or update PR comment
        if: steps.vars.outputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ steps.vars.outputs.pr_number }}
          body: |
            ## 🚀 Bare-Metal Benchmark Results (`honeycomb`)

            - **Host**: `${{ steps.sysinfo.outputs.host_desc || 'unknown (host probe failed)' }}`
            - **Suite**: `${{ steps.vars.outputs.benchmark_suite }}`
            - **Ref**: `${{ steps.vars.outputs.ref }}`
            ${{ steps.bench.outputs.base_line || '- **Base Ref**: _none — no base comparison ran_' }}
            - **Runner**: `self-hosted (baremetal / honeycomb)`

            ${{ env.BENCH_REPORT }}
          edit-mode: replace

name: Bare-Metal Benchmarks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to checkout (branch, tag, sha)'
        required: true
        default: 'main'
      base_ref:
        description: 'Base Git ref to compare against'
        required: false
      pr_number:
        description: 'PR number to post results to'
        required: false
      benchmark_suite:
        description: 'Benchmark suite to run (all, vs_stock, instructions, comparative, ycsb)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - vs_stock
          - instructions
          - comparative
          - ycsb
  issue_comment:
    types: [created]

jobs:
  bench-baremetal:
    name: Run Bare-Metal Benchmarks
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (startsWith(github.event.comment.body, '/bench') || startsWith(github.event.comment.body, '/benchmark')))
    runs-on: [self-hosted, linux]
    steps:
      - name: Check permissions
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'write'].includes(permission.permission)) {
              core.setFailed('User does not have permission to trigger benchmarks.');
            }

      - name: Resolve PR info
        id: pr-info
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.head.sha);
            core.setOutput('base_ref', pr.base.sha);
            core.setOutput('pr_number', context.issue.number.toString());
            
            const comment = context.payload.comment.body;
            let suite = 'all';
            if (comment.includes('vs_stock')) suite = 'vs_stock';
            else if (comment.includes('instructions')) suite = 'instructions';
            else if (comment.includes('comparative')) suite = 'comparative';
            else if (comment.includes('ycsb')) suite = 'ycsb';
            core.setOutput('benchmark_suite', suite);

      - name: Set input variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.ref }}" >> $GITHUB_OUTPUT
            echo "base_ref=${{ github.event.inputs.base_ref }}" >> $GITHUB_OUTPUT
            echo "pr_number=${{ github.event.inputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "benchmark_suite=${{ github.event.inputs.benchmark_suite }}" >> $GITHUB_OUTPUT
          else
            echo "ref=${{ steps.pr-info.outputs.ref }}" >> $GITHUB_OUTPUT
            echo "base_ref=${{ steps.pr-info.outputs.base_ref }}" >> $GITHUB_OUTPUT
            echo "pr_number=${{ steps.pr-info.outputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "benchmark_suite=${{ steps.pr-info.outputs.benchmark_suite }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.vars.outputs.ref }}
          fetch-depth: 0

      - name: System Load Hygiene Check
        run: |
          echo "=== System Load & Host Snapshot ==="
          uname -a
          uptime
          echo "Top CPU consumers:"
          ps -A -o %cpu,%mem,command | sort -rn | head -n 8

      - name: Run Native Bare-Metal Benchmarks
        id: bench
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/.local/lib:$LD_LIBRARY_PATH"
          export LIBRARY_PATH="$HOME/.local/lib:$LIBRARY_PATH"
          export C_INCLUDE_PATH="$HOME/.local/include:$C_INCLUDE_PATH"

          # Pre-compile release C ABI
          cargo build --release -p expanse-capi
          export EXPANSE_CDYLIB="$PWD/target/release/libexpanse.so"

          SUITE="${{ steps.vars.outputs.benchmark_suite }}"
          case "$SUITE" in
            "vs_stock")
              cargo bench --bench vs_stock -p expanse-capi | tee bench_output.txt
              ;;
            "instructions")
              cargo bench --bench instructions -p expanse-trie | tee bench_output.txt
              ;;
            "comparative")
              cargo bench --bench comparative -p expanse-trie | tee bench_output.txt
              ;;
            "ycsb")
              cargo bench --bench ycsb -p expanse-trie | tee bench_output.txt
              ;;
            "all"|*)
              echo "=== 1. libexpanse vs Stock libjudy C ABI Parity ===" | tee bench_output.txt
              cargo bench --bench vs_stock -p expanse-capi | tee -a bench_output.txt
              echo -e "\n=== 2. Deterministic Callgrind Instruction Counters ===" | tee -a bench_output.txt
              cargo bench --bench instructions -p expanse-trie | tee -a bench_output.txt
              echo -e "\n=== 3. Comparative vs hashbrown & BTreeMap ===" | tee -a bench_output.txt
              cargo bench --bench comparative -p expanse-trie | tee -a bench_output.txt
              ;;
          esac

          echo "BENCH_SUMMARY<<EOF" >> $GITHUB_ENV
          cat bench_output.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "## Bare-Metal Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat bench_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Find Comment
        if: steps.vars.outputs.pr_number != ''
        uses: peter-evans/find-comment@v4
        id: fc
        with:
          issue-number: ${{ steps.vars.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: Bare-Metal Benchmark Results

      - name: Create or update PR comment
        if: steps.vars.outputs.pr_number != ''
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ steps.vars.outputs.pr_number }}
          body: |
            ## Bare-Metal Benchmark Results
            
            - **Suite**: `${{ steps.vars.outputs.benchmark_suite }}`
            - **Ref**: `${{ steps.vars.outputs.ref }}`
            - **Runner**: `self-hosted (baremetal)`
            
            ```text
            ${{ env.BENCH_SUMMARY }}
            ```
          edit-mode: replace

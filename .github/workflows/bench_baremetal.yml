name: Bare-Metal Benchmarks

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to checkout (branch, tag, sha)'
        required: true
        default: 'main'
      base_ref:
        description: 'Base Git ref to compare against'
        required: false
      pr_number:
        description: 'PR number to post results to'
        required: false
      benchmark_suite:
        # Kept in lockstep with `.github/bench-suites.json` by
        # `scripts/check_bench_suites.py` (run it with `--write` to regenerate
        # this list); the `resolve` job validates the choice against the
        # manifest again at runtime, so a drifted dropdown cannot smuggle in an
        # undeclared suite.
        description: 'Benchmark suite to run (see .github/bench-suites.json)'
        required: true
        default: 'all'
        type: choice
        options:
          # BEGIN GENERATED: bench-suites
          - all
          - extended
          - vs_stock
          - instructions
          - vs_libjudy
          - comparative
          - ycsb
          - concurrency
          - point_lookup_counters
          - search_instructions
          - smoke_instructions
          - search_boolean
          - search_wand
          - search_memory
          - zset_zadd
          - zset_range
          - zset_rank
          - zset_memory
          - hashbrown_native_suite
          - hashbrown_ycsb
          - hashbrown_tail_latency
          - hashbrown_container_dists
          - hashbrown_memory_alloc
          - large_values
          - embedded
          - batch_lookup
          - compare
          # END GENERATED: bench-suites
  issue_comment:
    types: [created]

# The job posts reactions, the start acknowledgment, and the results comment
# through the workflow token; the repository default token is read-only, so
# without this block every comment write 403s (run 33016450539: benchmarks
# succeeded, report posting failed).
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Resolve the request on a GitHub-hosted runner, before the shared bare-metal
  # host is touched at all. This job owns the whole suite vocabulary: it parses
  # the token after `/bench` / `/benchmark`, matches it *exactly* against
  # `.github/bench-suites.json`, and refuses anything else by name.
  #
  # Why a separate job rather than a first step (#410): job-level `concurrency`
  # is evaluated before any step runs, so the old workflow re-derived the suite
  # inside its own `concurrency.group` expression - a second copy of the
  # resolver that had to be kept in sync by hand. `needs` *is* available to
  # `concurrency`, so publishing the suite as a job output removes that
  # duplicate ladder entirely.
  #
  # The old resolver matched by substring, so `/benchmark search_instructions`
  # hit `comment.includes('instructions')` and silently ran `instructions`,
  # and any unrecognised argument fell through to the initial `let suite =
  # 'all'` and ran a full dual-pass sweep. Both rendered as an ordinary,
  # successful, provenance-tagged report for a suite that never executed -
  # exactly the silent degradation AGENTS.md section 8.1 forbids.
  resolve:
    name: Resolve Benchmark Request
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (startsWith(github.event.comment.body, '/bench') || startsWith(github.event.comment.body, '/benchmark')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # Empty `suite` means "no benchmark run": either the comment was not a
      # bench command after all, or it was refused. The bench job gates on it.
      suite: ${{ steps.resolve.outputs.suite }}
      kind: ${{ steps.resolve.outputs.kind }}
      runner: ${{ steps.resolve.outputs.runner }}
      bench_package: ${{ steps.resolve.outputs.bench_package }}
      bench_target: ${{ steps.resolve.outputs.bench_target }}
      bench_env: ${{ steps.resolve.outputs.bench_env }}
      ref: ${{ steps.resolve.outputs.ref }}
      base_ref: ${{ steps.resolve.outputs.base_ref }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      # Sparse, non-cone: only the manifest. For `issue_comment` the checkout
      # ref is the default branch, so the accepted vocabulary is always the one
      # reviewed on `main`, never a version proposed by the pull request.
      - name: Check out the suite manifest
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/bench-suites.json
          sparse-checkout-cone-mode: false

      - name: Check permissions
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            if (!['admin', 'write'].includes(permission.permission)) {
              core.setFailed('User does not have permission to trigger benchmarks.');
            }

      - name: Resolve suite
        id: resolve
        uses: actions/github-script@v8
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const manifestPath = '.github/bench-suites.json';
            if (!fs.existsSync(manifestPath)) {
              // Fail closed: with no vocabulary there is no defensible default,
              // and guessing one is the bug this job exists to remove.
              core.setOutput('suite', '');
              core.setFailed(`${manifestPath} is missing from the checkout; the suite vocabulary could not be read, so no benchmark was started.`);
              return;
            }
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const suites = manifest.suites;
            const aliases = manifest.aliases || {};
            const byName = new Map(suites.map(s => [s.name, s]));
            const available = suites.filter(s => s.available);
            const unavailable = suites.filter(s => !s.available);

            const publish = (s) => {
              core.setOutput('suite', s.name);
              core.setOutput('kind', s.kind);
              core.setOutput('runner', s.runner);
              core.setOutput('bench_package', s.package || '');
              core.setOutput('bench_target', s.target || '');
              core.setOutput('bench_env', s.env || '');
              core.notice(`Resolved benchmark suite: ${s.name}`);
            };

            // ---- workflow_dispatch ------------------------------------------
            // `type: choice` already constrains the dropdown, but the dropdown
            // is a second copy of the list; validate against the manifest so a
            // drifted copy cannot start an undeclared suite.
            if (context.eventName === 'workflow_dispatch') {
              const inputs = context.payload.inputs || {};
              const requested = String(inputs.benchmark_suite || manifest.default).trim();
              const resolved = byName.get(aliases[requested] || requested);
              if (!resolved || !resolved.available) {
                core.setFailed(
                  `Unknown or unavailable benchmark suite '${requested}'. ` +
                  `Declared and available: ${available.map(s => s.name).join(', ')}.`
                );
                return;
              }
              core.setOutput('ref', inputs.ref || '');
              core.setOutput('base_ref', inputs.base_ref || '');
              core.setOutput('pr_number', inputs.pr_number || '');
              publish(resolved);
              return;
            }

            // ---- /bench and /benchmark PR comments ---------------------------
            // Token matching, never substring matching: take the first word of
            // the first line as the command and the second as the argument.
            const body = context.payload.comment.body || '';
            const firstLine = body.split(/\r?\n/)[0].trim();
            const parsed = firstLine.match(/^\/(bench|benchmark)\b\s*(\S*)/);
            if (!parsed) {
              // The job `if` only checks `startsWith('/bench')`, so ordinary
              // prose like `/benchmarking-notes` reaches here. That is not a
              // command; do nothing and start nothing.
              core.notice(`Not a benchmark command: ${JSON.stringify(firstLine.slice(0, 80))}`);
              core.setOutput('suite', '');
              return;
            }

            // Trailing punctuation and wrapping quotes/backticks are typing
            // noise, not part of the name; everything else is significant.
            const raw = parsed[2]
              .replace(/^[`'"(\[]+/, '')
              .replace(/[`'".,;:!?)\]]+$/, '');
            const token = raw.toLowerCase();
            const requested = aliases[token] || token;
            const resolved = token === '' ? byName.get(manifest.default) : byName.get(requested);

            const issue_number = context.issue.number;
            const react = async (content) => {
              try {
                await github.rest.reactions.createForIssueComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: context.payload.comment.id,
                  content,
                });
              } catch (e) {
                core.warning(`Failed to add reaction to trigger comment: ${e.message}`);
              }
            };

            if (!resolved || !resolved.available) {
              // Refusal is terminal and loud: a comment naming the argument and
              // the whole accepted vocabulary, a confused reaction, a red job,
              // and no bench job at all (AGENTS.md section 8.1).
              await react('confused');

              // The token is attacker-controlled text echoed into a comment.
              // Reduce it to the character class a suite name can use and cap
              // its length, so it cannot break out of the code span.
              const shown = raw.replace(/[^A-Za-z0-9_.\/-]/g, '').slice(0, 40) || '(empty)';
              const rows = available.map(s => `| \`${s.name}\` | ${s.kind === 'callgrind' ? 'Callgrind' : 'wall-clock'} | ${s.summary} |`);
              const gaps = unavailable.map(s => `| \`${s.name}\` | ${s.reason} |`);

              // A declared-but-unavailable target is a different answer from a
              // name nobody recognises, and saying so is the whole point: the
              // gap is stated rather than left to be discovered by a run that
              // quietly measured something else.
              const heading = resolved
                ? `## ⛔ Benchmark request refused — \`${shown}\` is not available via slash command`
                : `## ⛔ Benchmark request refused — unknown suite \`${shown}\``;
              const why = resolved
                ? 'No benchmark was started, and no numbers were produced. `' + shown + '` is a real bench target, but it is deliberately not reachable this way: ' + resolved.reason
                : 'No benchmark was started, and no numbers were produced. `' + shown + '` does not name a declared suite, and an unrecognised argument is never quietly turned into a default run (AGENTS.md §8.1).';

              const lines = [
                '<!-- expanse-bench:rejected -->',
                `<!-- expanse-bench-run:${context.runId} -->`,
                heading,
                '',
                why,
                '',
                '**Accepted suites** — `/bench` with no argument runs `' + manifest.default + '`:',
                '',
                '| Suite | Instrument | What it runs |',
                '|---|---|---|',
                ...rows,
              ];
              if (Object.keys(aliases).length) {
                lines.push(
                  '',
                  'Aliases: ' + Object.entries(aliases).map(([a, s]) => `\`${a}\` → \`${s}\``).join(', ') + '.',
                );
              }
              if (gaps.length) {
                lines.push(
                  '',
                  '<details>',
                  '<summary><b>Bench targets deliberately not reachable from a slash command</b></summary>',
                  '',
                  '| Target | Why |',
                  '|---|---|',
                  ...gaps,
                  '',
                  '</details>',
                );
              }
              lines.push('', `[View run](${process.env.RUN_URL})`);
              const refusal = lines.join('\n') + '\n';

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes('<!-- expanse-bench:rejected -->'));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: refusal,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  body: refusal,
                });
              }

              core.setOutput('suite', '');
              core.setFailed(
                resolved
                  ? `Refused: '${shown}' is declared but not reachable from a slash command.`
                  : `Refused: '${shown}' is not a declared benchmark suite.`
              );
              return;
            }

            await react('rocket');

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: issue_number,
            });
            core.setOutput('ref', pr.head.sha);
            core.setOutput('base_ref', pr.base.sha);
            core.setOutput('pr_number', String(issue_number));
            publish(resolved);

  bench-baremetal:
    name: Run Bare-Metal Benchmarks
    needs: [resolve]
    # An empty suite means the resolver refused, or the comment was not a bench
    # command; either way nothing runs on the shared host.
    if: needs.resolve.result == 'success' && needs.resolve.outputs.suite != ''
    runs-on: [self-hosted, linux]
    # One in-flight run per (PR, suite): a re-triggered suite supersedes its
    # own pending run instead of queueing behind the single self-hosted
    # runner, while a *different* suite on the same PR runs independently and
    # is arbitrated by the host-wide bench lock further down.
    #
    # The suite comes from the `resolve` job rather than being re-derived from
    # the comment body here (#410): `needs` is available to job-level
    # `concurrency`, so there is exactly one resolver in this workflow.
    concurrency:
      group: bench-baremetal-${{ needs.resolve.outputs.pr_number || github.run_id }}-${{ needs.resolve.outputs.suite }}
      cancel-in-progress: true
    # Sized off the longest suite. The longest observed successful run of this
    # workflow is ~15 min (`all`: dual-pass Callgrind over instructions and
    # vs_stock); `extended` layers six further `bench_report.py` harness runs
    # on that same Callgrind work - the N in {10k, 100k, 1M} population sweep
    # plus the baseline/x86-64-v2/x86-64-v3/native matrix, four of which
    # rebuild the harness under a different `-C target-cpu`. 180 leaves an
    # order of magnitude of headroom over the observed maximum while halving
    # the window in which a wedged run can hold the shared host, versus
    # GitHub's 6-hour default. Raise it if a real `extended` run ever trips
    # it: the failure is now visible rather than silent.
    timeout-minutes: 180
    steps:
      # Comment identity: one sticky comment per suite, addressed by the
      # stable marker `<!-- expanse-bench:<suite> -->` - the same pattern
      # ci.yml's perf report uses - and never by the human-readable heading.
      # Two suites requested on one PR therefore own two comments and cannot
      # clobber each other, and editing the heading cannot silently break
      # matching the way `body-includes: Bare-Metal Benchmark Results` did.
      #
      # This step still runs before checkout and before the bench lock, so it
      # must never destroy numbers this suite already published: whatever the
      # comment held is folded into a collapsed <details> and carried until
      # this run has something real to put in its place. AGENTS.md section 8.7
      # wants a published figure to keep resolving to a cited run; a result
      # overwritten by a pending marker stops resolving to anything.
      - name: Post start acknowledgment
        id: ack
        if: needs.resolve.outputs.pr_number != ''
        continue-on-error: true
        uses: actions/github-script@v8
        env:
          SUITE: ${{ needs.resolve.outputs.suite }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const suite = process.env.SUITE;
            const marker = `<!-- expanse-bench:${suite} -->`;
            const runMarker = `<!-- expanse-bench-run:${context.runId} -->`;
            const priorMarker = '<!-- expanse-bench-prior -->';
            const resultMarker = '<!-- expanse-bench-result -->';
            const issue_number = Number(process.env.PR_NUMBER);

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            // Carry the previous body forward rather than erasing it. When the
            // comment is already a pending one its prior block is reused
            // verbatim, so repeated triggers cannot nest <details> in <details>.
            let prior = '';
            if (existing) {
              const at = existing.body.indexOf(priorMarker);
              if (at >= 0) {
                // Already a pending / failed body: reuse its prior block as is.
                prior = existing.body.slice(at);
              } else if (existing.body.includes(resultMarker)) {
                // A finished result. Only a result is worth preserving - a
                // previous run's failure notice must not be re-presented as
                // "previous results", which is why this is keyed on a marker
                // rather than on the heading prose.
                const kept = existing.body
                  .split('\n')
                  .filter(line => !line.startsWith('<!-- expanse-bench'))
                  .join('\n')
                  .trim();
                if (kept) {
                  prior = [
                    priorMarker,
                    '<details>',
                    `<summary><b>Previous \`${suite}\` results - kept until this run reports</b></summary>`,
                    '',
                    kept,
                    '',
                    '</details>',
                  ].join('\n');
                }
              }
            }

            // The resolved suite is stated before a single benchmark runs, so
            // a request that resolved to something other than what was asked
            // for is visible now rather than only in the finished report
            // (#410). The resolver refuses anything it cannot name, so this
            // line is the suite that will actually execute.
            const head = [
              marker,
              runMarker,
              `## ⏳ Bare-Metal Benchmark Results — suite \`${suite}\` (running)`,
              '',
              `Resolved suite: \`${suite}\`. Nothing else runs under this comment.`,
              '',
              `Running on the dedicated bare-metal reference host: [view run](${process.env.RUN_URL})`,
              '',
              'This comment is replaced by the finished numbers, or by the reason the run produced none.',
            ].join('\n');
            const body = prior ? `${head}\n\n${prior}\n` : `${head}\n`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.ref }}
          fetch-depth: 0

      - name: System Load Hygiene Check
        id: sysinfo
        # Captures the load snapshot into the report (non-gating, per
        # docs/BENCHMARKING.md rule 2) and derives an anonymized host
        # description from the runner itself: host_desc is built from
        # lscpu/nproc/uname -sr, so it carries a CPU model and kernel but
        # no hostname, and the ps snapshot strips leading paths from
        # command names.
        #
        # Scope of that guarantee: it covers what this step WRITES into
        # the PR comment. It does NOT sanitize the job log, which on a
        # public repository is public too. The log additionally exposes
        # the runner's registered name and, when the runner is installed
        # under a user home directory, a /home/<user> prefix on every
        # path a build tool echoes. AGENTS.md section 7 forbids OS
        # usernames and home-directory paths alongside hostnames, so that
        # is fixed by relocating the runner on the host (a neutral path
        # such as /opt/actions-runner under a service account) - it
        # cannot be fixed from this workflow.
        run: |
          echo "=== System Load & Host Snapshot ==="
          uname -srm
          uptime
          echo "Top CPU consumers:"
          ps -A -o %cpu= -o %mem= -o comm= | sort -rn | head -n 8 || true

          {
            echo "<details>"
            echo "<summary><b>System Load Snapshot (non-gating, captured at run start)</b></summary>"
            echo ""
            echo '```text'
            echo "kernel: $(uname -srm)"
            echo "uptime:$(uptime)"
            echo ""
            echo "top CPU consumers (%cpu %mem command):"
            { ps -A -o %cpu= -o %mem= -o comm= | sort -rn | head -n 8 || true; } \
              | awk '{cmd=$3; sub(".*/", "", cmd); printf "%7s %6s %s\n", $1, $2, cmd}'
            echo '```'
            echo ""
            echo "</details>"
          } > system-load.md

          MODEL=$(lscpu 2>/dev/null | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)
          [ -n "$MODEL" ] || MODEL="$(uname -m)"
          THREADS=$(nproc 2>/dev/null || echo "?")
          L3=$(lscpu 2>/dev/null | sed -n 's/^L3 cache:[[:space:]]*//p' | head -n 1 | sed 's/ (.*)//')
          KERNEL=$(uname -sr)
          DESC="$MODEL ($THREADS threads${L3:+, $L3 L3}, $KERNEL)"
          echo "host_desc=$DESC" >> "$GITHUB_OUTPUT"
          echo "Host description: $DESC"

      - name: Run Native Bare-Metal Benchmarks (Dual-Pass)
        id: bench
        # shell: bash implies pipefail: a benchmark that crashes must fail the
        # step instead of exiting 0 through tee. Base-pass commands keep
        # `|| true` deliberately (a broken base commit must not hard-block the
        # run); the report renders a loud NO BASELINE section instead.
        shell: bash
        env:
          # Every one of these comes from the `resolve` job, which only ever
          # publishes values it read out of `.github/bench-suites.json` or the
          # pulls API - never raw comment text.
          REF: ${{ needs.resolve.outputs.ref }}
          BASE_REF_IN: ${{ needs.resolve.outputs.base_ref }}
          SUITE: ${{ needs.resolve.outputs.suite }}
          SUITE_KIND: ${{ needs.resolve.outputs.kind }}
          SUITE_RUNNER: ${{ needs.resolve.outputs.runner }}
          BENCH_PACKAGE: ${{ needs.resolve.outputs.bench_package }}
          BENCH_TARGET: ${{ needs.resolve.outputs.bench_target }}
          BENCH_ENV: ${{ needs.resolve.outputs.bench_env }}
          # Anonymized CPU/kernel description derived in `sysinfo` (never a
          # hostname) plus this run's URL: the two provenance fields §8.7
          # requires on every published wall-clock number.
          HOST_DESC: ${{ steps.sysinfo.outputs.host_desc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/.local/lib:$LD_LIBRARY_PATH"
          export LIBRARY_PATH="$HOME/.local/lib:$LIBRARY_PATH"
          export C_INCLUDE_PATH="$HOME/.local/include:$C_INCLUDE_PATH"

          git config --global --add safe.directory "$PWD"

          BASE_REF="$BASE_REF_IN"

          echo "Configured Ref: $REF"
          echo "Configured Base Ref: $BASE_REF"
          echo "Configured Suite: $SUITE (kind=$SUITE_KIND runner=$SUITE_RUNNER)"

          # The resolver is the only place a suite name is interpreted; if it
          # ever hands this step something incomplete, that is a harness fault
          # and must stop the run rather than silently pick a default.
          if [ -z "$SUITE" ] || [ -z "$SUITE_KIND" ] || [ -z "$SUITE_RUNNER" ]; then
            echo "::error::resolver published an incomplete suite descriptor (suite='$SUITE' kind='$SUITE_KIND' runner='$SUITE_RUNNER')"
            echo "fail_reason=bad_descriptor" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$SUITE_RUNNER" = "generic" ] && { [ -z "$BENCH_PACKAGE" ] || [ -z "$BENCH_TARGET" ]; }; then
            echo "::error::generic suite '$SUITE' has no package/target in .github/bench-suites.json"
            echo "fail_reason=bad_descriptor" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Fail fast if the suite needs Callgrind and the host lacks the
          # tooling: an iai-callgrind run without valgrind or a runner binary
          # produces garbage/empty output, which must not become a report.
          # Driven by the manifest's `kind`, so adding a Callgrind suite arms
          # this check without a second edit here.
          if [ "$SUITE_KIND" = "callgrind" ]; then
            for tool in valgrind iai-callgrind-runner; do
              if ! command -v "$tool" >/dev/null 2>&1; then
                echo "::error::Suite '$SUITE' requires Callgrind, but '$tool' is not installed on this runner. Install valgrind and a version-matched iai-callgrind-runner (see the ci.yml callgrind jobs) before re-triggering."
                # Hand the cause to the terminal comment step, so the PR
                # says why nothing ran instead of staying at the pending
                # marker (AGENTS.md section 8.1).
                echo "fail_reason=missing_tool:$tool" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            done
          fi

          # Fail fast if the suite compares against stock libjudy and the host
          # has none. The probe is `dlopen` itself - ctypes.CDLL resolves with
          # the same LD_LIBRARY_PATH and ldconfig search the harness gets - so
          # this answers the question the benchmark will ask, rather than a
          # weaker proxy for it. A missing stock library must stop the run with
          # a named cause, never be skipped into a report that looks complete
          # (AGENTS.md section 8.1).
          case "$SUITE" in
            vs_stock|vs_libjudy|all|extended) NEEDS_LIBJUDY=1 ;;
            *) NEEDS_LIBJUDY=0 ;;
          esac
          if [ "$NEEDS_LIBJUDY" = "1" ]; then
            if python3 -c "import ctypes; ctypes.CDLL('libJudy.so.1')" 2>/dev/null; then
              echo "stock libjudy: libJudy.so.1"
            elif python3 -c "import ctypes; ctypes.CDLL('libJudy.so')" 2>/dev/null; then
              echo "stock libjudy: libJudy.so"
            else
              echo "::error::Suite '$SUITE' compares against stock libjudy, but dlopen resolved neither libJudy.so.1 nor libJudy.so on this runner. Install stock libjudy (libjudy-dev, or a local build reachable through LD_LIBRARY_PATH) before re-triggering. No benchmark was run and no numbers were produced."
              echo "fail_reason=missing_libjudy" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi

          # Fail fast if the suite needs hardware performance counters and the
          # host will not hand them over. The probe opens a real counter over a
          # real process: `perf` on PATH answers a weaker question, and answers
          # it wrongly wherever `perf_event_paranoid` forbids the open. Driven
          # by the manifest's `kind`, so declaring a counters suite arms this
          # without a second edit here. A refused counter stops the run with a
          # named cause; it is never skipped into a report that looks complete
          # (AGENTS.md section 8.1).
          if [ "$SUITE_KIND" = "counters" ]; then
            if ! command -v perf >/dev/null 2>&1; then
              echo "::error::Suite '$SUITE' needs hardware performance counters, but 'perf' is not installed on this runner. Install the kernel's matching tools package (linux-tools-common plus linux-tools-\$(uname -r) on Debian/Ubuntu, perf on Fedora/RHEL) before re-triggering. No benchmark was run and no numbers were produced."
              echo "fail_reason=missing_perf_tool" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            PARANOID="$(cat /proc/sys/kernel/perf_event_paranoid 2>/dev/null || echo unreadable)"
            if ! perf stat -x, -e instructions -o /dev/null -- true >/dev/null 2>&1; then
              echo "::error::Suite '$SUITE' needs hardware performance counters, but 'perf stat -e instructions' could not open one on this runner (kernel.perf_event_paranoid=$PARANOID). Grant the capability (sudo setcap cap_perfmon,cap_sys_ptrace,cap_syslog=ep \$(command -v perf)) or lower the gate (sudo sysctl -w kernel.perf_event_paranoid=1), then re-trigger. A virtualised host may expose no PMU at all, in which case the counters have to be collected on bare metal. No benchmark was run and no numbers were produced."
              echo "fail_reason=missing_perf_counters" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "hardware counters: perf usable (kernel.perf_event_paranoid=$PARANOID)"
          fi

          # The flagship wall-clock comparison. `bench_vs_libjudy` is a custom
          # main under examples/, not a `[[bench]]` target, so the manifest's
          # `generic` runner (`cargo bench --bench <target> -p <package>`)
          # cannot reach it; it is invoked here and shared by every suite that
          # runs it, rather than copied into each case arm.
          #
          # EXPANSE_BENCH_RATIOS_JSON asks the harness for its per-round paired
          # ratios, from which the BCa interval behind the published figure can
          # be re-derived. A checkout whose harness does not read that variable
          # ignores it and simply writes no file; the upload step is set to
          # tolerate that rather than fail the run.
          run_vs_libjudy() {
            local ratios="$PWD/target/bench/vs-libjudy-ratios.json"
            mkdir -p "$(dirname "$ratios")"
            # target/ survives between jobs on this runner, so a previous
            # run's ratios must not be uploaded under this run's provenance.
            rm -f "$ratios"
            EXPANSE_BENCH_RATIOS_JSON="$ratios" \
              cargo run --release -p expanse-capi --example bench_vs_libjudy \
              | tee vs-libjudy.txt
          }

          # Host-wide benchmark lock (docs/BENCHMARKING.md, methodology rule
          # 8): one suite at a time per machine, across every checkout.
          # `mkdir` is atomic; the lock names its owner so a refused start
          # says who holds the host.
          BENCH_LOCK="${EXPANSE_BENCH_LOCK:-${TMPDIR:-/tmp}/expanse-bench.lock}"
          if ! mkdir "${BENCH_LOCK}" 2>/dev/null; then
            LOCK_OWNER="$( { cat "${BENCH_LOCK}/owner" 2>/dev/null || true; } | head -n 1 | tr -d '\r' )"
            [ -n "$LOCK_OWNER" ] || LOCK_OWNER="unknown (lock directory present, no owner record)"
            echo "::error::refusing to start: benchmark lock ${BENCH_LOCK} is held by: ${LOCK_OWNER}"
            # Publish the holder to the terminal comment step so a refused
            # start reads as refused, and names who holds the host, instead
            # of leaving the pending marker as the final state.
            {
              echo "fail_reason=lock_held"
              echo "lock_owner=${LOCK_OWNER}"
            } >> "$GITHUB_OUTPUT"
            exit 75
          fi
          printf 'suite=ci-%s pid=%s start=%s\n' "$SUITE" "$$" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "${BENCH_LOCK}/owner"
          # INT and TERM as well as EXIT: a run superseded through the job's
          # concurrency group, or stopped by timeout-minutes, is signalled
          # before it is killed, and a lock left behind on this host would
          # refuse every later run.
          trap 'rm -rf "${BENCH_LOCK}"' EXIT INT TERM

          # Detect / resolve base_ref if not explicitly provided
          if [ -z "$BASE_REF" ]; then
            BASE_REF=$(git merge-base origin/main "$REF" 2>/dev/null || echo "")
            if [ -z "$BASE_REF" ]; then
              if git rev-parse --verify origin/main >/dev/null 2>&1; then
                HEAD_SHA=$(git rev-parse "$REF" 2>/dev/null || git rev-parse HEAD)
                MAIN_SHA=$(git rev-parse origin/main 2>/dev/null || echo "")
                if [ -n "$MAIN_SHA" ] && [ "$HEAD_SHA" != "$MAIN_SHA" ]; then
                  BASE_REF="origin/main"
                fi
              fi
            fi
          fi

          # If BASE_REF resolves to the same commit as REF, don't run dual pass against self
          if [ -n "$BASE_REF" ]; then
            HEAD_SHA=$(git rev-parse "$REF" 2>/dev/null || git rev-parse HEAD)
            BASE_SHA=$(git rev-parse "$BASE_REF" 2>/dev/null || echo "")
            if [ "$HEAD_SHA" = "$BASE_SHA" ]; then
              echo "Base ref $BASE_REF resolves to head commit $HEAD_SHA; skipping separate base pass."
              BASE_REF=""
            fi
          fi

          # ====================================================================
          # PASS 1: Base Branch (Baseline)
          # ====================================================================
          if [ -n "$BASE_REF" ]; then
            echo "=== [Pass 1] Benchmarking Base Ref: $BASE_REF ==="
            if git checkout "$BASE_REF"; then
              # Pre-compile release C ABI. The whole base pass is non-fatal
              # (a broken base commit must not hard-block the run); the
              # degradation is reported loudly by perf_report.py's NO
              # BASELINE section and the sticky comment's Base Ref guard.
              if cargo build --release -p expanse-capi; then
                export EXPANSE_CDYLIB="$PWD/target/release/libexpanse.so"

                if [ "$SUITE" = "all" ] || [ "$SUITE" = "extended" ] || [ "$SUITE" = "instructions" ]; then
                  echo "Running base instructions benchmark..."
                  cargo bench --bench instructions -p expanse-trie -- --save-baseline=baremetal_base | tee base-instructions.txt || true
                fi

                if [ "$SUITE" = "all" ] || [ "$SUITE" = "extended" ] || [ "$SUITE" = "vs_stock" ]; then
                  echo "Running base vs_stock benchmark..."
                  cargo bench --bench vs_stock -p expanse-capi -- --save-baseline=baremetal_base_vs_stock | tee base-vs-stock.txt || true
                fi

                # Manifest-declared Callgrind suites get the same dual pass:
                # an instruction count with nothing to compare against is a
                # weaker instrument, and there is no per-suite code to write.
                if [ "$SUITE_RUNNER" = "generic" ] && [ "$SUITE_KIND" = "callgrind" ]; then
                  echo "Running base $BENCH_TARGET benchmark..."
                  cargo bench --bench "$BENCH_TARGET" -p "$BENCH_PACKAGE" -- --save-baseline=baremetal_base_generic | tee base-generic.txt || true
                fi
              else
                echo "Warning: base ref $BASE_REF failed to build; continuing single pass."
                BASE_REF=""
              fi

              git checkout "$REF"
            else
              echo "Warning: Failed to checkout $BASE_REF, continuing single pass."
              BASE_REF=""
            fi
          fi

          # ====================================================================
          # PASS 2: Head Branch (Candidate)
          # ====================================================================
          echo "=== [Pass 2] Benchmarking Head Ref: $REF ==="
          # This runner keeps target/ between jobs, so target/criterion can hold
          # arms from an earlier suite at an earlier commit. The harvest below
          # excludes anything older than this stamp rather than stamping stale
          # numbers with this run's commit.
          CRITERION_SINCE=$(date +%s)
          # Same reason, for the plain-text outputs this step folds into the
          # report: a file left by an earlier suite must not be published
          # under this run's suite and commit.
          rm -f vs-libjudy.txt
          git checkout "$REF"
          cargo build --release -p expanse-capi
          export EXPANSE_CDYLIB="$PWD/target/release/libexpanse.so"

          # A manifest-declared `generic` suite is run straight from its
          # package/target: one branch covers every such suite, so a new bench
          # target becomes reachable by adding a manifest entry, not by adding
          # a case arm that a later name could shadow.
          if [ "$SUITE_RUNNER" = "generic" ]; then
            if [ "$SUITE_KIND" = "callgrind" ]; then
              if [ -f base-generic.txt ]; then
                cargo bench --bench "$BENCH_TARGET" -p "$BENCH_PACKAGE" -- --baseline=baremetal_base_generic | tee bench-output.txt
              else
                cargo bench --bench "$BENCH_TARGET" -p "$BENCH_PACKAGE" | tee bench-output.txt
              fi
            elif [ -n "$BENCH_ENV" ]; then
              # BENCH_ENV is a manifest-declared `KEY=VALUE ...` string; word
              # splitting is the intent here.
              # shellcheck disable=SC2086
              env $BENCH_ENV cargo bench --bench "$BENCH_TARGET" -p "$BENCH_PACKAGE" | tee bench-output.txt
            else
              cargo bench --bench "$BENCH_TARGET" -p "$BENCH_PACKAGE" | tee bench-output.txt
            fi
          else
            case "$SUITE" in
              "vs_stock")
                if [ -f base-vs-stock.txt ]; then
                  cargo bench --bench vs_stock -p expanse-capi -- --baseline=baremetal_base_vs_stock | tee head-vs-stock.txt
                else
                  cargo bench --bench vs_stock -p expanse-capi -- --save-baseline=baremetal_main_vs_stock | tee head-vs-stock.txt
                fi
                ;;
              "instructions")
                if [ -f base-instructions.txt ]; then
                  cargo bench --bench instructions -p expanse-trie -- --baseline=baremetal_base | tee head-instructions.txt
                else
                  cargo bench --bench instructions -p expanse-trie -- --save-baseline=baremetal_main | tee head-instructions.txt
                fi
                cargo run --release -p expanse-trie --example bytes_per_key | tee bytes-per-key.txt
                cargo run --release -p expanse-trie --example bytes_per_key_32 | tee bytes-per-key-32.txt
                ;;
              "comparative")
                cargo bench --bench comparative -p expanse-trie | tee comparative.txt
                python3 scripts/bench_report.py --quick --format markdown | tee head-to-head.md
                ;;
              "extended")
                if [ -f base-instructions.txt ]; then
                  cargo bench --bench instructions -p expanse-trie -- --baseline=baremetal_base | tee head-instructions.txt
                else
                  cargo bench --bench instructions -p expanse-trie -- --save-baseline=baremetal_main | tee head-instructions.txt
                fi

                if [ -f base-vs-stock.txt ]; then
                  cargo bench --bench vs_stock -p expanse-capi -- --baseline=baremetal_base_vs_stock | tee head-vs-stock.txt
                else
                  cargo bench --bench vs_stock -p expanse-capi -- --save-baseline=baremetal_main_vs_stock | tee head-vs-stock.txt
                fi

                cargo run --release -p expanse-trie --example bytes_per_key | tee bytes-per-key.txt
                cargo run --release -p expanse-trie --example bytes_per_key_32 | tee bytes-per-key-32.txt
                run_vs_libjudy

                cargo bench --bench comparative -p expanse-trie | tee comparative.txt
                python3 scripts/bench_report.py --extended --arch-sweep --format markdown | tee head-to-head.md
                ;;
              "vs_libjudy")
                # Wall-clock only: no Callgrind pass, and no criterion arms,
                # so this suite claims nothing about instruction counts.
                run_vs_libjudy
                ;;
              "point_lookup_counters")
                # Hardware counters over the random point-lookup path
                # (#455 R0). Diagnostic only: nothing here gates, and the
                # suite runs no Callgrind pass, so it claims nothing about
                # instruction counts. The driver repeats its own preflight
                # against the built workload and exits non-zero on a refused
                # counter rather than emitting a table with silent gaps.
                cargo build --release -p expanse-trie --example perf_point_lookup
                python3 scripts/perf_counters.py \
                  --pops 262144,1048576,4194304 \
                  --runs 10 \
                  --host-desc "$HOST_DESC" \
                  --commit "$(git rev-parse HEAD)" \
                  --run-id "$RUN_URL" \
                  --out "perf-counters-$SUITE.json" \
                  | tee head-to-head.md
                ;;
              "ycsb")
                cargo bench --bench ycsb -p expanse-trie | tee ycsb.txt
                ;;
              "concurrency")
                # Wall-clock Sync* scaling instrument (benches/concurrency.rs,
                # harness = false; configured via env, not CLI args). Reduced
                # sweep to stay within the job window; report-only.
                EXPANSE_BENCH_THREADS="1,4,16" EXPANSE_BENCH_WORKLOADS="100,50" \
                  cargo bench --bench concurrency -p expanse-trie | tee concurrency.txt
                ;;
              "all")
                if [ -f base-instructions.txt ]; then
                  cargo bench --bench instructions -p expanse-trie -- --baseline=baremetal_base | tee head-instructions.txt
                else
                  cargo bench --bench instructions -p expanse-trie -- --save-baseline=baremetal_main | tee head-instructions.txt
                fi

                if [ -f base-vs-stock.txt ]; then
                  cargo bench --bench vs_stock -p expanse-capi -- --baseline=baremetal_base_vs_stock | tee head-vs-stock.txt
                else
                  cargo bench --bench vs_stock -p expanse-capi -- --save-baseline=baremetal_main_vs_stock | tee head-vs-stock.txt
                fi

                cargo run --release -p expanse-trie --example bytes_per_key | tee bytes-per-key.txt
                cargo run --release -p expanse-trie --example bytes_per_key_32 | tee bytes-per-key-32.txt
                run_vs_libjudy

                cargo bench --bench comparative -p expanse-trie | tee comparative.txt
                python3 scripts/bench_report.py --quick --format markdown | tee head-to-head.md
                ;;
              *)
                # Unreachable: the resolver only publishes declared suites and
                # every builtin one has an arm above. If it is ever reached, a
                # manifest entry was added without wiring - stop, do not run `all`
                # under another suite's name (AGENTS.md section 8.1).
                echo "::error::builtin suite '$SUITE' is declared in .github/bench-suites.json but has no branch in this workflow"
                echo "fail_reason=unwired_suite" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
            esac
          fi

          # ====================================================================
          # libexpanse vs stock libjudy
          # ====================================================================
          # Folded into head-to-head.md in one place rather than in each case
          # arm, so every suite that runs the comparison reaches the PR comment
          # through the same path - the `--head-to-head` argument to
          # perf_report.py when the suite also has instruction counters, and
          # the fallback body when it does not.
          if [ -f vs-libjudy.txt ]; then
            {
              echo ""
              echo "### libexpanse vs stock libjudy (paired wall-clock, arms interleaved per round)"
              echo ""
              echo '```text'
              cat vs-libjudy.txt
              echo '```'
            } >> head-to-head.md
          fi

          # ====================================================================
          # Wall-Clock BCa Confidence Intervals
          # ====================================================================
          # Criterion has always written per-sample data to
          # target/criterion/**/new/sample.json; nothing read it, so no
          # wall-clock claim could be gated on an interval (#403 Track 0).
          # Harvest it here into the artifact shape `results/baseline_*.json`
          # uses, and render the interval table into the same comment as the
          # rest of the report. Callgrind-only suites produce no criterion
          # directory and are skipped explicitly rather than silently.
          if [ -d target/criterion ]; then
            echo "=== Harvesting criterion samples -> BCa 95% CIs ==="
            python3 scripts/bench_baseline.py --harvest \
              --criterion-dir target/criterion \
              --newer-than "$CRITERION_SINCE" \
              --allow-empty \
              --suite "$SUITE" \
              --host-desc "$HOST_DESC" \
              --run-id "$RUN_URL" \
              --out "baseline-$SUITE.json" \
              > wallclock-ci.md
            # --allow-empty writes nothing when the suite ran no criterion arms
            # (a Callgrind-only suite on a runner whose target/ still holds
            # another suite's output); drop the empty render with it.
            if [ ! -f "baseline-$SUITE.json" ]; then
              rm -f wallclock-ci.md
            else
              # Fold it into head-to-head.md so it reaches the comment through
              # the existing --head-to-head path as well as the fallback below.
              if [ -f head-to-head.md ]; then
                printf '\n' >> head-to-head.md
              fi
              cat wallclock-ci.md >> head-to-head.md
            fi
          else
            echo "No target/criterion directory: suite '$SUITE' runs no criterion arms, so no wall-clock interval is claimed."
          fi

          # ====================================================================
          # Report Generation Step
          # ====================================================================
          # The sticky comment must not print a Base Ref for a comparison
          # that never ran: only report the base when its output actually
          # parses as benchmark results (bench headers present), matching
          # what perf_report.py / criterion could compare against.
          BASE_OK=false
          if [ -n "$BASE_REF" ]; then
            if { [ -f base-instructions.txt ] && grep -qE '^[[:alpha:]_][[:alnum:]_:]*::[[:alnum:]_]+' base-instructions.txt; } \
               || { [ -f base-generic.txt ] && grep -qE '^[[:alpha:]_][[:alnum:]_:]*::[[:alnum:]_]+' base-generic.txt; } \
               || { [ -f base-vs-stock.txt ] && grep -qE '^[[:alpha:]_][[:alnum:]_:]*::[[:alnum:]_]+' base-vs-stock.txt; }; then
              BASE_OK=true
            fi
          fi
          echo "base_ok=$BASE_OK" >> "$GITHUB_OUTPUT"
          if [ "$BASE_OK" = "true" ]; then
            echo "base_line=- **Base Ref**: \`$BASE_REF\`" >> "$GITHUB_OUTPUT"
          else
            echo "base_line=- **Base Ref**: _none — no base comparison ran_" >> "$GITHUB_OUTPUT"
          fi

          # A generic Callgrind suite emits the same iai-callgrind format as
          # `instructions`, so it goes through perf_report.py too rather than
          # being dumped as raw text: same parser, same regression legend.
          if [ "$SUITE_RUNNER" = "generic" ] && [ "$SUITE_KIND" = "callgrind" ] && [ -f bench-output.txt ]; then
            mv bench-output.txt head-instructions.txt
            if [ -f base-generic.txt ]; then
              mv base-generic.txt base-instructions.txt
            fi
          fi

          if [ -f head-instructions.txt ]; then
            BASE_ARGS=""
            if [ -f base-instructions.txt ]; then
              BASE_ARGS="--base base-instructions.txt --base-ref $BASE_REF"
            fi
            HEAD_TO_HEAD_ARGS=""
            if [ -f head-to-head.md ]; then
              HEAD_TO_HEAD_ARGS="--head-to-head head-to-head.md"
            fi
            VS_STOCK_ARGS=""
            if [ -f head-vs-stock.txt ]; then
              VS_STOCK_ARGS="--vs-stock head-vs-stock.txt"
            fi
            BYTES_ARGS=""
            if [ -f bytes-per-key.txt ]; then
              BYTES_ARGS="--bytes bytes-per-key.txt"
            fi
            BYTES32_ARGS=""
            if [ -f bytes-per-key-32.txt ]; then
              BYTES32_ARGS="--bytes32 bytes-per-key-32.txt"
            fi

            python3 scripts/perf_report.py \
              --head head-instructions.txt \
              $BASE_ARGS \
              $HEAD_TO_HEAD_ARGS \
              $BYTES_ARGS \
              $BYTES32_ARGS \
              $VS_STOCK_ARGS \
              > baremetal-report.md
          fi

          if [ -f baremetal-report.md ]; then
            if [ -f system-load.md ]; then
              cat system-load.md >> baremetal-report.md
            fi
            echo "BENCH_REPORT<<EOF" >> $GITHUB_ENV
            cat baremetal-report.md >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
            cat baremetal-report.md >> "$GITHUB_STEP_SUMMARY"
          else
            # The whole heredoc body is redirected into GITHUB_ENV as a
            # group; the previous form only redirected the delimiters,
            # leaving the report content on stdout and the comment empty.
            {
              echo "BENCH_REPORT<<EOF"
              # head-to-head.md carries the comparative tables and, when the
              # suite has criterion arms, the BCa interval table appended above.
              # Emitted once here so every suite shape reaches the comment with
              # its interval, not only the `comparative` branch below.
              if [ -f head-to-head.md ]; then
                cat head-to-head.md
                echo ""
              fi
              if [ -f head-vs-stock.txt ]; then
                echo '```text'
                cat head-vs-stock.txt
                echo '```'
              elif [ -f comparative.txt ]; then
                echo '```text'
                cat comparative.txt
                echo '```'
              elif [ -f ycsb.txt ]; then
                echo '```text'
                cat ycsb.txt
                echo '```'
              elif [ -f concurrency.txt ]; then
                echo '```text'
                cat concurrency.txt
                echo '```'
              elif [ -f bench-output.txt ]; then
                # Wall-clock output from a manifest-declared generic suite.
                echo '```text'
                cat bench-output.txt
                echo '```'
              fi
              if [ -f system-load.md ]; then
                cat system-load.md
              fi
              echo "EOF"
            } >> $GITHUB_ENV

            echo "## Bare-Metal Benchmark Results ($SUITE)" >> "$GITHUB_STEP_SUMMARY"
            if [ -f head-vs-stock.txt ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat head-vs-stock.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            elif [ -f comparative.txt ]; then
              if [ -f head-to-head.md ]; then
                cat head-to-head.md >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
              fi
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat comparative.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            elif [ -f ycsb.txt ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat ycsb.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            elif [ -f concurrency.txt ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat concurrency.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            elif [ -f bench-output.txt ]; then
              echo '```text' >> "$GITHUB_STEP_SUMMARY"
              cat bench-output.txt >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
            elif [ -f head-to-head.md ]; then
              # A suite whose whole output is markdown already - `vs_libjudy`
              # is the first - would otherwise leave the summary with a
              # heading and no numbers under it.
              cat head-to-head.md >> "$GITHUB_STEP_SUMMARY"
            fi
            if [ -f system-load.md ]; then
              cat system-load.md >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # The baseline artifact is the committable half of a wall-clock claim
      # (AGENTS.md section 8.7): a published interval must resolve to a
      # committed `results/baseline_*.json`. The runner cannot commit to a
      # protected branch, so the artifact is uploaded and the maintainer moves
      # it into `results/` in the PR that makes the claim.
      - name: Upload wall-clock baseline artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wallclock-baseline-${{ needs.resolve.outputs.suite }}-${{ github.run_id }}
          path: baseline-*.json
          if-no-files-found: ignore
          retention-days: 30

      # The per-round paired ratios behind the vs-libjudy figure, so its BCa
      # interval can be re-derived from the same run that published it rather
      # than trusted as a summary line (AGENTS.md sections 8.4 and 8.7). The
      # harness writes this only when it honours EXPANSE_BENCH_RATIOS_JSON; on
      # a checkout that does not, there is no file and `ignore` keeps that from
      # failing a run whose numbers are otherwise complete. It is a missing
      # supplement, not a missing result - the ratios themselves are in the
      # comment either way.
      # `concurrency`, `ycsb` and `comparative` are declared `harness = false`
      # in crates/expanse/Cargo.toml - custom mains that print their own tables
      # rather than criterion benchmarks - and the B/key examples are plain
      # binaries. None of them writes `target/criterion`, so the harvest step
      # correctly reports "runs no criterion arms" and no `baseline-*.json` is
      # produced for any of them.
      #
      # Without this upload their numbers reach only the PR comment and the step
      # summary, both of which expire, and a `workflow_dispatch` run has no PR to
      # comment on at all. A completed `/benchmark concurrency` therefore left
      # nothing downloadable behind and its cells stayed unfillable (issue #382),
      # which is how a successful run came to refill nothing.
      #
      # Uploading the raw tables makes a published figure from these suites
      # resolve to an artifact of the run that produced it (AGENTS.md section
      # 8.7). `ignore` keeps a suite that produces none of these files from
      # failing over it.
      - name: Upload non-criterion suite tables
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: suite-tables-${{ needs.resolve.outputs.suite }}-${{ github.run_id }}
          path: |
            concurrency.txt
            ycsb.txt
            comparative.txt
            bytes-per-key.txt
            bytes-per-key-32.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload vs-libjudy paired-ratio artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vs-libjudy-ratios-${{ needs.resolve.outputs.suite }}-${{ github.run_id }}
          path: target/bench/vs-libjudy-ratios.json
          if-no-files-found: ignore
          retention-days: 30

      # The per-run counter values behind every interval in the counters
      # report, so a claim built on them is recomputable from the same run
      # that published it rather than trusted as a summary line (AGENTS.md
      # sections 8.4 and 8.7). Only the counters suite writes one; `ignore`
      # keeps every other suite from failing over a file it never produces.
      - name: Upload hardware-counter artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-counters-${{ needs.resolve.outputs.suite }}-${{ github.run_id }}
          path: perf-counters-*.json
          if-no-files-found: ignore
          retention-days: 30

      # Terminal comment. `if: always()` so every outcome overwrites this
      # suite's own pending marker: a permanent ⏳ is exactly the "renders as
      # still working" shape AGENTS.md section 8.1 forbids. The failure branch
      # names the actual cause - lock holder, missing Callgrind tooling, build
      # or bench failure, cancellation - and always links the run.
      #
      # A run that produced no numbers keeps the prior result block the
      # acknowledgment carried, so a failed run never erases a good one, and
      # a run whose comment a newer run already claimed stands down rather
      # than overwriting fresher numbers with stale ones.
      - name: Publish benchmark comment
        if: always() && needs.resolve.outputs.pr_number != ''
        uses: actions/github-script@v8
        env:
          SUITE: ${{ needs.resolve.outputs.suite }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HOST_DESC: ${{ steps.sysinfo.outputs.host_desc }}
          HEAD_REF: ${{ needs.resolve.outputs.ref }}
          BASE_LINE: ${{ steps.bench.outputs.base_line }}
          BENCH_OUTCOME: ${{ steps.bench.outcome }}
          FAIL_REASON: ${{ steps.bench.outputs.fail_reason }}
          LOCK_OWNER: ${{ steps.bench.outputs.lock_owner }}
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const suite = process.env.SUITE;
            const marker = `<!-- expanse-bench:${suite} -->`;
            const runMarker = `<!-- expanse-bench-run:${context.runId} -->`;
            const priorMarker = '<!-- expanse-bench-prior -->';
            // Stamped on a body that actually carries numbers, so the next
            // run's acknowledgment can tell a result from a failure notice.
            const resultMarker = '<!-- expanse-bench-result -->';
            const runUrl = process.env.RUN_URL;
            const issue_number = Number(process.env.PR_NUMBER);

            const outcome = process.env.BENCH_OUTCOME || 'skipped';
            const reason = process.env.FAIL_REASON || '';
            const cancelled = outcome === 'cancelled' || process.env.JOB_STATUS === 'cancelled';
            // BENCH_REPORT reaches this step through GITHUB_ENV, written by the
            // benchmark step; it is absent whenever that step produced nothing.
            const report = (process.env.BENCH_REPORT || '').trim();

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              const owner = existing.body.match(/<!-- expanse-bench-run:(\d+) -->/);
              if (owner && Number(owner[1]) > context.runId) {
                core.notice(`Run ${owner[1]} already owns the ${suite} comment; leaving it in place.`);
                return;
              }
            }

            let prior = '';
            if (existing) {
              const at = existing.body.indexOf(priorMarker);
              if (at >= 0) prior = existing.body.slice(at);
            }

            let body;
            if (outcome === 'success' && report) {
              body = [
                marker,
                runMarker,
                resultMarker,
                `## 🚀 Bare-Metal Benchmark Results — suite \`${suite}\` (dedicated reference host)`,
                '',
                `- **Host**: \`${process.env.HOST_DESC || 'unknown (host probe failed)'}\``,
                `- **Suite**: \`${suite}\``,
                `- **Ref**: \`${process.env.HEAD_REF}\``,
                process.env.BASE_LINE || '- **Base Ref**: _none — no base comparison ran_',
                '- **Runner**: `self-hosted (baremetal, dedicated reference host)`',
                `- **Run**: [${context.runId}](${runUrl})`,
                '',
                report,
                '',
              ].join('\n');
            } else {
              let icon = '❌';
              let label = 'no results';
              let cause;
              if (cancelled) {
                icon = '🛑';
                label = 'cancelled';
                cause = 'The run was **cancelled** - superseded by a newer `/bench` for this same suite, stopped by hand, or stopped by the job timeout. No numbers were produced.';
              } else if (reason === 'lock_held') {
                label = 'refused';
                cause = [
                  'The run was **refused before any benchmark started**: the host-wide bench lock was already held. One suite runs at a time on this host.',
                  '',
                  'Lock holder:',
                  '',
                  '```text',
                  process.env.LOCK_OWNER || 'unknown (lock directory present, no owner record)',
                  '```',
                  '',
                  'Re-trigger once the holder finishes.',
                ].join('\n');
              } else if (reason === 'missing_libjudy') {
                label = 'refused';
                cause = `The run was **refused before any benchmark started**: suite \`${suite}\` compares against stock libjudy, but \`dlopen\` resolved neither \`libJudy.so.1\` nor \`libJudy.so\` on the runner. Install stock libjudy (\`libjudy-dev\`, or a local build reachable through \`LD_LIBRARY_PATH\`) before re-triggering. No numbers were produced.`;
              } else if (reason === 'missing_perf_tool') {
                label = 'refused';
                cause = `The run was **refused before any benchmark started**: suite \`${suite}\` reads hardware performance counters, but \`perf\` is not installed on the runner. Install the kernel's matching tools package (\`linux-tools-common\` plus \`linux-tools-$(uname -r)\` on Debian/Ubuntu, \`perf\` on Fedora/RHEL) before re-triggering. No numbers were produced.`;
              } else if (reason === 'missing_perf_counters') {
                label = 'refused';
                cause = `The run was **refused before any benchmark started**: suite \`${suite}\` reads hardware performance counters, but \`perf stat -e instructions\` could not open one on the runner. Grant the capability (\`sudo setcap cap_perfmon,cap_sys_ptrace,cap_syslog=ep $(command -v perf)\`) or lower \`kernel.perf_event_paranoid\`, then re-trigger. A virtualised host may expose no PMU at all, in which case the counters have to come from bare metal. No numbers were produced.`;
              } else if (reason.startsWith('missing_tool:')) {
                label = 'refused';
                const tool = reason.slice('missing_tool:'.length);
                cause = `The run was **refused before any benchmark started**: suite \`${suite}\` needs Callgrind, but \`${tool}\` is not installed on the runner. Install \`valgrind\` and a version-matched \`iai-callgrind-runner\` (see the \`ci.yml\` Callgrind jobs) before re-triggering.`;
              } else if (reason === 'bad_descriptor' || reason === 'unwired_suite') {
                label = 'refused';
                cause = [
                  'The run was **refused before any benchmark started**: the suite resolved cleanly but this workflow has no complete wiring for it.',
                  '',
                  reason === 'unwired_suite'
                    ? `\`${suite}\` is declared in \`.github/bench-suites.json\` as a builtin suite but has no branch in the benchmark step.`
                    : `\`${suite}\` has an incomplete descriptor in \`.github/bench-suites.json\` (missing kind, runner, package or target).`,
                  '',
                  'That is a repository fault, not a request fault. `scripts/check_bench_suites.py` is the guard that should have caught it before merge.',
                ].join('\n');
              } else if (outcome === 'failure') {
                cause = 'The benchmark step **failed** - build error, benchmark crash, or a host problem. The failing command is in the job log.';
              } else if (outcome === 'success') {
                cause = 'The benchmark step reported success but produced **no report**. That is a harness fault, not a result: treat this run as having measured nothing.';
              } else {
                cause = 'The job **failed before the benchmarks started** - permission check, checkout, or host probe. The failing step is in the job log.';
              }

              const lines = [
                marker,
                runMarker,
                `## ${icon} Bare-Metal Benchmark Results — suite \`${suite}\` (${label})`,
                '',
                cause,
                '',
                `[View run](${runUrl})`,
              ];
              if (prior) lines.push('', prior);
              body = lines.join('\n') + '\n';
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                body,
              });
            }

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per PR: a new commit supersedes the previous run, so
# only the tip of the branch is fully verified. That is what branch
# protection gates on anyway, and it stops a rapid series of review
# fixups from queueing several ~25-minute matrices at once.
#
# Pushes to `main` get a group PER COMMIT (`github.sha`), not one shared
# `refs/heads/main` group. `cancel-in-progress: false` is NOT enough to
# keep them: GitHub holds only one *pending* run per group and cancels
# any previously pending one, whatever that flag says. Per-commit groups
# make main runs queue behind each other instead of evicting each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  detect-changes:
    name: Detect Modified Subsystems
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly.yml'
            python:
              - 'crates/expanse-py/**'
              - 'tests/test_python_bindings.py'
              - 'pyproject.toml'
              - '.github/workflows/python.yml'
            docs:
              - 'docs/**'
              - '*.md'
              - 'scripts/**'
              - 'website/**'

  lint:
    name: lint
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Assert capi drop-in artifacts exist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = "target/debug/expanse.dll"
          $lib = "target/debug/expanse.lib"
          if (!(Test-Path $dll)) { Write-Error "missing $dll"; exit 1 }
          if (!(Test-Path $lib)) { Write-Error "missing $lib"; exit 1 }
          Write-Host "capi artifacts present: $dll, $lib"

      - name: Assert capi drop-in artifacts exist (Unix)
        if: runner.os != 'Windows'
        run: |
          shopt -s nullglob
          arts=(target/debug/libexpanse.{so,dylib} target/debug/libexpanse.a)
          if [ ${#arts[@]} -lt 2 ]; then
            echo "::error::expected cdylib + staticlib capi artifacts, found: ${arts[*]:-none}"
            exit 1
          fi
          echo "capi artifacts present: ${arts[*]}"
        shell: bash

  test-riscv64:
    name: test-riscv64
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Check (riscv64, cross-compile)
        run: cargo check --workspace --target riscv64gc-unknown-linux-gnu

  test-musl:
    name: test-musl
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          }

      - name: Build (musl)
        run: cargo build --workspace --target x86_64-unknown-linux-musl

      - name: Test (musl)
        run: cargo test --workspace --target x86_64-unknown-linux-musl

      - name: Assert capi drop-in artifacts exist (musl)
        run: |
          dir=target/x86_64-unknown-linux-musl/debug
          test -f "$dir/libexpanse.so" || { echo "::error::missing $dir/libexpanse.so"; exit 1; }
          test -f "$dir/libexpanse.a"  || { echo "::error::missing $dir/libexpanse.a"; exit 1; }
          echo "capi artifacts present: $dir/libexpanse.so, $dir/libexpanse.a"

  miri:
    name: miri
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      - name: Miri (core unsafe smoke — model sweeps run in nightly)
        run: cargo miri test -p expanse-trie --lib -- --skip model_

  php-judy-compat:
    name: php-judy-compat
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install PHP toolchain
        run: |
          sudo apt-get install -y --no-install-recommends php-dev php-cli || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends php-dev php-cli
          }

      - name: Build libexpanse and assemble the libjudy-compat prefix
        run: |
          cargo build --release -p expanse-capi
          PREFIX="$PWD/compat-prefix"
          mkdir -p "$PREFIX/include" "$PREFIX/lib"
          cp crates/expanse-capi/include/Judy.h "$PREFIX/include/"
          cp target/release/libexpanse.so "$PREFIX/lib/libJudy.so"
          echo "JUDY_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Build php-judy against libexpanse
        run: |
          git clone --filter=blob:none https://github.com/orieg/php-judy.git
          cd php-judy
          git checkout -q fb490245854fad4bfc0c9e0e987e846d2a0ae3bb
          phpize
          ./configure --with-judy="$JUDY_PREFIX"
          make -j"$(nproc)"

      - name: Run the php-judy test suite
        run: |
          cd php-judy
          export LD_LIBRARY_PATH="$JUDY_PREFIX/lib"
          NO_INTERACTION=1 make test | tee test-output.log
          grep -E 'Tests failed *: *0 ' test-output.log || {
            echo '::group::failing-test diffs'
            for f in tests/*.diff tests/*.out; do
              [ -f "$f" ] && { echo "--- $f"; cat "$f"; }
            done
            echo '::endgroup::'
            exit 1
          }

  php-judy-windows:
    name: php-judy-windows
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build expanse.dll and assemble the --with-judy prefix
        shell: pwsh
        run: |
          cargo build --release -p expanse-capi
          $prefix = "$PWD\compat-prefix"
          New-Item -ItemType Directory -Force -Path "$prefix\include", "$prefix\lib" | Out-Null
          Copy-Item crates/expanse-capi/include/Judy.h "$prefix\include"
          Copy-Item target/release/expanse.dll.lib "$prefix\lib\libJudy.lib"
          Copy-Item target/release/expanse.dll.lib "$prefix\libJudy.lib"
          Copy-Item target/release/expanse.dll "$prefix"
          Copy-Item target/release/expanse.dll "C:\Windows\System32"
          Add-Content $env:GITHUB_ENV "JUDY_PREFIX=$prefix"

      - name: Disable Windows Error Reporting
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "${{ runner.temp }}"

      - name: Build php-judy against expanse.dll and run its suite
        uses: php/php-windows-builder/extension@v1
        with:
          extension-url: https://github.com/orieg/php-judy
          extension-ref: fb490245854fad4bfc0c9e0e987e846d2a0ae3bb
          php-version: "8.4"
          arch: x64
          ts: nts
          args: --with-judy=${{ env.JUDY_PREFIX }}
          test-workers: "1"
          test-runner-args: "--set-timeout 30"

  instruction-counts:
    name: instruction-counts
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install valgrind and stock libjudy
        timeout-minutes: 8
        run: |
          if timeout 120 sudo apt-get install -y valgrind libjudy-dev; then exit 0; fi
          for i in 1 2 3; do
            timeout 120 sudo apt-get update || true
            if timeout 120 sudo apt-get install -y valgrind libjudy-dev; then exit 0; fi
            echo "apt attempt $i failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Build the harness (release mode)
        run: cargo bench --no-run -p expanse-capi --bench vs_stock

      - name: Measure PR branch instructions (vs_stock)
        run: |
          BIN=$(find target/release/deps -maxdepth 1 -name 'vs_stock-*' -type f -perm /111 | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::vs_stock harness binary not found"
            exit 1
          fi
          echo "Harness binary: $BIN"
          valgrind --tool=callgrind --instr-atstart=no --callgrind-out-file=callgrind.out "$BIN" --bench 2>&1 | tee harness-output.txt
          python3 scripts/perf_report.py --callgrind-out callgrind.out --output-json pr-counts.json --markdown pr-report.md

      - name: Emit Step Summary
        if: always()
        run: |
          if [ -f pr-report.md ]; then
            cat pr-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

  differential-oracle:
    name: differential-oracle
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install stock libjudy
        timeout-minutes: 8
        run: |
          if timeout 120 sudo apt-get install -y libjudy-dev; then exit 0; fi
          for _ in 1 2 3; do
            timeout 120 sudo apt-get update || true
            if timeout 120 sudo apt-get install -y libjudy-dev; then exit 0; fi
            echo "apt attempt failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Differential oracle vs stock libjudy
        run: cargo test -p expanse-capi --features oracle

      - name: Modern API smoke (expanse.h)
        run: |
          cargo build --release -p expanse-capi
          cc crates/expanse-capi/smoke/modern_api_smoke.c -Icrates/expanse-capi/include -Ltarget/release -lexpanse -o modern_smoke
          LD_LIBRARY_PATH="$PWD/target/release" ./modern_smoke

      - name: Preload smoke (COMPAT.md gate G4)
        run: |
          cargo build --release -p expanse-capi
          cc crates/expanse-capi/smoke/preload_smoke.c -lJudy -o smoke
          ./smoke > stock.out
          LD_PRELOAD="$PWD/target/release/libexpanse.so" ./smoke > preload.out
          diff stock.out preload.out
          grep -q '^ok$' stock.out

  memory-budget:
    name: memory-budget
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run memory budget assertions
        run: cargo run --release --example bytes_per_key

  loom:
    name: loom
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Loom model checks
        run: cargo test -p expanse-trie --release loom_
        env:
          RUSTFLAGS: --cfg loom

  fuzz-smoke:
    name: fuzz-smoke
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz smoke (60s per target)
        run: |
          for t in set_ops map_ops bytesmap_ops strmap_ops; do
            echo "::group::$t"
            cargo fuzz run "$t" -- -max_total_time=60 -print_final_stats=1
            echo "::endgroup::"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore

  test-python:
    name: test-python (smoke)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.python == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.5,<2.0" pytest

      - name: Build and install expanse-trie
        run: pip install .

      - name: Run Pytest suite
        run: pytest tests/test_python_bindings.py -v

  ci-gate:
    name: CI Gate / All Checks Passed
    if: always()
    needs:
      - detect-changes
      - lint
      - test
      - test-musl
      - test-riscv64
      - miri
      - php-judy-compat
      - php-judy-windows
      - instruction-counts
      - differential-oracle
      - memory-budget
      - loom
      - fuzz-smoke
      - test-python
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate Dependency Statuses
        shell: bash
        run: |
          echo "Evaluating CI matrix health..."
          STATUSES='${{ toJson(needs) }}'
          FAILED=()

          for job in $(echo "$STATUSES" | jq -r 'keys[]'); do
            result=$(echo "$STATUSES" | jq -r --arg j "$job" '.[$j].result')
            echo "  Job [$job]: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              FAILED+=("$job")
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::The following required checks failed: ${FAILED[*]}"
            exit 1
          fi

          echo "::notice::All applicable CI checks passed (or were cleanly skipped by path filters)."
          exit 0

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target: expanse.dll is the artifact
        # php-judy's Windows build will link instead of compiling C libjudy
        # from source (see docs/COMPAT.md gate G3).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Assert capi drop-in artifacts exist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = "target/debug/expanse.dll"
          $lib = "target/debug/expanse.lib"
          if (!(Test-Path $dll)) { Write-Error "missing $dll"; exit 1 }
          if (!(Test-Path $lib)) { Write-Error "missing $lib"; exit 1 }
          Write-Host "capi artifacts present: $dll, $lib"

      - name: Assert capi drop-in artifacts exist (Unix)
        if: runner.os != 'Windows'
        run: |
          shopt -s nullglob
          arts=(target/debug/libexpanse.{so,dylib} target/debug/libexpanse.a)
          if [ ${#arts[@]} -lt 2 ]; then
            echo "::error::expected cdylib + staticlib capi artifacts, found: ${arts[*]:-none}"
            exit 1
          fi
          echo "capi artifacts present: ${arts[*]}"
        shell: bash

  test-musl:
    # Most containerized deployments run Alpine. musl differs from glibc
    # enough (allocator, default stack sizes) that a clean glibc build is no
    # proof of a clean musl one — php-judy precedent. Cross-built from the
    # glibc runner: GitHub's JS actions need glibc node, so a `container:
    # alpine` job can't even check out.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test (musl, static)
        run: cargo test --workspace --target x86_64-unknown-linux-musl

      - name: Build capi (musl, dynamic — the Alpine drop-in artifact)
        # musl defaults to +crt-static, under which no cdylib is produced;
        # the libjudy swap on Alpine needs a real shared object.
        env:
          RUSTFLAGS: -C target-feature=-crt-static
        run: cargo build -p expanse-capi --target x86_64-unknown-linux-musl

      - name: Assert capi drop-in artifacts exist (musl)
        run: |
          dir=target/x86_64-unknown-linux-musl/debug
          test -f "$dir/libexpanse.so" || { echo "::error::missing $dir/libexpanse.so"; exit 1; }
          test -f "$dir/libexpanse.a"  || { echo "::error::missing $dir/libexpanse.a"; exit 1; }
          echo "capi artifacts present: $dir/libexpanse.so, $dir/libexpanse.a"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check

  # --- Jobs to add as their phases land (see docs/TESTING.md "CI mapping") ---
  # differential-oracle: Linux + libjudy-dev; libexpanse vs stock libjudy over
  #   shared op sequences (COMPAT.md gate G1). Lands with the Phase 8 surface.
  # miri: nightly cargo miri test on crates/expanse once unsafe enters the core.
  # fuzz: scheduled cargo-fuzz job over op-sequence targets.
  # php-judy-swap: build php-judy against libexpanse and run its suite
  #   (COMPAT.md gates G2/G3).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  
jobs:
  detect-changes:
    name: Subsystems / Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      java: ${{ steps.filter.outputs.java }}
      docs: ${{ steps.filter.outputs.docs }}
      ruby: ${{ steps.filter.outputs.ruby }}
      php: ${{ steps.filter.outputs.php }}
      wasm: ${{ steps.filter.outputs.wasm }}
      go: ${{ steps.filter.outputs.go }}
      integrations: ${{ steps.filter.outputs.integrations }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'include/**'
              - 'integrations/**'
              - 'tests/cpp/**'
              - 'fuzz/**'
              - 'scripts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              - '.github/workflows/ci.yml'
              - '.github/workflows/nightly.yml'
            python:
              - 'bindings/python/**'
              - 'crates/expanse-py/**'
              - 'crates/expanse/**'
              - 'crates/expanse-capi/**'
              - 'tests/test_python_bindings.py'
              - 'pyproject.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/python.yml'
            node:
              - 'crates/expanse-node/**'
              - 'crates/expanse/**'
              - 'crates/expanse-capi/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            dotnet:
              - 'bindings/dotnet/**'
              - 'crates/expanse/**'
              - 'crates/expanse-capi/**'
              - 'include/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            java:
              - 'bindings/java/**'
              - 'crates/expanse/**'
              - 'crates/expanse-capi/**'
              - 'include/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            docs:
              - 'docs/**'
              - '*.md'
              - 'scripts/**'
              - 'website/**'
            ruby:
              - 'bindings/ruby/**'
              - 'include/**'
              - 'crates/expanse-capi/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            php:
              - 'bindings/php/**'
              - 'crates/expanse-php/**'
              - 'include/**'
              - 'crates/expanse-capi/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            wasm:
              - 'crates/expanse-wasm/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            go:
              - 'bindings/go/**'
              - 'include/**'
              - 'crates/expanse-capi/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            integrations:
              - 'integrations/**'
              - 'crates/expanse/**'
              - 'crates/expanse-capi/**'
              - 'include/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  lint:
    name: Core / Linter & Formatting
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check

      - name: Verify Multi-Ecosystem Version Lockstep
        run: python3 scripts/bump_version.py --check

      - name: Verify C ABI Symbol Parity Across All Bindings
        run: python3 scripts/check_abi_parity.py

      - name: Verify CI Gate Completeness
        run: python3 scripts/check_ci_gate.py

  test:
    name: Core / Workspace Tests (${{ matrix.os }})
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --exclude expanse-php

      - name: Test
        run: cargo test --workspace --exclude expanse-php

      - name: Assert capi drop-in artifacts exist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = "target/debug/expanse.dll"
          $lib = "target/debug/expanse.lib"
          if (!(Test-Path $dll)) { Write-Error "missing $dll"; exit 1 }
          if (!(Test-Path $lib)) { Write-Error "missing $lib"; exit 1 }
          Write-Host "capi artifacts present: $dll, $lib"

      - name: Assert capi drop-in artifacts exist (Unix)
        if: runner.os != 'Windows'
        run: |
          shopt -s nullglob
          arts=(target/debug/libexpanse.{so,dylib} target/debug/libexpanse.a)
          if [ ${#arts[@]} -lt 2 ]; then
            echo "::error::expected cdylib + staticlib capi artifacts, found: ${arts[*]:-none}"
            exit 1
          fi
          echo "capi artifacts present: ${arts[*]}"
        shell: bash

      - name: Run C++20 Header Tests (Unix)
        if: runner.os != 'Windows'
        run: |
          c++ -std=c++20 -Iinclude tests/cpp/test_expanse.cpp target/debug/libexpanse.a -lpthread -ldl -lm -o /tmp/test_cpp
          /tmp/test_cpp
  test-riscv64:
    name: Cross / RV64GC Cross-Compile (Linux)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Check (riscv64, cross-compile)
        run: cargo check --target riscv64gc-unknown-linux-gnu -p expanse-trie -p expanse-capi

  test-rv32:
    name: Cross / RV32IMAC Cross-Compile (Bare-Metal)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Target
        run: rustup target add riscv32imac-unknown-none-elf

      - uses: Swatinem/rust-cache@v2

      - name: Check RV32IMAC Core
        run: cargo check -p expanse-trie --no-default-features --target riscv32imac-unknown-none-elf

  test-rv32-zbb:
    name: Cross / RV32IMAC + Zbb Cross-Compile (Bare-Metal)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Target
        run: rustup target add riscv32imac-unknown-none-elf

      - uses: Swatinem/rust-cache@v2

      # Zbb adds cpop/clz/ctz, so count_ones/leading_zeros/trailing_zeros in the
      # hot trie32 leaf/bitmap path lower to single instructions instead of the
      # base-ISA software sequences. See docs/HARDWARE.md §3.1 and
      # docs/design/32-bit-embedded.md. Codegen-only; the software fallback stays.
      - name: Check RV32IMAC + Zbb Core
        run: cargo check -p expanse-trie --no-default-features --target riscv32imac-unknown-none-elf
        env:
          RUSTFLAGS: "-C target-feature=+zbb"

  test-esp32c3:
    name: Cross / ESP32-C3 Cross-Compile (Bare-Metal RV32IMC)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Target
        run: rustup target add riscv32imc-unknown-none-elf

      - uses: Swatinem/rust-cache@v2

      - name: Check ESP32-C3 (RV32IMC) Core
        run: cargo check -p expanse-trie --no-default-features --target riscv32imc-unknown-none-elf

  test-cortex-m:
    name: Cross / ARM Cortex-M4 Cross-Compile (Bare-Metal)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Target
        run: rustup target add thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@v2

      - name: Check Cortex-M4 Core
        run: cargo check -p expanse-trie --no-default-features --target thumbv7em-none-eabihf

  test-i686:
    name: Cross / i686 32-bit Test Execution (Linux)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - uses: Swatinem/rust-cache@v2

      # Runs the real 32-bit trie engine with 32-bit `usize`/pointers — the
      # only host-runnable 32-bit target — so the differential oracle and
      # leak checks execute under the actual embedded word size. Scoped to
      # `--lib`: the integration tests under `tests/` exercise the
      # 64-bit-only engine modules (cfg'd out on 32-bit targets), so they do
      # not compile here; the 32-bit engine's own tests live in the lib.
      - name: Test expanse-trie (i686, 32-bit std)
        run: cargo test -p expanse-trie --lib --target i686-unknown-linux-gnu

  test-musl:
    name: Cross / Musl Static C ABI (Linux)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          }

      - name: Test (musl, static)
        run: cargo test -p expanse-trie -p expanse-capi --target x86_64-unknown-linux-musl

      - name: Build capi (musl, dynamic — the Alpine drop-in artifact)
        env:
          RUSTFLAGS: -C target-feature=-crt-static
        run: cargo build -p expanse-capi --target x86_64-unknown-linux-musl

      - name: Assert capi drop-in artifacts exist (musl)
        run: |
          dir=target/x86_64-unknown-linux-musl/debug
          test -f "$dir/libexpanse.so" || { echo "::error::missing $dir/libexpanse.so"; exit 1; }
          test -f "$dir/libexpanse.a"  || { echo "::error::missing $dir/libexpanse.a"; exit 1; }
          echo "capi artifacts present: $dir/libexpanse.so, $dir/libexpanse.a"

  miri:
    name: Safety / Tier 1 Miri Fast Smoke
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      - name: Miri (core unsafe smoke — leaf, node, slot, 32-bit trie invariants)
        run: |
          cargo miri test -p expanse-trie --lib -- leaf:: node:: slot:: alloc:: bits:: types::

  test-asan:
    name: Safety / ASan Core Smoke (Ubuntu)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Run expanse-trie unit tests under AddressSanitizer
        run: cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p expanse-trie
        env:
          RUSTFLAGS: "-Zsanitizer=address"

  php-judy-compat:
    name: Compat / PHP-Judy Extension (Linux)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install PHP toolchain
        run: |
          sudo apt-get install -y --no-install-recommends php-dev php-cli || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends php-dev php-cli
          }

      - name: Build libexpanse and assemble the libjudy-compat prefix
        run: |
          cargo build --release -p expanse-capi
          PREFIX="$PWD/compat-prefix"
          mkdir -p "$PREFIX/include" "$PREFIX/lib"
          cp crates/expanse-capi/include/Judy.h "$PREFIX/include/"
          cp target/release/libexpanse.so "$PREFIX/lib/libJudy.so"
          echo "JUDY_PREFIX=$PREFIX" >> "$GITHUB_ENV"

      - name: Build php-judy against libexpanse
        run: |
          git clone --filter=blob:none https://github.com/orieg/php-judy.git
          cd php-judy
          git checkout -q fb490245854fad4bfc0c9e0e987e846d2a0ae3bb
          phpize
          ./configure --with-judy="$JUDY_PREFIX"
          make -j"$(nproc)"

      - name: Run the php-judy test suite
        run: |
          cd php-judy
          export LD_LIBRARY_PATH="$JUDY_PREFIX/lib"
          NO_INTERACTION=1 make test | tee test-output.log
          grep -E 'Tests failed *: *0 ' test-output.log || {
            echo '::group::failing-test diffs'
            for f in tests/*.diff tests/*.out; do
              [ -f "$f" ] && { echo "--- $f"; cat "$f"; }
            done
            echo '::endgroup::'
            exit 1
          }

  php-judy-windows:
    name: Compat / PHP-Judy Extension (Windows x64)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build expanse.dll and assemble the --with-judy prefix
        shell: pwsh
        run: |
          cargo build --release -p expanse-capi
          $prefix = "$PWD\compat-prefix"
          New-Item -ItemType Directory -Force -Path "$prefix\include", "$prefix\lib" | Out-Null
          Copy-Item crates/expanse-capi/include/Judy.h "$prefix\include"
          Copy-Item target/release/expanse.dll.lib "$prefix\lib\libJudy.lib"
          Copy-Item target/release/expanse.dll.lib "$prefix\libJudy.lib"
          Copy-Item target/release/expanse.dll "$prefix"
          Copy-Item target/release/expanse.dll "C:\Windows\System32"
          Add-Content $env:GITHUB_ENV "JUDY_PREFIX=$prefix"

      - name: Disable Windows Error Reporting
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "${{ runner.temp }}"

      - name: Build php-judy against expanse.dll and run its suite
        uses: php/php-windows-builder/extension@v1
        with:
          extension-url: https://github.com/orieg/php-judy
          extension-ref: fb490245854fad4bfc0c9e0e987e846d2a0ae3bb
          php-version: "8.4"
          arch: x64
          ts: nts
          args: --with-judy=${{ env.JUDY_PREFIX }}
          test-workers: "1"
          test-runner-args: "--set-timeout 30"

  instruction-counts:
    name: Perf / Callgrind Deterministic Instructions
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install valgrind and stock libjudy
        timeout-minutes: 8
        run: |
          if timeout 120 sudo apt-get install -y valgrind libjudy-dev; then exit 0; fi
          for i in 1 2 3; do
            timeout 120 sudo apt-get update || true
            if timeout 120 sudo apt-get install -y valgrind libjudy-dev; then exit 0; fi
            echo "apt attempt $i failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Install iai-callgrind-runner
        run: |
          VERSION=$(cargo metadata --format-version 1 --locked | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='iai-callgrind'))")
          echo "iai-callgrind resolved to $VERSION"
          cargo install iai-callgrind-runner --version "$VERSION"

      - name: Build libexpanse.so for the same-shape arm
        run: |
          cargo build --release -p expanse-capi
          SO=$(find target/release -maxdepth 1 -name 'libexpanse.so' -print -quit)
          test -n "$SO" || { echo "libexpanse.so not produced"; exit 1; }
          echo "EXPANSE_CDYLIB=$PWD/$SO" >> "$GITHUB_ENV"
          echo "using $PWD/$SO"

      - name: Instruction and cache-miss counts (merge base)
        if: github.event_name == 'pull_request'
        run: |
          git config --global --add safe.directory "$PWD"
          MERGE_BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || echo "")
          if [ -n "$MERGE_BASE" ]; then
            echo "Benchmarking merge base $MERGE_BASE against origin/${{ github.base_ref }}..."
            git checkout "$MERGE_BASE"
            cargo bench --bench instructions -p expanse-trie -- --save-baseline=main_base | tee base-counts.txt || true
            git checkout -
          fi

      - name: Instruction and cache-miss counts (this branch, baseline)
        run: |
          if [ -f base-counts.txt ]; then
            cargo bench --bench instructions -p expanse-trie -- --baseline=main_base | tee instruction-counts.txt
          else
            cargo bench --bench instructions -p expanse-trie | tee instruction-counts.txt
          fi

      - name: Instruction and cache-miss counts (this branch, x86-64-v3 modern)
        run: |
          RUSTFLAGS="-C target-cpu=x86-64-v3" cargo bench --bench instructions -p expanse-trie | tee v3-counts.txt

      - name: bytes/key table (64-bit)
        run: cargo run --release -p expanse-trie --example bytes_per_key | tee bytes-per-key.txt

      - name: bytes/key table (32-bit embedded)
        run: cargo run --release -p expanse-trie --example bytes_per_key_32 | tee bytes-per-key-32.txt

      - name: libexpanse vs stock libjudy (instructions)
        run: cargo bench --bench vs_stock -p expanse-capi | tee vs-stock.txt

      - name: Head-to-Head Comparative Benchmark (Expanse vs hashbrown vs BTreeMap)
        run: |
          python3 scripts/bench_report.py --quick --format markdown | tee head-to-head.md

      - name: Generate Report and Enforce Regression Guard
        if: always()
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -f instruction-counts.txt ] && [ -f bytes-per-key.txt ] && [ -f vs-stock.txt ]; then
            printf '%s' "$PR_BODY" > pr-body.txt
            BASE_ARGS=""
            if [ -f base-counts.txt ]; then
              BASE_ARGS="--base base-counts.txt --base-ref origin/${{ github.base_ref }}"
            fi
            HEAD_TO_HEAD_ARGS=""
            if [ -f head-to-head.md ]; then
              HEAD_TO_HEAD_ARGS="--head-to-head head-to-head.md"
            fi
            python3 scripts/perf_report.py \
              --head instruction-counts.txt \
              $BASE_ARGS \
              $HEAD_TO_HEAD_ARGS \
              --bytes bytes-per-key.txt \
              --bytes32 bytes-per-key-32.txt \
              --vs-stock vs-stock.txt \
              --v3 v3-counts.txt \
              --pr-body-file pr-body.txt \
              --fail-on-regression \
              --max-regression-pct 5.0 > pr-report.md
            if [ -f pr-report.md ]; then
              cat pr-report.md >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Post or Update Benchmark PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('pr-report.md')) {
              console.log('No pr-report.md found, skipping comment');
              return;
            }
            const report = fs.readFileSync('pr-report.md', 'utf8').trim();
            if (!report) return;

            const marker = '<!-- expanse-perf-report -->';
            const body = `${marker}\n${report}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              console.log(`Updating existing PR benchmark comment #${existing.id}`);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              console.log('Creating new PR benchmark comment');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  callgrind-smoke:
    name: Perf / Callgrind Fast Smoke (Ubuntu)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install valgrind
        timeout-minutes: 8
        run: |
          if timeout 120 sudo apt-get install -y valgrind; then exit 0; fi
          for i in 1 2 3; do
            timeout 120 sudo apt-get update || true
            if timeout 120 sudo apt-get install -y valgrind; then exit 0; fi
            echo "apt attempt $i failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Install iai-callgrind-runner
        run: |
          VERSION=$(cargo metadata --format-version 1 --locked | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='iai-callgrind'))")
          echo "iai-callgrind resolved to $VERSION"
          cargo install iai-callgrind-runner --version "$VERSION"

      - name: Build release artifacts
        run: cargo build --release -p expanse-trie -p expanse-capi

      - name: Callgrind Fast Smoke (merge base)
        if: github.event_name == 'pull_request'
        run: |
          git config --global --add safe.directory "$PWD"
          MERGE_BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || echo "")
          if [ -n "$MERGE_BASE" ]; then
            echo "Benchmarking smoke merge base $MERGE_BASE against origin/${{ github.base_ref }}..."
            git checkout "$MERGE_BASE"
            cargo bench --bench smoke_instructions -p expanse-trie -- --save-baseline=smoke_base | tee base-smoke-counts.txt || true
            git checkout -
          fi

      - name: Run Callgrind Fast Smoke Instructions Benchmark
        run: |
          if [ -f base-smoke-counts.txt ]; then
            cargo bench --bench smoke_instructions -p expanse-trie -- --baseline=smoke_base | tee smoke-instruction-counts.txt
          else
            cargo bench --bench smoke_instructions -p expanse-trie | tee smoke-instruction-counts.txt
          fi

      - name: Generate Report and Enforce Regression Guard
        if: always()
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -f smoke-instruction-counts.txt ]; then
            printf '%s' "$PR_BODY" > pr-body.txt
            BASE_ARGS=""
            if [ -f base-smoke-counts.txt ]; then
              BASE_ARGS="--base base-smoke-counts.txt --base-ref origin/${{ github.base_ref }}"
            fi
            python3 scripts/perf_report.py \
              --head smoke-instruction-counts.txt \
              $BASE_ARGS \
              --pr-body-file pr-body.txt \
              --fail-on-regression \
              --max-regression-pct 5.0 > smoke-report.md
            if [ -f smoke-report.md ]; then
              cat smoke-report.md >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  differential-oracle:
    name: Compat / Stock libjudy Oracle (Linux)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install stock libjudy
        timeout-minutes: 8
        run: |
          if timeout 120 sudo apt-get install -y libjudy-dev; then exit 0; fi
          for _ in 1 2 3; do
            timeout 120 sudo apt-get update || true
            if timeout 120 sudo apt-get install -y libjudy-dev; then exit 0; fi
            echo "apt attempt failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Differential oracle vs stock libjudy
        run: cargo test -p expanse-capi --features oracle

      - name: Modern API smoke (expanse.h)
        run: |
          cargo build --release -p expanse-capi
          cc crates/expanse-capi/smoke/modern_api_smoke.c -Icrates/expanse-capi/include -Ltarget/release -lexpanse -o modern_smoke
          LD_LIBRARY_PATH="$PWD/target/release" ./modern_smoke

      - name: Preload smoke (COMPAT.md gate G4)
        run: |
          cargo build --release -p expanse-capi
          cc crates/expanse-capi/smoke/preload_smoke.c -lJudy -o smoke
          ./smoke > stock.out
          LD_PRELOAD="$PWD/target/release/libexpanse.so" ./smoke > preload.out
          diff stock.out preload.out
          grep -q '^ok$' stock.out

  memory-budget:
    name: Perf / Memory Budget Invariants
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run memory budget assertions (64-bit)
        run: cargo run --release --example bytes_per_key

      - name: Run memory budget assertions (32-bit embedded)
        run: cargo run --release --example bytes_per_key_32

  loom:
    name: Safety / Loom Concurrency Race Model
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Loom model checks
        run: cargo test -p expanse-trie --release loom_
        env:
          RUSTFLAGS: --cfg loom

  fuzz-smoke:
    name: Safety / Fuzz Invariants Smoke
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz smoke (60s per target)
        run: |
          for t in set_ops map_ops bytesmap_ops strmap_ops blobmap_image_corrupt set32_ops map32_ops; do
            echo "::group::$t"
            cargo fuzz run "$t" -- -max_total_time=60 -print_final_stats=1
            echo "::endgroup::"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore


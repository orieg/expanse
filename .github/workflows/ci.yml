  test-rocksdb-memtable:
    name: Integrations / RocksDB MemTable (${{ matrix.os }}, ${{ matrix.sanitizer }})
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust == 'true' || needs.detect-changes.outputs.integrations == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: [none, asan-ubsan, tsan]
        exclude:
          - os: macos-latest
            sanitizer: tsan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build native libexpanse
        run: cargo build --release -p expanse-capi

      - name: Compile and Run MemTable Tests (Standard)
        if: matrix.sanitizer == 'none'
        run: |
          c++ -std=c++20 -O3 -Iintegrations/rocksdb/include -Icrates/expanse-capi/include -Iinclude \
            integrations/rocksdb/src/expanse_memtable.cc \
            integrations/rocksdb/tests/test_expanse_memtable.cc \
            target/release/libexpanse.a -lpthread -ldl -lm -o /tmp/test_memtable
          /tmp/test_memtable

          c++ -std=c++20 -O3 -Iintegrations/rocksdb/include -Icrates/expanse-capi/include -Iinclude \
            integrations/rocksdb/src/expanse_memtable.cc \
            integrations/rocksdb/tests/test_differential_memtable.cc \
            target/release/libexpanse.a -lpthread -ldl -lm -o /tmp/test_differential
          /tmp/test_differential

      - name: Compile and Run MemTable Tests (ASan / UBSan)
        if: matrix.sanitizer == 'asan-ubsan'
        run: |
          c++ -std=c++20 -g -fsanitize=address,undefined -Iintegrations/rocksdb/include -Icrates/expanse-capi/include -Iinclude \
            integrations/rocksdb/src/expanse_memtable.cc \
            integrations/rocksdb/tests/test_expanse_memtable.cc \
            target/release/libexpanse.a -lpthread -ldl -lm -o /tmp/test_memtable_asan
          /tmp/test_memtable_asan

          c++ -std=c++20 -g -fsanitize=address,undefined -Iintegrations/rocksdb/include -Icrates/expanse-capi/include -Iinclude \
            integrations/rocksdb/src/expanse_memtable.cc \
            integrations/rocksdb/tests/test_differential_memtable.cc \
            target/release/libexpanse.a -lpthread -ldl -lm -o /tmp/test_differential_asan
          /tmp/test_differential_asan

      - name: Compile and Run MemTable Tests (TSan)
        if: matrix.sanitizer == 'tsan'
        run: |
          c++ -std=c++20 -g -fsanitize=thread -Iintegrations/rocksdb/include -Icrates/expanse-capi/include -Iinclude \
            integrations/rocksdb/src/expanse_memtable.cc \
            integrations/rocksdb/tests/test_expanse_memtable.cc \
            target/release/libexpanse.a -lpthread -ldl -lm -o /tmp/test_memtable_tsan
          /tmp/test_memtable_tsan



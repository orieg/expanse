  test-wasm64:
    name: Bindings / WebAssembly (wasm64 Memory64 Experimental)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.wasm == 'true' || needs.detect-changes.outputs.rust-src == 'true' || github.event_name != 'pull_request'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly
          components: rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Check core expanse-trie on wasm64-unknown-unknown
        run: cargo check -p expanse-trie --target wasm64-unknown-unknown -Z build-std

      - name: Build expanse-wasm on wasm64-unknown-unknown
        run: cargo build -p expanse-wasm --target wasm64-unknown-unknown -Z build-std=std,panic_abort

      - name: Run Node.js Memory64 Runtime Smoke Test
        run: node crates/expanse-wasm/tests/test_wasm64_smoke.js

  wasm-fuel:
    name: Perf / WebAssembly Fuel (wasm32 + wasm64, deterministic)
    runs-on: ubuntu-latest
    needs: [detect-changes]
    if: needs.detect-changes.outputs.wasm == 'true' || needs.detect-changes.outputs.rust-src == 'true' || github.event_name != 'pull_request'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # wasm64 has no shipped rust-std; the fuel module is built with
      # -Z build-std on nightly. The channel is dated: fuel counts follow the
      # compiler's codegen, and the committed baseline was measured with this
      # one. Move the pin and the baseline together (scripts/wasm_fuel.py
      # --save-baseline), never one without the other.
      - name: Install the pinned nightly with rust-src for wasm64
        run: rustup toolchain install nightly-2026-09-03 --profile minimal --component rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The exact-fuel readout needs the wasmtime Python bindings; the script
      # exits 1 with this hint if they are absent — it never mocks a runtime.
      # Pinned for the same reason as the nightly: fuel accounting is a property
      # of the runtime version, and results/baseline_wasm_fuel.json records
      # the version it was measured with.
      - name: Install wasmtime (pinned to the baseline's version)
        run: python3 -m pip install --quiet wasmtime==48.0.0

      - name: Driver self-test (fail-then-pass pins of the gate policy)
        run: python3 scripts/wasm_fuel.py --self-test

      # Every export is run twice on fresh instances and must agree to the
      # unit; the gate mirrors perf_report.py (single-worst > 5%, or >= 2 arms
      # over the 0.5% floor). A missing baseline entry is a hard failure, not
      # a green run (§8.1).
      - name: Fuel counts, wasm32 (32-bit engine) vs committed baseline
        run: python3 scripts/wasm_fuel.py --build wasm32 --check-baseline results/baseline_wasm_fuel.json --json wasm_fuel_wasm32.json --markdown wasm_fuel_wasm32.md

      - name: Fuel counts, wasm64 (64-bit engine) vs committed baseline
        env:
          WASM_FUEL_NIGHTLY: nightly-2026-09-03
        run: python3 scripts/wasm_fuel.py --build wasm64 --check-baseline results/baseline_wasm_fuel.json --json wasm_fuel_wasm64.json --markdown wasm_fuel_wasm64.md

      - name: Publish tables to the job summary
        if: always()
        run: |
          for f in wasm_fuel_wasm32.md wasm_fuel_wasm64.md; do
            [ -f "$f" ] && cat "$f" >> "$GITHUB_STEP_SUMMARY"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wasm-fuel
          path: |
            wasm_fuel_wasm32.json
            wasm_fuel_wasm64.json
            wasm_fuel_wasm32.md
            wasm_fuel_wasm64.md
          if-no-files-found: ignore

  test-go:
    name: Bindings / Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [detect-changes]
    if: needs.detect-changes.outputs.go == 'true' || needs.detect-changes.outputs.rust-src == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build native libexpanse
        run: cargo build --release -p expanse-capi

      - name: Run Go test suite and benchmarks (cgo on Unix)
        if: runner.os != 'Windows'
        run: |
          export LD_LIBRARY_PATH="$PWD/target/release:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="$PWD/target/release:$DYLD_LIBRARY_PATH"
          export CGO_LDFLAGS_ALLOW=".*"
          cd bindings/go && go test -v -bench=. -benchtime=100ms .

      - name: Run Go test suite and benchmarks (purego CGO_ENABLED=0 on Unix)
        if: runner.os != 'Windows'
        run: |
          export LD_LIBRARY_PATH="$PWD/target/release:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="$PWD/target/release:$DYLD_LIBRARY_PATH"
          export EXPANSE_LIBRARY="$PWD/target/release"
          cd bindings/go && CGO_ENABLED=0 go test -v -bench=. -benchtime=100ms .

      # This step differs from the one above in leaving cgo *enabled*: it
      # proves `-tags expanse_purego` selects the purego files even when a C
      # toolchain is present, which is the documented opt-in mode.
      #
      # On macOS that combination needs an external link below Go 1.24. Go's
      # internal linker emitted no LC_UUID on darwin until 1.24, and dyld on
      # macOS 15+ aborts a cgo-linked binary that lacks it -- `dyld: missing
      # LC_UUID load command` / `signal: abort trap` before any test runs.
      # Measured on macOS 26.4.1 arm64 against libexpanse at this commit:
      # 1.22.12 FAIL, 1.23.12 FAIL, 1.24.10 PASS, 1.25.6 PASS; with
      # `-linkmode=external` 1.22.12 PASSes and the binary carries an LC_UUID.
      # `CGO_ENABLED=0` is unaffected on every version (no cgo to link), which
      # is why only this step failed. Linux is unaffected throughout.
      #
      # The flag is applied only where it is needed, so the default invocation
      # stays under test everywhere it works. Drop it once the pinned Go is
      # >= 1.24. bindings/go/README.md documents the same constraint for users.
      - name: Run Go test suite (explicit expanse_purego build tag on Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$PWD/target/release:$LD_LIBRARY_PATH"
          export DYLD_LIBRARY_PATH="$PWD/target/release:$DYLD_LIBRARY_PATH"
          export EXPANSE_LIBRARY="$PWD/target/release"
          LDFLAGS=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            # -n ...p so an unparseable GOVERSION (a devel toolchain) yields an
            # empty string rather than a non-numeric one: the comparison would
            # then fail open and skip the flag on a version that needs it.
            # Absent or < 1.24 both take the flag -- external linking is
            # harmless on versions that do not need it (verified passing on
            # 1.25.6), so the safe default is to apply it when unsure.
            GO_MINOR=$(go env GOVERSION | sed -nE 's/^go1\.([0-9]+).*/\1/p')
            if [ -z "$GO_MINOR" ] || [ "$GO_MINOR" -lt 24 ]; then
              echo "Go '$(go env GOVERSION)' on macOS: forcing -linkmode=external for LC_UUID (see comment above)"
              LDFLAGS=(-ldflags=-linkmode=external)
            fi
          fi
          cd bindings/go && go test -tags expanse_purego "${LDFLAGS[@]}" -v .

      - name: Run Go test suite and benchmarks (purego CGO_ENABLED=0 on Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:EXPANSE_LIBRARY = "${{ github.workspace }}\target\release"
          cd bindings/go
          go test -v -bench=. -benchtime=100ms .

  ci-gate:
    name: CI Gate / All Checks Passed
    if: always()
    needs:
      - detect-changes
      - lint
      - msrv
      - man-examples
      - docs-lint
      - test
      - test-aarch64
      - test-musl
      - test-riscv64
      - test-rv32
      - test-rv32-zbb
      - test-esp32c3
      - test-cortex-m
      - test-qemu-cortex-m3
      - test-x86_64-none
      - test-i686
      - miri
      - test-asan
      - php-judy-compat
      - php-judy-windows
      - instruction-counts
      - callgrind-smoke
      - differential-oracle
      - memory-budget
      - loom
      - wasm-fuel
      - fuzz-smoke
      - test-python
      - test-node
      - test-php
      - test-dotnet
      - pack-dotnet
      - test-java
      - pack-java
      - test-rocksdb-memtable
      - test-ruby
      - test-wasm
      - test-wasm64
      - test-go
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Gate Self-Check (every job is a required dependency)
        shell: bash
        run: |
          # The branch ruleset requires only this single rollup context, so any job
          # left out of ci-gate's `needs` would fail open (its result unobserved).
          # Assert every job id (except ci-gate itself) is a dependency here.
          python3 -c '
          import sys, yaml
          wf = yaml.safe_load(open(".github/workflows/ci.yml"))
          jobs = set(wf["jobs"].keys())
          needs = wf["jobs"]["ci-gate"].get("needs", [])
          needs = {needs} if isinstance(needs, str) else set(needs)
          missing = (jobs - {"ci-gate"}) - needs
          if missing:
              print("::error::ci-gate is missing required job(s) in needs: " + ", ".join(sorted(missing)))
              sys.exit(1)
          print("ci-gate depends on all %d other jobs (incl. test-ruby): OK" % (len(jobs) - 1))
          '

      - name: Evaluate Dependency Statuses
        shell: bash
        run: |
          echo "Evaluating CI matrix health..."
          STATUSES='${{ toJson(needs) }}'
          FAILED=()

          for job in $(echo "$STATUSES" | jq -r 'keys[]'); do
            result=$(echo "$STATUSES" | jq -r --arg j "$job" '.[$j].result')
            echo "  Job [$job]: $result"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              FAILED+=("$job")
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo "::error::The following required checks failed: ${FAILED[*]}"
            exit 1
          fi

          echo "::notice::All applicable CI checks passed (or were cleanly skipped by path filters)."
          exit 0

  test-rv32-zbb:
    name: Cross / RV32IMAC + Zbb Cross-Compile (Bare-Metal)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust-src == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Target
        run: rustup target add riscv32imac-unknown-none-elf

      - uses: Swatinem/rust-cache@v2

      # Zbb adds cpop/clz/ctz, so count_ones/leading_zeros/trailing_zeros in the
      # hot trie32 leaf/bitmap path lower to single instructions instead of the
      # base-ISA software sequences. See docs/HARDWARE.md §3.1 and
      # docs/design/32-bit-embedded.md. Codegen-only; the software fallback stays.
      - name: Check RV32IMAC + Zbb Core
        run: cargo check -p expanse-trie --no-default-features --target riscv32imac-unknown-none-elf
        env:
          RUSTFLAGS: "-C target-feature=+zbb"

  test-esp32c3:
    name: Cross / ESP32-C3 Cross-Compile (Bare-Metal RV32IMC)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust-src == 'true' || needs.detect-changes.outputs.esp-component == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Target
        run: rustup target add riscv32imc-unknown-none-elf

      - uses: Swatinem/rust-cache@v2

      - name: Check ESP32-C3 (RV32IMC) Core
        run: cargo check -p expanse-trie --no-default-features --target riscv32imc-unknown-none-elf

      # The bare-metal libexpanse staticlib: `build`, not `check`, so the
      # archive actually links, and clippy at the repo's -D warnings bar so
      # the width-gated surface cannot rot into dead code (#558).
      - name: Build ESP32-C3 (RV32IMC) C ABI staticlib
        run: |
          cargo build --release -p expanse-capi --no-default-features \
            --features embedded-panic-handler \
            --target riscv32imc-unknown-none-elf
          cargo clippy -p expanse-capi --no-default-features \
            --features embedded-panic-handler \
            --target riscv32imc-unknown-none-elf -- -D warnings

      # The whole point of the alloc bridge: the archive must reach the
      # outside world through exactly two host symbols (plus compiler-rt
      # builtins, which the ESP toolchain supplies). Anything else means a
      # libc dependency crept in and the ESP-IDF link would break.
      - name: Assert the bare-metal archive has no libc dependency
        run: |
          set -euo pipefail
          rustup component add llvm-tools
          NM="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin/llvm-nm"
          AR=target/riscv32imc-unknown-none-elf/release/libexpanse.a
          "$NM" --undefined-only "$AR" | awk '{print $2}' | sort -u > /tmp/undef.txt
          "$NM" --defined-only   "$AR" | awk '{print $3}' | sort -u > /tmp/def.txt
          comm -23 /tmp/undef.txt /tmp/def.txt | { grep -v '^__' || true; } | sort > /tmp/external.txt
          printf 'expanse_host_free\nexpanse_host_malloc\n' > /tmp/expected.txt
          if ! diff -u /tmp/expected.txt /tmp/external.txt; then
            echo "::error::libexpanse.a needs symbols beyond the host allocator pair"
            exit 1
          fi

      # Compile a C translation unit against the shipped header at 32-bit
      # width: proves EXPANSE_WIDE_SURFACE and expanse_word_t resolve the way
      # docs/COMPAT.md says, and that the narrow call signatures type-check.
      - name: Type-check the 32-bit C header path
        run: |
          set -euo pipefail
          cat > /tmp/narrow_surface.c <<'CEOF'
          #include <stdint.h>
          #include "expanse.h"
          _Static_assert(sizeof(expanse_word_t) == 4, "32-bit key/value word");
          _Static_assert(EXPANSE_WIDE_SURFACE == 0, "narrow surface on 32-bit");
          int probe(void) {
              expanse_word_t k = 0;
              expanse_set_t *s = expanse_set_new();
              expanse_set_insert(s, 1);
              expanse_set_contains(s, 1);
              expanse_set_first(s, &k);
              expanse_set_free(s);
              expanse_map_t *m = expanse_map_new();
              expanse_map_insert(m, 1, 2, &k);
              expanse_map_get(m, 1, &k);
              expanse_map_free(m);
              return (int)k;
          }
          CEOF
          clang --target=riscv32-unknown-none-elf -march=rv32imc -mabi=ilp32 \
            -ffreestanding -fsyntax-only \
            -Iinclude /tmp/narrow_surface.c

      - name: Syntax-check ESP32-C3 component sources
        run: |
          set -euo pipefail
          clang --target=riscv32-unknown-none-elf -march=rv32imc -mabi=ilp32 \
            -ffreestanding -fsyntax-only -DEXPANSE_SINGLE_THREADED_BAREMETAL \
            -Iinclude -Icomponents/expanse/include \
            components/expanse/src/expanse_memtable.c \
            components/expanse/src/expanse_ble_tracker.c

      # The same sources at 64-bit width. EXPANSE_WIDE_SURFACE is 0 for every
      # target the component's CMake ladder accepts, so the 32-bit line above
      # can never exercise the wide branches -- which is why #620 (unguarded
      # narrow-only calls in expanse_memtable.c) was invisible for two
      # releases. x86_64-unknown-none is the width probe this job already uses
      # for the staticlib below.
      - name: Syntax-check component sources at 64-bit width
        run: |
          set -euo pipefail
          # The native runner target, not a bare-metal 64-bit triple: these
          # sources include <stdlib.h> / <string.h> / <pthread.h>, and a
          # bare-metal triple adds no system include path (which is also why
          # the riscv32 line above needs none). What this lane is for is
          # EXPANSE_WIDE_SURFACE == 1, and any 64-bit target gives that.
          #
          # gnu11, not c11: on this platform pair the __unix__ branch of the
          # lock macros is selected, and glibc hides PTHREAD_MUTEX_RECURSIVE
          # under __STRICT_ANSI__. A host building this component uses a gnu
          # dialect by default, so gnu11 is also the representative setting.
          cc -fsyntax-only -std=gnu11 \
            -Iinclude -Icomponents/expanse/include \
            components/expanse/src/expanse_memtable.c \
            components/expanse/src/expanse_ble_tracker.c

      # The two steps above cover components/expanse/src only, so the bench and
      # twin harnesses were outside every compile lane on every target. A
      # divisor defect in bench_esp32_memtable.c -- dividing by a literal 500
      # where the range holds 400 keys at pop=500 -- survived because nothing
      # built the file. These TUs take the non-ESP_PLATFORM fallback path
      # (<time.h>, printf), so they build on the native target like the 64-bit
      # width probe above. test_expanse.c is excluded: it needs ESP-IDF's
      # unity.h, which only exists inside an IDF build.
      - name: Syntax-check ESP32 bench and twin harnesses
        run: |
          set -euo pipefail
          cc -fsyntax-only -std=gnu11 -Wall -Wextra -Werror \
            -Iinclude -Icomponents/expanse/include -Icomponents/expanse/test \
            components/expanse/test/bench_esp32_memtable.c \
            components/expanse/test/twin_containers.c

      # 64-bit bare metal drops only expanse_sync_* (no std::sync); it keeps

      # the whole legacy Judy surface. Guards the pointer-width gates against
      # being conflated with the `std` ones. Surface matrix: docs/COMPAT.md.
      # The ESP32-P4 is hard-float RV32IMAFC (docs/HARDWARE.md §4.3); its
      # archive must be ilp32f or the ESP-IDF link rejects it (#581).
      - name: Add ESP32-P4 (RV32IMAFC) target
        run: rustup target add riscv32imafc-unknown-none-elf

      - name: Build ESP32-P4 (RV32IMAFC) C ABI staticlib
        run: |
          cargo build --release -p expanse-capi --no-default-features \
            --features embedded-panic-handler \
            --target riscv32imafc-unknown-none-elf
          cargo clippy -p expanse-capi --no-default-features \
            --features embedded-panic-handler \
            --target riscv32imafc-unknown-none-elf -- -D warnings

      - name: Assert the P4 archive is hard-float (ilp32f)
        run: |
          set -euo pipefail
          READOBJ="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/host: //p')/bin/llvm-readobj"
          AR=target/riscv32imafc-unknown-none-elf/release/libexpanse.a
          # Buffer before grepping: grep -q closing the pipe mid-stream makes
          # llvm-readobj abort on EPIPE, and under pipefail that false-fails
          # the assert even when the flag is present.
          "$READOBJ" --file-header "$AR" > /tmp/p4-readobj.out
          grep -q "EF_RISCV_FLOAT_ABI_SINGLE" /tmp/p4-readobj.out || {
            echo "::error::P4 archive is not ilp32f — an ESP-IDF esp32p4 link would reject it (#581)"
            exit 1
          }

      - name: Add x86_64 bare-metal target
        run: rustup target add x86_64-unknown-none

      - name: Build 64-bit bare-metal C ABI staticlib
        run: |
          cargo build -p expanse-capi --no-default-features \
            --features embedded-panic-handler --target x86_64-unknown-none
          cargo clippy -p expanse-capi --no-default-features \
            --features embedded-panic-handler \
            --target x86_64-unknown-none -- -D warnings

  test-cortex-m:
    name: Cross / ARM Cortex-M4 Cross-Compile (Bare-Metal)
    needs: [detect-changes]
    # Also on `integrations` changes: this job links the STM32H747 harness
    # (integrations/stm32h747), so harness-only PRs must exercise it (#601).
    if: needs.detect-changes.outputs.rust-src == 'true' || needs.detect-changes.outputs.integrations == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Target
        run: rustup target add thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@v2

      - name: Check Cortex-M4 Core
        run: cargo check -p expanse-trie --no-default-features --target thumbv7em-none-eabihf

      - name: Build C ABI staticlib (Cortex-M7 hard-float)
        run: >
          cargo build --release -p expanse-capi --no-default-features
          --features embedded-panic-handler --target thumbv7em-none-eabihf

      - name: Install Arm GNU toolchain
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-arm-none-eabi libnewlib-arm-none-eabi

      # Links the STM32H747 harness (integrations/stm32h747) against the
      # staticlib with -mfloat-abi=hard. The ARM linker refuses a soft/hard
      # float-ABI mismatch, so a successful link is the ABI assertion (#598;
      # the ESP32-C3 lane asserts the same thing via readobj, #581).
      - name: Link STM32H747 harness (float-ABI assertion)
        run: sh integrations/stm32h747/build.sh

  test-qemu-cortex-m3:
    name: Cross / ARM Cortex-M3 Execution (QEMU mps2-an385)
    needs: [detect-changes]
    # The ARM execution gate that needs no hardware (#598 step 4): the narrow
    # C ABI and the sync32 SysTick-reader protocol run on an emulated
    # ARMv7-M core. Soft float, no cache, not cycle-accurate — the M7/M4
    # numbers stay a hardware measurement (integrations/stm32h747).
    if: needs.detect-changes.outputs.rust-src == 'true' || needs.detect-changes.outputs.integrations == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Target
        run: rustup target add thumbv7m-none-eabi

      - uses: Swatinem/rust-cache@v2

      - name: Build C ABI staticlib (Cortex-M3, soft float)
        run: >
          cargo build --release -p expanse-capi --no-default-features
          --features embedded-panic-handler --target thumbv7m-none-eabi

      - name: Install Arm GNU toolchain and QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm

      - name: Build smoke (soft-float ABI assertion)
        run: sh integrations/qemu-cortex-m3/build.sh

      - name: Run smoke under QEMU
        run: sh integrations/qemu-cortex-m3/run.sh

  test-x86_64-none:
    name: Cross / x86_64 Bare-Metal Cross-Compile (x86_64-unknown-none)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust-src == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Target
        run: rustup target add x86_64-unknown-none

      - uses: Swatinem/rust-cache@v2

      - name: Check x86_64 Bare-Metal Core
        run: cargo check -p expanse-trie --no-default-features --target x86_64-unknown-none

  test-i686:
    name: Cross / i686 32-bit Test Execution (Linux)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust-src == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu

      - name: Install 32-bit toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib

      - uses: Swatinem/rust-cache@v2

      # Runs the real 32-bit trie engine with 32-bit `usize`/pointers — the
      # only host-runnable 32-bit target — so the differential oracle and
      # leak checks execute under the actual embedded word size. Scoped to
      # `--lib`: the integration tests under `tests/` exercise the
      # 64-bit-only engine modules (cfg'd out on 32-bit targets), so they do
      # not compile here; the 32-bit engine's own tests live in the lib.
      - name: Test expanse-trie (i686, 32-bit std)
        run: cargo test -p expanse-trie --lib --target i686-unknown-linux-gnu

      # The 32-bit-only C surface (`!EXPANSE_WIDE_SURFACE`, #578): the i686
      # cdylib is the one host-runnable 32-bit libexpanse, so both the
      # Rust-side test and a C smoke linked with -m32 run here.
      - name: Test expanse-capi narrow surface (i686)
        run: cargo test -p expanse-capi --test test_narrow_capi --target i686-unknown-linux-gnu

      - name: Narrow C ABI smoke (i686, -m32)
        run: |
          cargo build --release -p expanse-capi --target i686-unknown-linux-gnu
          cc -m32 crates/expanse-capi/smoke/narrow_api_smoke.c -Iinclude \
            -Ltarget/i686-unknown-linux-gnu/release -lexpanse -lpthread -o narrow_smoke
          LD_LIBRARY_PATH="$PWD/target/i686-unknown-linux-gnu/release" ./narrow_smoke

      # The 32-bit-only man pages' EXAMPLES programs (NARROW_SURFACE_PAGES)
      # cannot link against the 64-bit host library the docs job uses, so
      # they are compiled, run and output-matched here against the i686
      # cdylib (#595). Failure is a job failure, not advisory.
      - name: Narrow-surface man page examples (i686, -m32)
        run: |
          python3 scripts/check_man_examples.py --narrow --cc "cc -m32" \
            --lib-dir target/i686-unknown-linux-gnu/release

  test-musl:
    name: Cross / Musl Static C ABI (Linux)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust-src == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools || {
            sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
          }

      - name: Test (musl, static)
        run: cargo test -p expanse-trie -p expanse-capi --target x86_64-unknown-linux-musl

      - name: Build capi (musl, dynamic — the Alpine drop-in artifact)
        env:
          RUSTFLAGS: -C target-feature=-crt-static
        run: cargo build -p expanse-capi --target x86_64-unknown-linux-musl

      - name: Assert capi drop-in artifacts exist (musl)
        run: |
          dir=target/x86_64-unknown-linux-musl/debug
          test -f "$dir/libexpanse.so" || { echo "::error::missing $dir/libexpanse.so"; exit 1; }
          test -f "$dir/libexpanse.a"  || { echo "::error::missing $dir/libexpanse.a"; exit 1; }
          echo "capi artifacts present: $dir/libexpanse.so, $dir/libexpanse.a"

  miri:
    name: Safety / Tier 1 Miri Fast Smoke
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust-src == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly
          components: miri

      - uses: Swatinem/rust-cache@v2


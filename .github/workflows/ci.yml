name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  
jobs:
  detect-changes:
    name: Subsystems / Change Detection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust-src: ${{ steps.filter.outputs.rust-src }}
      tooling: ${{ steps.filter.outputs.tooling }}
      perf-tooling: ${{ steps.filter.outputs.perf-tooling }}
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
      java: ${{ steps.filter.outputs.java }}
      docs: ${{ steps.filter.outputs.docs }}
      ruby: ${{ steps.filter.outputs.ruby }}
      php: ${{ steps.filter.outputs.php }}
      wasm: ${{ steps.filter.outputs.wasm }}
      go: ${{ steps.filter.outputs.go }}
      integrations: ${{ steps.filter.outputs.integrations }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # Rust/C++ behaviour: the sources every compiled artifact is
            # built from. This is the only filter that gates the expensive
            # safety lane (miri, ASan, fuzz, Callgrind) and the cross-compile
            # matrix. It deliberately excludes `scripts/**`, which no Rust job
            # compiles or links -- see `tooling` and `perf-tooling` below (#412).
            # `integrations/**` is C++ outside the cargo workspace and is
            # covered by the `integrations` filter, which gates the only job
            # that builds it.
            rust-src:
              - 'crates/**'
              - 'include/**'
              - 'tests/cpp/**'
              - 'fuzz/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain*'
              # Kept here deliberately, not by reflex (#412). An edit to this
              # file rewrites the build commands, flags, toolchains and `if:`
              # gates of the jobs above, and can silently remove one. `main` is
              # protected, so the `push` event fires only after the merge --
              # PR time is the sole place a broken or disabled safety job is
              # observable before it lands. Restricting this to the jobs a diff
              # actually touches is not expressible as a path glob, so the
              # conservative case is taken: every ci.yml edit runs the full
              # matrix. Tooling-only PRs that leave this file alone do not.
              - '.github/workflows/ci.yml'
            # Repo tooling with no Rust coupling: the guard scripts the `lint`
            # job carries (bump_version, check_abi_parity, check_ci_gate,
            # check_bench_suites, check_docs_hygiene), the workflow files those
            # scripts parse, and the /bench suite vocabulary they parse it
            # against. A PR confined to these must still run `lint` -- skipping
            # the sync guards exactly when their inputs change would defeat
            # them -- but must not run Miri, ASan, fuzz or Callgrind.
            tooling:
              - 'scripts/**'
              - '.github/workflows/**'
              - '.github/bench-suites.json'
              # `lint` runs check_man_pages.py, so a man-page-only PR must run
              # it. Kept out of `rust-src`: troff edits compile nothing, and
              # gating the safety lane on them would undo #412.
              - 'man/**'
            # The genuine tooling->Rust coupling, scoped to it: these two
            # report scripts are executed by `instruction-counts` and
            # `callgrind-smoke`, so they gate those two jobs specifically
            # rather than justifying `scripts/**` -> everything.
            perf-tooling:
              - 'scripts/perf_report.py'
              - 'scripts/bench_report.py'
            python:
              - 'bindings/python/**'
              - 'crates/expanse-py/**'
              - 'crates/expanse/**'
              - 'crates/expanse-capi/**'
              - 'tests/test_python_bindings.py'
              - 'pyproject.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/python.yml'
            node:
              - 'crates/expanse-node/**'
              - 'crates/expanse/**'
              - 'crates/expanse-capi/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            dotnet:
              - 'bindings/dotnet/**'
              - 'crates/expanse/**'
              - 'crates/expanse-capi/**'
              - 'include/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            java:
              - 'bindings/java/**'
              - 'crates/expanse/**'
              - 'crates/expanse-capi/**'
              - 'include/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            docs:
              - 'docs/**'
              - 'man/**'
              - '*.md'
              - 'scripts/**'
              - 'website/**'
            ruby:
              - 'bindings/ruby/**'
              - 'include/**'
              - 'crates/expanse-capi/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            php:
              - 'bindings/php/**'
              - 'crates/expanse-php/**'
              - 'include/**'
              - 'crates/expanse-capi/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            wasm:
              - 'crates/expanse-wasm/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            go:
              - 'bindings/go/**'
              - 'include/**'
              - 'crates/expanse-capi/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            integrations:
              - 'integrations/**'
              - 'crates/expanse/**'
              - 'crates/expanse-capi/**'
              - 'include/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  lint:
    name: Core / Linter & Formatting
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust-src == 'true' || needs.detect-changes.outputs.tooling == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --all --check

      - name: Verify Multi-Ecosystem Version Lockstep
        run: python3 scripts/bump_version.py --check

      - name: Verify C ABI Symbol Parity Across All Bindings
        run: python3 scripts/check_abi_parity.py

      - name: Verify Tracked File Deletion Rationale
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_deletion_rationale.py --base "origin/${{ github.base_ref }}"

      - name: Verify Workspace Test Count Floor
        run: python3 scripts/check_test_floors.py

      - name: Verify CI Gate Completeness
        run: python3 scripts/check_ci_gate.py

      # The `/bench` suite vocabulary is declared once in
      # `.github/bench-suites.json`; this fails when the workflow's
      # workflow_dispatch choices, the docs/BENCHMARKING.md table, or the
      # crate `[[bench]]` targets have drifted away from it (#410).
      - name: Verify Benchmark Suite Manifest Sync
        run: python3 scripts/check_bench_suites.py

      # check_man_pages.py skips its troff lint when mandoc is absent, and the
      # runner image does not ship it — without this install the advertised
      # lint silently never runs.
      - name: Install mandoc (troff linter)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mandoc

      - name: Verify Section 3 Manual Pages
        run: python3 scripts/check_man_pages.py

      - name: Verify Man Page Example Self-Tests
        run: python3 scripts/check_man_examples.py --self-test

      # The report scripts carry the §8.1 (fail-loud) and §8.2 (no hardcoded
      # findings prose) assertions as self-tests; run them so they cannot rot.
      - name: Report-Script Self-Tests (perf_report / bench_report / bench_baseline / perf counters / docs hygiene / bench suites / man pages / abi parity / deletions / test floors)
        run: |
          python3 scripts/perf_report.py --self-test
          python3 scripts/bench_report.py --self-test
          python3 scripts/bench_baseline.py --self-test
          # perf_counters.py needs a PMU to collect anything, but its CSV
          # parser, its "unsupported counter is None, never 0" rule and its
          # derived rendering are all checkable without one.
          python3 scripts/perf_counters.py --self-test
          python3 scripts/check_docs_hygiene.py --self-test
          python3 scripts/check_bench_suites.py --self-test
          python3 scripts/check_man_pages.py --self-test
          python3 scripts/check_abi_parity.py --self-test
          python3 scripts/check_deletion_rationale.py --self-test
          python3 scripts/check_test_floors.py --self-test

      # bca_bootstrap.py is the estimator every wall-clock gate rests on; its
      # unit tests pin reference values and were not executed anywhere until
      # the harvest pipeline gave them a consumer (#403 Track 0).
      - name: BCa Bootstrap Unit Tests
        working-directory: scripts
        run: python3 -m unittest test_bca_bootstrap -v

  msrv:
    name: Core / MSRV 1.88 Build
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust-src == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Cargo.toml declares rust-version = "1.88" (AGENTS.md §5); every other
      # job builds on `stable`, which never exercises the floor. This job does.
      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2

      - name: Check workspace on the declared MSRV
        run: cargo check --workspace --exclude expanse-php --all-targets

  man-examples:
    name: Docs / Man Page Examples Compile and Match
    needs: [detect-changes]
    # `man/**` sits in the `tooling` filter, so a man-page-only PR reaches this.
    if: needs.detect-changes.outputs.rust-src == 'true' || needs.detect-changes.outputs.tooling == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # check_man_pages.py validates that the troff is well formed and that
      # every symbol is mentioned. It cannot tell whether the prose is true —
      # it passed a page whose example printed the 3rd key while claiming the
      # 2nd (#419). This builds the real C ABI, compiles each page's EXAMPLES
      # program against it, runs it, and diffs stdout against the output the
      # page documents.
      - name: Build the C ABI shared library
        run: cargo build --release -p expanse-capi

      - name: Compile, run and verify every man page example
        run: python3 scripts/check_man_examples.py --lib-dir target/release

  docs-lint:
    name: Docs / Hygiene (time estimates, PII, provenance)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.docs == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Comma-separated private hostnames to reject in docs/PR text. A SECRET,
      # not a variable: Actions echoes job `env:` values into the run log, which
      # is public on this repository, and only secrets are masked (`***`). A
      # check that exists to keep these names out of public artifacts must not
      # print them on every run. Cost: secrets are unavailable to fork PRs, so
      # the hostname check skips there — the script says so and still runs its
      # other checks.
      DOCS_HOSTNAME_DENYLIST: ${{ secrets.DOCS_HOSTNAME_DENYLIST }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v7

      - name: Scan tracked markdown and the PR body
        shell: bash
        run: |
          printf '%s' "$PR_BODY" > pr-body.txt
          python3 scripts/check_docs_hygiene.py --pr-body-file pr-body.txt

  test:
    name: Core / Workspace Tests (${{ matrix.os }})
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust-src == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # AGENTS.md §5 gate 4: the randomized model test at heavy iterations
      # (proptest's default is 256 cases).
      PROPTEST_CASES: "500"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --exclude expanse-php

      - name: Test
        run: cargo test --workspace --exclude expanse-php

      - name: Assert capi drop-in artifacts exist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = "target/debug/expanse.dll"
          $lib = "target/debug/expanse.lib"
          if (!(Test-Path $dll)) { Write-Error "missing $dll"; exit 1 }
          if (!(Test-Path $lib)) { Write-Error "missing $lib"; exit 1 }
          Write-Host "capi artifacts present: $dll, $lib"

      - name: Assert capi drop-in artifacts exist (Unix)
        if: runner.os != 'Windows'
        run: |
          # `libexpanse.{so,dylib}` is BRACE expansion, not a glob: it yields
          # literal words with no metacharacters, so `nullglob` cannot drop the
          # ones that do not exist and the array was always 3 long. The count
          # test could never fail — verified against an empty directory.
          # Test each path instead, and require the cdylib for this platform.
          cdylib="target/debug/libexpanse.so"
          [ "$RUNNER_OS" = "macOS" ] && cdylib="target/debug/libexpanse.dylib"
          missing=()
          [ -f "$cdylib" ] || missing+=("$cdylib")
          [ -f target/debug/libexpanse.a ] || missing+=("target/debug/libexpanse.a")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing capi drop-in artifact(s): ${missing[*]}"
            exit 1
          fi
          echo "capi artifacts present: $cdylib target/debug/libexpanse.a"
        shell: bash

      - name: Run C++20 Header Tests (Unix)
        if: runner.os != 'Windows'
        run: |
          c++ -std=c++20 -Iinclude tests/cpp/test_expanse.cpp target/debug/libexpanse.a -lpthread -ldl -lm -o /tmp/test_cpp
          /tmp/test_cpp

  test-aarch64:
    name: Core / AArch64 Linux Tests & Callgrind (Neoverse N2)
    needs: [detect-changes]
    # `perf-tooling` is back in this condition as of the Callgrind gate below:
    # the job now runs perf_report.py, so a change to that script must be
    # exercised here too. (It was dropped when the lane only printed counts and
    # genuinely ran neither report script.)
    if: needs.detect-changes.outputs.rust-src == 'true' || needs.detect-changes.outputs.perf-tooling == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      # AGENTS.md §5 gate 4: the randomized model test at heavy iterations
      # (proptest's default is 256 cases).
      PROPTEST_CASES: "500"
    steps:
      # fetch-depth: 0 — the merge-base baseline pass below needs history, the
      # same as the x86 `callgrind-smoke` job it mirrors.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Step 0 capability census: record what the runner exposes (Neoverse core,
      # SVE/SVE2 flags, CTR_EL0-derived cache line).
      - name: Hardware Capability Census (lscpu, /proc/cpuinfo, CTR_EL0 cache-line)
        shell: bash
        run: |
          echo "=== uname ==="
          uname -a
          echo "=== lscpu ==="
          lscpu || true
          echo "=== /proc/cpuinfo (AArch64 core & features) ==="
          grep -E '^(processor|BogoMIPS|Features|CPU implementer|CPU architecture|CPU variant|CPU part|CPU revision|model name)' /proc/cpuinfo || cat /proc/cpuinfo
          echo "=== Cache Line Size ==="
          if [ -f /sys/devices/system/cpu/cpu0/cache/index0/coherency_line_size ]; then
            echo "L1d coherency_line_size: $(cat /sys/devices/system/cpu/cpu0/cache/index0/coherency_line_size) bytes"
          fi
          getconf LEVEL1_DCACHE_LINESIZE 2>/dev/null && echo "getconf LEVEL1_DCACHE_LINESIZE: $(getconf LEVEL1_DCACHE_LINESIZE) bytes" || true
          echo "=== SVE / SVE2 Feature Status ==="
          grep -q '\bsve\b' /proc/cpuinfo && echo "SVE: present" || echo "SVE: absent"
          grep -q '\bsve2\b' /proc/cpuinfo && echo "SVE2: present" || echo "SVE2: absent"

          # Assert, do not merely print. docs/HARDWARE.md §2.6 publishes this
          # census as fact and this job is named for the core; if GitHub rotates
          # the ubuntu-24.04-arm fleet to a different part (Cobalt 200, an
          # Ampere Altra with no SVE), a print-only step stays green while the
          # docs and the Callgrind counts silently describe other hardware.
          # AGENTS.md §8.1: the degradation must surface, not pass.
          echo "=== Census assertions ==="
          fail=0
          part=$(awk -F': ' '/^CPU part/{print $2; exit}' /proc/cpuinfo)
          line=$(cat /sys/devices/system/cpu/cpu0/cache/index0/coherency_line_size)
          if [ "$part" != "0xd49" ]; then
            echo "::error::CPU part is $part, expected 0xd49 (Neoverse-N2). The runner fleet changed: re-take the census, update docs/HARDWARE.md §2.6 and this job's name before trusting its numbers."
            fail=1
          fi
          if [ "$line" != "64" ]; then
            echo "::error::L1d coherency_line_size is $line, expected 64 — docs/HARDWARE.md §2.4/§2.6 assert 64 B on Neoverse."
            fail=1
          fi
          if ! grep -q '\bsve2\b' /proc/cpuinfo; then
            echo "::error::SVE2 absent — docs/HARDWARE.md §2.6 records it as exposed on this runner."
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "census matches docs/HARDWARE.md §2.6 (part=$part, line=${line}B, sve2 present)"
          exit "$fail"

      - name: Build
        run: cargo build --workspace --exclude expanse-php

      # Step 1: Execute full workspace test suite and NEON SIMD parity tests natively on AArch64.
      - name: Test (AArch64 workspace & NEON SIMD parity)
        run: cargo test --workspace --exclude expanse-php

      - name: Assert C ABI drop-in artifacts exist
        shell: bash
        run: |
          # See the note in the `test` job: the brace-expansion form this was
          # copied from could never fail. This lane is Linux, so the cdylib is
          # always the .so.
          missing=()
          [ -f target/debug/libexpanse.so ] || missing+=("target/debug/libexpanse.so")
          [ -f target/debug/libexpanse.a ] || missing+=("target/debug/libexpanse.a")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::missing capi drop-in artifact(s): ${missing[*]}"
            exit 1
          fi
          echo "capi artifacts present: target/debug/libexpanse.so target/debug/libexpanse.a"

      - name: Run C++20 Header Tests
        run: |
          c++ -std=c++20 -Iinclude tests/cpp/test_expanse.cpp target/debug/libexpanse.a -lpthread -ldl -lm -o /tmp/test_cpp
          /tmp/test_cpp

      # Step 2: Extend Callgrind instruction tracking to AArch64 (roadmap bullet docs/CI.md §11).
      - name: Install valgrind
        timeout-minutes: 8
        run: |
          if timeout 120 sudo apt-get install -y valgrind; then exit 0; fi
          for i in 1 2 3; do
            timeout 120 sudo apt-get update || true
            if timeout 120 sudo apt-get install -y valgrind; then exit 0; fi
            echo "apt attempt $i failed; retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Install iai-callgrind-runner
        run: |
          VERSION=$(cargo metadata --format-version 1 --locked | python3 -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='iai-callgrind'))")
          echo "iai-callgrind resolved to $VERSION"
          cargo install iai-callgrind-runner --version "$VERSION"

      - name: Build release artifacts
        run: cargo build --release -p expanse-trie -p expanse-capi

      # The merge-base pass is what turns these counts from a printed table
      # into a baseline. Non-fatal by design (`|| true`, mirroring
      # `callgrind-smoke`): a base commit that does not build must not block
      # the PR — perf_report.py renders a loud NO BASELINE section instead.
      - name: Callgrind Fast Smoke (merge base, AArch64)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git config --global --add safe.directory "$PWD"
          MERGE_BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || echo "")
          if [ -n "$MERGE_BASE" ]; then
            echo "Benchmarking AArch64 smoke merge base $MERGE_BASE against origin/${{ github.base_ref }}..."
            git checkout "$MERGE_BASE"
            cargo bench --bench smoke_instructions -p expanse-trie -- --save-baseline=aarch64_smoke_base | tee aarch64-base-smoke-counts.txt || true
            git checkout -
          fi

      - name: Run Callgrind Fast Smoke Instructions Benchmark (AArch64)
        # shell: bash implies pipefail: a crashed bench must fail the step, not
        # exit 0 through tee and let the guard report a clean run.
        shell: bash
        run: |
          if [ -f aarch64-base-smoke-counts.txt ]; then
            cargo bench --bench smoke_instructions -p expanse-trie -- --baseline=aarch64_smoke_base | tee aarch64-smoke-instructions.txt
          else
            cargo bench --bench smoke_instructions -p expanse-trie | tee aarch64-smoke-instructions.txt
          fi

      - name: Generate AArch64 Report and Enforce Regression Guard
        if: always()
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          # AGENTS.md §8.1: no output means the bench never ran — fail loudly
          # rather than skip the guard and exit 0.
          if [ ! -f aarch64-smoke-instructions.txt ]; then
            echo "::error::AArch64 regression guard did not run — missing aarch64-smoke-instructions.txt"
            exit 1
          fi
          printf '%s' "$PR_BODY" > pr-body.txt
          BASE_ARGS=""
          if [ -f aarch64-base-smoke-counts.txt ]; then
            BASE_ARGS="--base aarch64-base-smoke-counts.txt --base-ref origin/${{ github.base_ref }}"
          fi
          # The report body is platform-neutral, so name the platform above it:
          # this summary sits alongside the x86 one and the two are otherwise
          # indistinguishable.
          echo '## 🧮 AArch64 (Neoverse N2) — Callgrind Fast Smoke' >> "$GITHUB_STEP_SUMMARY"
          # `set +e` around the guard on purpose: the runner shell carries -e,
          # so a failing perf_report.py would abort the step before the report
          # was appended and the reader would get ::error:: annotations with no
          # table to read them against. Capture the status, publish the report
          # either way, then exit with it.
          set +e
          python3 scripts/perf_report.py \
            --head aarch64-smoke-instructions.txt \
            $BASE_ARGS \
            --pr-body-file pr-body.txt \
            --fail-on-regression \
            --max-regression-pct 5.0 > aarch64-smoke-report.md
          status=$?
          set -e
          if [ -s aarch64-smoke-report.md ]; then
            cat aarch64-smoke-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  test-riscv64:
    name: Cross / RV64GC Cross-Compile (Linux)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust-src == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2

      - name: Check (riscv64, cross-compile)
        run: cargo check --target riscv64gc-unknown-linux-gnu -p expanse-trie -p expanse-capi

  test-rv32:
    name: Cross / RV32IMAC Cross-Compile (Bare-Metal)
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust-src == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Target
        run: rustup target add riscv32imac-unknown-none-elf

      - uses: Swatinem/rust-cache@v2


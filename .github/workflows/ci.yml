  fuzz-smoke:
    name: Safety / Fuzz Invariants Smoke
    needs: [detect-changes]
    if: needs.detect-changes.outputs.rust-src == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/rust-toolchain
        with:
          toolchain: nightly

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz target registration self-check
        # Every fuzz/fuzz_targets/*.rs must be a registered [[bin]] in
        # fuzz/Cargo.toml and vice versa; a target that is only one of the
        # two is silently never fuzzed. Targets are discovered, never listed
        # by hand here.
        run: |
          registered="$(cargo fuzz list | sort)"
          on_disk="$(ls fuzz/fuzz_targets/*.rs | xargs -n1 basename | sed 's/\.rs$//' | sort)"
          if [ "$registered" != "$on_disk" ]; then
            echo "::error::fuzz/Cargo.toml [[bin]] targets and fuzz/fuzz_targets/*.rs differ"
            diff <(echo "$registered") <(echo "$on_disk") || true
            exit 1
          fi
          test -n "$registered"
          echo "fuzz targets: $(echo "$registered" | tr '\n' ' ')"

      - name: Fuzz smoke (60s per target, targets discovered from fuzz/Cargo.toml)
        run: |
          for t in $(cargo fuzz list); do
            echo "::group::$t"
            cargo fuzz run "$t" -- -max_total_time=60 -print_final_stats=1
            echo "::endgroup::"
          done

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore


name: Deploy GitHub Pages

# Builds the documentation portal and assembles the APT and RPM
# repositories from the latest stable release's packages, signed with
# REPO_SIGNING_KEY. No package or repository metadata is committed: packages come
# from the release (checked against its SHA256SUMS), signatures are made here.
# The key is only read by `sign`, a job bound to the `package-signing`
# environment that runs no third-party action and can reach GitHub only.
# Repository > Settings > Pages must use "GitHub Actions" as the source.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_repo.py'
      - 'scripts/build_pages.py'
      - 'scripts/build_apt_repo.py'
      - 'scripts/build_rpm_repo.py'
      - 'scripts/site_theme.py'
      - '.github/workflows/pages.yml'
      - 'Cargo.toml'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Renders the site. It holds no secret; its output is data for `sign`, never code.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Build portal and documentation site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 scripts/build_pages.py --artifacts-dir artifacts --output-dir _site --allow-empty --unsigned
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _site
          if-no-files-found: error
          retention-days: 1

  # Adds the signed APT and RPM repositories to the rendered site. The only
  # job that reads REPO_SIGNING_KEY: first-party actions and this repository's
  # own scripts, from a checkout of the same commit, with egress limited to GitHub.
  sign:
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: package-signing
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site
      - name: Latest stable release packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"
          mkdir -p artifacts
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir artifacts \
            --pattern '*.deb' --pattern '*.rpm' --pattern SHA256SUMS
          cd artifacts
          grep -E '\.(deb|rpm)$' SHA256SUMS | sha256sum --check --strict
          count="$(find . -maxdepth 1 \( -name '*.deb' -o -name '*.rpm' \) | wc -l | tr -d ' ')"
          [ "${count}" -ge 1 ] || { echo "::error::expected .deb and .rpm in ${tag}, found ${count}"; exit 1; }
      - name: Import the repository signing key
        shell: bash
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          REPO_SIGNING_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${REPO_SIGNING_KEY}" ]; then
            echo "::error::REPO_SIGNING_KEY is not set. The APT and RPM repositories are only published signed."
            exit 1
          fi
          gnupg="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${gnupg}"
          echo "allow-loopback-pinentry" > "${gnupg}/gpg-agent.conf"
          printf '%s\n' "${REPO_SIGNING_KEY}" | GNUPGHOME="${gnupg}" gpg --batch --import
          key="$(GNUPGHOME="${gnupg}" gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          [ -n "${key}" ] || { echo "::error::REPO_SIGNING_KEY holds no secret key"; exit 1; }
          echo "GNUPGHOME=${gnupg}" >> "${GITHUB_ENV}"
          echo "REPO_KEY=${key}" >> "${GITHUB_ENV}"
      - name: Build the signed repositories
        shell: bash
        env:
          REPO_SIGNING_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          python3 scripts/build_repo.py --artifacts-dir artifacts --docs-dir _site \
            --version "${RELEASE_TAG#v}" --sign-key "${REPO_KEY}"
          gpgv --keyring _site/apt/expanse-archive-keyring.gpg _site/apt/dists/stable/InRelease
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download latest release packages
        id: packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p artifacts

          # `gh release download` exits non-zero both when no release exists and
          # when the download failed, and those two demand opposite responses:
          # a genuine bootstrap SHOULD publish empty apt/rpm repos, a transient
          # API error MUST NOT, because the deploy below runs with
          # `keep_files: false` and would replace the live repositories with the
          # empty ones. Ask about the release separately so the two are
          # distinguishable, rather than inferring the cause from a failure code
          # that cannot carry it.
          if ! releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1); then
            echo "::error::could not list releases; refusing to build package repos on an unknown state"
            exit 1
          fi
          if [ -z "$releases" ]; then
            echo "bootstrap=true" >> "$GITHUB_OUTPUT"
            echo "::warning::No release exists yet; building empty apt/rpm repos (genuine bootstrap)."
            exit 0
          fi

          echo "bootstrap=false" >> "$GITHUB_OUTPUT"
          if ! gh release download --repo "$GITHUB_REPOSITORY" \
                 --pattern '*.deb' --pattern '*.rpm' --dir artifacts; then
            echo "::error::a release exists but its .deb/.rpm assets could not be downloaded; refusing to republish (this would replace the live apt/rpm repositories with empty ones)"
            exit 1
          fi
          echo "Downloaded release packages:"
          ls -la artifacts

      - name: Build static site
        # Via `env:` rather than interpolated into `run:`, matching how ci.yml
        # passes PR_BODY: an expression expanded straight into the script body
        # is a shell-injection shape, and keeping every one of them out of `run:`
        # means no reviewer has to work out which values happen to be safe.
        env:
          BOOTSTRAP: ${{ steps.packages.outputs.bootstrap }}
        run: |
          set -euo pipefail
          if [ "$BOOTSTRAP" = "true" ]; then
            python3 scripts/build_pages.py --artifacts-dir artifacts --output-dir ./pages-root --allow-empty
            exit 0
          fi

          # A release exists, so every asset type must be present. Test each glob
          # on its own: `ls a* b*` exits non-zero when EITHER fails, so a release
          # carrying .deb but no .rpm would otherwise look identical to having
          # nothing at all and wipe the live rpm repository while the debs were
          # fine.
          missing=""
          ls artifacts/*.deb >/dev/null 2>&1 || missing="$missing .deb"
          ls artifacts/*.rpm >/dev/null 2>&1 || missing="$missing .rpm"
          if [ -n "$missing" ]; then
            echo "::error::release assets missing:$missing — refusing to build package repos from a partial download"
            exit 1
          fi
          python3 scripts/build_pages.py --artifacts-dir artifacts --output-dir ./pages-root

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-root
          keep_files: false

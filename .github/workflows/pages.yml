name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
      - 'Cargo.toml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download latest release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p artifacts
          if gh release download --repo "$GITHUB_REPOSITORY" \
               --pattern '*.deb' --pattern '*.rpm' --dir artifacts; then
            echo "Downloaded release packages:"
            ls -la artifacts
          else
            echo "::warning::No release with .deb/.rpm assets found; portal will be built with empty apt/rpm repos (bootstrap)."
          fi

      - name: Build static site
        run: |
          set -euo pipefail
          # Refuse to overwrite the live apt/rpm repos with empty ones unless this
          # is a genuine bootstrap (no release assets exist yet).
          if ls artifacts/*.deb artifacts/*.rpm >/dev/null 2>&1; then
            python3 scripts/build_pages.py --artifacts-dir artifacts --output-dir ./pages-root
          else
            python3 scripts/build_pages.py --artifacts-dir artifacts --output-dir ./pages-root --allow-empty
          fi

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-root
          keep_files: false

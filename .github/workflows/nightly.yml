name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Which jobs to run"
        required: false
        default: all
        type: choice
        options: [all, bench]

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  
jobs:
  miri-full:
    # The per-push Miri job skips the heavy model-based suites to stay
    # fast; this run executes the whole suite under Miri daily.
    if: inputs.only != 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      - name: Miri (full)
        run: cargo miri test -p expanse-trie

      - name: Report or Update Nightly Failure Issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '🚨 [Nightly CI Failure] Full Miri Model Verification Failed on main';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-failure'
            });

            const existing = issues.find(i => i.title.includes('Full Miri'));
            const body = [
              '### Nightly Verification Failure Alert',
              '',
              `- **Commit**: [${context.sha}](${context.payload.repository?.html_url}/commit/${context.sha})`,
              `- **Workflow Run**: [View Failed Run Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '- **Failing Target**: `cargo miri test -p expanse-trie`',
              '',
              '#### Local Reproduction Command:',
              '```bash',
              'cargo miri test -p expanse-trie',
              '```'
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `⚠️ Nightly run still failing on commit ${context.sha}. [View Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'nightly-failure', 'automated-triage']
              });
            }

      - name: Auto-Close Resolved Nightly Issue on Success
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-failure'
            });
            const existing = issues.find(i => i.title.includes('Full Miri'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `🟢 Nightly verification succeeded on commit ${context.sha}! Auto-closing this issue.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }

  test-tsan:
    name: Safety / ThreadSanitizer (TSan) Sync* Tests
    if: inputs.only != 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Verify ThreadSanitizer canary catches unsuppressed races (negative control)
        run: |
          if cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p expanse-trie --test tsan_canary; then
            echo "::error::TSan canary passed unexpectedly! Suppressions may be overbroad or TSan is inactive."
            exit 1
          else
            echo "✓ TSan canary correctly caught intentional unsuppressed data race (inverted exit-code check passed)."
          fi
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
          TSAN_OPTIONS: "suppressions=${{ github.workspace }}/.github/tsan-suppressions.txt"

      - name: Run Sync* suite under ThreadSanitizer
        run: |
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p expanse-trie --lib sync:: --lib sync32::
          cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p expanse-trie --test linearizability --test test_blobmap --test sync32_stress
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
          TSAN_OPTIONS: "suppressions=${{ github.workspace }}/.github/tsan-suppressions.txt"

      - name: Report or Update Nightly Failure Issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '🚨 [Nightly CI Failure] ThreadSanitizer (TSan) Verification Failed on main';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-failure'
            });

            const existing = issues.find(i => i.title.includes('ThreadSanitizer'));
            const body = [
              '### Nightly Verification Failure Alert',
              '',
              `- **Commit**: [${context.sha}](${context.payload.repository?.html_url}/commit/${context.sha})`,
              `- **Workflow Run**: [View Failed Run Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '- **Failing Target**: `ThreadSanitizer (TSan) Sync* / linearizability / blobmap / sync32 tests`',
              '',
              '#### Local Reproduction Commands:',
              '```bash',
              'TSAN_OPTIONS="suppressions=.github/tsan-suppressions.txt" RUSTFLAGS="-Zsanitizer=thread" cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p expanse-trie --lib sync:: --lib sync32::',
              'TSAN_OPTIONS="suppressions=.github/tsan-suppressions.txt" RUSTFLAGS="-Zsanitizer=thread" cargo test -Zbuild-std --target x86_64-unknown-linux-gnu -p expanse-trie --test linearizability --test test_blobmap --test sync32_stress',
              '```'
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `⚠️ Nightly run still failing on commit ${context.sha}. [View Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'nightly-failure', 'automated-triage']
              });
            }

      - name: Comment on Nightly Issue on Success
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-failure'
            });
            const existing = issues.find(i => i.title.includes('ThreadSanitizer'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `🟢 Nightly run passed on commit ${context.sha} (not auto-closing: TSan race findings require manual inspection/triage per #479).`
              });
            }

  bench-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32 target for the nightly wasm-pack build of crates/expanse-wasm
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Go, Java 22+, and .NET toolchains for the go/java/dotnet bindings benchmark
      # runners in scripts/bench_bindings.py (#304) — without these, bench_bindings.py
      # silently skips those three ecosystems and the nightly baseline never guards them.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.22'
          cache: false

      - name: Set up JDK 22
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Set up .NET SDKs (8.0 and 9.0)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Shared prerequisite for the go/java/dotnet/ruby/php bindings benchmark runners,
      # which dynamically load the release-built C ABI artifact (target/release/libexpanse.*)
      # rather than a language-specific packaged extension.
      - name: Build native libexpanse
        run: cargo build --release -p expanse-capi

      # Without these three builds, bench_bindings.py warn-and-drops the node,
      # python, and wasm runtimes every night, and (pre-#373) the wasm harness
      # would silently benchmark a JS Map mock. Node addon: release build; the
      # index.js loader falls back to target/release/. Python: the maturin-built
      # expanse_trie extension, same recipe as ci.yml's test-python. WASM: the
      # bench requires ../pkg via CommonJS, so build with --target nodejs.
      - name: Build Node.js addon
        run: cargo build --release -p expanse-node

      - name: Build and install Python extension
        run: |
          python -m pip install --upgrade pip
          python -m pip install "maturin>=1.5,<2.0"
          pip install .

      - name: Build WASM pkg (Node target)
        run: |
          npm install -g wasm-pack
          wasm-pack build --release --target nodejs crates/expanse-wasm

      - name: Install stock libjudy
        timeout-minutes: 8
        run: |
          if timeout 120 sudo apt-get install -y libjudy-dev; then exit 0; fi
          for _ in 1 2 3; do
            timeout 120 sudo apt-get update || true
            if timeout 120 sudo apt-get install -y libjudy-dev; then exit 0; fi
            sleep 15
          done
          exit 1

      - name: Record machine state
        run: |
          {
            echo "## Runner state"
            uptime
            nproc
            echo
          } | tee bench-report.txt

      - name: libexpanse vs stock libjudy (paired ratios)
        run: |
          cargo run --release -p expanse-capi --example bench_vs_libjudy \
            | tee -a bench-report.txt

      - name: bytes/key (deterministic)
        run: cargo run --release -p expanse-trie --example bytes_per_key | tee -a bench-report.txt

      # Full Sync* coverage (map, set, blob map, str map, bytes map + their
      # baselines) via the dedicated instrument benches/concurrency.rs,
      # replacing the SyncExpanseMap-only concurrent_scaling example. Reduced
      # sweep via env knobs: the hosted runner has ~4 vCPUs, so 1→4 threads is
      # the meaningful scaling span here.
      - name: Concurrent scaling (all Sync* types, reduced sweep)
        env:
          EXPANSE_BENCH_THREADS: "1,4"
          EXPANSE_BENCH_WORKLOADS: "95,50"
        run: |
          cargo bench --bench concurrency -p expanse-trie | tee concurrency-report.txt
          cat concurrency-report.txt >> bench-report.txt

      - name: Concurrency ratio-check self-test
        run: python3 scripts/bench_concurrency_check.py --self-test

      - name: Download historical concurrency baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p concurrency-baseline
          gh run download --repo "${{ github.repository }}" --name concurrency-baseline --dir concurrency-baseline || true

      # Collapse-proof gate on scaling ratios (max-threads ÷ 1-thread total
      # ops/s per engine/workload), not absolute ops/s. Warn-only for now
      # (no --fail-on-regression): promote once the baseline proves stable
      # across several consecutive unmodified nightlies (#360).
      - name: Concurrency scaling-ratio baseline check (warn-only)
        run: |
          CHECK_FLAG=""
          if [ -f concurrency-baseline/concurrency-baseline.json ]; then
            CHECK_FLAG="--check-baseline concurrency-baseline/concurrency-baseline.json"
          fi
          python3 scripts/bench_concurrency_check.py \
            --input concurrency-report.txt \
            $CHECK_FLAG \
            --save-baseline concurrency-baseline.json | tee -a bench-report.txt

      - name: Upload new concurrency baseline
        uses: actions/upload-artifact@v7
        with:
          name: concurrency-baseline
          path: concurrency-baseline.json

      - name: Download historical bindings baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bindings-baseline
          gh run download --repo "${{ github.repository }}" --name bindings-baseline --dir bindings-baseline || true

      # Warn-only, matching its concurrency sibling above, and the upload below
      # runs even when it warns. Both halves are load-bearing:
      #
      # `--check-baseline` compares against the most recent `bindings-baseline`
      # artifact, and a fatal check that ran *before* the upload made the job
      # destroy the replacement baseline it had just computed. The next night
      # then downloaded the same stale artifact and failed identically, so the
      # nightly could not refresh its own baseline: every scheduled run from
      # 2026-08-27 onward failed at this step with the measurement already
      # taken and saved (`Saved baseline to bindings-baseline.json`, then exit
      # 1). That is the shape #449 fixed in the bench workflow — a completed
      # measurement discarded by its post-processing — with the added twist
      # that it also blocked its own repair.
      #
      # What it was failing on was not a regression. #380 repaired the bindings
      # harnesses (no silent fallbacks, no fabricated memory constants, one
      # PRNG) and merged after the last baseline was captured, so the run was
      # gating the repaired harness against numbers the repair invalidated:
      # PHP lookup "regressed" 3.57 -> 1.15 Mops because the old figure came
      # from the pure-PHP fallback driver the harness now refuses, and memory
      # "regressed" 16.00 -> 23.89 B/key against a 16.00 that was one of the
      # fabricated constants #380 deleted.
      #
      # Cross-language wall-clock throughput on a shared runner is also the
      # wrong thing to gate hard on: AGENTS.md section 6 says CI ratios are not
      # publishable numbers, and section 8.4 wants an interval before a
      # wall-clock delta decides anything. A point-estimate comparison here
      # reports, it does not adjudicate.
      - name: Cross-language bindings benchmark & baseline check (warn-only)
        run: |
          CHECK_FLAG=""
          if [ -f bindings-baseline/bindings-baseline.json ]; then
            CHECK_FLAG="--check-baseline bindings-baseline/bindings-baseline.json"
          fi
          rc=0
          python3 scripts/bench_bindings.py --quick $CHECK_FLAG --save-baseline bindings-baseline.json --output bindings-report.md || rc=$?
          # Warn-only applies to a *finding*, never to a harness that failed to
          # run. `bench_bindings.py` exits 1 for detected regressions and does so
          # only after writing the baseline, so the baseline's existence is what
          # separates "measured, and reports a regression" from "did not
          # measure". A crash leaves no baseline and stays fatal (section 8.1).
          if [ "$rc" -ne 0 ]; then
            if [ -f bindings-baseline.json ]; then
              echo "::warning::Cross-language bindings baseline check reported regressions (exit $rc); see bindings-report.md in this run's artifacts. The measurement completed and its baseline is uploaded below."
            else
              echo "::error::bench_bindings.py exited $rc without producing a baseline — the harness did not complete, so this is a failed run, not a reported regression."
              exit "$rc"
            fi
          fi
          if [ -f bindings-report.md ]; then
            cat bindings-report.md >> bench-report.txt
          fi

      # `if: always()` is what breaks the deadlock: the newly measured baseline
      # must reach the artifact store even when the step above warned, or the
      # next run compares against the same stale one and nothing ever refreshes.
      - name: Upload new bindings baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bindings-baseline
          path: bindings-baseline.json
          if-no-files-found: warn

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: bench-report.txt

  fuzz-long:
    if: inputs.only != 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Keep in lockstep with fuzz/Cargo.toml [[bin]] targets (fuzz-smoke in
        # ci.yml discovers them via `cargo fuzz list`; this matrix is hand-listed).
        target: [set_ops, set_algebra, map_ops, bytesmap_ops, strmap_ops, blobmap_image_corrupt, set32_ops, map32_ops]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Restore fuzz corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }} (20 min)
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=1200 -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

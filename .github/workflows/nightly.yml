name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Which jobs to run"
        required: false
        default: all
        type: choice
        options: [all, bench]

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  CARGO_TERM_COLOR: always
  
jobs:
  miri-full:
    # The per-push Miri job skips the heavy model-based suites to stay
    # fast; this run executes the whole suite under Miri daily.
    if: inputs.only != 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      - name: Miri (full)
        run: cargo miri test -p expanse-trie

      - name: Report or Update Nightly Failure Issue
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '🚨 [Nightly CI Failure] Full Miri Model Verification Failed on main';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-failure'
            });

            const existing = issues.find(i => i.title.includes('Full Miri'));
            const body = [
              '### Nightly Verification Failure Alert',
              '',
              `- **Commit**: [${context.sha}](${context.payload.repository?.html_url}/commit/${context.sha})`,
              `- **Workflow Run**: [View Failed Run Logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '- **Failing Target**: `cargo miri test -p expanse-trie`',
              '',
              '#### Local Reproduction Command:',
              '```bash',
              'cargo miri test -p expanse-trie',
              '```'
            ].join('\n');

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `⚠️ Nightly run still failing on commit ${context.sha}. [View Run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'nightly-failure', 'automated-triage']
              });
            }

      - name: Auto-Close Resolved Nightly Issue on Success
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'nightly-failure'
            });
            const existing = issues.find(i => i.title.includes('Full Miri'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `🟢 Nightly verification succeeded on commit ${context.sha}! Auto-closing this issue.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }

  bench-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install stock libjudy
        timeout-minutes: 8
        run: |
          if timeout 120 sudo apt-get install -y libjudy-dev; then exit 0; fi
          for _ in 1 2 3; do
            timeout 120 sudo apt-get update || true
            if timeout 120 sudo apt-get install -y libjudy-dev; then exit 0; fi
            sleep 15
          done
          exit 1

      - name: Record machine state
        run: |
          {
            echo "## Runner state"
            uptime
            nproc
            echo
          } | tee bench-report.txt

      - name: libexpanse vs stock libjudy (paired ratios)
        run: |
          cargo run --release -p expanse-capi --example bench_vs_libjudy \
            | tee -a bench-report.txt

      - name: bytes/key (deterministic)
        run: cargo run --release -p expanse-trie --example bytes_per_key | tee -a bench-report.txt

      - name: Concurrent read scaling
        run: cargo run --release -p expanse-trie --example concurrent_scaling | tee -a bench-report.txt

      - name: Download historical bindings baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p bindings-baseline
          gh run download --repo "${{ github.repository }}" --name bindings-baseline --dir bindings-baseline || true

      - name: Cross-language bindings benchmark & baseline check
        run: |
          CHECK_FLAG=""
          if [ -f bindings-baseline/bindings-baseline.json ]; then
            CHECK_FLAG="--check-baseline bindings-baseline/bindings-baseline.json"
          fi
          python3 scripts/bench_bindings.py --quick $CHECK_FLAG --save-baseline bindings-baseline.json --output bindings-report.md
          if [ -f bindings-report.md ]; then
            cat bindings-report.md >> bench-report.txt
          fi

      - name: Upload new bindings baseline
        uses: actions/upload-artifact@v7
        with:
          name: bindings-baseline
          path: bindings-baseline.json

      - name: Upload report
        uses: actions/upload-artifact@v7
        with:
          name: bench-report
          path: bench-report.txt

  fuzz-long:
    if: inputs.only != 'bench'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: [set_ops, map_ops, bytesmap_ops, strmap_ops, blobmap_image_corrupt, set32_ops, map32_ops]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - name: Restore fuzz corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz ${{ matrix.target }} (20 min)
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=1200 -print_final_stats=1

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

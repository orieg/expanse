name: Release

on:
  push:
    tags:
      - 'v*'
  # Canary: exercise the full release DAG (gate, builds, packaging, page
  # generation) while skipping every outward publish step (GitHub Release,
  # crates.io, npm, NuGet, Pages deploy). Run this before tagging a release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: skip all outward publish steps'
        type: boolean
        default: true

# Minimal default; each job elevates only what it needs.
permissions:
  contents: read

jobs:
  # Gate: only publish artifacts for a tag whose commit already passed the full
  # CI rollup on main, and whose manifests are in version lockstep with the tag.
  release-gate:
    name: Release Gate / Verify CI + Version Lockstep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Assert tagged commit passed the CI Gate rollup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Poll for the CI Gate check-run instead of insta-failing: a tag
          # pushed moments after its commit lands on main races the
          # still-running CI (the v0.4.0 incident, #313). Assert on the MOST
          # RECENT check-run only — re-runs accumulate multiple check-runs per
          # commit, and a stale failed one must not poison the commit forever.
          deadline=$(( $(date +%s) + 1800 ))  # wait up to 30 minutes
          while :; do
            # One "started_at|status|conclusion" row per matching check-run
            # (robust to pagination; jq runs per page, sorting happens below).
            mapfile -t rows < <(gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq '.check_runs[] | select(.name=="CI Gate / All Checks Passed") | "\(.started_at)|\(.status)|\(.conclusion // "pending")"')
            if [ "${#rows[@]}" -eq 0 ]; then
              status="absent"; conclusion="absent"
            else
              latest=$(printf '%s\n' "${rows[@]}" | sort | tail -1)
              status=$(echo "${latest}" | cut -d'|' -f2)
              conclusion=$(echo "${latest}" | cut -d'|' -f3)
            fi
            echo "CI Gate check-run for ${GITHUB_SHA}: status=${status} conclusion=${conclusion}"
            if [ "${status}" = "completed" ]; then
              if [ "${conclusion}" = "success" ]; then
                echo "CI Gate rollup concluded success for ${GITHUB_SHA}."
                break
              fi
              echo "::error::The latest CI Gate rollup for ${GITHUB_SHA} concluded '${conclusion}'. Fix CI (or re-run it to success) before releasing."
              exit 1
            fi
            if [ "$(date +%s)" -ge "${deadline}" ]; then
              echo "::error::Timed out waiting for the CI Gate rollup on ${GITHUB_SHA} (last status=${status}). Ensure CI runs and passes on this commit."
              exit 1
            fi
            echo "CI Gate not concluded yet; retrying in 30s..."
            sleep 30
          done

      - name: Assert manifests are in version lockstep with the tag
        if: github.event_name == 'push'  # no tag to compare on a canary dispatch
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Verifying all manifests match tag version ${TAG_VERSION}..."
          python3 scripts/bump_version.py --check "${TAG_VERSION}"

  publish-crates:
    name: Publish to Crates.io
    # Anchor-first (#313): every registry publish waits for the canonical
    # GitHub Release, so a registry can never carry a version the release
    # page does not.
    needs: [release-gate, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # crates.io OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Publish crates (idempotent on already-published versions)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -uo pipefail
          publish_crate() {
            crate="$1"
            attempt=0
            max=3
            while :; do
              attempt=$((attempt + 1))
              echo "Publishing ${crate} (attempt ${attempt}/${max})..."
              if cargo publish -p "${crate}" 2>&1 | tee /tmp/publish.log; then
                echo "Published ${crate}."
                return 0
              fi
              if grep -qiE 'already (exists|uploaded)|is already uploaded|crate version .* is already' /tmp/publish.log; then
                echo "${crate} version already on crates.io; treating as success (idempotent)."
                return 0
              fi
              if [ "${attempt}" -ge "${max}" ]; then
                echo "::error::cargo publish failed for ${crate} after ${max} attempts"
                return 1
              fi
              echo "Retrying ${crate} after crates.io index propagation delay..."
              sleep 20
            done
          }
          publish_crate expanse-trie
          publish_crate expanse-capi

  build-release-artifacts:
    name: Build Artifacts (${{ matrix.target }})
    needs: [release-gate]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
            dotnet_rid: linux-x64
            nativefile: libexpanse.so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            deb_arch: arm64
            rpm_arch: aarch64
            cross_pkg: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            deb_arch: riscv64
            rpm_arch: riscv64
            cross_pkg: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross_pkg: musl-tools
          - target: aarch64-apple-darwin
            os: macos-latest
            dotnet_rid: osx-arm64
            nativefile: libexpanse.dylib
          - target: x86_64-apple-darwin
            os: macos-latest
            dotnet_rid: osx-x64
            nativefile: libexpanse.dylib
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            dotnet_rid: win-x64
            nativefile: expanse.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install cross-compilation dependencies (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev rpm ${{ matrix.cross_pkg }}
      - name: Build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
        run: cargo build -p expanse-capi --release --target ${{ matrix.target }}

      - name: Prepare dist, archive, and Linux packages (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Tag pushes carry the version in the ref; a canary dispatch has no
          # tag (GITHUB_REF=refs/heads/main — the old stripping produced
          # "refs/heads/main" and broke every Unix packaging step), so fall
          # back to the manifest version.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -m1 '^version' crates/expanse-capi/Cargo.toml | cut -d'"' -f2)"
          fi
          T="${{ matrix.target }}"

          mkdir -p dist/include dist/lib dist/share/man/man3
          cp crates/expanse-capi/include/*.h dist/include/
          if [ -d "man/man3" ]; then
            cp man/man3/*.3 dist/share/man/man3/
          fi

          if [ -f "target/$T/release/libexpanse.a" ]; then
            cp "target/$T/release/libexpanse.a" dist/lib/
          fi

          # cargo emits an unversioned library; synthesize the soname chain so the
          # libjudy-compat symlink (libJudy.so.1 -> libexpanse.so.1) is not dangling.
          if [ -f "target/$T/release/libexpanse.so" ]; then
            cp "target/$T/release/libexpanse.so" dist/lib/libexpanse.so.1.0.0
            ln -sf libexpanse.so.1.0.0 dist/lib/libexpanse.so.1
            ln -sf libexpanse.so.1 dist/lib/libexpanse.so
          elif [ -f "target/$T/release/libexpanse.dylib" ]; then
            cp "target/$T/release/libexpanse.dylib" dist/lib/libexpanse.dylib
          fi

          tar -czvf "expanse-${VERSION}-${T}.tar.gz" -C dist .

          if [ -n "${{ matrix.deb_arch }}" ]; then
            bash scripts/package_deb.sh "$VERSION" "${{ matrix.deb_arch }}" dist
          fi
          if [ -n "${{ matrix.rpm_arch }}" ]; then
            bash scripts/package_rpm.sh "$VERSION" "${{ matrix.rpm_arch }}" dist
          fi

      - name: Prepare archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item target\${{ matrix.target }}\release\expanse.dll package\
          Copy-Item target\${{ matrix.target }}\release\expanse.lib package\
          Copy-Item crates\expanse-capi\include\*.h package\
          Set-Content -Path package\README_MSVC.txt -Value "MSVC Build Instructions: Add expanse.lib to your linker input, and include Judy.h/expanse.h"
          # Same derivation as the Unix step: tag ref on releases, manifest
          # version on a canary dispatch (GITHUB_REF_NAME would be "main").
          $VERSION = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace '^refs/tags/v', '' } else { (Select-String -Path crates/expanse-capi/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value }
          Compress-Archive -Path package\* -DestinationPath "expanse-v$VERSION-${{ matrix.target }}.zip"

      - name: Stage native library for NuGet
        if: matrix.dotnet_rid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "native/${{ matrix.dotnet_rid }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.nativefile }}" "native/${{ matrix.dotnet_rid }}/"

      - name: Upload native library artifact (NuGet)
        if: matrix.dotnet_rid
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.dotnet_rid }}
          path: native/${{ matrix.dotnet_rid }}/*
          if-no-files-found: error

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ matrix.target }}
          path: |
            expanse-*.tar.gz
            expanse-*.zip
            *.deb
            *.rpm
          if-no-files-found: error

  build-npm:
    name: Build npm addon (${{ matrix.platform }})
    needs: [release-gate]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            libfile: libexpanse_node.so
          - platform: darwin-x64
            target: x86_64-apple-darwin
            os: macos-latest
            libfile: libexpanse_node.dylib
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            libfile: libexpanse_node.dylib
          - platform: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            os: windows-latest
            libfile: expanse_node.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build native addon
        run: cargo build -p expanse-node --release --target ${{ matrix.target }}
      - name: Assemble platform .node
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "target/${{ matrix.target }}/release/${{ matrix.libfile }}" "out/expanse.${{ matrix.platform }}.node"
      - name: Upload platform addon artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-${{ matrix.platform }}
          path: out/expanse.${{ matrix.platform }}.node
          if-no-files-found: error

  package-nuget:
    name: Package & Publish .NET NuGet
    needs: [release-gate, build-release-artifacts, github-release] # anchor-first (#313)
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the nupkg to the GitHub Release
      id-token: write # NuGet.org OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Download native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: native-staging
      - name: Stage native libraries into runtimes/{rid}/native
        run: |
          set -euo pipefail
          base="bindings/dotnet/src/Expanse.NET/runtimes"
          found=0
          for d in native-staging/native-*; do
            [ -d "$d" ] || continue
            rid="${d#native-staging/native-}"
            mkdir -p "${base}/${rid}/native"
            cp "$d"/* "${base}/${rid}/native/"
            found=$((found + 1))
            echo "Staged ${rid}: $(ls "${base}/${rid}/native")"
          done
          if [ "${found}" -eq 0 ]; then
            echo "::error::No native libraries staged for NuGet"; exit 1
          fi
      - name: Pack NuGet package
        run: |
          mkdir -p dist/nuget
          dotnet pack bindings/dotnet/src/Expanse.NET/Expanse.NET.csproj -c Release -o dist/nuget
      - name: Upload NuGet artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-nuget
          path: dist/nuget/*.nupkg
          if-no-files-found: error
      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: orieg
      - name: Publish to NuGet.org
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            # Hard failure, not a silent skip: a green job that published
            # nothing is the failure class #313 exists to eliminate.
            echo "::error::No NuGet credential available (OIDC login yielded no key and NUGET_API_KEY is unset); refusing to report success without publishing."
            exit 1
          fi
          dotnet nuget push dist/nuget/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
      # Under anchor-first ordering this job runs AFTER github-release, so the
      # nupkg can no longer ride the release-artifacts-* download there —
      # attach it to the existing release explicitly (idempotent via --clobber).
      - name: Attach nupkg to the GitHub Release
        if: github.event_name == 'push' # the release exists only on tag pushes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/nuget/*.nupkg dist/nuget/*.snupkg --clobber

  publish-npm:
    name: Publish Node.js (npm)
    needs: [release-gate, build-npm, github-release] # anchor-first (#313)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing & provenance
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Upgrade npm CLI (OIDC provenance support)
        run: npm install -g npm@latest
      - name: Download platform addons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: npm-*
          path: npm-staging
      - name: Assemble and publish platform packages + main package
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          CRATE=crates/expanse-node
          VERSION=$(node -p "require('./${CRATE}/package.json').version")
          echo "Publishing @orieg/expanse platform packages at ${VERSION} via npm OIDC..."

          platform_os() { case "$1" in linux-*) echo linux ;; darwin-*) echo darwin ;; win32-*) echo win32 ;; esac; }
          platform_cpu() { case "$1" in *-arm64) echo arm64 ;; *) echo x64 ;; esac; }

          for d in npm-staging/npm-*; do
            [ -d "$d" ] || continue
            plat="${d#npm-staging/npm-}"
            pkgdir="${CRATE}/npm/${plat}"
            mkdir -p "${pkgdir}"
            cp "$d"/expanse.*.node "${pkgdir}/"
            # shellcheck disable=SC2016  # ${...} below are JS template literals, not shell
            PKGDIR="${pkgdir}" node -e '
              const fs = require("fs");
              const [plat, version, os, cpu] = process.argv.slice(1);
              const pkg = {
                name: `@orieg/expanse-${plat}`,
                version,
                description: `Prebuilt @orieg/expanse native addon for ${plat}.`,
                main: `expanse.${plat}.node`,
                files: [`expanse.${plat}.node`],
                os: [os],
                cpu: [cpu],
                license: "MIT OR Apache-2.0",
                repository: { type: "git", url: "git+https://github.com/orieg/expanse.git", directory: "crates/expanse-node" },
                engines: { node: ">= 20.0.0" },
              };
              fs.writeFileSync(`${process.env.PKGDIR}/package.json`, JSON.stringify(pkg, null, 2));
            ' "$plat" "$VERSION" "$(platform_os "$plat")" "$(platform_cpu "$plat")"
            if npm view "@orieg/expanse-${plat}@${VERSION}" version >/dev/null 2>&1; then
              echo "@orieg/expanse-${plat}@${VERSION} already on the registry; skipping (idempotent re-run)."
            else
              echo "Publishing @orieg/expanse-${plat}..."
              npm publish "./${pkgdir}" --access public --provenance
            fi
          done

          if npm view "@orieg/expanse@${VERSION}" version >/dev/null 2>&1; then
            echo "@orieg/expanse@${VERSION} already on the registry; skipping (idempotent re-run)."
          else
            echo "Publishing main package @orieg/expanse..."
            # The "./" prefix is load-bearing: a bare "crates/expanse-node"
            # parses as a github:owner/repo spec (EALLOWGIT — how the v0.4.0
            # main-package publish failed while the warning-swallow hid it).
            npm publish "./${CRATE}" --access public --provenance
          fi

  github-release:
    name: Create GitHub Release
    # The PRIMARY ANCHOR (#313): depends only on the gate and the core
    # artifacts. Downstream registries depend on THIS job — never the reverse.
    needs: [release-gate, build-release-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload assets
      actions: write # dispatch python.yml for the PyPI publish
    steps:
      - uses: actions/checkout@v7
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: artifacts
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum ./* > SHA256SUMS
      - name: Create Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/*
          generate_release_notes: true
      # Nested Go module versioning (#322): `go get .../bindings/go@vX.Y.Z`
      # only resolves a pinned release if a `bindings/go/vX.Y.Z` tag exists.
      - name: Push Go nested-module tag
        if: github.event_name == 'push' # tag releases only
        run: |
          git push -f origin "${GITHUB_SHA}:refs/tags/bindings/go/${GITHUB_REF_NAME}"
      # PyPI (#313): a release created with GITHUB_TOKEN emits no `release`
      # event to other workflows (GitHub suppresses token-caused events except
      # workflow_dispatch/repository_dispatch), so python.yml is dispatched
      # explicitly — v0.4.1 shipped without PyPI because of this.
      - name: Dispatch PyPI publish (python.yml)
        if: github.event_name == 'push' # tag releases only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run python.yml --ref main -f publish=true -f release_tag="${GITHUB_REF_NAME}"

  publish-pages:
    name: Publish Portal & Repositories (GitHub Pages)
    needs: [build-release-artifacts, github-release] # anchor-first (#313)
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the gh-pages branch
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install repodata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c dpkg-dev
      - name: Download all release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: artifacts
      - name: Generate complete Pages website
        run: |
          python3 scripts/build_pages.py --artifacts-dir artifacts --output-dir pages-root
      - name: Deploy to GitHub Pages
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-root
          keep_files: false

  publish-gem:
    name: Publish Ruby Gem (rubygems.org)
    needs: [release-gate, github-release] # anchor-first (#313)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # rubygems.org OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Build gem
        working-directory: bindings/ruby
        run: gem build expanse.gemspec
      # The gem is pure Ruby (Fiddle/FFI onto libexpanse from the release
      # channels) — no native compile at install; see docs/bindings/ruby.md.
      - name: Configure RubyGems OIDC credentials
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish gem (idempotent)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        working-directory: bindings/ruby
        run: |
          set -euo pipefail
          VERSION=$(ruby -e 'puts Gem::Specification.load("expanse.gemspec").version')
          if curl -sf "https://rubygems.org/api/v2/rubygems/expanse/versions/${VERSION}.json" >/dev/null; then
            echo "expanse ${VERSION} already on rubygems.org; skipping (idempotent re-run)."
          else
            gem push "expanse-${VERSION}.gem"
          fi

  publish-wasm:
    name: Publish WebAssembly (npm)
    needs: [release-gate, github-release] # anchor-first (#313)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing & provenance
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Upgrade npm CLI (OIDC provenance support) and install wasm-pack
        run: |
          npm install -g npm@latest
          npm install -g wasm-pack
      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Build wasm package
        run: wasm-pack build --release --target web --scope orieg crates/expanse-wasm
      - name: Publish @orieg/expanse-wasm (idempotent)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./crates/expanse-wasm/pkg/package.json').version")
          if npm view "@orieg/expanse-wasm@${VERSION}" version >/dev/null 2>&1; then
            echo "@orieg/expanse-wasm@${VERSION} already on the registry; skipping (idempotent re-run)."
          else
            npm publish ./crates/expanse-wasm/pkg --access public --provenance
          fi

  # Every publish job above reports success when its upload command exits
  # zero -- not when the registry actually serves the version. v0.5.0 shipped
  # with all publish jobs green and was only confirmed complete by querying
  # the registries by hand afterwards. This job makes that query part of the
  # release, so an upload that silently did not land fails the run.
  #
  # Skipped on the dry-run canary, which publishes nothing.
  verify-registries:
    name: Verify / Registries Serve the Release
    needs:
      - publish-crates
      - publish-npm
      - publish-wasm
      - publish-gem
      - package-nuget
      - github-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Retries with backoff: registries ingest asynchronously, and the PHP
      # library was absent from Packagist minutes after the v0.5.0 tag and
      # present later. Absence only counts once the budget is exhausted.
      - name: Assert every registry serves ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verify_release_registries.py \
            --version "${GITHUB_REF_NAME}" \
            --attempts 6 --delay 30 --max-delay 240

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # Required for crates.io OIDC trusted publishing

jobs:
  publish-crates:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Publish expanse-trie
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p expanse-trie || echo "crates.io publish skipped or completed"
      - name: Publish expanse-capi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p expanse-capi || echo "crates.io publish skipped or completed"

  build-release-artifacts:
    name: Build Artifacts (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            deb_arch: amd64
            rpm_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            deb_arch: arm64
            rpm_arch: aarch64
            cross_pkg: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-latest
            deb_arch: riscv64
            rpm_arch: riscv64
            cross_pkg: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross_pkg: musl-tools
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install cross-compilation dependencies (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev rpm ${{ matrix.cross_pkg }}
      - name: Build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
        run: cargo build --workspace --release --target ${{ matrix.target }}
      - name: Prepare archives (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p package/include package/lib
          cp crates/expanse-capi/include/*.h package/include/
          [ -f "target/${{ matrix.target }}/release/libexpanse.so" ] && cp "target/${{ matrix.target }}/release/libexpanse.so" package/lib/ || true
          [ -f "target/${{ matrix.target }}/release/libexpanse.dylib" ] && cp "target/${{ matrix.target }}/release/libexpanse.dylib" package/lib/ || true
          [ -f "target/${{ matrix.target }}/release/libexpanse.a" ] && cp "target/${{ matrix.target }}/release/libexpanse.a" package/lib/ || true
          
          VERSION="${GITHUB_REF#refs/tags/v}"
          [ -z "$VERSION" ] && VERSION="0.3.0"

          # Build Debian package if deb_arch is set
          if [ -n "${{ matrix.deb_arch }}" ]; then
            mkdir -p deb/usr/lib deb/usr/include deb/DEBIAN
            cp package/lib/* deb/usr/lib/
            cp package/include/* deb/usr/include/
            printf "Package: libexpanse\nVersion: %s\nArchitecture: %s\nMaintainer: Nicolas Brousse <nicolas@brousse.info>\nDescription: Expanse: modern Judy arrays and high-performance trie engine\n" "$VERSION" "${{ matrix.deb_arch }}" > deb/DEBIAN/control
            dpkg-deb --build deb "libexpanse_${VERSION}_${{ matrix.deb_arch }}.deb"
          fi

          # Build RPM package if rpm_arch is set
          if [ -n "${{ matrix.rpm_arch }}" ]; then
            bash scripts/package_rpm.sh "$VERSION" "${{ matrix.rpm_arch }}" package || true
          fi
          
          tar -czvf "expanse-${VERSION}-${{ matrix.target }}.tar.gz" -C package .
      - name: Prepare archives (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item target\${{ matrix.target }}\release\expanse.dll package\
          Copy-Item target\${{ matrix.target }}\release\expanse.lib package\
          Copy-Item crates\expanse-capi\include\*.h package\
          Set-Content -Path package\README_MSVC.txt -Value "MSVC Build Instructions: Add expanse.lib to your linker input, and include Judy.h/expanse.h"
          Compress-Archive -Path package\* -DestinationPath "expanse-$($env:GITHUB_REF_NAME)-${{ matrix.target }}.zip"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.target }}
          path: |
            expanse-*.tar.gz
            expanse-*.zip
            *.deb
            *.rpm

  github-release:
    name: Create GitHub Release
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: artifacts
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum ./* > SHA256SUMS
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  publish-pages:
    name: Publish Portal & Repositories (GitHub Pages)
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install repodata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c dpkg-dev
      - name: Download all release packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: artifacts
      - name: Generate complete Pages website
        run: |
          python3 scripts/build_pages.py artifacts pages-root
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-root
          keep_files: false


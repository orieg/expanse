name: Release

on:
  push:
    tags:
      - 'v*'
  # Canary: exercise the full release DAG (gate, builds, packaging, page
  # generation) while skipping every outward publish step (GitHub Release,
  # crates.io, npm, NuGet, Pages deploy). Run this before tagging a release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: skip all outward publish steps'
        type: boolean
        default: true

# Minimal default; each job elevates only what it needs.
permissions:
  contents: read

# One run per ref at a time, never cancelled: a tag deleted and pushed again
# must not have two runs writing one release and racing to the registries.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The compiler every release job builds with. Pinned so that rebuilding a
  # tag reproduces the toolchain it was released with; `stable` would be
  # whatever the channel pointed at on the day. Raise it deliberately, in a
  # pull request that runs the canary.
  RELEASE_TOOLCHAIN: "1.99.0"

jobs:
  # Gate: only publish artifacts for a commit that passed a FULL ci.yml run,
  # and whose manifests are in version lockstep with the tag. A push to main
  # that lands a tree CI already passed in full runs ci.yml's fast lane only,
  # and its `CI Gate / All Checks Passed` check-run succeeds with no test
  # having run, so that check-run alone is not evidence (docs/CI.md section 3). release_ci_gate.py reads the commit's
  # ci.yml runs instead, and dispatches a full one on this ref when none exists.
  release-gate:
    name: Release Gate / Verify CI + Version Lockstep
    runs-on: ubuntu-24.04
    # Bounds the wait for a dispatched full run behind a busy runner pool; the
    # script's own --deadline-minutes fails it first, with the reason.
    timeout-minutes: 240
    permissions:
      contents: read
      actions: write # read the commit's ci.yml runs; dispatch one if none is full
    steps:
      # Records every outbound connection this job makes (audit mode: nothing
      # is blocked). The record is the input for an egress allow-list.
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Refuse a dispatch that would publish
        # A release is a pushed, signed tag. The signature, lockstep and
        # on-main checks below run on a tag push only, so a manual run with
        # `dry_run` unticked would skip them and publish all the same.
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          echo "::error::release.yml publishes only from a pushed release tag. A manual run is a canary: leave dry_run ticked. To release, create the tag with scripts/tag_release.py and push it."
          exit 1

      - name: Assert the released commit passed a full CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A full run is one whose `fast-lane` job succeeded; the latest full
          # (or still-running) run decides. With none, ci.yml is dispatched on
          # this ref once and waited for -- a workflow_dispatch made with
          # GITHUB_TOKEN does start a run. A tag pushed moments after its
          # commit lands races the still-running CI; the script waits for it
          # rather than failing (the v0.4.0 incident, #313).
          # --require-ancestor-of: a tagged commit must be on main, checked
          # before any wait. A tag cut from a stale checkout is refused here.
          # A workflow_dispatch canary publishes nothing, and is how a change
          # to this workflow is exercised on its branch before it merges, so
          # the assertion applies to tag pushes only.
          on_main=()
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            on_main=(--require-ancestor-of main)
          fi
          python3 scripts/release_ci_gate.py \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}" \
            --dispatch-ref "${GITHUB_REF_NAME}" \
            "${on_main[@]}" \
            --deadline-minutes 220

      - name: Assert the tag is signed by a committed release key
        if: github.event_name == 'push'  # a canary dispatch has no tag
        run: |
          set -euo pipefail
          # The release tag is the maintainer's (scripts/tag_release.py). Only
          # the keys in .github/release-signing-keys.asc are trusted: the
          # script verifies in an empty GnuPG home holding that one file, so
          # an unsigned tag, a lightweight tag, or one signed by any other
          # key stops the release here, before anything is built or published.
          # The checkout may hold the tag's commit without the tag object.
          git fetch --no-tags --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          # --sha: the signed tag must name this ref and peel to the commit
          # this run builds, so a tag moved after the push is refused.
          python3 scripts/verify_tag_signature.py --tag "${GITHUB_REF_NAME}" --sha "${GITHUB_SHA}"

      - name: Assert manifests are in version lockstep with the tag
        if: github.event_name == 'push'  # no tag to compare on a canary dispatch
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          # A pre-release tag (X.Y.Z-rc.N) rehearses X.Y.Z from the commit
          # that carries X.Y.Z, so the manifests are checked against the base.
          BASE_VERSION="${TAG_VERSION%%-*}"
          echo "Verifying all manifests match version ${BASE_VERSION} (tag ${TAG_VERSION})..."
          python3 scripts/bump_version.py --check "${BASE_VERSION}"

  publish-crates:
    name: Publish to Crates.io
    # Anchor-first (#313): every registry publish waits for the canonical
    # GitHub Release, so a registry can never carry a version the release
    # page does not.
    needs: [release-gate, github-release, promote]
    # A pre-release tag (vX.Y.Z-rc.N) is built, attested and smoke-tested, and
    # stops there: nothing is published from it.
    # The `release` environment admits release tags only, so on a manual canary
    # on a branch it refuses the deployment and the job ends red with no step run.
    # Skipped there instead: nothing a canary exercises is lost.
    if: ${{ github.event_name == 'push' && !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # crates.io OIDC trusted publishing
    steps:
      # Records every outbound connection this job makes (audit mode: nothing
      # is blocked). The record is the input for an egress allow-list.
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}
      # Exchanges this job's OIDC token for a short-lived crates.io token, which
      # the action's post step revokes. Each crate must list this repository
      # and `release.yml` as a trusted publisher on crates.io (an environment,
      # if one is set there, must be `release`). No registry token is stored.
      - name: Authenticate to crates.io (OIDC trusted publishing)
        id: crates-auth
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crates (idempotent on already-published versions)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          set -uo pipefail
          publish_crate() {
            crate="$1"
            attempt=0
            max=3
            while :; do
              attempt=$((attempt + 1))
              echo "Publishing ${crate} (attempt ${attempt}/${max})..."
              if cargo publish --locked -p "${crate}" 2>&1 | tee /tmp/publish.log; then
                echo "Published ${crate}."
                return 0
              fi
              if grep -qiE 'already (exists|uploaded)|is already uploaded|crate version .* is already' /tmp/publish.log; then
                echo "${crate} version already on crates.io; treating as success (idempotent)."
                return 0
              fi
              if [ "${attempt}" -ge "${max}" ]; then
                echo "::error::cargo publish failed for ${crate} after ${max} attempts"
                return 1
              fi
              echo "Retrying ${crate} after crates.io index propagation delay..."
              sleep 20
            done
          }
          publish_crate expanse-trie
          publish_crate expanse-capi

  build-release-artifacts:
    name: Build Artifacts (${{ matrix.target }})
    needs: [release-gate]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            deb_arch: amd64
            rpm_arch: x86_64
            dotnet_rid: linux-x64
            java_classifier: linux-x86_64
            nativefile: libexpanse.so
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04
            deb_arch: arm64
            rpm_arch: aarch64
            java_classifier: linux-aarch64
            nativefile: libexpanse.so
            cross_pkg: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - target: riscv64gc-unknown-linux-gnu
            os: ubuntu-24.04
            deb_arch: riscv64
            rpm_arch: riscv64
            cross_pkg: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            cross_pkg: musl-tools
          - target: aarch64-apple-darwin
            os: macos-26
            dotnet_rid: osx-arm64
            java_classifier: darwin-aarch64
            nativefile: libexpanse.dylib
          - target: x86_64-apple-darwin
            os: macos-26
            dotnet_rid: osx-x64
            java_classifier: darwin-x86_64
            nativefile: libexpanse.dylib
          - target: x86_64-pc-windows-msvc
            os: windows-2025-vs2026
            dotnet_rid: win-x64
            java_classifier: windows-x86_64
            nativefile: expanse.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Install cross-compilation dependencies (Linux)
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev rpm ${{ matrix.cross_pkg }}
      - name: Build release binaries
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
        run: cargo build -p expanse-capi --release --locked --target ${{ matrix.target }}

      - name: Prepare dist, archive, and Linux packages (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Tag pushes carry the version in the ref; a canary dispatch has no
          # tag (GITHUB_REF=refs/heads/main — the old stripping produced
          # "refs/heads/main" and broke every Unix packaging step), so fall
          # back to the manifest version.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -m1 '^version' crates/expanse-capi/Cargo.toml | cut -d'"' -f2)"
          fi
          T="${{ matrix.target }}"

          mkdir -p dist/include dist/lib dist/share/man/man3
          cp include/*.h include/*.hpp dist/include/
          if [ -d "man/man3" ]; then
            cp man/man3/*.3 dist/share/man/man3/
          fi

          if [ -f "target/$T/release/libexpanse.a" ]; then
            cp "target/$T/release/libexpanse.a" dist/lib/
          fi

          # cargo emits an unversioned library; synthesize the soname chain so the
          # libjudy-compat symlink (libJudy.so.1 -> libexpanse.so.1) is not dangling.
          if [ -f "target/$T/release/libexpanse.so" ]; then
            cp "target/$T/release/libexpanse.so" dist/lib/libexpanse.so.1.0.0
            ln -sf libexpanse.so.1.0.0 dist/lib/libexpanse.so.1
            ln -sf libexpanse.so.1 dist/lib/libexpanse.so
          elif [ -f "target/$T/release/libexpanse.dylib" ]; then
            cp "target/$T/release/libexpanse.dylib" dist/lib/libexpanse.dylib
          fi

          # glibc-hwcaps micro-architecture variants (x86_64 only). The
          # packagers already stage dist/lib/glibc-hwcaps if it exists; until
          # #762 nothing populated it, so every published .deb and .rpm carried
          # the baseline alone while the docs said otherwise. The builder skips
          # non-x86_64 targets itself, and the validator fails if a variant is
          # byte-identical to the baseline — i.e. if -C target-cpu did not take.
          if [ "$T" = "x86_64-unknown-linux-gnu" ]; then
            bash scripts/build_hwcaps.sh "$T" dist
            bash scripts/test_hwcaps.sh dist
          fi

          tar -czvf "expanse-${VERSION}-${T}.tar.gz" -C dist .

          if [ -n "${{ matrix.deb_arch }}" ]; then
            bash scripts/package_deb.sh "$VERSION" "${{ matrix.deb_arch }}" dist
          fi
          if [ -n "${{ matrix.rpm_arch }}" ]; then
            bash scripts/package_rpm.sh "$VERSION" "${{ matrix.rpm_arch }}" dist
          fi

      - name: Prepare archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item target\${{ matrix.target }}\release\expanse.dll package\
          Copy-Item target\${{ matrix.target }}\release\expanse.lib package\
          # Canonical public headers live in include/ (#563).
          Copy-Item include\*.h package\
          Set-Content -Path package\README_MSVC.txt -Value "MSVC Build Instructions: Add expanse.lib to your linker input, and include Judy.h/expanse.h"
          # Same derivation as the Unix step: tag ref on releases, manifest
          # version on a canary dispatch (GITHUB_REF_NAME would be "main").
          $VERSION = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF -replace '^refs/tags/v', '' } else { (Select-String -Path crates/expanse-capi/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value }
          Compress-Archive -Path package\* -DestinationPath "expanse-v$VERSION-${{ matrix.target }}.zip"

      - name: Stage native library for NuGet
        if: matrix.dotnet_rid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "native/${{ matrix.dotnet_rid }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.nativefile }}" "native/${{ matrix.dotnet_rid }}/"

      - name: Upload native library artifact (NuGet)
        if: matrix.dotnet_rid
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.dotnet_rid }}
          path: native/${{ matrix.dotnet_rid }}/*
          if-no-files-found: error

      - name: Stage native library for Java
        if: matrix.java_classifier
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "native-java/${{ matrix.java_classifier }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.nativefile }}" "native-java/${{ matrix.java_classifier }}/"

      - name: Upload native library artifact (Java)
        if: matrix.java_classifier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-java-${{ matrix.java_classifier }}
          path: native-java/${{ matrix.java_classifier }}/*
          if-no-files-found: error

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ matrix.target }}
          path: |
            expanse-*.tar.gz
            expanse-*.zip
            *.deb
            *.rpm
          if-no-files-found: error

  build-npm:
    name: Build npm addon (${{ matrix.platform }})
    needs: [release-gate]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            libfile: libexpanse_node.so
          - platform: darwin-x64
            target: x86_64-apple-darwin
            os: macos-26
            libfile: libexpanse_node.dylib
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-26
            libfile: libexpanse_node.dylib
          - platform: win32-x64-msvc
            target: x86_64-pc-windows-msvc
            os: windows-2025-vs2026
            libfile: expanse_node.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Build native addon
        run: cargo build -p expanse-node --release --locked --target ${{ matrix.target }}
      - name: Assemble platform .node
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "target/${{ matrix.target }}/release/${{ matrix.libfile }}" "out/expanse.${{ matrix.platform }}.node"
      - name: Upload platform addon artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-${{ matrix.platform }}
          path: out/expanse.${{ matrix.platform }}.node
          if-no-files-found: error

  package-nuget:
    name: Package & Publish .NET NuGet
    needs: [release-gate, build-release-artifacts, github-release, promote] # anchor-first (#313)
    # A pre-release tag (vX.Y.Z-rc.N) is built, attested and smoke-tested, and
    # stops there: nothing is published from it.
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write # attach the nupkg to the GitHub Release
      id-token: write # NuGet.org OIDC trusted publishing
    steps:
      # Records every outbound connection this job makes (audit mode: nothing
      # is blocked). The record is the input for an egress allow-list.
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.425'
      - name: Download native libraries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-*
          path: native-staging
      - name: Stage native libraries into runtimes/{rid}/native
        run: |
          set -euo pipefail
          base="bindings/dotnet/src/Expanse.NET/runtimes"
          found=0
          for d in native-staging/native-*; do
            [ -d "$d" ] || continue
            rid="${d#native-staging/native-}"
            mkdir -p "${base}/${rid}/native"
            cp "$d"/* "${base}/${rid}/native/"
            found=$((found + 1))
            echo "Staged ${rid}: $(ls "${base}/${rid}/native")"
          done
          if [ "${found}" -eq 0 ]; then
            echo "::error::No native libraries staged for NuGet"; exit 1
          fi
      - name: Pack NuGet package
        run: |
          mkdir -p dist/nuget
          dotnet pack bindings/dotnet/src/Expanse.NET/Expanse.NET.csproj -c Release -o dist/nuget
      - name: Upload NuGet artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-nuget
          path: dist/nuget/*.nupkg
          if-no-files-found: error
      - name: NuGet login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: orieg
      - name: Publish to NuGet.org
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            # Hard failure, not a silent skip: a green job that published
            # nothing is the failure class #313 exists to eliminate.
            echo "::error::No NuGet credential available (OIDC login yielded no key and NUGET_API_KEY is unset); refusing to report success without publishing."
            exit 1
          fi
          dotnet nuget push dist/nuget/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
      # Under anchor-first ordering this job runs AFTER github-release, so the
      # nupkg can no longer ride the release-artifacts-* download there —
      # attach it to the existing release explicitly (idempotent via --clobber).
      - name: Attach nupkg to the GitHub Release
        if: github.event_name == 'push' # the release exists only on tag pushes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/nuget/*.nupkg dist/nuget/*.snupkg --clobber

  package-maven:
    name: Package & Publish Java (Maven Central)
    needs: [release-gate, build-release-artifacts, github-release, promote] # anchor-first (#313)
    # A pre-release tag (vX.Y.Z-rc.N) is built, attested and smoke-tested, and
    # stops there: nothing is published from it.
    # The `release` environment admits release tags only, so on a manual canary
    # on a branch it refuses the deployment and the job ends red with no step run.
    # Skipped there instead: nothing a canary exercises is lost.
    if: ${{ github.event_name == 'push' && !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # attach jar to GitHub Release
    steps:
      # Records every outbound connection this job makes (audit mode: nothing
      # is blocked). The record is the input for an egress allow-list.
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 22
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '22.0.2'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Download native libraries (Java)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-java-*
          path: native-java-staging

      - name: Stage native libraries into resources/native/{classifier}
        run: |
          set -euo pipefail
          base="bindings/java/src/main/resources/native"
          found=0
          for d in native-java-staging/native-java-*; do
            [ -d "$d" ] || continue
            classifier="${d#native-java-staging/native-java-}"
            mkdir -p "${base}/${classifier}"
            cp "$d"/* "${base}/${classifier}/"
            found=$((found + 1))
            echo "Staged ${classifier}: $(ls "${base}/${classifier}")"
          done
          if [ "${found}" -lt 5 ]; then
            echo "::error::Expected 5 native classifiers for Java, found ${found}"; exit 1
          fi

      - name: Package JAR with all native binaries
        run: mvn clean package -f bindings/java/pom.xml -DskipTests

      - name: Upload Java release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-java
          path: |
            bindings/java/target/*.jar
            bindings/java/pom.xml
          if-no-files-found: error

      - name: Publish to Maven Central
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${MAVEN_CENTRAL_TOKEN:-}" ]; then
            echo "::warning::MAVEN_CENTRAL_TOKEN is unset; skipping Maven Central publish."
            exit 0
          fi
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            # maven-gpg-plugin shells out to gpg, which asks its agent for the
            # passphrase and fails with "Inappropriate ioctl for device" on a
            # runner with no TTY. Loopback pinentry has to be allowed by the
            # agent *and* asked for on the command line, and the passphrase has
            # to reach the plugin: importing with --batch alone is not enough,
            # which is how the v0.6.0 Java publish failed after every other
            # channel had already published (release run 34072934462).
            mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
            echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
            gpgconf --reload gpg-agent || true
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>central</id><username>${MAVEN_CENTRAL_USERNAME}</username><password>${MAVEN_CENTRAL_TOKEN}</password></server></servers></settings>" > ~/.m2/settings.xml
          mvn deploy -f bindings/java/pom.xml -P release -DskipTests \
            -Dgpg.pinentry-mode=loopback \
            -Dgpg.passphrase="${GPG_PASSPHRASE:-}"

      - name: Attach JAR to the GitHub Release
        if: github.event_name == 'push' # the release exists only on tag pushes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" bindings/java/target/*.jar --clobber

  publish-npm:
    name: Publish Node.js (npm)
    needs: [release-gate, build-npm, github-release, promote] # anchor-first (#313)
    # A pre-release tag (vX.Y.Z-rc.N) is built, attested and smoke-tested, and
    # stops there: nothing is published from it.
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing & provenance
    steps:
      # Records every outbound connection this job makes (audit mode: nothing
      # is blocked). The record is the input for an egress allow-list.
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - name: Upgrade npm CLI (OIDC provenance support)
        run: npm install -g npm@12.2.0
      - name: Download platform addons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: npm-*
          path: npm-staging
      - name: Assemble and publish platform packages + main package
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          CRATE=crates/expanse-node
          VERSION=$(node -p "require('./${CRATE}/package.json').version")
          echo "Publishing @orieg/expanse platform packages at ${VERSION} via npm OIDC..."

          platform_os() { case "$1" in linux-*) echo linux ;; darwin-*) echo darwin ;; win32-*) echo win32 ;; esac; }
          platform_cpu() { case "$1" in *-arm64) echo arm64 ;; *) echo x64 ;; esac; }

          for d in npm-staging/npm-*; do
            [ -d "$d" ] || continue
            plat="${d#npm-staging/npm-}"
            pkgdir="${CRATE}/npm/${plat}"
            mkdir -p "${pkgdir}"
            cp "$d"/expanse.*.node "${pkgdir}/"
            # shellcheck disable=SC2016  # ${...} below are JS template literals, not shell
            PKGDIR="${pkgdir}" node -e '
              const fs = require("fs");
              const [plat, version, os, cpu] = process.argv.slice(1);
              const pkg = {
                name: `@orieg/expanse-${plat}`,
                version,
                description: `Prebuilt @orieg/expanse native addon for ${plat}.`,
                main: `expanse.${plat}.node`,
                files: [`expanse.${plat}.node`],
                os: [os],
                cpu: [cpu],
                license: "MIT OR Apache-2.0",
                repository: { type: "git", url: "git+https://github.com/orieg/expanse.git", directory: "crates/expanse-node" },
                engines: { node: ">= 20.0.0" },
              };
              fs.writeFileSync(`${process.env.PKGDIR}/package.json`, JSON.stringify(pkg, null, 2));
            ' "$plat" "$VERSION" "$(platform_os "$plat")" "$(platform_cpu "$plat")"
            if npm view "@orieg/expanse-${plat}@${VERSION}" version >/dev/null 2>&1; then
              echo "@orieg/expanse-${plat}@${VERSION} already on the registry; skipping (idempotent re-run)."
            else
              echo "Publishing @orieg/expanse-${plat}..."
              npm publish "./${pkgdir}" --access public --provenance
            fi
          done

          if npm view "@orieg/expanse@${VERSION}" version >/dev/null 2>&1; then
            echo "@orieg/expanse@${VERSION} already on the registry; skipping (idempotent re-run)."
          else
            echo "Publishing main package @orieg/expanse..."
            # The "./" prefix is load-bearing: a bare "crates/expanse-node"
            # parses as a github:owner/repo spec (EALLOWGIT — how the v0.4.0
            # main-package publish failed while the warning-swallow hid it).
            npm publish "./${CRATE}" --access public --provenance
          fi

  github-release:
    name: Create GitHub Release
    # The PRIMARY ANCHOR (#313): depends only on the gate and the core
    # artifacts. Downstream registries depend on THIS job — never the reverse.
    needs: [release-gate, build-release-artifacts]
    runs-on: ubuntu-24.04
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    permissions:
      contents: write # create the draft release and upload assets
      id-token: write # Sigstore OIDC token for build provenance
      attestations: write # create GitHub artifact attestations
    steps:
      # Records every outbound connection this job makes (audit mode: nothing
      # is blocked). The record is the input for an egress allow-list.
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Refuse to rewrite a published release
        # Re-running this job after `promote` would delete and re-upload the
        # public release's assets with rebuilt, different bytes, while the
        # registries, the tap formula and the apt/rpm metadata keep the old
        # digests. A draft is not returned by this endpoint, so a re-run
        # before promotion passes.
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if url=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" --jq .html_url 2>lookup.err); then
            echo "::error::${GITHUB_REF_NAME} is already published (${url}). Its assets are not rebuilt. To retry a registry job, use 'Re-run failed jobs', never 'Re-run all jobs'."
            exit 1
          fi
          # Only "no such release" lets the job go on; any other failure of
          # the lookup leaves the question open, and the job stops.
          if ! grep -q 'HTTP 404' lookup.err; then
            echo "::error::could not tell whether ${GITHUB_REF_NAME} is already published: $(cat lookup.err)"
            exit 1
          fi
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: artifacts
      - name: Install cargo-cyclonedx
        run: scripts/install_cyclonedx.sh
      - name: Generate CycloneDX SBOM
        run: |
          set -euo pipefail
          CARGO_LOCKED=true cargo cyclonedx --format json --spec-version 1.5 --override-filename expanse.cdx
          cp crates/expanse-capi/expanse.cdx.json artifacts/expanse.cdx.json
          cp crates/expanse/expanse.cdx.json artifacts/expanse-trie.cdx.json
          rm -f crates/*/*.cdx.json
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum ./* > SHA256SUMS
      - id: provenance
        name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/expanse-*.tar.gz
            artifacts/expanse-*.zip
            artifacts/*.deb
            artifacts/*.rpm
      - id: sbom-attestation
        name: Attest CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/expanse-*.tar.gz
            artifacts/expanse-*.zip
            artifacts/*.deb
            artifacts/*.rpm
          sbom-path: artifacts/expanse.cdx.json
      # The same attestation, attached to the release so it can be verified offline
      # (`gh attestation verify <archive> --bundle expanse.intoto.jsonl`) and found
      # by tools that read release assets (OpenSSF Scorecard Signed-Releases).
      - name: Attach the provenance bundle
        shell: bash
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          [ -s "${BUNDLE}" ] || { echo "::error::no attestation bundle at '${BUNDLE}'"; exit 1; }
          cp "${BUNDLE}" artifacts/expanse.intoto.jsonl
      # Every build leg produced its archive, the fixed files are present, and
      # each file has the digest SHA256SUMS records. Runs in the canary too,
      # so a leg that uploads nothing is caught before a tag is pushed.
      - name: Check the collected assets
        run: python3 scripts/release_assets.py check-local --dir artifacts
      # The smoke job checks the archive it tests against this list.
      - name: Hand the checksum list to the smoke job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error
      # The curated notes are the signed tag's message (scripts/tag_release.py
      # --notes-file / --notes-from-pr). They lead the release body; the list
      # generated from pull-request titles follows. A stable tag without notes
      # fails here, before the release is created.
      - name: Read the curated notes from the tag
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          python3 scripts/release_notes.py --tag "${GITHUB_REF_NAME}" --out curated-notes.md
      - name: Create Release
        id: release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/*
          # With both set, the action puts the generated notes after this body.
          body_path: ${{ github.event_name == 'push' && 'curated-notes.md' || '' }}
          generate_release_notes: true
          # Created as a draft: nothing is public, and nothing downstream runs,
          # until the uploaded assets have been read back and checked below.
          # A pre-release tag's draft is never published (see `promote`).
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
      # What is on the release must be what was built: the assets are
      # downloaded again and compared with the uploaded set by name and by
      # digest. A truncated or missing upload stops here, with the release
      # still a draft and no registry touched.
      - name: Read the draft's assets back and verify them
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          # By release id, not by tag: the tag lookup does not return a draft.
          [ -n "${RELEASE_ID}" ] || { echo "::error::the release step reported no release id. Check the Create GitHub Release step output or re-run the release job"; exit 1; }
          mkdir readback
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?per_page=100" \
            --jq '.[] | "\(.id)\t\(.name)"' > assets.tsv
          while IFS=$'\t' read -r asset_id name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "readback/${name}"
          done < assets.tsv
          python3 scripts/release_assets.py check-readback --dir readback --local artifacts
      - name: Verify provenance attestations
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Verifying build provenance on released archives..."
          for f in artifacts/expanse-*.tar.gz artifacts/expanse-*.zip; do
            [ -f "${f}" ] || continue
            echo "Verifying ${f}..."
            gh attestation verify "${f}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
          done
          echo "All release archive attestations verified successfully."

  # Consumer-level proof before anything irreversible: each archive is
  # unpacked and used the way a user would, on the platform it is for. It reads
  # the build's own artifacts, which the release job has shown to be
  # byte-identical to the draft's assets (read-back), so the same job runs
  # unchanged in the dry-run canary, where no draft exists.
  smoke:
    name: Smoke / ${{ matrix.target }}
    needs: [release-gate, build-release-artifacts, github-release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this target's archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-${{ matrix.target }}
          path: artifacts
      - name: Download the checksum list
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-checksums
          path: checksums
      - name: Locate the archive and check its digest
        id: archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -m1 '^version' crates/expanse-capi/Cargo.toml | cut -d'"' -f2)"
          fi
          # A pre-release tag (X.Y.Z-rc.N) is built from the commit that carries
          # X.Y.Z, so that is the version the library reports.
          VERSION="${VERSION%%-*}"
          shopt -s nullglob
          found=(artifacts/expanse-*"${TARGET}".tar.gz artifacts/expanse-*"${TARGET}".zip)
          [ "${#found[@]}" -eq 1 ] || { echo "::error::expected one archive for ${TARGET}, found ${#found[@]}"; exit 1; }
          python3 scripts/release_assets.py check-file --file "${found[0]}" --sums checksums/SHA256SUMS
          echo "path=${found[0]}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      # Compiles and runs the C programs of the Homebrew formula's `test do`
      # against the archive's headers and static library, and checks the
      # version the library reports.
      - name: Compile and run C programs against the archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
          VERSION: ${{ steps.archive.outputs.version }}
        run: |
          set -euo pipefail
          # The success line is checked as well as the exit status: under
          # bash 3.2 a dead script can exit 0 through its cleanup trap.
          bash scripts/test_homebrew_archive.sh "${ARCHIVE}" "${VERSION}" | tee smoke.log
          grep -q -e "homebrew archive smoke: ok" smoke.log || { echo "::error::smoke script printed no success line"; exit 1; }
      # No C toolchain is assumed on Windows: the DLL is loaded and asked for
      # its version, which proves it loads and exports the modern API.
      - name: Load the DLL and read its version
        if: runner.os == 'Windows'
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.path }}
          VERSION: ${{ steps.archive.outputs.version }}
        run: |
          set -euo pipefail
          mkdir unpacked
          unzip -q "${ARCHIVE}" -d unpacked
          for f in expanse.dll expanse.lib expanse.h Judy.h; do
            [ -f "unpacked/${f}" ] || { echo "::error::archive lacks ${f}"; exit 1; }
          done
          python scripts/smoke_windows_dll.py unpacked/expanse.dll "${VERSION}"

  # The point of no return. Publishing the draft makes the release public;
  # the Go tag, the PyPI dispatch and every registry job follow it. It runs
  # only after the draft's assets were read back and the smoke job passed.
  promote:
    name: Promote / Publish the Release
    needs: [release-gate, github-release, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publish the draft; push the Go module tag
      actions: write # dispatch python.yml for the PyPI publish
    steps:
      # Records every outbound connection this job makes (audit mode: nothing
      # is blocked). The record is the input for an egress allow-list.
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Keeps the token: this job pushes the Go module tag with it.
        with:
          persist-credentials: true
      # A pre-release stays a draft: a published release is archived by Zenodo
      # and announced to watchers, pre-releases included; a draft is neither.
      # Nested Go module versioning (#322): `go get .../bindings/go@vX.Y.Z`
      # only resolves a pinned release if a `bindings/go/vX.Y.Z` tag exists.
      # First, because it is the step most likely to be refused (the token
      # cannot push a ref when a workflow file changed on main since the
      # tagged commit) and nothing is public yet: a failure here leaves a
      # draft. No force: a Go tag that exists on another commit fails loudly;
      # the same tag on the same commit is a no-op on a re-run.
      - name: Push Go nested-module tag
        if: github.event_name == 'push' && !contains(github.ref_name, '-') # stable tag releases only
        run: |
          git push origin "${GITHUB_SHA}:refs/tags/bindings/go/${GITHUB_REF_NAME}"
      - name: Publish the release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.github-release.outputs.release_id }}
        run: |
          set -euo pipefail
          [ -n "${RELEASE_ID}" ] || { echo "::error::no release id from the release job. Check that github-release succeeded and set its outputs.release_id, or re-run the release"; exit 1; }
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false \
            --jq '"published \(.tag_name): draft=\(.draft) \(.html_url)"'
      - name: Dispatch PyPI publish (python.yml)
        if: github.event_name == 'push' && !contains(github.ref_name, '-') # stable tag releases only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run python.yml --ref main -f publish=true -f release_tag="${GITHUB_REF_NAME}"

  publish-homebrew:
    name: Publish Homebrew Formula & MacPorts Portfile
    # Renders both from the release archives' own checksums, attaches them to
    # the release, and pushes the formula to orieg/homebrew-tap.
    needs: [release-gate, build-release-artifacts, github-release, promote] # anchor-first (#313)
    # A pre-release tag (vX.Y.Z-rc.N) is built, attested and smoke-tested, and
    # stops there: nothing is published from it.
    # The `release` environment admits release tags only, so on a manual canary
    # on a branch it refuses the deployment and the job ends red with no step run.
    # Skipped there instead: nothing a canary exercises is lost.
    if: ${{ github.event_name == 'push' && !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
    runs-on: macos-26 # the smoke step needs cc against a darwin archive
    environment: release
    permissions:
      contents: write # attach expanse.rb and Portfile to the release
    steps:
      # Records every outbound connection this job makes (audit mode: nothing
      # is blocked). The record is the input for an egress allow-list.
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-artifacts-*
          merge-multiple: true
          path: artifacts
      - name: Render formula and Portfile
        id: render
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(grep -m1 '^version' crates/expanse-capi/Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          python3 scripts/update_homebrew_formula.py --self-test
          python3 scripts/update_homebrew_formula.py \
            --version "${VERSION}" --artifacts-dir artifacts \
            --formula-out dist/expanse.rb --portfile-out dist/Portfile
      # The formula's `test do` programs, run against the archive this runner's
      # architecture would install, so a broken header or a missing symbol
      # stops the push rather than reaching `brew test` on a user's machine.
      - name: Smoke the darwin archive with the formula's test programs
        shell: bash
        env:
          VERSION: ${{ steps.render.outputs.version }}
        run: |
          set -euo pipefail
          # Gate on the script's own success line as well as its exit status:
          # the first canary run went green with the smoke dead on its first
          # compile, because bash 3.2 exited 0 through the cleanup trap.
          bash scripts/test_homebrew_archive.sh "artifacts/expanse-${VERSION}-$(uname -m | sed 's/arm64/aarch64/')-apple-darwin.tar.gz" "${VERSION}" | tee smoke.log
          grep -q -e "homebrew archive smoke: ok" smoke.log || { echo "::error::smoke script printed no success line"; exit 1; }
      - name: Attach formula and Portfile to the GitHub Release
        if: github.event_name == 'push' # tag releases only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/expanse.rb dist/Portfile --clobber
      - name: Push formula to orieg/homebrew-tap
        if: github.event_name == 'push' # tag releases only
        shell: bash
        env:
          VERSION: ${{ steps.render.outputs.version }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY || '' }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY}" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not configured — formula NOT pushed to orieg/homebrew-tap; dist/expanse.rb is attached to the release"
            exit 0
          fi
          python3 scripts/update_homebrew_formula.py \
            --version "${VERSION}" --artifacts-dir artifacts \
            --push-to-tap orieg/homebrew-tap

  publish-pages:
    name: Publish Portal & Repositories (GitHub Pages)
    needs: [build-release-artifacts, github-release, promote] # anchor-first (#313)
    # A pre-release tag (vX.Y.Z-rc.N) is built, attested and smoke-tested, and
    # stops there: nothing is published from it.
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      # Records every outbound connection this job makes (audit mode: nothing
      # is blocked). The record is the input for an egress allow-list.
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trigger GitHub Pages deployment with signed package repositories
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "${GITHUB_REPOSITORY}" --ref main


  publish-gem:
    name: Publish Ruby Gem (rubygems.org)
    needs: [release-gate, github-release, promote] # anchor-first (#313)
    # A pre-release tag (vX.Y.Z-rc.N) is built, attested and smoke-tested, and
    # stops there: nothing is published from it.
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # rubygems.org OIDC trusted publishing
    steps:
      # Records every outbound connection this job makes (audit mode: nothing
      # is blocked). The record is the input for an egress allow-list.
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3.12'
      - name: Build gem
        working-directory: bindings/ruby
        run: gem build expanse.gemspec
      # The gem is pure Ruby (Fiddle/FFI onto libexpanse from the release
      # channels) — no native compile at install; see docs/bindings/ruby.md.
      - name: Configure RubyGems OIDC credentials
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish gem (idempotent)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        working-directory: bindings/ruby
        run: |
          set -euo pipefail
          VERSION=$(ruby -e 'puts Gem::Specification.load("expanse.gemspec").version')
          if curl -sf "https://rubygems.org/api/v2/rubygems/expanse/versions/${VERSION}.json" >/dev/null; then
            echo "expanse ${VERSION} already on rubygems.org; skipping (idempotent re-run)."
          else
            gem push "expanse-${VERSION}.gem"
          fi

  publish-wasm:
    name: Publish WebAssembly (npm)
    needs: [release-gate, github-release, promote] # anchor-first (#313)
    # A pre-release tag (vX.Y.Z-rc.N) is built, attested and smoke-tested, and
    # stops there: nothing is published from it.
    if: ${{ !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing & provenance
    steps:
      # Records every outbound connection this job makes (audit mode: nothing
      # is blocked). The record is the input for an egress allow-list.
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.3'
      - name: Upgrade npm CLI (OIDC provenance support) and install wasm-pack
        run: |
          npm install -g npm@12.2.0
          npm install -g wasm-pack@0.15.0
      - name: Install Rust (wasm32 target)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: Build wasm package
        run: wasm-pack build --release --target web --scope orieg crates/expanse-wasm
      - name: Publish @orieg/expanse-wasm (idempotent)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./crates/expanse-wasm/pkg/package.json').version")
          if npm view "@orieg/expanse-wasm@${VERSION}" version >/dev/null 2>&1; then
            echo "@orieg/expanse-wasm@${VERSION} already on the registry; skipping (idempotent re-run)."
          else
            npm publish ./crates/expanse-wasm/pkg --access public --provenance
          fi

  # Every publish job above reports success when its upload command exits
  # zero -- not when the registry actually serves the version. v0.5.0 shipped
  # with all publish jobs green and was only confirmed complete by querying
  # the registries by hand afterwards. This job makes that query part of the
  # release, so an upload that silently did not land fails the run.
  #
  # Skipped on the dry-run canary, which publishes nothing.
  verify-registries:
    name: Verify / Registries Serve the Release
    needs:
      - publish-crates
      - publish-npm
      - publish-wasm
      - publish-gem
      - package-nuget
      - package-maven
      - github-release
      - promote
    # Nothing to verify for a pre-release tag: no registry receives it.
    if: ${{ github.event_name == 'push' && !(startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-')) }}
    runs-on: ubuntu-24.04
    # The shared budget below waits 30+60+120+240+240 s; Maven Central's four
    # extra attempts (EXTRA_ATTEMPTS in the script) add 4 x 240 s, 1,650 s of
    # waiting in all before the probes' own time, so the timeout holds it.
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Retries with backoff: registries ingest asynchronously, and the PHP
      # library was absent from Packagist minutes after the v0.5.0 tag and
      # present later. Absence only counts once the budget is exhausted.
      # Maven Central outlived this budget three times on v0.7.0 and gets
      # extra attempts of its own; the probes bypass repo1's CDN cache.
      - name: Assert every registry serves ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verify_release_registries.py \
            --version "${GITHUB_REF_NAME}" \
            --attempts 6 --delay 30 --max-delay 240

name: Subsplit Mirrors (PHP)

# Two-package PHP distribution (#317, MongoDB model):
#   bindings/php        -> github.com/orieg/expanse-php-library  (Packagist: orieg/expanse, type library)
#   crates/expanse-php  -> github.com/orieg/php-expanse          (Packagist: orieg/expanse-extension, type php-ext)
# Each mirror repo's Packagist entry is registered/repointed manually once;
# thereafter tags flowing through these subsplits publish new versions.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'bindings/php/**'
      - 'crates/expanse-php/**'
      - '.github/workflows/subsplit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  subsplit-php-library:
    name: Mirror / bindings/php -> orieg/expanse-php-library
    runs-on: ubuntu-latest
    steps:
      # A tag push is a publish path: a missing key must fail, never report
      # success having mirrored nothing (AGENTS.md 8.1). On main a missing key
      # is tolerable (forks, unconfigured clones) and only warns.
      - name: Preflight / require the deploy key on tag pushes
        run: |
          if [[ -n "${SSH_KEY}" ]]; then
            echo "PHP_LIBRARY_SUBSPLIT_SSH_KEY configured; mirroring the library."
            exit 0
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "::error::PHP_LIBRARY_SUBSPLIT_SSH_KEY is not configured, so ${GITHUB_REF_NAME} cannot be mirrored to orieg/expanse-php-library. Packagist would keep serving the previous version while the release reported success."
            exit 1
          fi
          echo "::warning::PHP_LIBRARY_SUBSPLIT_SSH_KEY not configured; skipping the library mirror (not a tag push)."
        env:
          SSH_KEY: ${{ secrets.PHP_LIBRARY_SUBSPLIT_SSH_KEY }}

      - name: Checkout monorepo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup SSH Deploy Key
        if: ${{ env.SSH_KEY != '' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PHP_LIBRARY_SUBSPLIT_SSH_KEY }}
        env:
          SSH_KEY: ${{ secrets.PHP_LIBRARY_SUBSPLIT_SSH_KEY }}

      - name: Configure Git Author
        if: ${{ env.SSH_KEY != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        env:
          SSH_KEY: ${{ secrets.PHP_LIBRARY_SUBSPLIT_SSH_KEY }}

      - name: Push bindings/php subtree to orieg/expanse-php-library
        if: ${{ env.SSH_KEY != '' }}
        run: |
          SPLIT_BRANCH="php-library-split"
          git subtree split --prefix=bindings/php -b "${SPLIT_BRANCH}"
          git push -f git@github.com:orieg/expanse-php-library.git "${SPLIT_BRANCH}:main"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            git tag -f "${TAG_NAME}" "${SPLIT_BRANCH}"
            git push -f git@github.com:orieg/expanse-php-library.git "${TAG_NAME}"
          fi
        env:
          SSH_KEY: ${{ secrets.PHP_LIBRARY_SUBSPLIT_SSH_KEY }}


  subsplit-php-extension:
    name: Mirror / crates/expanse-php -> orieg/php-expanse
    runs-on: ubuntu-latest
    steps:
      # A tag push is a publish path: a missing key must fail, never report
      # success having mirrored nothing (AGENTS.md 8.1). On main a missing key
      # is tolerable (forks, unconfigured clones) and only warns.
      - name: Preflight / require the deploy key on tag pushes
        run: |
          if [[ -n "${SSH_KEY}" ]]; then
            echo "PHP_SUBSPLIT_SSH_KEY configured; mirroring the extension."
            exit 0
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "::error::PHP_SUBSPLIT_SSH_KEY is not configured, so ${GITHUB_REF_NAME} cannot be mirrored to orieg/php-expanse. Packagist would keep serving the previous version while the release reported success."
            exit 1
          fi
          echo "::warning::PHP_SUBSPLIT_SSH_KEY not configured; skipping the extension mirror (not a tag push)."
        env:
          SSH_KEY: ${{ secrets.PHP_SUBSPLIT_SSH_KEY }}

      - name: Checkout monorepo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup SSH Deploy Key
        if: ${{ env.SSH_KEY != '' }}
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.PHP_SUBSPLIT_SSH_KEY }}
        env:
          SSH_KEY: ${{ secrets.PHP_SUBSPLIT_SSH_KEY }}

      - name: Configure Git Author
        if: ${{ env.SSH_KEY != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        env:
          SSH_KEY: ${{ secrets.PHP_SUBSPLIT_SSH_KEY }}

      - name: Push crates/expanse-php subtree to orieg/php-expanse
        if: ${{ env.SSH_KEY != '' }}
        run: |
          SPLIT_BRANCH="php-extension-split"
          git subtree split --prefix=crates/expanse-php -b "${SPLIT_BRANCH}"
          git push -f git@github.com:orieg/php-expanse.git "${SPLIT_BRANCH}:main"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            git tag -f "${TAG_NAME}" "${SPLIT_BRANCH}"
            git push -f git@github.com:orieg/php-expanse.git "${TAG_NAME}"
          fi
        env:
          SSH_KEY: ${{ secrets.PHP_SUBSPLIT_SSH_KEY }}


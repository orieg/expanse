name: Subsplit Mirror (PHP)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'bindings/php/**'
      - '.github/workflows/subsplit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  subsplit-php:
    name: Mirror / bindings/php -> orieg/php-expanse
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH Deploy Key
        if: ${{ env.SSH_KEY != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PHP_SUBSPLIT_SSH_KEY }}
        env:
          SSH_KEY: ${{ secrets.PHP_SUBSPLIT_SSH_KEY }}

      - name: Configure Git Author
        if: ${{ env.SSH_KEY != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
        env:
          SSH_KEY: ${{ secrets.PHP_SUBSPLIT_SSH_KEY }}

      - name: Push bindings/php subtree to orieg/php-expanse
        if: ${{ env.SSH_KEY != '' }}
        run: |
          SPLIT_BRANCH="php-split"
          git subtree split --prefix=bindings/php -b "${SPLIT_BRANCH}"
          git push -f git@github.com:orieg/php-expanse.git "${SPLIT_BRANCH}:main"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            git tag -f "${TAG_NAME}" "${SPLIT_BRANCH}"
            git push -f git@github.com:orieg/php-expanse.git "${TAG_NAME}"
          fi
        env:
          SSH_KEY: ${{ secrets.PHP_SUBSPLIT_SSH_KEY }}

      - name: Skip notification
        if: ${{ env.SSH_KEY == '' }}
        run: echo "PHP_SUBSPLIT_SSH_KEY secret not configured; skipping external repository mirror."
        env:
          SSH_KEY: ${{ secrets.PHP_SUBSPLIT_SSH_KEY }}

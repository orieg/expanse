name: Subsplit Mirror (PHP)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'bindings/php/**'
      - '.github/workflows/subsplit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  subsplit-php:
    name: Mirror / bindings/php -> orieg/php-expanse
    if: ${{ secrets.SUBSPLIT_ACCESS_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Subsplit bindings/php
        uses: danharrin/monorepo-split-github-action@v2.4.5
        with:
          package_directory: 'bindings/php'
          repository_organization: 'orieg'
          repository_name: 'php-expanse'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          branch: 'main'
          tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.SUBSPLIT_ACCESS_TOKEN }}

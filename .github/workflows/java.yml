name: Java Publish (Maven Central)

# Per-channel recovery for the Java binding, in the shape `python.yml` already
# uses for PyPI. `release.yml` publishes every channel from the tag push; a
# Phase-3 channel that fails is re-run on its own (docs/PACKAGING.md §1,
# "independent recovery"). A tag-triggered run reads its workflow from the tag,
# so a fix landed on main cannot be picked up by re-running that job — this
# workflow is the route that can. It never re-publishes any other channel.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. v0.6.0)'
        type: string
        required: true
      source_run_id:
        description: 'release.yml run id whose native-java-* artifacts to reuse'
        type: string
        required: true
      publish:
        description: 'Publish to Maven Central (false = build and verify only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: java-publish-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish-java:
    name: Package & Publish Java (${{ inputs.release_tag }})
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # attach the jar to the GitHub Release
      actions: read # read the source run's artifacts
    steps:
      - name: Harden the runner (audit egress)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Verify the tag's manifests match the tag
        run: |
          set -euo pipefail
          VERSION="${{ inputs.release_tag }}"
          VERSION="${VERSION#v}"
          python3 scripts/bump_version.py --check "${VERSION}"
          grep -q "<version>${VERSION}</version>" bindings/java/pom.xml \
            || { echo "::error::bindings/java/pom.xml is not at ${VERSION}"; exit 1; }

      - name: Upgrade central publishing plugin if tagged prior to 0.9.0
        run: |
          set -euo pipefail
          # Pre-v0.11.2 tags pinned central-publishing-maven-plugin 0.4.0, which Sonatype
          # Central Portal rejects with "Bundle has content that does NOT have a .pom file" (Refs #1431).
          python3 -c "
          p = 'bindings/java/pom.xml'
          with open(p, 'r', encoding='utf-8') as f:
              content = f.read()
          if '<version>0.4.0</version>' in content:
              content = content.replace('<version>0.4.0</version>', '<version>0.9.0</version>')
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Upgraded central-publishing-maven-plugin from 0.4.0 to 0.9.0')
          "
          grep -q "<version>0.9.0</version>" bindings/java/pom.xml \
            || { echo "::error::central-publishing-maven-plugin is not at 0.9.0"; exit 1; }

      - name: Set up JDK 22
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '22.0.2'
          distribution: 'temurin'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Set up Maven 3.9.16
        run: |
          set -euo pipefail
          # Pin Maven to 3.9.16: runner images starting with 20261004.327.1 pre-install
          # Maven 3.10.0, whose resolver produces maven-metadata-local.xml in the staging
          # directory. central-publishing-maven-plugin does not remove local metadata files,
          # causing Sonatype Central Portal to reject the upload with
          # "Bundle has content that does NOT have a .pom file" (Refs #1431).
          curl -sSL --retry 3 -o /tmp/maven.tar.gz https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz
          python3 -c "import hashlib; assert hashlib.sha512(open('/tmp/maven.tar.gz','rb').read()).hexdigest() == '831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6'"
          tar -xzf /tmp/maven.tar.gz -C /tmp
          rm -f /tmp/maven.tar.gz
          echo "/tmp/apache-maven-3.9.16/bin" >> "${GITHUB_PATH}"
          /tmp/apache-maven-3.9.16/bin/mvn -version | grep -q "Apache Maven 3.9.16" \
            || { echo "::error::mvn is not 3.9.16"; exit 1; }

      # The natives are the ones the release run already built and shipped; a
      # rebuild here would publish binaries the GitHub Release does not carry.
      - name: Download native libraries from the release run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-java-*
          path: native-java-staging
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage native libraries into resources/native/{classifier}
        run: |
          set -euo pipefail
          base="bindings/java/src/main/resources/native"
          found=0
          for d in native-java-staging/native-java-*; do
            [ -d "$d" ] || continue
            classifier="${d#native-java-staging/native-java-}"
            mkdir -p "${base}/${classifier}"
            cp "$d"/* "${base}/${classifier}/"
            found=$((found + 1))
            echo "Staged ${classifier}: $(ls "${base}/${classifier}")"
          done
          if [ "${found}" -lt 5 ]; then
            echo "::error::Expected 5 native classifiers for Java, found ${found}"; exit 1
          fi

      - name: Package JAR with all native binaries
        run: mvn clean package -f bindings/java/pom.xml -DskipTests

      - name: Publish to Maven Central
        if: ${{ inputs.publish }}
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${MAVEN_CENTRAL_TOKEN:-}" ]; then
            echo "::error::MAVEN_CENTRAL_TOKEN is unset; refusing to report success."
            exit 1
          fi
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            # See release.yml: the plugin's gpg needs loopback pinentry allowed
            # by the agent and asked for on the command line, or it fails with
            # "Inappropriate ioctl for device" on a runner with no TTY.
            mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
            echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
            gpgconf --reload gpg-agent || true
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          fi
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>central</id><username>${MAVEN_CENTRAL_USERNAME}</username><password>${MAVEN_CENTRAL_TOKEN}</password></server></servers></settings>" > ~/.m2/settings.xml
          version=$(grep -m1 '<version>' bindings/java/pom.xml | sed 's/[^0-9.]//g')
          if curl -s -f -o /dev/null "https://repo1.maven.org/maven2/io/github/orieg/expanse-java/${version}/expanse-java-${version}.pom"; then
            echo "expanse-java ${version} already published on Maven Central, skipping"
            exit 0
          fi
          rm -rf bindings/java/target/central-staging bindings/java/target/central-publishing
          mvn deploy -f bindings/java/pom.xml -P release -DskipTests \
            -Dgpg.pinentry-mode=loopback \
            -Dgpg.passphrase="${GPG_PASSPHRASE:-}"

      - name: Attach the jar to the GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ inputs.release_tag }}" \
            bindings/java/target/*.jar --clobber --repo "${{ github.repository }}"

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  # The hashed tool requirements the workflows install (docs/CI.md 12.4).
  # Dependabot edits the .in pins and recompiles the .txt beside them.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      python-tools:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

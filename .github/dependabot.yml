version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # discipline.toml's header requires re-running `scripts/discipline_replay.py
      # --last 100` before advancing the pinned release; v0.19.0's unmemoized
      # `ParsedFileFacts::tracked_helper` also times out on `crates/expanse/src/sync.rs`.
      - dependency-name: "orieg/discipline"
    commit-message:
      prefix: "chore(ci)"

  # The hashed tool requirements the workflows install (docs/CI.md 12.4).
  # Dependabot edits the .in pins and recompiles the .txt beside them. This
  # entry covers the files for Python 3.10 and newer; pytest moves freely
  # within what Python 3.10 supports (scripts/check_release_workflow.py checks
  # the pin against that floor).
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      python-tools:
        patterns:
          - "*"
    ignore:
      # The wasm fuel instrument's runtime: fuel counts follow the wasmtime
      # version, and scripts/wasm_fuel.py --self-test compares this pin with
      # the committed baseline. It moves only with a re-baseline, by hand.
      - dependency-name: "wasmtime"
    commit-message:
      prefix: "chore(ci)"

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  # The hashed tool requirements the workflows install (docs/CI.md 12.4).
  # Dependabot edits the .in pins and recompiles the .txt beside them. This
  # entry covers the files for Python 3.10 and newer; pytest moves freely
  # within what Python 3.10 supports (scripts/check_release_workflow.py checks
  # the pin against that floor).
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      python-tools:
        patterns:
          - "*"
    ignore:
      # The wasm fuel instrument's runtime: fuel counts follow the wasmtime
      # version, and scripts/wasm_fuel.py --self-test compares this pin with
      # the committed baseline. It moves only with a re-baseline, by hand.
      - dependency-name: "wasmtime"
    commit-message:
      prefix: "chore(ci)"

  # The Python 3.8 row of python.yml has its own pinned set in a directory of
  # its own, because ignore rules apply per dependency name across a whole
  # directory and the main set above must be free to take new pytest releases.
  # pytest 8.4 and later and typing-extensions 4.14 and later require Python
  # 3.9+, so those versions are held back here. This entry goes away with the
  # 3.8 row.
  - package-ecosystem: "pip"
    directory: "/.github/requirements/py38"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      python-tools-py38:
        patterns:
          - "*"
    ignore:
      - dependency-name: "pytest"
        versions: [">=8.4"]
      - dependency-name: "typing-extensions"
        versions: [">=4.14"]
    commit-message:
      prefix: "chore(ci)"

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  # The hashed tool requirements the workflows install (docs/CI.md 12.4).
  # Dependabot edits the .in pins and recompiles the .txt beside them.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      python-tools:
        patterns:
          - "*"
    ignore:
      # pytest 9 does not support Python 3.8, which python.yml still tests
      # (its matrix); python-bindings.txt is compiled on 3.8 and installed
      # with --require-hashes on 3.8, 3.10 and 3.12. Lift this with the 3.8 row.
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]
      # The wasm fuel instrument's runtime: fuel counts follow the wasmtime
      # version, and scripts/wasm_fuel.py --self-test compares this pin with
      # the committed baseline. It moves only with a re-baseline, by hand.
      - dependency-name: "wasmtime"
    commit-message:
      prefix: "chore(ci)"

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  # The hashed tool requirements the workflows install (docs/CI.md 12.4).
  # Dependabot edits the .in pins and recompiles the .txt beside them.
  - package-ecosystem: "pip"
    directory: "/.github/requirements"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      python-tools:
        patterns:
          - "*"
    ignore:
      # python-bindings.txt is installed with --require-hashes on every Python
      # in python.yml's matrix, the oldest being 3.8. pytest 8.4 and later and
      # typing-extensions 4.14 and later require Python 3.9+, so those
      # versions are held back. The bounds move when 3.8 leaves the matrix.
      - dependency-name: "pytest"
        versions: [">=8.4"]
      - dependency-name: "typing-extensions"
        versions: [">=4.14"]
      # The wasm fuel instrument's runtime: fuel counts follow the wasmtime
      # version, and scripts/wasm_fuel.py --self-test compares this pin with
      # the committed baseline. It moves only with a re-baseline, by hand.
      - dependency-name: "wasmtime"
    commit-message:
      prefix: "chore(ci)"

    <rect x="215" y="264" width="143.3" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="362.3" y="273" class="t-axis-label">10,506 (52,433 ns)</text>
    <text x="207" y="312" class="t-legend" text-anchor="end">evict 25 of 2,000 / remove_range</text>
    <rect x="215" y="290" width="17.5" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="236.5" y="299" class="t-axis-label">1,284 (3,210 ns)</text>
    <rect x="215" y="303" width="26.8" height="11" rx="1" style="fill:#93c5fd"/>

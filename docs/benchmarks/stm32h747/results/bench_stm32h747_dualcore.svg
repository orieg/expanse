    <text x="207" y="52" class="t-legend" text-anchor="end">ingest 2,000 keys / insert</text>
    <rect x="215" y="30" width="12.3" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="231.3" y="39" class="t-axis-label">820 (2,047 ns)</text>
    <rect x="215" y="43" width="22.8" height="11" rx="1" style="fill:#93c5fd"/>
    <text x="241.8" y="52" class="t-axis-label">1,518 (3,790 ns)</text>
    <rect x="215" y="56" width="44.5" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="263.5" y="65" class="t-axis-label">2,964 (14,804 ns)</text>
    <text x="207" y="104" class="t-legend" text-anchor="end">CAN dispatch / get</text>
    <rect x="215" y="82" width="4.2" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="223.2" y="91" class="t-axis-label">282 (703 ns)</text>
    <rect x="215" y="95" width="7.5" height="11" rx="1" style="fill:#93c5fd"/>
    <text x="226.5" y="104" class="t-axis-label">500 (1,248 ns)</text>
    <rect x="215" y="108" width="18.6" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="237.6" y="117" class="t-axis-label">1,237 (6,177 ns)</text>
    <text x="207" y="156" class="t-legend" text-anchor="end">evict 600 of 2,000 / per-key loop</text>
    <rect x="215" y="134" width="39.5" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="258.5" y="143" class="t-axis-label">2,634 (6,577 ns)</text>
    <rect x="215" y="147" width="68.9" height="11" rx="1" style="fill:#93c5fd"/>
    <text x="287.9" y="156" class="t-axis-label">4,596 (11,476 ns)</text>
    <rect x="215" y="160" width="145.7" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="364.7" y="169" class="t-axis-label">9,712 (48,502 ns)</text>
    <text x="207" y="208" class="t-legend" text-anchor="end">evict 600 of 2,000 / remove_range</text>
    <rect x="215" y="186" width="12.7" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="231.7" y="195" class="t-axis-label">847 (2,115 ns)</text>
    <rect x="215" y="199" width="22.4" height="11" rx="1" style="fill:#93c5fd"/>
    <text x="241.4" y="208" class="t-axis-label">1,493 (3,728 ns)</text>
    <rect x="215" y="212" width="48.2" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="267.2" y="221" class="t-axis-label">3,213 (16,047 ns)</text>
    <text x="207" y="260" class="t-legend" text-anchor="end">evict 25 of 2,000 / per-key loop</text>
    <rect x="215" y="238" width="41.5" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="260.5" y="247" class="t-axis-label">2,764 (6,901 ns)</text>
    <rect x="215" y="251" width="70.3" height="11" rx="1" style="fill:#93c5fd"/>

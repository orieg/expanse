    <text x="207" y="52" class="t-legend" text-anchor="end">ingest 2,000 keys / insert</text>
    <rect x="215" y="30" width="10.2" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="229.2" y="39" class="t-axis-label">745 (1,863 ns)</text>
    <rect x="215" y="43" width="19.6" height="11" rx="1" style="fill:#93c5fd"/>
    <text x="238.6" y="52" class="t-axis-label">1,438 (3,595 ns)</text>
    <rect x="215" y="56" width="41.4" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="260.4" y="65" class="t-axis-label">3,037 (15,159 ns)</text>
    <text x="207" y="104" class="t-legend" text-anchor="end">CAN dispatch / get</text>
    <rect x="215" y="82" width="3.4" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="222.4" y="91" class="t-axis-label">252 (630 ns)</text>
    <rect x="215" y="95" width="5.9" height="11" rx="1" style="fill:#93c5fd"/>
    <text x="224.9" y="104" class="t-axis-label">434 (1,085 ns)</text>
    <rect x="215" y="108" width="16.8" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="235.8" y="117" class="t-axis-label">1,231 (6,143 ns)</text>
    <text x="207" y="156" class="t-legend" text-anchor="end">evict 600 of 2,000 / per-key loop</text>
    <rect x="215" y="134" width="40.0" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="259.0" y="143" class="t-axis-label">2,933 (7,334 ns)</text>
    <rect x="215" y="147" width="66.6" height="11" rx="1" style="fill:#93c5fd"/>
    <text x="285.6" y="156" class="t-axis-label">4,887 (12,217 ns)</text>
    <rect x="215" y="160" width="146.8" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="365.8" y="169" class="t-axis-label">10,764 (53,719 ns)</text>
    <text x="207" y="208" class="t-legend" text-anchor="end">evict 600 of 2,000 / remove_range</text>
    <rect x="215" y="186" width="14.6" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="233.6" y="195" class="t-axis-label">1,070 (2,676 ns)</text>
    <rect x="215" y="199" width="23.4" height="11" rx="1" style="fill:#93c5fd"/>
    <text x="242.4" y="208" class="t-axis-label">1,716 (4,291 ns)</text>
    <rect x="215" y="212" width="52.3" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="271.3" y="221" class="t-axis-label">3,837 (19,148 ns)</text>
    <text x="207" y="260" class="t-legend" text-anchor="end">evict 25 of 2,000 / per-key loop</text>
    <rect x="215" y="238" width="41.0" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="260.0" y="247" class="t-axis-label">3,005 (7,512 ns)</text>
    <rect x="215" y="251" width="66.7" height="11" rx="1" style="fill:#93c5fd"/>

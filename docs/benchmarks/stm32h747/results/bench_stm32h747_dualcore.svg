  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>
  <text x="20" y="26" class="t-title">The other core: cacheless Cortex-M4 point, and the M7-writer / M4-reader cells</text>

    <rect x="215" y="264" width="137.5" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="356.5" y="273" class="t-axis-label">9,168 (45,784 ns)</text>
    <text x="207" y="312" class="t-legend" text-anchor="end">evict 25 of 2,000 / remove_range</text>
    <rect x="215" y="290" width="14.5" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="233.5" y="299" class="t-axis-label">970 (2,421 ns)</text>
    <rect x="215" y="303" width="24.7" height="11" rx="1" style="fill:#93c5fd"/>

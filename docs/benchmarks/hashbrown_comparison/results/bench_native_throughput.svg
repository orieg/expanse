<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 290" width="100%" height="100%">
  <title>Native Criterion Benchmarks</title>
  <defs>
    <style>
      /* Light theme (default) */
      .bg { fill: #ffffff; }
      .border { stroke: #e2e8f0; stroke-width: 1px; fill: none; }
      .grid { stroke: #f1f5f9; stroke-width: 1px; stroke-dasharray: 2,3; }
      .axis { stroke: #cbd5e1; stroke-width: 1.5px; }
      .divider { stroke: #e2e8f0; stroke-width: 1px; }
      
      .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; fill: #0f172a; text-transform: uppercase; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #475569; }
      .t-unit { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .t-axis-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 500; fill: #64748b; }
      .t-bar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .t-legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #0f172a; }
      
      .t-val-accent { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #15803d; }
      .t-val-blue { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #2563eb; }
      .t-val-muted { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #475569; }
      .t-val-warn { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #b91c1c; }

      .t-win { fill: #15803d; font-weight: 600; }
      .t-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 500; fill: #64748b; }

      .b-expanse { fill: #16a34a; }
      .b-hashbrown { fill: #2563eb; }
      .b-btree { fill: #64748b; }
      .b-disqualified { fill: #ef4444; stroke: #b91c1c; stroke-width: 1px; stroke-dasharray: 2,2; fill-opacity: 0.15; }

      .badge-win { fill: #dcfce7; stroke: #86efac; stroke-width: 1px; rx: 3px; }
      .badge-win-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #15803d; text-anchor: middle; }

      .badge-disq { fill: #fee2e2; stroke: #fca5a5; stroke-width: 1px; rx: 3px; }
      .badge-disq-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #991b1b; text-anchor: middle; }

      /* Dark theme overrides */
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .border { stroke: #30363d; }
        .grid { stroke: #21262d; }
        .axis { stroke: #484f58; }
        .divider { stroke: #21262d; }
        .t-title { fill: #f0f6fc; }
        .t-sub { fill: #94a3b8; }
        .t-unit { fill: #94a3b8; }
        .t-axis-label { fill: #94a3b8; }
        .t-bar-label { fill: #f8fafc; }
        .t-legend { fill: #f8fafc; }
        .t-val-accent { fill: #4ade80; }
        .t-val-blue { fill: #38bdf8; }
        .t-val-muted { fill: #cbd5e1; }
        .t-val-warn { fill: #f87171; }
        .t-win { fill: #4ade80; }
        .t-note { fill: #94a3b8; }
        .b-expanse { fill: #22c55e; }
        .b-hashbrown { fill: #3b82f6; }
        .b-btree { fill: #475569; }
        .b-disqualified { fill: #ef4444; stroke: #f87171; fill-opacity: 0.25; }
        .badge-win { fill: #064e3b; stroke: #059669; }
        .badge-win-text { fill: #6ee7b7; }
        .badge-disq { fill: #450a0a; stroke: #dc2626; }
        .badge-disq-text { fill: #fca5a5; }
      }

      :root[data-theme="dark"] .bg, [data-theme="dark"] .bg { fill: #0d1117; }
      :root[data-theme="dark"] .border, [data-theme="dark"] .border { stroke: #30363d; }
      :root[data-theme="dark"] .grid, [data-theme="dark"] .grid { stroke: #21262d; }
      :root[data-theme="dark"] .axis, [data-theme="dark"] .axis { stroke: #484f58; }
      :root[data-theme="dark"] .divider, [data-theme="dark"] .divider { stroke: #21262d; }
      :root[data-theme="dark"] .t-title, [data-theme="dark"] .t-title { fill: #f0f6fc; }
      :root[data-theme="dark"] .t-sub, [data-theme="dark"] .t-sub { fill: #94a3b8; }
      :root[data-theme="dark"] .t-unit, [data-theme="dark"] .t-unit { fill: #94a3b8; }
      :root[data-theme="dark"] .t-axis-label, [data-theme="dark"] .t-axis-label { fill: #94a3b8; }
      :root[data-theme="dark"] .t-bar-label, [data-theme="dark"] .t-bar-label { fill: #f8fafc; }
      :root[data-theme="dark"] .t-legend, [data-theme="dark"] .t-legend { fill: #f8fafc; }
      :root[data-theme="dark"] .t-val-accent, [data-theme="dark"] .t-val-accent { fill: #4ade80; }
      :root[data-theme="dark"] .t-val-blue, [data-theme="dark"] .t-val-blue { fill: #38bdf8; }
      :root[data-theme="dark"] .t-val-muted, [data-theme="dark"] .t-val-muted { fill: #cbd5e1; }
      :root[data-theme="dark"] .t-val-warn, [data-theme="dark"] .t-val-warn { fill: #f87171; }
      :root[data-theme="dark"] .t-win, [data-theme="dark"] .t-win { fill: #4ade80; }
      :root[data-theme="dark"] .t-note, [data-theme="dark"] .t-note { fill: #94a3b8; }
      :root[data-theme="dark"] .b-expanse, [data-theme="dark"] .b-expanse { fill: #22c55e; }
      :root[data-theme="dark"] .b-hashbrown, [data-theme="dark"] .b-hashbrown { fill: #3b82f6; }
      :root[data-theme="dark"] .b-btree, [data-theme="dark"] .b-btree { fill: #475569; }
      :root[data-theme="dark"] .b-disqualified, [data-theme="dark"] .b-disqualified { fill: #ef4444; stroke: #f87171; fill-opacity: 0.25; }
      :root[data-theme="dark"] .badge-win, [data-theme="dark"] .badge-win { fill: #064e3b; stroke: #059669; }
      :root[data-theme="dark"] .badge-win-text, [data-theme="dark"] .badge-win-text { fill: #6ee7b7; }
      :root[data-theme="dark"] .badge-disq, [data-theme="dark"] .badge-disq { fill: #450a0a; stroke: #dc2626; }
      :root[data-theme="dark"] .badge-disq-text, [data-theme="dark"] .badge-disq-text { fill: #fca5a5; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <!-- Legend -->
  <g transform="translate(630, 18)">
    <rect x="0" y="0" width="12" height="12" rx="2" class="b-expanse"/>
    <text x="18" y="10" class="t-legend">ExpanseMap</text>
    <rect x="105" y="0" width="12" height="12" rx="2" class="b-hashbrown"/>
    <text x="123" y="10" class="t-legend">hashbrown</text>
    <rect x="210" y="0" width="12" height="12" rx="2" class="b-btree"/>
    <text x="228" y="10" class="t-legend">BTreeMap</text>
  </g>

  <!-- Panel: Point Lookup Hit -->
  <g transform="translate(30, 20)">
    <text x="0" y="0" class="t-title">Point Lookup Hit</text>
    <text x="0" y="13" class="t-sub">100,000 keys random query</text>
    <text x="0" y="27" class="t-unit">&#9650; Throughput (M ops / sec)</text>

    <!-- Grid lines -->
    <line x1="30" y1="45" x2="260" y2="45" class="grid"/>
    <text x="24" y="48" class="t-axis-label" text-anchor="end">50M</text>

    <line x1="30" y1="115" x2="260" y2="115" class="grid"/>
    <text x="24" y="118" class="t-axis-label" text-anchor="end">25M</text>

    <line x1="30" y1="185" x2="260" y2="185" class="axis"/>
    <text x="24" y="188" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="185" class="axis"/>

    <!-- Bar 1: Expanse -->
    <rect x="45" y="175.1" width="55" height="9.9" class="b-expanse" rx="2"/>
    <text x="72.5" y="169.1" class="t-val-accent" text-anchor="middle">3.7M</text>
    <text x="72.5" y="202" class="t-bar-label" text-anchor="middle">Expanse</text>

    <!-- Bar 2: Hashbrown -->
    <rect x="120" y="79.4" width="55" height="105.6" class="b-hashbrown" rx="2"/>
    <text x="147.5" y="73.4" class="t-val-blue" text-anchor="middle">39.1M</text>
    <text x="147.5" y="202" class="t-bar-label" text-anchor="middle">hashbrown</text>

    <!-- Bar 3: BTreeMap -->
    <rect x="195" y="173.5" width="55" height="11.5" class="b-btree" rx="2"/>
    <text x="222.5" y="167.5" class="t-val-muted" text-anchor="middle">4.3M</text>
    <text x="222.5" y="202" class="t-bar-label" text-anchor="middle">BTreeMap</text>
  </g>

  <!-- Panel: Point Lookup Miss -->
  <g transform="translate(345, 20)">
    <text x="0" y="0" class="t-title">Point Lookup Miss</text>
    <text x="0" y="13" class="t-sub">100,000 absent keys query</text>
    <text x="0" y="27" class="t-unit">&#9650; Throughput (M ops / sec)</text>

    <!-- Grid lines -->
    <line x1="30" y1="45" x2="260" y2="45" class="grid"/>
    <text x="24" y="48" class="t-axis-label" text-anchor="end">120M</text>

    <line x1="30" y1="115" x2="260" y2="115" class="grid"/>
    <text x="24" y="118" class="t-axis-label" text-anchor="end">60M</text>

    <line x1="30" y1="185" x2="260" y2="185" class="axis"/>
    <text x="24" y="188" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="185" class="axis"/>

    <!-- Bar 1: Expanse -->
    <rect x="45" y="175.9" width="55" height="9.1" class="b-expanse" rx="2"/>
    <text x="72.5" y="169.9" class="t-val-accent" text-anchor="middle">8.1M</text>
    <text x="72.5" y="202" class="t-bar-label" text-anchor="middle">Expanse</text>

    <!-- Bar 2: Hashbrown -->
    <rect x="120" y="80.2" width="55" height="104.8" class="b-hashbrown" rx="2"/>
    <text x="147.5" y="74.2" class="t-val-blue" text-anchor="middle">93.1M</text>
    <text x="147.5" y="202" class="t-bar-label" text-anchor="middle">hashbrown</text>

    <!-- Bar 3: BTreeMap -->
    <rect x="195" y="181.9" width="55" height="3.1" class="b-btree" rx="2"/>
    <text x="222.5" y="175.9" class="t-val-muted" text-anchor="middle">2.7M</text>
    <text x="222.5" y="202" class="t-bar-label" text-anchor="middle">BTreeMap</text>
  </g>

  <!-- Panel: Dynamic Ingestion -->
  <g transform="translate(660, 20)">
    <text x="0" y="0" class="t-title">Dynamic Ingestion</text>
    <text x="0" y="13" class="t-sub">Growth 0 -&gt; 100k keys</text>
    <text x="0" y="27" class="t-unit">&#9650; Throughput (M ops / sec)</text>

    <!-- Grid lines -->
    <line x1="30" y1="45" x2="260" y2="45" class="grid"/>
    <text x="24" y="48" class="t-axis-label" text-anchor="end">40M</text>

    <line x1="30" y1="115" x2="260" y2="115" class="grid"/>
    <text x="24" y="118" class="t-axis-label" text-anchor="end">20M</text>

    <line x1="30" y1="185" x2="260" y2="185" class="axis"/>
    <text x="24" y="188" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="185" class="axis"/>

    <!-- Bar 1: Expanse -->
    <rect x="45" y="173.6" width="55" height="11.4" class="b-expanse" rx="2"/>
    <text x="72.5" y="167.6" class="t-val-accent" text-anchor="middle">3.4M</text>
    <text x="72.5" y="202" class="t-bar-label" text-anchor="middle">Expanse</text>

    <!-- Bar 2: Hashbrown -->
    <rect x="120" y="100.9" width="55" height="84.1" class="b-hashbrown" rx="2"/>
    <text x="147.5" y="94.9" class="t-val-blue" text-anchor="middle">24.9M</text>
    <text x="147.5" y="202" class="t-bar-label" text-anchor="middle">hashbrown</text>

    <!-- Bar 3: BTreeMap -->
    <rect x="195" y="176.8" width="55" height="8.2" class="b-btree" rx="2"/>
    <text x="222.5" y="170.8" class="t-val-muted" text-anchor="middle">2.4M</text>
    <text x="222.5" y="202" class="t-bar-label" text-anchor="middle">BTreeMap</text>
  </g>

  <line x1="320" y1="20" x2="320" y2="260" class="divider"/>
  <line x1="635" y1="20" x2="635" y2="260" class="divider"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 530" width="100%" height="100%">
  <title>WAND SKIP-SCAN: NANOSECONDS PER next_at_or_after (LOWER IS BETTER)</title>
  <defs>
    <style>
      /* Light theme (default) */
      .bg { fill: #ffffff; }

    <rect x="0" y="0" width="12" height="12" rx="2" class="b-expanse"/>
    <text x="18" y="10" class="t-legend">ExpanseSet</text>
    <rect x="120" y="0" width="12" height="12" rx="2" class="b-roaring"/>
    <text x="138" y="10" class="t-legend">Roaring</text>
  </g>

  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <text x="30" y="30" class="t-title">BOOLEAN AND: INTERSECTION LATENCY (LOG SCALE, LOWER IS BETTER)</text>
  <text x="30" y="46" class="t-sub">Cardinality of A ∩ B • top size N=10,000,000 per list • ExpanseSet native kernel #339 (intersection_len) vs Roaring (intersection_len)</text>

<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1000 586" width="100%" height="100%">
  <title>Traversal and prefix scan · Expanse vs radix tries</title>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { stroke: #e2e8f0; stroke-width: 1px; fill: none; }
      .grid { stroke: #f1f5f9; stroke-width: 1px; stroke-dasharray: 2,3; }
      .axis { stroke: #cbd5e1; stroke-width: 1.5px; }
      .divider { stroke: #e2e8f0; stroke-width: 1px; }

      .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; fill: #0f172a; text-transform: uppercase; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #475569; }
      .t-unit { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .t-axis-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 500; fill: #64748b; }
      .t-bar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .t-legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #0f172a; }

      .t-val-accent { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #15803d; }
      .t-val-blue { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #2563eb; }
      .t-val-loss { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #b45309; }
      .t-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 500; fill: #64748b; }

      .b-expanse { fill: #16a34a; }
      .b-art { fill: #2563eb; }
      .b-patricia { fill: #2563eb; }
      .b-radix { fill: #d97706; }
      .b-qp { fill: #7c3aed; }
      .b-btree { fill: #d97706; }
      .b-hashmap { fill: #7c3aed; }

      .badge-win { fill: #dcfce7; stroke: #86efac; stroke-width: 1px; }
      .badge-win-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #15803d; text-anchor: middle; }
      .badge-loss { fill: #fef3c7; stroke: #fcd34d; stroke-width: 1px; }
      .badge-loss-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #b45309; text-anchor: middle; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .border { stroke: #30363d; }
        .grid { stroke: #21262d; }
        .axis { stroke: #484f58; }
        .divider { stroke: #21262d; }
        .t-title { fill: #f0f6fc; }
        .t-sub { fill: #94a3b8; }
        .t-unit { fill: #94a3b8; }
        .t-axis-label { fill: #94a3b8; }
        .t-bar-label { fill: #f8fafc; }
        .t-legend { fill: #f8fafc; }
        .t-val-accent { fill: #4ade80; }
        .t-val-blue { fill: #38bdf8; }
        .t-note { fill: #94a3b8; }
        .t-val-loss { fill: #fbbf24; }
        .b-expanse { fill: #22c55e; }
        .b-art { fill: #3b82f6; }
        .b-patricia { fill: #3b82f6; }
        .b-radix { fill: #f59e0b; }
        .b-qp { fill: #a855f7; }
        .b-btree { fill: #f59e0b; }
        .b-hashmap { fill: #a855f7; }
        .badge-win { fill: #052e16; stroke: #166534; }
        .badge-win-text { fill: #4ade80; }
        .badge-loss { fill: #451a03; stroke: #92400e; }
        .badge-loss-text { fill: #fbbf24; }
      }

      :root[data-theme="dark"] .bg, [data-theme="dark"] .bg { fill: #0d1117; }
      :root[data-theme="dark"] .border, [data-theme="dark"] .border { stroke: #30363d; }
      :root[data-theme="dark"] .grid, [data-theme="dark"] .grid { stroke: #21262d; }
      :root[data-theme="dark"] .axis, [data-theme="dark"] .axis { stroke: #484f58; }
      :root[data-theme="dark"] .divider, [data-theme="dark"] .divider { stroke: #21262d; }
      :root[data-theme="dark"] .t-title, [data-theme="dark"] .t-title { fill: #f0f6fc; }
      :root[data-theme="dark"] .t-sub, [data-theme="dark"] .t-sub { fill: #94a3b8; }
      :root[data-theme="dark"] .t-unit, [data-theme="dark"] .t-unit { fill: #94a3b8; }
      :root[data-theme="dark"] .t-axis-label, [data-theme="dark"] .t-axis-label { fill: #94a3b8; }
      :root[data-theme="dark"] .t-bar-label, [data-theme="dark"] .t-bar-label { fill: #f8fafc; }
      :root[data-theme="dark"] .t-legend, [data-theme="dark"] .t-legend { fill: #f8fafc; }
      :root[data-theme="dark"] .t-val-accent, [data-theme="dark"] .t-val-accent { fill: #4ade80; }
      :root[data-theme="dark"] .t-val-blue, [data-theme="dark"] .t-val-blue { fill: #38bdf8; }
      :root[data-theme="dark"] .t-note, [data-theme="dark"] .t-note { fill: #94a3b8; }
      :root[data-theme="dark"] .t-val-loss, [data-theme="dark"] .t-val-loss { fill: #fbbf24; }
      :root[data-theme="dark"] .b-expanse, [data-theme="dark"] .b-expanse { fill: #22c55e; }
      :root[data-theme="dark"] .b-art, [data-theme="dark"] .b-art { fill: #3b82f6; }
      :root[data-theme="dark"] .b-patricia, [data-theme="dark"] .b-patricia { fill: #3b82f6; }
      :root[data-theme="dark"] .b-radix, [data-theme="dark"] .b-radix { fill: #f59e0b; }
      :root[data-theme="dark"] .b-qp, [data-theme="dark"] .b-qp { fill: #a855f7; }
      :root[data-theme="dark"] .b-btree, [data-theme="dark"] .b-btree { fill: #f59e0b; }
      :root[data-theme="dark"] .b-hashmap, [data-theme="dark"] .b-hashmap { fill: #a855f7; }
      :root[data-theme="dark"] .badge-win, [data-theme="dark"] .badge-win { fill: #052e16; stroke: #166534; }
      :root[data-theme="dark"] .badge-win-text, [data-theme="dark"] .badge-win-text { fill: #4ade80; }
      :root[data-theme="dark"] .badge-loss, [data-theme="dark"] .badge-loss { fill: #451a03; stroke: #92400e; }
      :root[data-theme="dark"] .badge-loss-text, [data-theme="dark"] .badge-loss-text { fill: #fbbf24; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="6" />
  <rect width="100%" height="100%" class="border" rx="6" />

  <text x="24" y="30" class="t-title">Traversal and prefix scan · Expanse vs radix tries</text>
  <text x="24" y="46" class="t-sub">full traversal: n = 1,000,000 u64 draws, generator order · prefix scan: 64 prefixes of 35-byte-prefixed paths · workload: patricia_scan</text>
  <text x="24" y="61" class="t-note">Log scale: each gridline is a factor of 10. Left of 1 = Expanse faster, right = slower. Whiskers: BCa 95% interval.</text>
  <text x="24" y="75" class="t-note">fast_radix_trie not drawn on 5 of 7 rows (failed validation, e.g. cannot hold the key set).</text>
  <rect x="200" y="84" width="10" height="10" rx="2" class="b-patricia"/><text x="214" y="93" class="t-legend">vs patricia_tree</text>
  <rect x="350" y="84" width="10" height="10" rx="2" class="b-radix"/><text x="364" y="93" class="t-legend">vs fast_radix_trie</text>
  <rect x="500" y="84" width="10" height="10" rx="2" class="b-qp"/><text x="514" y="93" class="t-legend">vs qp-trie</text>
  <line x1="200.0" y1="104" x2="200.0" y2="556" class="grid"/>
  <text x="200.0" y="570" class="t-axis-label" text-anchor="middle">100× faster</text>
  <line x1="400.0" y1="104" x2="400.0" y2="556" class="grid"/>
  <text x="400.0" y="570" class="t-axis-label" text-anchor="middle">10× faster</text>
  <line x1="600.0" y1="104" x2="600.0" y2="556" class="axis"/>
  <text x="600.0" y="570" class="t-axis-label" text-anchor="middle">1</text>
  <line x1="800.0" y1="104" x2="800.0" y2="556" class="grid"/>
  <text x="800.0" y="570" class="t-axis-label" text-anchor="middle">10× slower</text>
  <text x="24" y="120" class="t-bar-label">full traversal · sequential</text>
  <text x="34" y="136" class="t-axis-label">patricia_tree</text>
  <rect x="449.1" y="128" width="150.9" height="10" rx="1.5" class="b-patricia"/>
  <line x1="448.7" y1="132.5" x2="449.3" y2="132.5" class="axis"/>
  <text x="990" y="136" class="t-val-accent" text-anchor="end">5.68× faster</text>
  <text x="34" y="151" class="t-axis-label">qp-trie</text>
  <rect x="568.4" y="143" width="31.6" height="10" rx="1.5" class="b-qp"/>
  <line x1="567.6" y1="147.5" x2="568.8" y2="147.5" class="axis"/>
  <text x="990" y="151" class="t-val-accent" text-anchor="end">1.44× faster</text>
  <text x="24" y="178" class="t-bar-label">full traversal · clustered</text>
  <text x="34" y="194" class="t-axis-label">patricia_tree</text>
  <rect x="451.5" y="186" width="148.5" height="10" rx="1.5" class="b-patricia"/>
  <line x1="451.0" y1="190.5" x2="451.9" y2="190.5" class="axis"/>
  <text x="990" y="194" class="t-val-accent" text-anchor="end">5.53× faster</text>
  <text x="34" y="209" class="t-axis-label">qp-trie</text>
  <rect x="568.8" y="201" width="31.2" height="10" rx="1.5" class="b-qp"/>
  <line x1="568.1" y1="205.5" x2="569.6" y2="205.5" class="axis"/>
  <text x="990" y="209" class="t-val-accent" text-anchor="end">1.43× faster</text>
  <text x="24" y="236" class="t-bar-label">full traversal · uniform_random</text>
  <text x="34" y="252" class="t-axis-label">patricia_tree</text>
  <rect x="352.7" y="244" width="247.3" height="10" rx="1.5" class="b-patricia"/>
  <line x1="351.9" y1="248.5" x2="353.7" y2="248.5" class="axis"/>
  <text x="990" y="252" class="t-val-accent" text-anchor="end">17.2× faster</text>
  <text x="34" y="267" class="t-axis-label">qp-trie</text>
  <rect x="474.7" y="259" width="125.3" height="10" rx="1.5" class="b-qp"/>
  <line x1="474.5" y1="263.5" x2="474.9" y2="263.5" class="axis"/>
  <text x="990" y="267" class="t-val-accent" text-anchor="end">4.23× faster</text>
  <text x="24" y="294" class="t-bar-label">full traversal · sparse_stride</text>
  <text x="34" y="310" class="t-axis-label">patricia_tree</text>
  <rect x="551.6" y="302" width="48.4" height="10" rx="1.5" class="b-patricia"/>
  <line x1="551.2" y1="306.5" x2="551.8" y2="306.5" class="axis"/>
  <text x="990" y="310" class="t-val-accent" text-anchor="end">1.75× faster</text>
  <text x="34" y="325" class="t-axis-label">qp-trie</text>
  <rect x="600.0" y="317" width="70.0" height="10" rx="1.5" class="b-qp"/>
  <line x1="669.7" y1="321.5" x2="670.4" y2="321.5" class="axis"/>
  <text x="990" y="325" class="t-val-loss" text-anchor="end">2.24× slower</text>
  <text x="24" y="352" class="t-bar-label">full traversal · zipfian</text>
  <text x="34" y="368" class="t-axis-label">patricia_tree</text>
  <rect x="396.5" y="360" width="203.5" height="10" rx="1.5" class="b-patricia"/>
  <line x1="396.0" y1="364.5" x2="397.0" y2="364.5" class="axis"/>
  <text x="990" y="368" class="t-val-accent" text-anchor="end">10.4× faster</text>
  <text x="34" y="383" class="t-axis-label">qp-trie</text>
  <rect x="548.0" y="375" width="52.0" height="10" rx="1.5" class="b-qp"/>
  <line x1="547.5" y1="379.5" x2="548.5" y2="379.5" class="axis"/>
  <text x="990" y="383" class="t-val-accent" text-anchor="end">1.82× faster</text>
  <text x="24" y="410" class="t-bar-label">prefix scan · paths, generator build (n = 1,000,000)</text>
  <text x="34" y="426" class="t-axis-label">patricia_tree</text>
  <rect x="584.1" y="418" width="15.9" height="10" rx="1.5" class="b-patricia"/>
  <line x1="583.8" y1="422.5" x2="584.4" y2="422.5" class="axis"/>
  <text x="990" y="426" class="t-val-accent" text-anchor="end">1.2× faster</text>
  <text x="34" y="441" class="t-axis-label">fast_radix_trie</text>
  <rect x="600.0" y="433" width="20.5" height="10" rx="1.5" class="b-radix"/>
  <line x1="620.2" y1="437.5" x2="620.8" y2="437.5" class="axis"/>
  <text x="990" y="441" class="t-val-loss" text-anchor="end">1.27× slower</text>
  <text x="34" y="456" class="t-axis-label">qp-trie</text>
  <rect x="600.0" y="448" width="78.6" height="10" rx="1.5" class="b-qp"/>
  <line x1="678.3" y1="452.5" x2="678.9" y2="452.5" class="axis"/>
  <text x="990" y="456" class="t-val-loss" text-anchor="end">2.47× slower</text>
  <text x="24" y="483" class="t-bar-label">prefix scan · paths, sorted build (n = 1,000,000)</text>
  <text x="34" y="499" class="t-axis-label">patricia_tree</text>
  <rect x="600.0" y="491" width="24.7" height="10" rx="1.5" class="b-patricia"/>
  <line x1="624.6" y1="495.5" x2="624.9" y2="495.5" class="axis"/>
  <text x="990" y="499" class="t-val-loss" text-anchor="end">1.33× slower</text>
  <text x="34" y="514" class="t-axis-label">fast_radix_trie</text>
  <rect x="600.0" y="506" width="32.2" height="10" rx="1.5" class="b-radix"/>
  <line x1="631.9" y1="510.5" x2="632.5" y2="510.5" class="axis"/>
  <text x="990" y="514" class="t-val-loss" text-anchor="end">1.45× slower</text>
  <text x="34" y="529" class="t-axis-label">qp-trie</text>
  <rect x="600.0" y="521" width="45.6" height="10" rx="1.5" class="b-qp"/>
  <line x1="645.2" y1="525.5" x2="646.0" y2="525.5" class="axis"/>
  <text x="990" y="529" class="t-val-loss" text-anchor="end">1.69× slower</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1000 400" width="100%" height="100%">
  <title>String lookup vs shared-prefix length</title>
  <defs>
    <style>
      .bg { fill: #ffffff; }

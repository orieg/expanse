  <text x="800.0" y="574" class="t-axis-label" text-anchor="middle">1</text>
  <text x="24" y="120" class="t-bar-label">sequential</text>
  <text x="34" y="136" class="t-axis-label">generator · patricia_tree</text>
  <rect x="311.9" y="128" width="488.1" height="10" rx="1.5" class="b-patricia"/>
  <line x1="311.8" y1="132.5" x2="312.1" y2="132.5" class="axis"/>
  <text x="990" y="136" class="t-val-accent" text-anchor="end">276× faster</text>
  <text x="34" y="151" class="t-axis-label">generator · qp-trie</text>

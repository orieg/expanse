  <text x="24" y="30" class="t-title">Live heap per key · shared-prefix string keys</text>
  <text x="24" y="46" class="t-sub">n = 1,000,000, requested bytes per key, exact allocator counts, both build orders · lower is better · workload: patricia_memory</text>
  <text x="24" y="61" class="t-note">Linear scale from 0 to the largest cell. Usable bytes are in the tables; neither includes the allocator's per-chunk header.</text>

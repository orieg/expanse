<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 420" width="100%" height="100%">
  <title>Memory across expanse occupancy — Expanse vs Masstree</title>
  <defs>
    <style>
      .bg { fill: #ffffff; }

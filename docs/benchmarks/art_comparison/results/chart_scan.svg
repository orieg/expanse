<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 480" width="100%" height="100%">
  <title>Ordered Scan &amp; In-Order Iteration Latency</title>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { stroke: #e2e8f0; stroke-width: 1px; fill: none; }
      .grid { stroke: #f1f5f9; stroke-width: 1px; stroke-dasharray: 2,3; }
      .axis { stroke: #cbd5e1; stroke-width: 1.5px; }
      .divider { stroke: #e2e8f0; stroke-width: 1px; }

      .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; fill: #0f172a; text-transform: uppercase; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #475569; }
      .t-unit { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .t-axis-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 500; fill: #64748b; }
      .t-bar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .t-legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #0f172a; }

      .t-val-accent { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #15803d; }
      .t-val-blue { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #2563eb; }
      .t-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 500; fill: #64748b; }

      .b-expanse { fill: #16a34a; }
      .b-art { fill: #2563eb; }
      .b-btree { fill: #d97706; }
      .b-hashmap { fill: #7c3aed; }

      .badge-win { fill: #dcfce7; stroke: #86efac; stroke-width: 1px; }
      .badge-win-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #15803d; text-anchor: middle; }
      .badge-loss { fill: #fef3c7; stroke: #fcd34d; stroke-width: 1px; }
      .badge-loss-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 700; fill: #b45309; text-anchor: middle; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .border { stroke: #30363d; }
        .grid { stroke: #21262d; }
        .axis { stroke: #484f58; }
        .divider { stroke: #21262d; }
        .t-title { fill: #f0f6fc; }
        .t-sub { fill: #94a3b8; }
        .t-unit { fill: #94a3b8; }
        .t-axis-label { fill: #94a3b8; }
        .t-bar-label { fill: #f8fafc; }
        .t-legend { fill: #f8fafc; }
        .t-val-accent { fill: #4ade80; }
        .t-val-blue { fill: #38bdf8; }
        .t-note { fill: #94a3b8; }
        .b-expanse { fill: #22c55e; }
        .b-art { fill: #3b82f6; }
        .b-btree { fill: #f59e0b; }
        .b-hashmap { fill: #a855f7; }
        .badge-win { fill: #052e16; stroke: #166534; }
        .badge-win-text { fill: #4ade80; }
        .badge-loss { fill: #451a03; stroke: #92400e; }
        .badge-loss-text { fill: #fbbf24; }
      }

      :root[data-theme="dark"] .bg, [data-theme="dark"] .bg { fill: #0d1117; }
      :root[data-theme="dark"] .border, [data-theme="dark"] .border { stroke: #30363d; }
      :root[data-theme="dark"] .grid, [data-theme="dark"] .grid { stroke: #21262d; }
      :root[data-theme="dark"] .axis, [data-theme="dark"] .axis { stroke: #484f58; }
      :root[data-theme="dark"] .divider, [data-theme="dark"] .divider { stroke: #21262d; }
      :root[data-theme="dark"] .t-title, [data-theme="dark"] .t-title { fill: #f0f6fc; }
      :root[data-theme="dark"] .t-sub, [data-theme="dark"] .t-sub { fill: #94a3b8; }
      :root[data-theme="dark"] .t-unit, [data-theme="dark"] .t-unit { fill: #94a3b8; }
      :root[data-theme="dark"] .t-axis-label, [data-theme="dark"] .t-axis-label { fill: #94a3b8; }
      :root[data-theme="dark"] .t-bar-label, [data-theme="dark"] .t-bar-label { fill: #f8fafc; }
      :root[data-theme="dark"] .t-legend, [data-theme="dark"] .t-legend { fill: #f8fafc; }
      :root[data-theme="dark"] .t-val-accent, [data-theme="dark"] .t-val-accent { fill: #4ade80; }
      :root[data-theme="dark"] .t-val-blue, [data-theme="dark"] .t-val-blue { fill: #38bdf8; }
      :root[data-theme="dark"] .t-note, [data-theme="dark"] .t-note { fill: #94a3b8; }
      :root[data-theme="dark"] .b-expanse, [data-theme="dark"] .b-expanse { fill: #22c55e; }
      :root[data-theme="dark"] .b-art, [data-theme="dark"] .b-art { fill: #3b82f6; }
      :root[data-theme="dark"] .b-btree, [data-theme="dark"] .b-btree { fill: #f59e0b; }
      :root[data-theme="dark"] .b-hashmap, [data-theme="dark"] .b-hashmap { fill: #a855f7; }
      :root[data-theme="dark"] .badge-win, [data-theme="dark"] .badge-win { fill: #052e16; stroke: #166534; }
      :root[data-theme="dark"] .badge-win-text, [data-theme="dark"] .badge-win-text { fill: #4ade80; }
      :root[data-theme="dark"] .badge-loss, [data-theme="dark"] .badge-loss { fill: #451a03; stroke: #92400e; }
      :root[data-theme="dark"] .badge-loss-text, [data-theme="dark"] .badge-loss-text { fill: #fbbf24; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="6" />
  <rect width="100%" height="100%" class="border" rx="6" />

  <text x="30" y="34" class="t-title">Ordered Scan &amp; In-Order Iteration Latency</text>
  <text x="30" y="50" class="t-sub">Population N = 1,000,000 &#183; ns / element &#183; lower is better</text>
  <g transform="translate(630, 20)">
    <rect x="0" y="0" width="10" height="10" rx="2" class="b-expanse"/>
    <text x="14" y="9" class="t-legend">ExpanseMap</text>
    <rect x="110" y="0" width="10" height="10" rx="2" class="b-art"/>
    <text x="124" y="9" class="t-legend">blart (ART)</text>
    <rect x="210" y="0" width="10" height="10" rx="2" class="b-btree"/>
    <text x="224" y="9" class="t-legend">BTreeMap</text>
  </g>
  <line x1="30" y1="66" x2="930" y2="66" class="divider"/>
  <text x="30" y="106" class="t-bar-label">Sequential (Full Iter)</text>
  <text x="30" y="120" class="t-sub">Scan all N = 1,000,000 keys in order</text>
  <rect x="260" y="88" width="11.2" height="10" rx="2" class="b-expanse"/>
  <text x="279.2" y="96" class="t-val-accent">3.07</text>
  <rect x="260" y="102" width="21.2" height="10" rx="2" class="b-art"/>
  <text x="289.2" y="110" class="t-val-blue">5.79</text>
  <rect x="260" y="116" width="20.0" height="10" rx="2" class="b-btree"/>
  <text x="288.0" y="124" class="t-axis-label">5.45</text>
  <rect x="800" y="102" width="130" height="20" rx="3" class="badge-win"/>
  <text x="865" y="116" class="badge-win-text">Expanse 1.89x</text>
  <text x="30" y="166" class="t-bar-label">Clustered (Full Iter)</text>
  <text x="30" y="180" class="t-sub">Scan all N = 1,000,000 keys in order</text>
  <rect x="260" y="148" width="11.8" height="10" rx="2" class="b-expanse"/>
  <text x="279.8" y="156" class="t-val-accent">3.22</text>
  <rect x="260" y="162" width="22.1" height="10" rx="2" class="b-art"/>
  <text x="290.1" y="170" class="t-val-blue">6.04</text>
  <rect x="260" y="176" width="20.4" height="10" rx="2" class="b-btree"/>
  <text x="288.4" y="184" class="t-axis-label">5.57</text>
  <rect x="800" y="162" width="130" height="20" rx="3" class="badge-win"/>
  <text x="865" y="176" class="badge-win-text">Expanse 1.88x</text>
  <text x="30" y="226" class="t-bar-label">Uniform Random (Full Iter)</text>
  <text x="30" y="240" class="t-sub">Scan all N = 1,000,000 keys in order</text>
  <rect x="260" y="208" width="20.3" height="10" rx="2" class="b-expanse"/>
  <text x="288.3" y="216" class="t-val-accent">5.54</text>
  <rect x="260" y="222" width="224.0" height="10" rx="2" class="b-art"/>
  <text x="492.0" y="230" class="t-val-blue">61.08</text>
  <rect x="260" y="236" width="42.7" height="10" rx="2" class="b-btree"/>
  <text x="310.7" y="244" class="t-axis-label">11.64</text>
  <rect x="800" y="222" width="130" height="20" rx="3" class="badge-win"/>
  <text x="865" y="236" class="badge-win-text">Expanse 11.02x</text>
  <text x="30" y="286" class="t-bar-label">Sequential (Range k=100)</text>
  <text x="30" y="300" class="t-sub">Bounded range query (100 items)</text>
  <rect x="260" y="268" width="7.7" height="10" rx="2" class="b-expanse"/>
  <text x="275.7" y="276" class="t-val-accent">2.09</text>
  <rect x="260" y="282" width="4.5" height="10" rx="2" class="b-art"/>
  <text x="272.5" y="290" class="t-val-blue">1.23</text>
  <rect x="260" y="296" width="3.9" height="10" rx="2" class="b-btree"/>
  <text x="271.9" y="304" class="t-axis-label">1.05</text>
  <rect x="800" y="282" width="130" height="20" rx="3" class="badge-loss"/>
  <text x="865" y="296" class="badge-loss-text">ART 1.70x</text>
  <text x="30" y="346" class="t-bar-label">Clustered (Range k=100)</text>
  <text x="30" y="360" class="t-sub">Bounded range query (100 items)</text>
  <rect x="260" y="328" width="7.3" height="10" rx="2" class="b-expanse"/>
  <text x="275.3" y="336" class="t-val-accent">2.00</text>
  <rect x="260" y="342" width="4.5" height="10" rx="2" class="b-art"/>
  <text x="272.5" y="350" class="t-val-blue">1.23</text>
  <rect x="260" y="356" width="4.5" height="10" rx="2" class="b-btree"/>
  <text x="272.5" y="364" class="t-axis-label">1.23</text>
  <rect x="800" y="342" width="130" height="20" rx="3" class="badge-loss"/>
  <text x="865" y="356" class="badge-loss-text">ART 1.63x</text>
  <text x="30" y="406" class="t-bar-label">Uniform Random (Range k=100)</text>
  <text x="30" y="420" class="t-sub">Bounded range query (100 items)</text>
  <rect x="260" y="388" width="10.9" height="10" rx="2" class="b-expanse"/>
  <text x="278.9" y="396" class="t-val-accent">2.96</text>
  <rect x="260" y="402" width="10.5" height="10" rx="2" class="b-art"/>
  <text x="278.5" y="410" class="t-val-blue">2.85</text>
  <rect x="260" y="416" width="4.8" height="10" rx="2" class="b-btree"/>
  <text x="272.8" y="424" class="t-axis-label">1.32</text>
  <rect x="800" y="402" width="130" height="20" rx="3" class="badge-loss"/>
  <text x="865" y="416" class="badge-loss-text">ART 1.04x</text>
</svg>

  <text x="492.0" y="268" class="t-axis-label">107.9</text>
  <rect x="260" y="274" width="45.8" height="10" rx="2" class="b-hashmap"/>
  <text x="313.8" y="282" class="t-note">22.1</text>
  <rect x="800" y="248" width="130" height="20" rx="3" class="badge-win"/>
  <text x="865" y="262" class="badge-win-text">Expanse 1.69x</text>
  <text x="30" y="324" class="t-bar-label">Sparse Stride</text>
  <text x="30" y="338" class="t-sub">Dynamic Growth 0 -&gt; 1,000,000</text>
  <rect x="260" y="304" width="65.8" height="10" rx="2" class="b-expanse"/>

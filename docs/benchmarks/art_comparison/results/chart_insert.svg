  <rect x="260" y="332" width="94.9" height="10" rx="2" class="b-btree"/>
  <text x="362.9" y="340" class="t-axis-label">45.7</text>
  <rect x="260" y="346" width="42.0" height="10" rx="2" class="b-hashmap"/>
  <text x="310.0" y="354" class="t-note">20.2</text>
  <rect x="800" y="320" width="130" height="20" rx="3" class="badge-win"/>
  <text x="865" y="334" class="badge-win-text">Expanse 1.76x</text>
</svg>

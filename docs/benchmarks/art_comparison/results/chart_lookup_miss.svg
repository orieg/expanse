  <rect x="260" y="260" width="224.0" height="10" rx="2" class="b-btree"/>
  <text x="492.0" y="268" class="t-axis-label">150.7</text>
  <rect x="260" y="274" width="14.4" height="10" rx="2" class="b-hashmap"/>
  <text x="282.4" y="282" class="t-note">9.7</text>
  <rect x="800" y="248" width="130" height="20" rx="3" class="badge-win"/>
  <text x="865" y="262" class="badge-win-text">Expanse 1.25x</text>
  <text x="30" y="324" class="t-bar-label">Sparse Stride</text>
  <text x="30" y="338" class="t-sub">N = 1,000,000 keys (50% Hit / 50% Miss)</text>
  <rect x="260" y="304" width="18.7" height="10" rx="2" class="b-expanse"/>
  <text x="286.7" y="312" class="t-val-accent">12.6</text>
  <rect x="260" y="318" width="42.4" height="10" rx="2" class="b-art"/>
  <text x="310.4" y="326" class="t-val-blue">28.5</text>
  <rect x="260" y="332" width="118.1" height="10" rx="2" class="b-btree"/>
  <text x="386.1" y="340" class="t-axis-label">79.4</text>
  <rect x="260" y="346" width="13.2" height="10" rx="2" class="b-hashmap"/>
  <text x="281.2" y="354" class="t-note">8.8</text>
  <rect x="800" y="320" width="130" height="20" rx="3" class="badge-win"/>
  <text x="865" y="334" class="badge-win-text">Expanse 2.27x</text>
  <text x="30" y="396" class="t-bar-label">Zipfian</text>
  <text x="30" y="410" class="t-sub">N = 1,000,000 keys (50% Hit / 50% Miss)</text>
  <rect x="260" y="376" width="16.9" height="10" rx="2" class="b-expanse"/>
  <text x="284.9" y="384" class="t-val-accent">11.4</text>
  <rect x="260" y="390" width="24.0" height="10" rx="2" class="b-art"/>
  <text x="292.0" y="398" class="t-val-blue">16.1</text>
  <rect x="260" y="404" width="63.9" height="10" rx="2" class="b-btree"/>
  <text x="331.9" y="412" class="t-axis-label">43.0</text>
  <rect x="260" y="418" width="14.4" height="10" rx="2" class="b-hashmap"/>
  <text x="282.4" y="426" class="t-note">9.7</text>
  <rect x="800" y="392" width="130" height="20" rx="3" class="badge-win"/>

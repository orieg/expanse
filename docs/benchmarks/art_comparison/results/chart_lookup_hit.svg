  <text x="339.9" y="182" class="t-val-blue">51.7</text>
  <rect x="260" y="188" width="223.3" height="10" rx="2" class="b-btree"/>
  <text x="491.3" y="196" class="t-axis-label">160.4</text>
  <rect x="260" y="202" width="11.9" height="10" rx="2" class="b-hashmap"/>
  <text x="279.9" y="210" class="t-note">8.5</text>
  <rect x="800" y="176" width="130" height="20" rx="3" class="badge-win"/>
  <text x="865" y="190" class="badge-win-text">Expanse 1.95x</text>
  <text x="30" y="252" class="t-bar-label">Uniform Random</text>
  <text x="30" y="266" class="t-sub">N = 1,000,000 keys (100% Hit)</text>
  <rect x="260" y="232" width="60.3" height="10" rx="2" class="b-expanse"/>
  <text x="328.3" y="240" class="t-val-accent">43.3</text>
  <rect x="260" y="246" width="93.0" height="10" rx="2" class="b-art"/>
  <text x="361.0" y="254" class="t-val-blue">66.8</text>
  <rect x="260" y="260" width="209.8" height="10" rx="2" class="b-btree"/>
  <text x="477.8" y="268" class="t-axis-label">150.7</text>
  <rect x="260" y="274" width="11.9" height="10" rx="2" class="b-hashmap"/>
  <text x="279.9" y="282" class="t-note">8.5</text>
  <rect x="800" y="248" width="130" height="20" rx="3" class="badge-win"/>
  <text x="865" y="262" class="badge-win-text">Expanse 1.54x</text>
  <text x="30" y="324" class="t-bar-label">Sparse Stride</text>
  <text x="30" y="338" class="t-sub">N = 1,000,000 keys (100% Hit)</text>
  <rect x="260" y="304" width="20.6" height="10" rx="2" class="b-expanse"/>
  <text x="288.6" y="312" class="t-val-accent">14.8</text>
  <rect x="260" y="318" width="66.1" height="10" rx="2" class="b-art"/>
  <text x="334.1" y="326" class="t-val-blue">47.5</text>
  <rect x="260" y="332" width="224.0" height="10" rx="2" class="b-btree"/>
  <text x="492.0" y="340" class="t-axis-label">160.9</text>
  <rect x="260" y="346" width="11.9" height="10" rx="2" class="b-hashmap"/>
  <text x="279.9" y="354" class="t-note">8.5</text>
  <rect x="800" y="320" width="130" height="20" rx="3" class="badge-win"/>
  <text x="865" y="334" class="badge-win-text">Expanse 3.21x</text>
  <text x="30" y="396" class="t-bar-label">Zipfian</text>
  <text x="30" y="410" class="t-sub">N = 1,000,000 keys (100% Hit)</text>
  <rect x="260" y="376" width="13.4" height="10" rx="2" class="b-expanse"/>
  <text x="281.4" y="384" class="t-val-accent">9.6</text>
  <rect x="260" y="390" width="25.0" height="10" rx="2" class="b-art"/>
  <text x="293.0" y="398" class="t-val-blue">17.9</text>
  <rect x="260" y="404" width="79.1" height="10" rx="2" class="b-btree"/>
  <text x="347.1" y="412" class="t-axis-label">56.9</text>
  <rect x="260" y="418" width="4.3" height="10" rx="2" class="b-hashmap"/>

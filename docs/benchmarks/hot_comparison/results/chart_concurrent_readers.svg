  <rect width="100%" height="100%" class="bg" rx="6" />
  <rect width="100%" height="100%" class="border" rx="6" />

  <text x="30" y="34" class="t-title">Reader throughput alongside writers — SyncExpanse vs HOT-ROWEX</text>
  <text x="30" y="50" class="t-sub">C2: 8 readers probe 50/50 while W writers insert; W=0 is the reader-only reference &#183; M lookups/s (median of rounds) &#183; higher is better</text>

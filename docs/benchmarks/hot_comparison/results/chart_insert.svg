<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 568" width="100%" height="100%">
  <title>INSERTION INTO A COLD STRUCTURE</title>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { stroke: #e2e8f0; stroke-width: 1px; fill: none; }

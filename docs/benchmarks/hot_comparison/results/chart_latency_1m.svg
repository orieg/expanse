<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 530" width="100%" height="100%">
  <title>Latency at N=1M — HOT / Expanse ratio with BCa 95% intervals</title>
  <defs>
    <style>
      .bg { fill: #ffffff; }

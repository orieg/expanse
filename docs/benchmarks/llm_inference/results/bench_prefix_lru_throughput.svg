<text x="40" y="322" class="text-axis">1,000,000 Blocks</text>
<rect x="200" y="300" width="404.7" height="20" rx="3" class="bar-baseline" />
<text x="614.6528000000001" y="315" class="text-val">219.92 MB</text>

<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 288" width="100%" height="100%">
  <title>PILLAR D — GRAMMAR-CONSTRAINED DECODING MASKS</title>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { stroke: #e2e8f0; stroke-width: 1px; fill: none; }
      .grid { stroke: #f1f5f9; stroke-width: 1px; stroke-dasharray: 2,3; }
      .axis { stroke: #cbd5e1; stroke-width: 1.5px; }
      .divider { stroke: #e2e8f0; stroke-width: 1px; }

      .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.6px; fill: #0f172a; text-transform: uppercase; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 500; fill: #475569; }
      .t-unit { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .t-axis-label { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 500; fill: #64748b; }
      .t-bar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #0f172a; }
      .t-legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #0f172a; }

      .t-val-accent { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #15803d; }
      .t-val-blue { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #2563eb; }
      .t-val-gray { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #475569; }
      .t-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 500; fill: #64748b; }

      .b-expanse { fill: #2563eb; }
      .b-baseline { fill: #94a3b8; }
      .b-highlight { fill: #10b981; }

      .badge-win { fill: #dcfce7; stroke: #86efac; stroke-width: 1px; }
      .badge-win-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #15803d; text-anchor: middle; }
      .badge-loss { fill: #fef3c7; stroke: #fcd34d; stroke-width: 1px; }
      .badge-loss-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #b45309; text-anchor: middle; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .border { stroke: #30363d; }
        .grid { stroke: #21262d; }
        .axis { stroke: #484f58; }
        .divider { stroke: #21262d; }
        .t-title { fill: #f0f6fc; }
        .t-sub { fill: #94a3b8; }
        .t-unit { fill: #94a3b8; }
        .t-axis-label { fill: #94a3b8; }
        .t-bar-label { fill: #f8fafc; }
        .t-legend { fill: #f8fafc; }
        .t-val-accent { fill: #4ade80; }
        .t-val-blue { fill: #38bdf8; }
        .t-val-gray { fill: #cbd5e1; }
        .t-note { fill: #94a3b8; }
        .b-expanse { fill: #3b82f6; }
        .b-baseline { fill: #64748b; }
        .b-highlight { fill: #34d399; }
        .badge-win { fill: #064e3b; stroke: #059669; }
        .badge-win-text { fill: #6ee7b7; }
        .badge-loss { fill: #451a03; stroke: #d97706; }
        .badge-loss-text { fill: #fcd34d; }
      }

      :root[data-theme="dark"] .bg, [data-theme="dark"] .bg { fill: #0d1117; }
      :root[data-theme="dark"] .border, [data-theme="dark"] .border { stroke: #30363d; }
      :root[data-theme="dark"] .grid, [data-theme="dark"] .grid { stroke: #21262d; }
      :root[data-theme="dark"] .axis, [data-theme="dark"] .axis { stroke: #484f58; }
      :root[data-theme="dark"] .divider, [data-theme="dark"] .divider { stroke: #21262d; }
      :root[data-theme="dark"] .t-title, [data-theme="dark"] .t-title { fill: #f0f6fc; }
      :root[data-theme="dark"] .t-sub, [data-theme="dark"] .t-sub { fill: #94a3b8; }
      :root[data-theme="dark"] .t-unit, [data-theme="dark"] .t-unit { fill: #94a3b8; }
      :root[data-theme="dark"] .t-axis-label, [data-theme="dark"] .t-axis-label { fill: #94a3b8; }
      :root[data-theme="dark"] .t-bar-label, [data-theme="dark"] .t-bar-label { fill: #f8fafc; }
      :root[data-theme="dark"] .t-legend, [data-theme="dark"] .t-legend { fill: #f8fafc; }
      :root[data-theme="dark"] .t-val-accent, [data-theme="dark"] .t-val-accent { fill: #4ade80; }
      :root[data-theme="dark"] .t-val-blue, [data-theme="dark"] .t-val-blue { fill: #38bdf8; }
      :root[data-theme="dark"] .t-val-gray, [data-theme="dark"] .t-val-gray { fill: #cbd5e1; }
      :root[data-theme="dark"] .t-note, [data-theme="dark"] .t-note { fill: #94a3b8; }
      :root[data-theme="dark"] .b-expanse, [data-theme="dark"] .b-expanse { fill: #3b82f6; }
      :root[data-theme="dark"] .b-baseline, [data-theme="dark"] .b-baseline { fill: #64748b; }
      :root[data-theme="dark"] .b-highlight, [data-theme="dark"] .b-highlight { fill: #34d399; }
      :root[data-theme="dark"] .badge-win, [data-theme="dark"] .badge-win { fill: #064e3b; stroke: #059669; }
      :root[data-theme="dark"] .badge-win-text, [data-theme="dark"] .badge-win-text { fill: #6ee7b7; }
      :root[data-theme="dark"] .badge-loss, [data-theme="dark"] .badge-loss { fill: #451a03; stroke: #d97706; }
      :root[data-theme="dark"] .badge-loss-text, [data-theme="dark"] .badge-loss-text { fill: #fcd34d; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <text x="30" y="34" class="t-title">PILLAR D — GRAMMAR-CONSTRAINED DECODING MASKS</text>
  <text x="30" y="50" class="t-sub">Total RAM across 2,000 DFA states (128k vocab) &#183; MB &#183; lower is better</text>
  <line x1="30" y1="66" x2="930" y2="66" class="divider"/>
  <text x="30" y="104" class="t-bar-label">Dense Bitmask</text>
  <text x="30" y="118" class="t-sub">[u64] Array (Full vocab)</text>
  <rect x="250" y="92" width="304.0" height="20" rx="3" class="b-baseline"/>
  <text x="562.0" y="107" class="t-val-gray">30.52 MB</text>
  <rect x="790" y="98" width="140" height="18" rx="3" class="badge-loss"/>
  <text x="860" y="111" class="badge-loss-text">Dense Baseline</text>
  <text x="30" y="160" class="t-bar-label">ExpanseSet</text>
  <text x="30" y="174" class="t-sub">Judy digital trie (Compressed)</text>
  <rect x="250" y="148" width="211.5" height="20" rx="3" class="b-expanse"/>
  <text x="469.5" y="163" class="t-val-blue">21.23 MB</text>
  <rect x="790" y="154" width="140" height="18" rx="3" class="badge-win"/>
  <text x="860" y="167" class="badge-win-text">Expanse 1.4x lower</text>
  <text x="30" y="216" class="t-bar-label">Roaring Bitmap</text>
  <text x="30" y="230" class="t-sub">Container array (Compressed)</text>
  <rect x="250" y="204" width="101.4" height="20" rx="3" class="b-highlight"/>
  <text x="359.4" y="219" class="t-val-accent">10.18 MB</text>
  <rect x="790" y="210" width="140" height="18" rx="3" class="badge-win"/>
  <text x="860" y="223" class="badge-win-text">Roaring 3.0x lower</text>
</svg>

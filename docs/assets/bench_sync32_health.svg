  <line x1="30" y1="432" x2="930" y2="432" class="divider"/>
  <text x="30" y="448" class="t-note">Reading: at the 10k/s duty, reads validate &#8805;99.9% of the time at every reader count in both runs. Refusals: none at any reader count.</text>
  <text x="30" y="461" class="t-note">Reclamation frees a parked node once every reader has passed through a quiescent state since it was retired (per-reader walk counters, #594).</text>
  <text x="30" y="479" class="t-note">Measured: reference host -- 12th Gen Intel(R) Core(TM) i9-12900F, pin 0-15 &#183; runs 36658309874 and 36661955960, ref f9853201 &#183; report-only, never gating (workload: core_concurrency).</text>

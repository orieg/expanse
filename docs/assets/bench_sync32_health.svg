  <line x1="30" y1="416" x2="930" y2="416" class="divider"/>
  <text x="30" y="432" class="t-note">Reading: Busy tracks write rate &#215; bracket length, as the seqlock model predicts &#8212; at embedded ingestion rates reads validate &#8805;99.8% of the time. Refusals appear only under dense many-reader load:</text>
  <text x="30" y="445" class="t-note">deferred reclamation drains only at a fence that sees every reader flag clear, so sixteen continuous readers starve the writer. Zero refusals for the wrapper's stated 1&#8211;2 reader target at every rate.</text>
  <text x="30" y="463" class="t-note">Measured: reference host -- Intel i9-12900F, 24 threads, 30 MiB L3, Linux 6.8 &#183; run 33556060582, ref db63f409 &#183; report-only, never gating (workload: core_concurrency).</text>

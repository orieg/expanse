  <line x1="30" y1="416" x2="930" y2="416" class="divider"/>
  <text x="30" y="432" class="t-note">Reading: at the 10k/s duty, reads validate &#8805;99.8% of the time at every reader count in both runs. Refusals: none at any reader count.</text>
  <text x="30" y="445" class="t-note">Reclamation frees a parked node once every reader has passed through a quiescent state since it was retired (per-reader walk counters, #594).</text>
  <text x="30" y="463" class="t-note">Measured: reference host -- 12th Gen Intel(R) Core(TM) i9-12900F, pin 0-15 &#183; runs 35617717693 and 35619244412, ref 0a3ed07a &#183; report-only, never gating (workload: core_concurrency).</text>

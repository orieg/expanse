<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 1000 540" width="100%" height="100%">
  <title>Expanse against a sorted array, an open-addressing hash table and newlib tsearch on the STM32H747I-DISCO</title>
  <defs>
    <style>
      /* Light theme by default for maximum contrast on the web. */
      .bg { fill: #ffffff; }
      .border { stroke: #e2e8f0; stroke-width: 1px; fill: none; }
      .grid { stroke: #f1f5f9; stroke-width: 1px; stroke-dasharray: 2,3; }
      .axis { stroke: #cbd5e1; stroke-width: 1.5px; }
      .divider { stroke: #e2e8f0; stroke-width: 1px; }

      .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.6px; fill: #0f172a; text-transform: uppercase; }
      .t-chart-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; fill: #0f172a; text-transform: uppercase; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #334155; }
      .t-note { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 9.5px; font-weight: 500; fill: #64748b; }
      .t-unit { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .t-axis-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 500; fill: #475569; }
      .t-bar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .t-legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #0f172a; }
      .t-win { fill: #15803d; font-weight: 700; }
      .t-loss { fill: #b45309; font-weight: 700; }

      .t-val-accent { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #15803d; text-anchor: middle; }
      .t-val-blue { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #2563eb; text-anchor: middle; }
      .t-val-muted { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .t-row-accent { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 700; fill: #15803d; }
      .t-row-muted { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; font-weight: 600; fill: #334155; }

      .b-expanse { fill: #16a34a; }
      .b-expanse-alt { fill: #10b981; }
      .b-hash { fill: #2563eb; }
      .b-btree { fill: #64748b; }
      .b-skipmap { fill: #94a3b8; }
      .b-other { fill: #64748b; }

      .badge-win { fill: #dcfce7; stroke: #86efac; stroke-width: 1px; rx: 3px; }
      .badge-win-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 700; fill: #15803d; text-anchor: middle; }
      .badge-loss { fill: #fef3c7; stroke: #fcd34d; stroke-width: 1px; rx: 3px; }
      .badge-loss-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 9.5px; font-weight: 700; fill: #b45309; text-anchor: middle; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .border { stroke: #30363d; }
        .grid { stroke: #21262d; }
        .axis { stroke: #484f58; }
        .divider { stroke: #21262d; }
        .t-title { fill: #f0f6fc; }
        .t-chart-title { fill: #f0f6fc; }
        .t-sub { fill: #94a3b8; }
        .t-note { fill: #94a3b8; }
        .t-unit { fill: #94a3b8; }
        .t-axis-label { fill: #94a3b8; }
        .t-bar-label { fill: #f8fafc; }
        .t-legend { fill: #f8fafc; }
        .t-win { fill: #4ade80; }
        .t-loss { fill: #fcd34d; }
        .t-val-accent { fill: #4ade80; }
        .t-val-blue { fill: #38bdf8; }
        .t-val-muted { fill: #e2e8f0; }
        .t-row-accent { fill: #4ade80; }
        .t-row-muted { fill: #e2e8f0; }
        .b-expanse { fill: #22c55e; }
        .b-expanse-alt { fill: #34d399; }
        .b-hash { fill: #3b82f6; }
        .b-btree { fill: #64748b; }
        .b-skipmap { fill: #475569; }
        .b-other { fill: #64748b; }
        .badge-win { fill: #064e3b; stroke: #059669; }
        .badge-win-text { fill: #6ee7b7; }
        .badge-loss { fill: #451a03; stroke: #d97706; }
        .badge-loss-text { fill: #fcd34d; }
      }

      :root[data-theme="dark"] .bg, [data-theme="dark"] .bg { fill: #0d1117; }
      :root[data-theme="dark"] .border, [data-theme="dark"] .border { stroke: #30363d; }
      :root[data-theme="dark"] .grid, [data-theme="dark"] .grid { stroke: #21262d; }
      :root[data-theme="dark"] .axis, [data-theme="dark"] .axis { stroke: #484f58; }
      :root[data-theme="dark"] .divider, [data-theme="dark"] .divider { stroke: #21262d; }
      :root[data-theme="dark"] .t-title, [data-theme="dark"] .t-title { fill: #f0f6fc; }
      :root[data-theme="dark"] .t-chart-title, [data-theme="dark"] .t-chart-title { fill: #f0f6fc; }
      :root[data-theme="dark"] .t-sub, [data-theme="dark"] .t-sub { fill: #94a3b8; }
      :root[data-theme="dark"] .t-note, [data-theme="dark"] .t-note { fill: #94a3b8; }
      :root[data-theme="dark"] .t-unit, [data-theme="dark"] .t-unit { fill: #94a3b8; }
      :root[data-theme="dark"] .t-axis-label, [data-theme="dark"] .t-axis-label { fill: #94a3b8; }
      :root[data-theme="dark"] .t-bar-label, [data-theme="dark"] .t-bar-label { fill: #f8fafc; }
      :root[data-theme="dark"] .t-legend, [data-theme="dark"] .t-legend { fill: #f8fafc; }
      :root[data-theme="dark"] .t-win, [data-theme="dark"] .t-win { fill: #4ade80; }
      :root[data-theme="dark"] .t-loss, [data-theme="dark"] .t-loss { fill: #fcd34d; }
      :root[data-theme="dark"] .t-val-accent, [data-theme="dark"] .t-val-accent { fill: #4ade80; }
      :root[data-theme="dark"] .t-val-blue, [data-theme="dark"] .t-val-blue { fill: #38bdf8; }
      :root[data-theme="dark"] .t-val-muted, [data-theme="dark"] .t-val-muted { fill: #e2e8f0; }
      :root[data-theme="dark"] .t-row-accent, [data-theme="dark"] .t-row-accent { fill: #4ade80; }
      :root[data-theme="dark"] .t-row-muted, [data-theme="dark"] .t-row-muted { fill: #e2e8f0; }
      :root[data-theme="dark"] .b-expanse, [data-theme="dark"] .b-expanse { fill: #22c55e; }
      :root[data-theme="dark"] .b-expanse-alt, [data-theme="dark"] .b-expanse-alt { fill: #34d399; }
      :root[data-theme="dark"] .b-hash, [data-theme="dark"] .b-hash { fill: #3b82f6; }
      :root[data-theme="dark"] .b-btree, [data-theme="dark"] .b-btree { fill: #64748b; }
      :root[data-theme="dark"] .b-skipmap, [data-theme="dark"] .b-skipmap { fill: #475569; }
      :root[data-theme="dark"] .b-other, [data-theme="dark"] .b-other { fill: #64748b; }
      :root[data-theme="dark"] .badge-win, [data-theme="dark"] .badge-win { fill: #064e3b; stroke: #059669; }
      :root[data-theme="dark"] .badge-win-text, [data-theme="dark"] .badge-win-text { fill: #6ee7b7; }
      :root[data-theme="dark"] .badge-loss, [data-theme="dark"] .badge-loss { fill: #451a03; stroke: #d97706; }
      :root[data-theme="dark"] .badge-loss-text, [data-theme="dark"] .badge-loss-text { fill: #fcd34d; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>
  <text x="20" y="26" class="t-title">Expanse vs a sorted array, a hash table and tsearch, same Cortex-M7, same fixtures</text>
  <g transform="translate(20, 52)">
    <text x="0" y="0" class="t-chart-title">cycles per operation at 400 MHz, D-cache on (log scale, lower is better)</text>
    <text x="0" y="13" class="t-sub">min of 5 passes, one fixture code path behind a vtable; batched eviction = remove_range, or a full scan for the hash table</text>
    <text x="207" y="60" class="t-legend" text-anchor="end">ingest 2,000 sequential / insert</text>
    <rect x="215" y="30" width="135.7" height="12" rx="1" style="fill:#1d4ed8"/>
    <text x="354.7" y="40" class="t-axis-label">745</text>
    <rect x="215" y="45" width="91.9" height="12" rx="1" style="fill:#f59e0b"/>
    <text x="310.9" y="55" class="t-axis-label">185  4.0x faster</text>
    <rect x="215" y="60" width="61.7" height="12" rx="1" style="fill:#10b981"/>
    <text x="280.7" y="70" class="t-axis-label">71  10.5x faster</text>
    <rect x="215" y="75" width="251.6" height="12" rx="1" style="fill:#94a3b8"/>
    <text x="470.6" y="85" class="t-axis-label">29,511  39.6x slower</text>
    <text x="207" y="138" class="t-legend" text-anchor="end">CAN dispatch, 500 keys / get</text>
    <rect x="215" y="108" width="101.6" height="12" rx="1" style="fill:#1d4ed8"/>
    <text x="320.6" y="118" class="t-axis-label">252</text>
    <rect x="215" y="123" width="72.5" height="12" rx="1" style="fill:#f59e0b"/>
    <text x="291.5" y="133" class="t-axis-label">100  2.5x faster</text>
    <rect x="215" y="138" width="53.9" height="12" rx="1" style="fill:#10b981"/>
    <text x="272.9" y="148" class="t-axis-label">55  4.5x faster</text>
    <rect x="215" y="153" width="199.1" height="12" rx="1" style="fill:#94a3b8"/>
    <text x="418.1" y="163" class="t-axis-label">5,568  22.1x slower</text>
    <text x="207" y="216" class="t-legend" text-anchor="end">evict 600 of 2,000, batched</text>
    <rect x="215" y="186" width="147.1" height="12" rx="1" style="fill:#1d4ed8"/>
    <text x="366.1" y="196" class="t-axis-label">1,070</text>
    <rect x="215" y="201" width="191.4" height="12" rx="1" style="fill:#f59e0b"/>
    <text x="410.4" y="211" class="t-axis-label">4,367  4.1x slower</text>
    <rect x="215" y="216" width="86.7" height="12" rx="1" style="fill:#10b981"/>
    <text x="305.7" y="226" class="t-axis-label">157  6.8x faster</text>
    <rect x="215" y="231" width="169.3" height="12" rx="1" style="fill:#94a3b8"/>
    <text x="388.3" y="241" class="t-axis-label">2,160  2.0x slower</text>
    <text x="207" y="294" class="t-legend" text-anchor="end">evict 25 of 2,000, batched</text>
    <rect x="215" y="264" width="152.9" height="12" rx="1" style="fill:#1d4ed8"/>
    <text x="371.9" y="274" class="t-axis-label">1,284</text>
    <rect x="215" y="279" width="165.7" height="12" rx="1" style="fill:#f59e0b"/>
    <text x="384.7" y="289" class="t-axis-label">1,932  1.5x slower</text>
    <rect x="215" y="294" width="185.2" height="12" rx="1" style="fill:#10b981"/>
    <text x="404.2" y="304" class="t-axis-label">3,583  2.8x slower</text>
    <rect x="215" y="309" width="143.4" height="12" rx="1" style="fill:#94a3b8"/>
    <text x="362.4" y="319" class="t-axis-label">950  1.4x faster</text>
    <line x1="215.0" y1="28" x2="215.0" y2="342" class="grid"/>
    <text x="215.0" y="354" class="t-axis-label" text-anchor="middle">10</text>
    <line x1="287.5" y1="28" x2="287.5" y2="342" class="grid"/>
    <text x="287.5" y="354" class="t-axis-label" text-anchor="middle">100</text>
    <line x1="360.0" y1="28" x2="360.0" y2="342" class="grid"/>
    <text x="360.0" y="354" class="t-axis-label" text-anchor="middle">1,000</text>
    <line x1="432.5" y1="28" x2="432.5" y2="342" class="grid"/>
    <text x="432.5" y="354" class="t-axis-label" text-anchor="middle">10,000</text>
    <line x1="505.0" y1="28" x2="505.0" y2="342" class="grid"/>
    <text x="505.0" y="354" class="t-axis-label" text-anchor="middle">100,000</text>
    <rect x="0" y="368" width="10" height="10" rx="1" style="fill:#1d4ed8"/>
    <text x="14" y="377" class="t-note">Expanse (C ABI)</text>
    <rect x="240" y="368" width="10" height="10" rx="1" style="fill:#f59e0b"/>
    <text x="254" y="377" class="t-note">sorted array, bsearch + memmove</text>
    <rect x="0" y="384" width="10" height="10" rx="1" style="fill:#10b981"/>
    <text x="14" y="393" class="t-note">open-addressing hash, 50% load</text>
    <rect x="240" y="384" width="10" height="10" rx="1" style="fill:#94a3b8"/>
    <text x="254" y="393" class="t-note">newlib tsearch (unbalanced BST)</text>
  </g>
  <g transform="translate(660, 52)">
    <text x="0" y="0" class="t-chart-title">bytes per key, 2,000 keys</text>
    <text x="0" y="13" class="t-sub">newlib heap in use (mallinfo), overhead included</text>
    <text x="0" y="34" class="t-legend">sequential keys, one map</text>
    <rect x="0" y="42" width="15.8" height="14" rx="1" style="fill:#1d4ed8"/>
    <text x="19.8" y="53" class="t-axis-label">5.7 B/key</text>
    <rect x="0" y="62" width="22.3" height="14" rx="1" style="fill:#f59e0b"/>
    <text x="26.3" y="73" class="t-axis-label">8.0 B/key</text>
    <rect x="0" y="82" width="45.5" height="14" rx="1" style="fill:#10b981"/>
    <text x="49.5" y="93" class="t-axis-label">16.4 B/key</text>
    <rect x="0" y="102" width="100.0" height="14" rx="1" style="fill:#94a3b8"/>
    <text x="104.0" y="113" class="t-axis-label">36.0 B/key</text>
    <text x="0" y="154" class="t-legend">hash keys, dual index (ordered) or one table (hash)</text>
    <rect x="0" y="162" width="59.1" height="14" rx="1" style="fill:#1d4ed8"/>
    <text x="63.1" y="173" class="t-axis-label">21.3 B/key</text>
    <rect x="0" y="182" width="44.5" height="14" rx="1" style="fill:#f59e0b"/>
    <text x="48.5" y="193" class="t-axis-label">16.0 B/key</text>
    <rect x="0" y="202" width="45.5" height="14" rx="1" style="fill:#10b981"/>
    <text x="49.5" y="213" class="t-axis-label">16.4 B/key</text>
    <rect x="0" y="222" width="200.0" height="14" rx="1" style="fill:#94a3b8"/>
    <text x="204.0" y="233" class="t-axis-label">72.0 B/key</text>
    <text x="0" y="292" class="t-note">the sorted array and the hash table are pre-sized to their capacity;</text>
    <text x="0" y="305" class="t-note">Expanse and tsearch grow through malloc as keys arrive</text>
  </g>
  <text x="20" y="492" class="t-note">measured: STM32H747I-DISCO, Cortex-M7 CPUID 0x411fc271 (IDCODE 0x20036450), D-cache 4-way x 128 sets x 32 B lines; direct SMPS supply, VOS3 to 160 MHz, VOS1 at 400 MHz</text>
  <text x="20" y="506" class="t-note">clock check from the host side over 320M cycles: 64 nominal / 64.1 measured MHz, 160 nominal / 160.2 measured MHz, 200 nominal / 200.4 measured MHz, 400 nominal / 400.0 measured MHz</text>
  <text x="20" y="520" class="t-note">DWT CYCCNT, single board; libexpanse staticlib commit 22908c15; harness integrations/stm32h747; source docs/benchmarks/stm32h747/results.json</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 275" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .border { stroke: #30363d; stroke-width: 1px; fill: none; }
      .grid { stroke: #21262d; stroke-width: 1px; stroke-dasharray: 2,3; }
      .axis { stroke: #484f58; stroke-width: 1.5px; }
      .divider { stroke: #21262d; stroke-width: 1px; }
      
      .t-chart-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; fill: #8b949e; text-transform: uppercase; }
      .t-chart-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; fill: #6e7681; }
      .t-unit-header { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #8b949e; }
      .t-axis-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #8b949e; }
      .t-bar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #c9d1d9; }
      
      .t-val-accent { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #3fb950; text-anchor: middle; }
      .t-val-muted { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 500; fill: #8b949e; text-anchor: middle; }
      .t-val-blue { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #58a6ff; text-anchor: middle; }

      .b-expanse { fill: #2ea043; }
      .b-rocksdb { fill: #1f6feb; }
      .b-other { fill: #30363d; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .border { stroke: #30363d; }
        .grid { stroke: #21262d; }
        .axis { stroke: #484f58; }
        .divider { stroke: #21262d; }
        .t-chart-title { fill: #8b949e; }
        .t-chart-sub { fill: #6e7681; }
        .t-unit-header { fill: #8b949e; }
        .t-axis-label { fill: #8b949e; }
        .t-bar-label { fill: #c9d1d9; }
        .t-val-accent { fill: #3fb950; }
        .t-val-blue { fill: #58a6ff; }
        .t-val-muted { fill: #8b949e; }
        .b-expanse { fill: #2ea043; }
        .b-rocksdb { fill: #1f6feb; }
        .b-other { fill: #30363d; }
      }

      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .border { stroke: #d0d7de; }
        .grid { stroke: #eaeef2; }
        .axis { stroke: #afb8c1; }
        .divider { stroke: #eaeef2; }
        .t-chart-title { fill: #57606a; }
        .t-chart-sub { fill: #8c959f; }
        .t-unit-header { fill: #57606a; }
        .t-axis-label { fill: #57606a; }
        .t-bar-label { fill: #1f2328; }
        .t-val-accent { fill: #1a7f37; }
        .t-val-blue { fill: #0969da; }
        .t-val-muted { fill: #656d76; }
        .b-expanse { fill: #1a7f37; }
        .b-rocksdb { fill: #0969da; }
        .b-other { fill: #d0d7de; }
      }

      [data-theme="dark"] .bg, :root[data-theme="dark"] .bg { fill: #0d1117; }
      [data-theme="dark"] .border, :root[data-theme="dark"] .border { stroke: #30363d; }
      [data-theme="dark"] .grid, :root[data-theme="dark"] .grid { stroke: #21262d; }
      [data-theme="dark"] .axis, :root[data-theme="dark"] .axis { stroke: #484f58; }
      [data-theme="dark"] .divider, :root[data-theme="dark"] .divider { stroke: #21262d; }
      [data-theme="dark"] .t-chart-title, :root[data-theme="dark"] .t-chart-title { fill: #8b949e; }
      [data-theme="dark"] .t-chart-sub, :root[data-theme="dark"] .t-chart-sub { fill: #6e7681; }
      [data-theme="dark"] .t-unit-header, :root[data-theme="dark"] .t-unit-header { fill: #8b949e; }
      [data-theme="dark"] .t-axis-label, :root[data-theme="dark"] .t-axis-label { fill: #8b949e; }
      [data-theme="dark"] .t-bar-label, :root[data-theme="dark"] .t-bar-label { fill: #c9d1d9; }
      [data-theme="dark"] .t-val-accent, :root[data-theme="dark"] .t-val-accent { fill: #3fb950; }
      [data-theme="dark"] .t-val-blue, :root[data-theme="dark"] .t-val-blue { fill: #58a6ff; }
      [data-theme="dark"] .t-val-muted, :root[data-theme="dark"] .t-val-muted { fill: #8b949e; }
      [data-theme="dark"] .b-expanse, :root[data-theme="dark"] .b-expanse { fill: #2ea043; }
      [data-theme="dark"] .b-rocksdb, :root[data-theme="dark"] .b-rocksdb { fill: #1f6feb; }
      [data-theme="dark"] .b-other, :root[data-theme="dark"] .b-other { fill: #30363d; }

      [data-theme="light"] .bg, :root[data-theme="light"] .bg { fill: #ffffff; }
      [data-theme="light"] .border, :root[data-theme="light"] .border { stroke: #d0d7de; }
      [data-theme="light"] .grid, :root[data-theme="light"] .grid { stroke: #eaeef2; }
      [data-theme="light"] .axis, :root[data-theme="light"] .axis { stroke: #afb8c1; }
      [data-theme="light"] .divider, :root[data-theme="light"] .divider { stroke: #eaeef2; }
      [data-theme="light"] .t-chart-title, :root[data-theme="light"] .t-chart-title { fill: #57606a; }
      [data-theme="light"] .t-chart-sub, :root[data-theme="light"] .t-chart-sub { fill: #8c959f; }
      [data-theme="light"] .t-unit-header, :root[data-theme="light"] .t-unit-header { fill: #57606a; }
      [data-theme="light"] .t-axis-label, :root[data-theme="light"] .t-axis-label { fill: #57606a; }
      [data-theme="light"] .t-bar-label, :root[data-theme="light"] .t-bar-label { fill: #1f2328; }
      [data-theme="light"] .t-val-accent, :root[data-theme="light"] .t-val-accent { fill: #1a7f37; }
      [data-theme="light"] .t-val-blue, :root[data-theme="light"] .t-val-blue { fill: #0969da; }
      [data-theme="light"] .t-val-muted, :root[data-theme="light"] .t-val-muted { fill: #656d76; }
      [data-theme="light"] .b-expanse, :root[data-theme="light"] .b-expanse { fill: #1a7f37; }
      [data-theme="light"] .b-rocksdb, :root[data-theme="light"] .b-rocksdb { fill: #0969da; }
      [data-theme="light"] .b-other, :root[data-theme="light"] .b-other { fill: #d0d7de; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <!-- PANEL 1: SEQUENTIAL SCAN THROUGHPUT (prefixscan) -->
  <g transform="translate(15, 0)">
    <text x="15" y="24" class="t-chart-title">RocksDB Sequential Scan</text>
    <text x="15" y="38" class="t-chart-sub">prefixscan throughput (100K keys)</text>
    <text x="280" y="24" class="t-unit-header" text-anchor="end">Mops/s (Higher=Better)</text>

    <!-- Grid lines (0, 100, 200, 300, 400, 500) -->
    <!-- Max = 500 Mops/s. Scale: 240px / 500 = 0.48 px per Mops/s -->
    <line x1="45" y1="60" x2="45" y2="225" class="axis"/>
    <line x1="45" y1="225" x2="280" y2="225" class="axis"/>

    <line x1="93" y1="60" x2="93" y2="225" class="grid"/>
    <text x="93" y="238" class="t-axis-label" text-anchor="middle">100</text>

    <line x1="141" y1="60" x2="141" y2="225" class="grid"/>
    <text x="141" y="238" class="t-axis-label" text-anchor="middle">200</text>

    <line x1="189" y1="60" x2="189" y2="225" class="grid"/>
    <text x="189" y="238" class="t-axis-label" text-anchor="middle">300</text>

    <line x1="237" y1="60" x2="237" y2="225" class="grid"/>
    <text x="237" y="238" class="t-axis-label" text-anchor="middle">400</text>

    <line x1="280" y1="60" x2="280" y2="225" class="grid"/>
    <text x="280" y="238" class="t-axis-label" text-anchor="middle">500</text>

    <!-- Bar 1: ExpanseMemTable (215.32 Mops/s -> width = 103.3px) -->
    <text x="15" y="85" class="t-bar-label">Expanse</text>
    <rect x="45" y="70" width="103.3" height="24" rx="3" class="b-expanse"/>
    <text x="180" y="86" class="t-val-accent">215.3 Mops/s (19.7x)</text>

    <!-- Bar 2: SkipListRep (10.95 Mops/s -> width = 5.3px) -->
    <text x="15" y="130" class="t-bar-label">SkipList</text>
    <rect x="45" y="115" width="7" height="24" rx="3" class="b-rocksdb"/>
    <text x="95" y="131" class="t-val-blue">11.0 Mops/s</text>

    <!-- Bar 3: VectorRep (464.58 Mops/s -> width = 223px) -->
    <text x="15" y="175" class="t-bar-label">Vector</text>
    <rect x="45" y="160" width="223" height="24" rx="3" class="b-other"/>
    <text x="230" y="152" class="t-val-muted" text-anchor="end">464.6 Mops/s (Read-Only)</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="320" y1="15" x2="320" y2="255" class="divider"/>

  <!-- PANEL 2: RAM MEMORY FOOTPRINT (Bytes per Entry) -->
  <g transform="translate(335, 0)">
    <text x="15" y="24" class="t-chart-title">RAM Footprint per Entry</text>
    <text x="15" y="38" class="t-chart-sub">100K keys (16B key / 64B val)</text>
    <text x="280" y="24" class="t-unit-header" text-anchor="end">Bytes / Key (Lower=Better)</text>

    <!-- Max = 160 Bytes. Scale: 235px / 160 = 1.47 px per Byte -->
    <line x1="45" y1="60" x2="45" y2="225" class="axis"/>
    <line x1="45" y1="225" x2="280" y2="225" class="axis"/>

    <line x1="104" y1="60" x2="104" y2="225" class="grid"/>
    <text x="104" y="238" class="t-axis-label" text-anchor="middle">40B</text>

    <line x1="163" y1="60" x2="163" y2="225" class="grid"/>
    <text x="163" y="238" class="t-axis-label" text-anchor="middle">80B</text>

    <line x1="221" y1="60" x2="221" y2="225" class="grid"/>
    <text x="221" y="238" class="t-axis-label" text-anchor="middle">120B</text>

    <line x1="280" y1="60" x2="280" y2="225" class="grid"/>
    <text x="280" y="238" class="t-axis-label" text-anchor="middle">160B</text>

    <!-- Bar 1: ExpanseMemTable (13.2 B/entry -> width = 19.4px) -->
    <text x="15" y="85" class="t-bar-label">Expanse</text>
    <rect x="45" y="70" width="19.4" height="24" rx="3" class="b-expanse"/>
    <text x="110" y="86" class="t-val-accent">13.2 B (-91.0%)</text>

    <!-- Bar 2: SkipListRep (146.7 B/entry -> width = 215.6px) -->
    <text x="15" y="130" class="t-bar-label">SkipList</text>
    <rect x="45" y="115" width="215.6" height="24" rx="3" class="b-rocksdb"/>
    <text x="210" y="131" class="t-val-blue" text-anchor="end">146.7 B / key</text>

    <!-- Bar 3: VectorRep (10.5 B/entry -> width = 15.4px) -->
    <text x="15" y="175" class="t-bar-label">Vector</text>
    <rect x="45" y="160" width="15.4" height="24" rx="3" class="b-other"/>
    <text x="105" y="176" class="t-val-muted">10.5 B / key</text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="640" y1="15" x2="640" y2="255" class="divider"/>

  <!-- PANEL 3: POINT LOOKUP LATENCY (readrandom) -->
  <g transform="translate(655, 0)">
    <text x="15" y="24" class="t-chart-title">Point Lookup Latency</text>
    <text x="15" y="38" class="t-chart-sub">readrandom single-key query</text>
    <text x="280" y="24" class="t-unit-header" text-anchor="end">Nanoseconds (Lower=Better)</text>

    <!-- Max = 1400 ns. Scale: 235px / 1400 = 0.168 px per ns -->
    <line x1="45" y1="60" x2="45" y2="225" class="axis"/>
    <line x1="45" y1="225" x2="280" y2="225" class="axis"/>

    <line x1="104" y1="60" x2="104" y2="225" class="grid"/>
    <text x="104" y="238" class="t-axis-label" text-anchor="middle">350</text>

    <line x1="163" y1="60" x2="163" y2="225" class="grid"/>
    <text x="163" y="238" class="t-axis-label" text-anchor="middle">700</text>

    <line x1="221" y1="60" x2="221" y2="225" class="grid"/>
    <text x="221" y="238" class="t-axis-label" text-anchor="middle">1050</text>

    <line x1="280" y1="60" x2="280" y2="225" class="grid"/>
    <text x="280" y="238" class="t-axis-label" text-anchor="middle">1400</text>

    <!-- Bar 1: ExpanseMemTable (999 ns -> width = 167.8px) -->
    <text x="15" y="85" class="t-bar-label">Expanse</text>
    <rect x="45" y="70" width="167.8" height="24" rx="3" class="b-expanse"/>
    <text x="125" y="86" class="t-val-accent">999 ns / op</text>

    <!-- Bar 2: SkipListRep (1077 ns -> width = 180.9px) -->
    <text x="15" y="130" class="t-bar-label">SkipList</text>
    <rect x="45" y="115" width="180.9" height="24" rx="3" class="b-rocksdb"/>
    <text x="145" y="131" class="t-val-blue">1077 ns / op</text>

    <!-- Bar 3: VectorRep (1065 ns -> width = 178.9px) -->
    <text x="15" y="175" class="t-bar-label">Vector</text>
    <rect x="45" y="160" width="178.9" height="24" rx="3" class="b-other"/>
    <text x="145" y="176" class="t-val-muted">1065 ns / op</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .border { stroke: #30363d; stroke-width: 1px; fill: none; }
      .grid { stroke: #21262d; stroke-width: 1px; stroke-dasharray: 2,3; }
      .axis { stroke: #484f58; stroke-width: 1.5px; }
      
      .t-chart-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; fill: #8b949e; text-transform: uppercase; }
      .t-chart-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; fill: #6e7681; }
      .t-unit-header { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #8b949e; }
      .t-axis-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #8b949e; }
      .t-bar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #c9d1d9; }
      
      .t-val-accent { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #3fb950; text-anchor: middle; }
      .t-val-muted { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 500; fill: #8b949e; text-anchor: middle; }
      .t-val-blue { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #58a6ff; text-anchor: middle; }

      .b-expanse { fill: #2ea043; }
      .b-roaring { fill: #1f6feb; }
      .b-other { fill: #30363d; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .border { stroke: #d0d7de; }
        .grid { stroke: #eaeef2; }
        .axis { stroke: #afb8c1; }
        .t-chart-title { fill: #57606a; }
        .t-chart-sub { fill: #8c959f; }
        .t-unit-header { fill: #57606a; }
        .t-axis-label { fill: #57606a; }
        .t-bar-label { fill: #1f2328; }
        .t-val-accent { fill: #1a7f37; }
        .t-val-blue { fill: #0969da; }
        .t-val-muted { fill: #656d76; }
        .b-expanse { fill: #1a7f37; }
        .b-roaring { fill: #0969da; }
        .b-other { fill: #d0d7de; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <!-- ================= CHART 1: RANGE SCAN ================= -->
  <g transform="translate(30, 25)">
    <text x="0" y="0" class="t-chart-title">Ordered Range Scan</text>
    <text x="0" y="14" class="t-chart-sub">100,000 keys sequential scan (higher is better)</text>
    <text x="0" y="32" class="t-unit-header">&#9650; Throughput (M keys / sec)</text>

    <!-- Y Axis: 0 to 100M -->
    <line x1="30" y1="50" x2="240" y2="50" class="grid"/>
    <text x="22" y="53" class="t-axis-label" text-anchor="end">100M</text>
    
    <line x1="30" y1="130" x2="240" y2="130" class="grid"/>
    <text x="22" y="133" class="t-axis-label" text-anchor="end">50M</text>
    
    <line x1="30" y1="210" x2="240" y2="210" class="axis"/>
    <text x="22" y="213" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="45" x2="30" y2="210" class="axis"/>

    <!-- Bar 1: ExpanseMap -->
    <rect x="55" y="68.6" width="65" height="141.4" class="b-expanse" rx="2"/>
    <text x="87.5" y="60" class="t-val-accent">88.4 M/s</text>
    <text x="87.5" y="230" class="t-bar-label" text-anchor="middle">ExpanseMap</text>
    <text x="87.5" y="245" class="t-chart-sub" text-anchor="middle" fill="#3fb950">3.4&#215; speedup</text>

    <!-- Bar 2: BTreeMap -->
    <rect x="145" y="168.4" width="65" height="41.6" class="b-other" rx="2"/>
    <text x="177.5" y="160" class="t-val-muted">26.0 M/s</text>
    <text x="177.5" y="230" class="t-bar-label" text-anchor="middle">BTreeMap</text>
    <text x="177.5" y="245" class="t-chart-sub" text-anchor="middle">1.0&#215; baseline</text>
  </g>

  <!-- Divider 1 -->
  <line x1="310" y1="25" x2="310" y2="355" stroke="#21262d" stroke-width="1"/>

  <!-- ================= CHART 2: POINT LOOKUP LATENCY ================= -->
  <g transform="translate(340, 25)">
    <text x="0" y="0" class="t-chart-title">Point Lookup Latency</text>
    <text x="0" y="14" class="t-chart-sub">1,000,000 keys random queries (lower is better)</text>
    <text x="0" y="32" class="t-unit-header">&#9660; Latency (ns / op)</text>

    <!-- Y Axis: 0 to 40 ns -->
    <line x1="30" y1="50" x2="250" y2="50" class="grid"/>
    <text x="22" y="53" class="t-axis-label" text-anchor="end">40 ns</text>
    
    <line x1="30" y1="130" x2="250" y2="130" class="grid"/>
    <text x="22" y="133" class="t-axis-label" text-anchor="end">20 ns</text>
    
    <line x1="30" y1="210" x2="250" y2="210" class="axis"/>
    <text x="22" y="213" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="45" x2="30" y2="210" class="axis"/>

    <!-- Bar 1: ExpanseSet -->
    <rect x="45" y="146.8" width="50" height="63.2" class="b-expanse" rx="2"/>
    <text x="70" y="138" class="t-val-accent">15.8 ns</text>
    <text x="70" y="230" class="t-bar-label" text-anchor="middle">ExpanseSet</text>
    <text x="70" y="245" class="t-chart-sub" text-anchor="middle" fill="#3fb950">fastest</text>

    <!-- Bar 2: Roaring -->
    <rect x="115" y="113.2" width="50" height="96.8" class="b-roaring" rx="2"/>
    <text x="140" y="104" class="t-val-blue">24.2 ns</text>
    <text x="140" y="230" class="t-bar-label" text-anchor="middle">Roaring</text>
    <text x="140" y="245" class="t-chart-sub" text-anchor="middle">1.5&#215;</text>

    <!-- Bar 3: Stock Judy -->
    <rect x="185" y="80.8" width="50" height="129.2" class="b-other" rx="2"/>
    <text x="210" y="72" class="t-val-muted">32.3 ns</text>
    <text x="210" y="230" class="t-bar-label" text-anchor="middle">Stock Judy</text>
    <text x="210" y="245" class="t-chart-sub" text-anchor="middle">2.0&#215; baseline</text>
  </g>

  <!-- Divider 2 -->
  <line x1="635" y1="25" x2="635" y2="355" stroke="#21262d" stroke-width="1"/>

  <!-- ================= CHART 3: MEMORY CONSUMPTION ================= -->
  <g transform="translate(665, 25)">
    <text x="0" y="0" class="t-chart-title">Memory Footprint</text>
    <text x="0" y="14" class="t-chart-sub">100,000 keys in 256-key clusters (lower is better)</text>
    <text x="0" y="32" class="t-unit-header">&#9660; Density (Bytes / key)</text>

    <!-- Y Axis: 0 to 20 B/k -->
    <line x1="30" y1="50" x2="250" y2="50" class="grid"/>
    <text x="22" y="53" class="t-axis-label" text-anchor="end">20 B</text>
    
    <line x1="30" y1="130" x2="250" y2="130" class="grid"/>
    <text x="22" y="133" class="t-axis-label" text-anchor="end">10 B</text>
    
    <line x1="30" y1="210" x2="250" y2="210" class="axis"/>
    <text x="22" y="213" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="45" x2="30" y2="210" class="axis"/>

    <!-- Bar 1: ExpanseSet -->
    <rect x="45" y="206" width="50" height="4" class="b-expanse" rx="1"/>
    <text x="70" y="198" class="t-val-accent">0.36 B</text>
    <text x="70" y="230" class="t-bar-label" text-anchor="middle">ExpanseSet</text>
    <text x="70" y="245" class="t-chart-sub" text-anchor="middle" fill="#3fb950">-98% heap</text>

    <!-- Bar 2: Roaring -->
    <rect x="115" y="206" width="50" height="4" class="b-roaring" rx="1"/>
    <text x="140" y="198" class="t-val-blue">0.38 B</text>
    <text x="140" y="230" class="t-bar-label" text-anchor="middle">Roaring</text>
    <text x="140" y="245" class="t-chart-sub" text-anchor="middle">-98% heap</text>

    <!-- Bar 3: BTreeSet -->
    <rect x="185" y="82" width="50" height="128" class="b-other" rx="2"/>
    <text x="210" y="74" class="t-val-muted">16.00 B</text>
    <text x="210" y="230" class="t-bar-label" text-anchor="middle">BTreeSet</text>
    <text x="210" y="245" class="t-chart-sub" text-anchor="middle">44&#215; larger</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 460" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card-bg { fill: #161b22; stroke: #30363d; stroke-width: 1; rx: 8px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #f0f6fc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #58a6ff; }
      .bar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #c9d1d9; }
      .bar-val { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace; font-size: 12px; font-weight: 600; fill: #f0f6fc; }
      .bar-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
      
      .bar-expanse { fill: #238636; rx: 4px; }
      .bar-expanse-accent { fill: #2ea043; rx: 4px; }
      .bar-roaring { fill: #1f6feb; rx: 4px; }
      .bar-other { fill: #484f58; rx: 4px; }
      .grid { stroke: #21262d; stroke-dasharray: 2,4; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .card-bg { fill: #f6f8fa; stroke: #d0d7de; }
        .title { fill: #1f2328; }
        .subtitle { fill: #656d76; }
        .section-title { fill: #0969da; }
        .bar-label { fill: #1f2328; }
        .bar-val { fill: #1f2328; }
        .bar-sub { fill: #656d76; }
        .bar-other { fill: #afb8c1; }
        .grid { stroke: #eaeef2; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Card 1: Range Scan Throughput -->
  <g transform="translate(20, 20)">
    <rect width="385" height="195" class="card-bg"/>
    <text x="20" y="30" class="section-title">ORDERED RANGE SCAN THROUGHPUT</text>
    <text x="20" y="46" class="subtitle">100,000 sequential 64-bit keys (higher is better)</text>
    
    <!-- ExpanseMap -->
    <text x="20" y="80" class="bar-label">ExpanseMap</text>
    <rect x="120" y="66" width="200" height="18" class="bar-expanse-accent"/>
    <text x="328" y="80" class="bar-val">3.4×</text>
    <text x="125" y="80" class="bar-sub" fill="#ffffff">88.4M keys/s</text>

    <!-- BTreeMap -->
    <text x="20" y="125" class="bar-label">BTreeMap</text>
    <rect x="120" y="111" width="59" height="18" class="bar-other"/>
    <text x="187" y="125" class="bar-val">1.0×</text>
    <text x="125" y="125" class="bar-sub" fill="#ffffff">26.0M</text>

    <text x="20" y="170" class="bar-sub">⚡ 3.4× faster by skipping empty digit branches in cache</text>
  </g>

  <!-- Card 2: Point Lookup Latency -->
  <g transform="translate(435, 20)">
    <rect width="385" height="195" class="card-bg"/>
    <text x="20" y="30" class="section-title">POINT LOOKUP LATENCY</text>
    <text x="20" y="46" class="subtitle">1,000,000 keys random query (lower is better)</text>

    <!-- ExpanseSet -->
    <text x="20" y="75" class="bar-label">ExpanseSet</text>
    <rect x="110" y="61" width="105" height="18" class="bar-expanse"/>
    <text x="223" y="75" class="bar-val">15.8 ns</text>
    <text x="280" y="75" class="bar-sub">(fastest)</text>

    <!-- RoaringBitmap -->
    <text x="20" y="110" class="bar-label">Roaring</text>
    <rect x="110" y="96" width="161" height="18" class="bar-roaring"/>
    <text x="279" y="110" class="bar-val">24.2 ns</text>
    <text x="336" y="110" class="bar-sub">(1.5×)</text>

    <!-- Stock Judy -->
    <text x="20" y="145" class="bar-label">Stock Judy</text>
    <rect x="110" y="131" width="215" height="18" class="bar-other"/>
    <text x="333" y="145" class="bar-val">32.3 ns</text>
    <text x="382" y="145" class="bar-sub"></text>

    <text x="20" y="178" class="bar-sub">⚡ 2.0× faster than Stock Judy via immediate slot bypass</text>
  </g>

  <!-- Card 3: Memory Density on Clustered Sets -->
  <g transform="translate(20, 235)">
    <rect width="800" height="205" class="card-bg"/>
    <text x="20" y="30" class="section-title">MEMORY FOOTPRINT: CLUSTERED &amp; DENSE INTEGER SETS</text>
    <text x="20" y="48" class="subtitle">Bytes per key on 100,000 keys across 256-key clusters (lower is better)</text>

    <!-- ExpanseSet -->
    <text x="20" y="85" class="bar-label">ExpanseSet</text>
    <rect x="130" y="71" width="9" height="20" class="bar-expanse-accent"/>
    <text x="147" y="86" class="bar-val">0.36 B/key</text>
    <text x="240" y="86" class="bar-sub">36 KB total heap — adaptive 256-bit bitmap leaves</text>

    <!-- RoaringBitmap -->
    <text x="20" y="120" class="bar-label">RoaringBitmap</text>
    <rect x="130" y="106" width="10" height="20" class="bar-roaring"/>
    <text x="148" y="121" class="bar-val">0.38 B/key</text>
    <text x="240" y="121" class="bar-sub">38 KB total heap — run/bit container array</text>

    <!-- BTreeSet -->
    <text x="20" y="155" class="bar-label">BTreeSet</text>
    <rect x="130" y="141" width="380" height="20" class="bar-other"/>
    <text x="518" y="156" class="bar-val">16.00 B/key</text>
    <text x="610" y="156" class="bar-sub">1,600 KB (44× larger)</text>

    <text x="20" y="190" class="bar-sub">💾 Expanse achieves 97.7% memory reduction vs BTreeSet while preserving sorted order and O(depth) rank/select</text>
  </g>
</svg>

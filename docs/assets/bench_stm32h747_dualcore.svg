    <text x="207" y="312" class="t-legend" text-anchor="end">evict 25 of 2,000 / remove_range</text>
    <rect x="215" y="290" width="15.7" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="234.7" y="299" class="t-axis-label">1,202 (3,001 ns)</text>

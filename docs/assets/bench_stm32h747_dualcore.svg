    <text x="207" y="52" class="t-legend" text-anchor="end">ingest 2,000 keys / insert</text>
    <rect x="215" y="30" width="15.6" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="234.6" y="39" class="t-axis-label">1,199 (2,993 ns)</text>
    <rect x="215" y="43" width="29.3" height="11" rx="1" style="fill:#93c5fd"/>
    <text x="248.3" y="52" class="t-axis-label">2,249 (5,614 ns)</text>
    <rect x="215" y="56" width="66.2" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="285.2" y="65" class="t-axis-label">5,074 (25,339 ns)</text>
    <text x="207" y="104" class="t-legend" text-anchor="end">CAN dispatch / get</text>
    <rect x="215" y="82" width="3.4" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="222.4" y="91" class="t-axis-label">264 (659 ns)</text>
    <rect x="215" y="95" width="6.4" height="11" rx="1" style="fill:#93c5fd"/>
    <text x="225.4" y="104" class="t-axis-label">491 (1,225 ns)</text>
    <rect x="215" y="108" width="16.1" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="235.1" y="117" class="t-axis-label">1,234 (6,160 ns)</text>
    <text x="207" y="156" class="t-legend" text-anchor="end">evict 600 of 2,000 / per-key loop</text>
    <rect x="215" y="134" width="37.1" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="256.1" y="143" class="t-axis-label">2,847 (7,109 ns)</text>
    <rect x="215" y="147" width="64.3" height="11" rx="1" style="fill:#93c5fd"/>
    <text x="283.3" y="156" class="t-axis-label">4,929 (12,308 ns)</text>
    <rect x="215" y="160" width="144.8" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="363.8" y="169" class="t-axis-label">11,101 (55,435 ns)</text>
    <text x="207" y="208" class="t-legend" text-anchor="end">evict 600 of 2,000 / remove_range</text>
    <rect x="215" y="186" width="13.0" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="232.0" y="195" class="t-axis-label">994 (2,483 ns)</text>
    <rect x="215" y="199" width="21.5" height="11" rx="1" style="fill:#93c5fd"/>
    <text x="240.5" y="208" class="t-axis-label">1,649 (4,117 ns)</text>
    <rect x="215" y="212" width="50.1" height="11" rx="1" style="fill:#f59e0b"/>
    <text x="269.1" y="221" class="t-axis-label">3,844 (19,195 ns)</text>
    <text x="207" y="260" class="t-legend" text-anchor="end">evict 25 of 2,000 / per-key loop</text>
    <rect x="215" y="238" width="36.8" height="11" rx="1" style="fill:#1d4ed8"/>
    <text x="255.8" y="247" class="t-axis-label">2,824 (7,051 ns)</text>
    <rect x="215" y="251" width="62.2" height="11" rx="1" style="fill:#93c5fd"/>

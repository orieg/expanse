  <text x="30" y="390" class="t-note">Measured: mem_used() deterministic byte accounting — host-independent; no wall clock; commit 16003bc0; workload example_keyspace_density.</text>
  <text x="30" y="404" class="t-note">Clearing one top key bit halves the expanses and is exactly a doubling of N, so the three widths share one axis. Source: docs/ARCHITECTURE.md &#167;3.5.</text>

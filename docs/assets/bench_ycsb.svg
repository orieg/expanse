  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <text x="30" y="30" class="t-title">YCSB WORKLOADS A&#8211;F THROUGHPUT</text>
  <text x="30" y="46" class="t-sub">Mops/s &#183; higher is better &#183; N = 100,000, Zipfian theta = 0.99, 128B blobs, seed 0x1234_5678_9ABC, criterion median throughput</text>
  <line x1="30" y1="58" x2="930" y2="58" class="divider"/>
  <g transform="translate(30, 68)">
    <rect x="0" y="0" width="12" height="12" rx="2" class="b-expanse"/>
    <text x="18" y="10" class="t-legend">ExpanseMap (u64)</text>
    <rect x="172" y="0" width="12" height="12" rx="2" class="b-expanse-alt"/>
    <text x="190" y="10" class="t-legend">ExpanseBlobMap (128B)</text>
    <rect x="344" y="0" width="12" height="12" rx="2" class="b-btree"/>
    <text x="362" y="10" class="t-legend">BTreeMap (128B)</text>
    <rect x="516" y="0" width="12" height="12" rx="2" class="b-skipmap"/>
    <text x="534" y="10" class="t-legend">SkipMap (128B)</text>
  </g>

  <rect x="775" y="501.0" width="155" height="18" class="badge-loss"/>
  <text x="852.5" y="514.0" class="badge-loss-text">BTreeMap 1.47x</text>

  <text x="30" y="576" class="t-note">Measured: reference host -- Intel i9-12900F, 24 threads, 30 MiB L3, Ubuntu 22.04 / kernel 6.8, idle &#183; run 33219093994 &#183; benches/ycsb.rs, post-#470 payload-dereference repair</text>
  <text x="30" y="589" class="t-note">The Workload E figure published under #375 is retracted; E is re-measured here and inverts.</text>
</svg>

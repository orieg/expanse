<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 275" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .border { stroke: #30363d; stroke-width: 1px; fill: none; }
      .grid { stroke: #21262d; stroke-width: 1px; stroke-dasharray: 2,3; }
      .axis { stroke: #484f58; stroke-width: 1.5px; }
      .divider { stroke: #21262d; stroke-width: 1px; }
      
      .t-chart-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; fill: #8b949e; text-transform: uppercase; }
      .t-chart-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; fill: #6e7681; }
      .t-unit-header { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #8b949e; }
      .t-axis-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #8b949e; }
      .t-bar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #c9d1d9; }
      
      .t-val-accent { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #3fb950; text-anchor: middle; }
      .t-val-muted { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 500; fill: #8b949e; text-anchor: middle; }
      .t-val-blue { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #58a6ff; text-anchor: middle; }

      .b-expanse { fill: #2ea043; }
      .b-btreemap { fill: #1f6feb; }
      .b-skipmap { fill: #30363d; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .border { stroke: #30363d; }
        .grid { stroke: #21262d; }
        .axis { stroke: #484f58; }
        .divider { stroke: #21262d; }
        .t-chart-title { fill: #8b949e; }
        .t-chart-sub { fill: #6e7681; }
        .t-unit-header { fill: #8b949e; }
        .t-axis-label { fill: #8b949e; }
        .t-bar-label { fill: #c9d1d9; }
        .t-val-accent { fill: #3fb950; }
        .t-val-blue { fill: #58a6ff; }
        .t-val-muted { fill: #8b949e; }
        .b-expanse { fill: #2ea043; }
        .b-btreemap { fill: #1f6feb; }
        .b-skipmap { fill: #30363d; }
      }

      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .border { stroke: #d0d7de; }
        .grid { stroke: #eaeef2; }
        .axis { stroke: #afb8c1; }
        .divider { stroke: #eaeef2; }
        .t-chart-title { fill: #57606a; }
        .t-chart-sub { fill: #8c959f; }
        .t-unit-header { fill: #57606a; }
        .t-axis-label { fill: #57606a; }
        .t-bar-label { fill: #1f2328; }
        .t-val-accent { fill: #1a7f37; }
        .t-val-blue { fill: #0969da; }
        .t-val-muted { fill: #656d76; }
        .b-expanse { fill: #1a7f37; }
        .b-btreemap { fill: #0969da; }
        .b-skipmap { fill: #d0d7de; }
      }

      [data-theme="dark"] .bg, :root[data-theme="dark"] .bg { fill: #0d1117; }
      [data-theme="dark"] .border, :root[data-theme="dark"] .border { stroke: #30363d; }
      [data-theme="dark"] .grid, :root[data-theme="dark"] .grid { stroke: #21262d; }
      [data-theme="dark"] .axis, :root[data-theme="dark"] .axis { stroke: #484f58; }
      [data-theme="dark"] .divider, :root[data-theme="dark"] .divider { stroke: #21262d; }
      [data-theme="dark"] .t-chart-title, :root[data-theme="dark"] .t-chart-title { fill: #8b949e; }
      [data-theme="dark"] .t-chart-sub, :root[data-theme="dark"] .t-chart-sub { fill: #6e7681; }
      [data-theme="dark"] .t-unit-header, :root[data-theme="dark"] .t-unit-header { fill: #8b949e; }
      [data-theme="dark"] .t-axis-label, :root[data-theme="dark"] .t-axis-label { fill: #8b949e; }
      [data-theme="dark"] .t-bar-label, :root[data-theme="dark"] .t-bar-label { fill: #c9d1d9; }
      [data-theme="dark"] .t-val-accent, :root[data-theme="dark"] .t-val-accent { fill: #3fb950; }
      [data-theme="dark"] .t-val-blue, :root[data-theme="dark"] .t-val-blue { fill: #58a6ff; }
      [data-theme="dark"] .t-val-muted, :root[data-theme="dark"] .t-val-muted { fill: #8b949e; }
      [data-theme="dark"] .b-expanse, :root[data-theme="dark"] .b-expanse { fill: #2ea043; }
      [data-theme="dark"] .b-btreemap, :root[data-theme="dark"] .b-btreemap { fill: #1f6feb; }
      [data-theme="dark"] .b-skipmap, :root[data-theme="dark"] .b-skipmap { fill: #30363d; }

      [data-theme="light"] .bg, :root[data-theme="light"] .bg { fill: #ffffff; }
      [data-theme="light"] .border, :root[data-theme="light"] .border { stroke: #d0d7de; }
      [data-theme="light"] .grid, :root[data-theme="light"] .grid { stroke: #eaeef2; }
      [data-theme="light"] .axis, :root[data-theme="light"] .axis { stroke: #afb8c1; }
      [data-theme="light"] .divider, :root[data-theme="light"] .divider { stroke: #eaeef2; }
      [data-theme="light"] .t-chart-title, :root[data-theme="light"] .t-chart-title { fill: #57606a; }
      [data-theme="light"] .t-chart-sub, :root[data-theme="light"] .t-chart-sub { fill: #8c959f; }
      [data-theme="light"] .t-unit-header, :root[data-theme="light"] .t-unit-header { fill: #57606a; }
      [data-theme="light"] .t-axis-label, :root[data-theme="light"] .t-axis-label { fill: #57606a; }
      [data-theme="light"] .t-bar-label, :root[data-theme="light"] .t-bar-label { fill: #1f2328; }
      [data-theme="light"] .t-val-accent, :root[data-theme="light"] .t-val-accent { fill: #1a7f37; }
      [data-theme="light"] .t-val-blue, :root[data-theme="light"] .t-val-blue { fill: #0969da; }
      [data-theme="light"] .t-val-muted, :root[data-theme="light"] .t-val-muted { fill: #656d76; }
      [data-theme="light"] .b-expanse, :root[data-theme="light"] .b-expanse { fill: #1a7f37; }
      [data-theme="light"] .b-btreemap, :root[data-theme="light"] .b-btreemap { fill: #0969da; }
      [data-theme="light"] .b-skipmap, :root[data-theme="light"] .b-skipmap { fill: #d0d7de; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <!-- ================= CHART 1: YCSB WORKLOAD E (RANGE SCANS) ================= -->
  <g transform="translate(30, 20)">
    <text x="0" y="0" class="t-chart-title">YCSB Workload E (OLAP Scan)</text>
    <text x="0" y="13" class="t-chart-sub">95% Range Scan, 5% Insert (higher is better)</text>
    <text x="0" y="29" class="t-unit-header">&#9650; Throughput (M ops / sec)</text>

    <!-- Y Axis: 0 to 15M -->
    <line x1="30" y1="45" x2="250" y2="45" class="grid"/>
    <text x="22" y="48" class="t-axis-label" text-anchor="end">15M</text>
    
    <line x1="30" y1="120" x2="250" y2="120" class="grid"/>
    <text x="22" y="123" class="t-axis-label" text-anchor="end">7.5M</text>
    
    <line x1="30" y1="195" x2="250" y2="195" class="axis"/>
    <text x="22" y="198" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="195" class="axis"/>

    <!-- Bar 1: ExpanseBlobMap (13.22M -> height = 132.2, y = 62.8) -->
    <rect x="42" y="62.8" width="55" height="132.2" class="b-expanse" rx="2"/>
    <text x="69.5" y="55" class="t-val-accent">13.2 M/s</text>
    <text x="69.5" y="214" class="t-bar-label" text-anchor="middle">Expanse</text>
    <text x="69.5" y="228" class="t-chart-sub" text-anchor="middle" fill="#3fb950">7.3&#215; speedup</text>

    <!-- Bar 2: BTreeMap (3.52M -> height = 35.2, y = 159.8) -->
    <rect x="114" y="159.8" width="55" height="35.2" class="b-btreemap" rx="2"/>
    <text x="141.5" y="152" class="t-val-blue">3.52 M/s</text>
    <text x="141.5" y="214" class="t-bar-label" text-anchor="middle">BTreeMap</text>
    <text x="141.5" y="228" class="t-chart-sub" text-anchor="middle">2.0&#215;</text>

    <!-- Bar 3: SkipMap (1.80M -> height = 18.0, y = 177.0) -->
    <rect x="186" y="177.0" width="55" height="18.0" class="b-skipmap" rx="2"/>
    <text x="213.5" y="169" class="t-val-muted">1.80 M/s</text>
    <text x="213.5" y="214" class="t-bar-label" text-anchor="middle">SkipMap</text>
    <text x="213.5" y="228" class="t-chart-sub" text-anchor="middle">1.0&#215; baseline</text>
  </g>

  <!-- Divider 1 -->
  <line x1="315" y1="20" x2="315" y2="255" class="divider"/>

  <!-- ================= CHART 2: YCSB WORKLOAD F (READ-MODIFY-WRITE) ================= -->
  <g transform="translate(345, 20)">
    <text x="0" y="0" class="t-chart-title">YCSB Workload F (Atomic RMW)</text>
    <text x="0" y="13" class="t-chart-sub">50% Read, 50% RMW (higher is better)</text>
    <text x="0" y="29" class="t-unit-header">&#9650; Throughput (M ops / sec)</text>

    <!-- Y Axis: 0 to 16M -->
    <line x1="30" y1="45" x2="250" y2="45" class="grid"/>
    <text x="22" y="48" class="t-axis-label" text-anchor="end">16M</text>
    
    <line x1="30" y1="120" x2="250" y2="120" class="grid"/>
    <text x="22" y="123" class="t-axis-label" text-anchor="end">8.0M</text>
    
    <line x1="30" y1="195" x2="250" y2="195" class="axis"/>
    <text x="22" y="198" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="195" class="axis"/>

    <!-- Bar 1: ExpanseBlobMap (14.27M -> height = 133.8, y = 61.2) -->
    <rect x="42" y="61.2" width="55" height="133.8" class="b-expanse" rx="2"/>
    <text x="69.5" y="53" class="t-val-accent">14.3 M/s</text>
    <text x="69.5" y="214" class="t-bar-label" text-anchor="middle">Expanse</text>
    <text x="69.5" y="228" class="t-chart-sub" text-anchor="middle" fill="#3fb950">8.1&#215; speedup</text>

    <!-- Bar 2: BTreeMap (3.71M -> height = 34.8, y = 160.2) -->
    <rect x="114" y="160.2" width="55" height="34.8" class="b-btreemap" rx="2"/>
    <text x="141.5" y="152" class="t-val-blue">3.71 M/s</text>
    <text x="141.5" y="214" class="t-bar-label" text-anchor="middle">BTreeMap</text>
    <text x="141.5" y="228" class="t-chart-sub" text-anchor="middle">2.1&#215;</text>

    <!-- Bar 3: SkipMap (1.76M -> height = 16.5, y = 178.5) -->
    <rect x="186" y="178.5" width="55" height="16.5" class="b-skipmap" rx="2"/>
    <text x="213.5" y="171" class="t-val-muted">1.76 M/s</text>
    <text x="213.5" y="214" class="t-bar-label" text-anchor="middle">SkipMap</text>
    <text x="213.5" y="228" class="t-chart-sub" text-anchor="middle">1.0&#215; baseline</text>
  </g>

  <!-- Divider 2 -->
  <line x1="635" y1="20" x2="635" y2="255" class="divider"/>

  <!-- ================= CHART 3: SMALL PAYLOAD INLINING (POINT GET) ================= -->
  <g transform="translate(665, 20)">
    <text x="0" y="0" class="t-chart-title">Small-Payload Inlining</text>
    <text x="0" y="13" class="t-chart-sub">&#8804; 7B payloads, zero heap alloc (lower is better)</text>
    <text x="0" y="29" class="t-unit-header">&#9660; Latency (ns / op)</text>

    <!-- Y Axis: 0 to 70 ns -->
    <line x1="30" y1="45" x2="250" y2="45" class="grid"/>
    <text x="22" y="48" class="t-axis-label" text-anchor="end">70 ns</text>
    
    <line x1="30" y1="120" x2="250" y2="120" class="grid"/>
    <text x="22" y="123" class="t-axis-label" text-anchor="end">35 ns</text>
    
    <line x1="30" y1="195" x2="250" y2="195" class="axis"/>
    <text x="22" y="198" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="195" class="axis"/>

    <!-- Bar 1: Expanse (5.7ns -> height = 5.7 * 2.14 = 12.2, y = 182.8) -->
    <rect x="55" y="182.8" width="70" height="12.2" class="b-expanse" rx="2"/>
    <text x="90" y="174" class="t-val-accent">5.7 ns</text>
    <text x="90" y="214" class="t-bar-label" text-anchor="middle">ExpanseBlobMap</text>
    <text x="90" y="228" class="t-chart-sub" text-anchor="middle" fill="#3fb950">5.1&#215; faster (0 alloc)</text>

    <!-- Bar 2: BTreeMap (29.0ns -> height = 29.0 * 2.14 = 62.1, y = 132.9) -->
    <rect x="155" y="132.9" width="70" height="62.1" class="b-btreemap" rx="2"/>
    <text x="190" y="124" class="t-val-blue">29.0 ns</text>
    <text x="190" y="214" class="t-bar-label" text-anchor="middle">BTreeMap (Heap)</text>
    <text x="190" y="228" class="t-chart-sub" text-anchor="middle">1.0&#215; (16B header)</text>
  </g>
</svg>

  <text x="30" y="468" class="t-note">Workload E, separate axis (max 1.259 Mops/s) &#8212; Plotted on its own axis: every arm is an order of magnitude below A-D/F, and BTreeMap wins.</text>
  <text x="30" y="493" class="t-bar-label">Workload E</text>
  <text x="30" y="506" class="t-sub">95% Short Range Scan / 5% Insert</text>

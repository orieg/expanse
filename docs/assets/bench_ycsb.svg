  <text x="700" y="108" class="t-row-accent" text-anchor="end">20.49</text>
  <rect x="300.0" y="113" width="291.2" height="9" rx="2" class="b-expanse-alt"/>
  <text x="700" y="121" class="t-row-muted" text-anchor="end">20.23</text>
  <rect x="300.0" y="126" width="61.2" height="9" rx="2" class="b-btree"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { stroke: #e2e8f0; stroke-width: 1px; fill: none; }
      .grid { stroke: #f1f5f9; stroke-width: 1px; stroke-dasharray: 2,3; }
      .axis { stroke: #cbd5e1; stroke-width: 1.5px; }
      .divider { stroke: #e2e8f0; stroke-width: 1px; }

      .t-chart-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; fill: #0f172a; text-transform: uppercase; }
      .t-chart-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #334155; }
      .t-unit-header { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .t-axis-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 500; fill: #475569; }
      .t-win { fill: #16a34a; font-weight: 600; }
      .t-bar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }

      .t-val-accent { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #16a34a; text-anchor: middle; }
      .t-val-muted { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .t-val-blue { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #2563eb; text-anchor: middle; }

      .b-expanse { fill: #16a34a; }
      .b-hashmap { fill: #2563eb; }
      .b-stdmap { fill: #475569; }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .bg { fill: #0b1220; }
        :root:not([data-theme="light"]) .border { stroke: #1e293b; }
        :root:not([data-theme="light"]) .grid { stroke: #16233b; }
        :root:not([data-theme="light"]) .axis { stroke: #334155; }
        :root:not([data-theme="light"]) .divider { stroke: #1e293b; }
        :root:not([data-theme="light"]) .t-chart-title { fill: #e2e8f0; }
        :root:not([data-theme="light"]) .t-chart-sub { fill: #94a3b8; }
        :root:not([data-theme="light"]) .t-unit-header, :root:not([data-theme="light"]) .t-axis-label { fill: #64748b; }
        :root:not([data-theme="light"]) .t-bar-label { fill: #e2e8f0; }
        :root:not([data-theme="light"]) .t-val-muted { fill: #94a3b8; }
        :root:not([data-theme="light"]) .t-win { fill: #4ade80; }
        :root:not([data-theme="light"]) .t-val-accent { fill: #4ade80; }
        :root:not([data-theme="light"]) .t-val-blue { fill: #60a5fa; }
        :root:not([data-theme="light"]) .b-expanse { fill: #22c55e; }
        :root:not([data-theme="light"]) .b-hashmap { fill: #3b82f6; }
        :root:not([data-theme="light"]) .b-stdmap { fill: #475569; }
      }
      [data-theme="dark"] .bg, :root[data-theme="dark"] .bg { fill: #0b1220; }
      [data-theme="dark"] .border, :root[data-theme="dark"] .border { stroke: #1e293b; }
      [data-theme="dark"] .grid, :root[data-theme="dark"] .grid { stroke: #16233b; }
      [data-theme="dark"] .axis, :root[data-theme="dark"] .axis { stroke: #334155; }
      [data-theme="dark"] .divider, :root[data-theme="dark"] .divider { stroke: #1e293b; }
      [data-theme="dark"] .t-chart-title, :root[data-theme="dark"] .t-chart-title { fill: #e2e8f0; }
      [data-theme="dark"] .t-chart-sub, :root[data-theme="dark"] .t-chart-sub { fill: #94a3b8; }
      [data-theme="dark"] .t-unit-header, :root[data-theme="dark"] .t-unit-header { fill: #64748b; }
      [data-theme="dark"] .t-axis-label, :root[data-theme="dark"] .t-axis-label { fill: #64748b; }
      [data-theme="dark"] .t-bar-label, :root[data-theme="dark"] .t-bar-label { fill: #e2e8f0; }
      [data-theme="dark"] .t-val-muted, :root[data-theme="dark"] .t-val-muted { fill: #94a3b8; }
      [data-theme="dark"] .t-win, :root[data-theme="dark"] .t-win { fill: #4ade80; }
      [data-theme="dark"] .t-val-accent, :root[data-theme="dark"] .t-val-accent { fill: #4ade80; }
      [data-theme="dark"] .t-val-blue, :root[data-theme="dark"] .t-val-blue { fill: #60a5fa; }
      [data-theme="dark"] .b-expanse, :root[data-theme="dark"] .b-expanse { fill: #22c55e; }
      [data-theme="dark"] .b-hashmap, :root[data-theme="dark"] .b-hashmap { fill: #3b82f6; }
      [data-theme="dark"] .b-stdmap, :root[data-theme="dark"] .b-stdmap { fill: #475569; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <g transform="translate(30, 20)">
    <text x="0" y="0" class="t-chart-title">Sensor TSDB Density</text>
    <text x="0" y="13" class="t-chart-sub">1 kHz timestamps, N=2,000 &#183; derived &#183; lower is better</text>
    <text x="0" y="29" class="t-unit-header">&#9660; SRAM (Bytes / key)</text>
    <line x1="30" y1="45" x2="250" y2="45" class="grid"/>
    <text x="22" y="48" class="t-axis-label" text-anchor="end">40 B</text>
    <line x1="30" y1="120" x2="250" y2="120" class="grid"/>
    <text x="22" y="123" class="t-axis-label" text-anchor="end">20 B</text>
    <line x1="30" y1="195" x2="250" y2="195" class="axis"/>
    <text x="22" y="198" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="195" class="axis"/>
    <rect x="45" y="178.4" width="50" height="16.6" class="b-expanse" rx="2"/>
    <text x="70" y="169.9" class="t-val-accent">4.42</text>
    <text x="70" y="214" class="t-bar-label" text-anchor="middle">Expanse</text>
    <text x="70" y="228" class="t-chart-sub t-win" text-anchor="middle">7.2&#215; denser</text>
    <rect x="115" y="87.0" width="50" height="108.0" class="b-hashmap" rx="2"/>
    <text x="140" y="78.5" class="t-val-blue">29</text>
    <text x="140" y="214" class="t-bar-label" text-anchor="middle">HashMap</text>
    <text x="140" y="228" class="t-chart-sub" text-anchor="middle">reserved</text>
    <rect x="185" y="75.0" width="50" height="120.0" class="b-stdmap" rx="2"/>
    <text x="210" y="66.5" class="t-val-muted">32</text>
    <text x="210" y="214" class="t-bar-label" text-anchor="middle">std::map</text>
    <text x="210" y="228" class="t-chart-sub" text-anchor="middle">rb-tree</text>
  </g>

  <line x1="330" y1="20" x2="330" y2="245" class="divider"/>

  <g transform="translate(350, 20)">
    <text x="0" y="0" class="t-chart-title">Telemetry Ingest</text>
    <text x="0" y="13" class="t-chart-sub">per event, incl. flush share &#183; measured &#183; lower is better</text>
    <text x="0" y="29" class="t-unit-header">&#9660; ns / event</text>
    <line x1="30" y1="45" x2="250" y2="45" class="grid"/>
    <text x="22" y="48" class="t-axis-label" text-anchor="end">50</text>
    <line x1="30" y1="120" x2="250" y2="120" class="grid"/>
    <text x="22" y="123" class="t-axis-label" text-anchor="end">25</text>
    <line x1="30" y1="195" x2="250" y2="195" class="axis"/>
    <text x="22" y="198" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="195" class="axis"/>
    <rect x="45" y="71.2" width="50" height="123.8" class="b-expanse" rx="2"/>
    <text x="70" y="62.7" class="t-val-accent">41</text>
    <text x="70" y="214" class="t-bar-label" text-anchor="middle">Expanse</text>
    <text x="70" y="228" class="t-chart-sub" text-anchor="middle">13.1&#215; slower</text>
    <rect x="115" y="185.6" width="50" height="9.4" class="b-hashmap" rx="2"/>
    <text x="140" y="177.1" class="t-val-blue">3.1</text>
    <text x="140" y="214" class="t-bar-label" text-anchor="middle">HashMap</text>
    <text x="140" y="228" class="t-chart-sub" text-anchor="middle">unordered</text>
    <rect x="185" y="110.0" width="50" height="85.0" class="b-stdmap" rx="2"/>
    <text x="210" y="101.5" class="t-val-muted">28</text>
    <text x="210" y="214" class="t-bar-label" text-anchor="middle">BTreeMap</text>
    <text x="210" y="228" class="t-chart-sub" text-anchor="middle">ordered</text>
  </g>

  <line x1="650" y1="20" x2="650" y2="245" class="divider"/>

  <g transform="translate(670, 20)">
    <text x="0" y="0" class="t-chart-title">CAN ID Dispatch</text>
    <text x="0" y="13" class="t-chart-sub">29-bit IDs, N=500 &#183; measured &#183; lower is better</text>
    <text x="0" y="29" class="t-unit-header">&#9660; ns / lookup</text>
    <line x1="30" y1="45" x2="250" y2="45" class="grid"/>
    <text x="22" y="48" class="t-axis-label" text-anchor="end">15</text>
    <line x1="30" y1="120" x2="250" y2="120" class="grid"/>
    <text x="22" y="123" class="t-axis-label" text-anchor="end">7.5</text>
    <line x1="30" y1="195" x2="250" y2="195" class="axis"/>
    <text x="22" y="198" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="195" class="axis"/>
    <rect x="45" y="67.2" width="50" height="127.8" class="b-expanse" rx="2"/>
    <text x="70" y="58.7" class="t-val-accent">12.8</text>
    <text x="70" y="214" class="t-bar-label" text-anchor="middle">Expanse</text>
    <text x="70" y="228" class="t-chart-sub" text-anchor="middle">9.0&#215; slower</text>
    <rect x="115" y="180.8" width="50" height="14.2" class="b-hashmap" rx="2"/>
    <text x="140" y="172.3" class="t-val-blue">1.4</text>
    <text x="140" y="214" class="t-bar-label" text-anchor="middle">HashMap</text>
    <text x="140" y="228" class="t-chart-sub" text-anchor="middle">unordered</text>
    <rect x="185" y="125.6" width="50" height="69.4" class="b-stdmap" rx="2"/>
    <text x="210" y="117.1" class="t-val-muted">6.9</text>
    <text x="210" y="214" class="t-bar-label" text-anchor="middle">BTreeMap</text>
    <text x="210" y="228" class="t-chart-sub" text-anchor="middle">ordered</text>
  </g>

  <line x1="970" y1="20" x2="970" y2="245" class="divider"/>

  <g transform="translate(990, 20)">
    <text x="0" y="0" class="t-chart-title">Stale-Device Expiry</text>
    <text x="0" y="13" class="t-chart-sub">evict 25 stale of 2,000 tracked &#183; measured</text>
    <text x="0" y="29" class="t-unit-header">&#9660; &#181;s / housekeeping pass</text>
    <line x1="30" y1="45" x2="250" y2="45" class="grid"/>
    <text x="22" y="48" class="t-axis-label" text-anchor="end">5</text>
    <line x1="30" y1="120" x2="250" y2="120" class="grid"/>
    <text x="22" y="123" class="t-axis-label" text-anchor="end">2.5</text>
    <line x1="30" y1="195" x2="250" y2="195" class="axis"/>
    <text x="22" y="198" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="195" class="axis"/>
    <rect x="60" y="76.8" width="50" height="118.2" class="b-expanse" rx="2"/>
    <text x="85" y="68.3" class="t-val-accent">3.9</text>
    <text x="85" y="214" class="t-bar-label" text-anchor="middle">Expanse</text>
    <text x="85" y="228" class="t-chart-sub" text-anchor="middle">1.3&#215; slower</text>
    <rect x="170" y="103.9" width="50" height="91.1" class="b-hashmap" rx="2"/>
    <text x="195" y="95.4" class="t-val-blue">3.0</text>
    <text x="195" y="214" class="t-bar-label" text-anchor="middle">HashMap</text>
    <text x="195" y="228" class="t-chart-sub" text-anchor="middle">scans all 2k</text>
  </g>

  <text x="30" y="262" class="t-chart-sub">Panel 1 derived by scripts/embedded_envelope.py; panels 2-4 measured: 12th Gen Intel(R) Core(TM) i9-12900F (24 threads, 30 MiB L3, Linux 6.8.0-136-generic).</text>
  <text x="30" y="275" class="t-chart-sub">Expiry scaling: Expanse&#8217;s pass cost follows the stale count; the HashMap sweep follows the tracked count (~68 KiB flat table, L2-resident on this host) &#183; bulk shape (600 of 2,000 expired): dual-trie 87 &#181;s vs sweep 7.3 &#181;s — the linear sweep wins bulk expiry.</text>
  <text x="700" y="262" class="t-chart-sub">Commit 1402a606c, run 33550404527 &#183; BCa 95% CIs in docs/benchmarks/embedded/results.json.</text>
  <text x="30" y="288" class="t-chart-sub">Host caveat: a 30 MiB L3 flatters flat scans; the on-device ESP32-C3/C6 chart is pending the first hardware harvest.</text>
</svg>

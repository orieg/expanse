<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 300" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .border { stroke: #e2e8f0; stroke-width: 1px; fill: none; }
      .grid { stroke: #f1f5f9; stroke-width: 1px; stroke-dasharray: 2,3; }
      .axis { stroke: #cbd5e1; stroke-width: 1.5px; }
      .divider { stroke: #e2e8f0; stroke-width: 1px; }

      .t-chart-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; fill: #0f172a; text-transform: uppercase; }
      .t-chart-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #334155; }
      .t-unit-header { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .t-axis-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 500; fill: #475569; }
      .t-win { fill: #16a34a; font-weight: 600; }
      .t-bar-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #0f172a; }

      .t-val-accent { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #16a34a; text-anchor: middle; }
      .t-val-muted { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .t-val-blue { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 600; fill: #2563eb; text-anchor: middle; }

      .b-expanse { fill: #16a34a; }
      .b-hashmap { fill: #2563eb; }
      .b-stdmap { fill: #475569; }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .bg { fill: #0b1220; }
        :root:not([data-theme="light"]) .border { stroke: #1e293b; }
        :root:not([data-theme="light"]) .grid { stroke: #16233b; }
        :root:not([data-theme="light"]) .axis { stroke: #334155; }
        :root:not([data-theme="light"]) .divider { stroke: #1e293b; }
        :root:not([data-theme="light"]) .t-chart-title { fill: #e2e8f0; }
        :root:not([data-theme="light"]) .t-chart-sub { fill: #94a3b8; }
        :root:not([data-theme="light"]) .t-unit-header, :root:not([data-theme="light"]) .t-axis-label { fill: #64748b; }
        :root:not([data-theme="light"]) .t-bar-label { fill: #e2e8f0; }
        :root:not([data-theme="light"]) .t-val-muted { fill: #94a3b8; }
        :root:not([data-theme="light"]) .t-win { fill: #4ade80; }
        :root:not([data-theme="light"]) .t-val-accent { fill: #4ade80; }
        :root:not([data-theme="light"]) .t-val-blue { fill: #60a5fa; }
        :root:not([data-theme="light"]) .b-expanse { fill: #22c55e; }
        :root:not([data-theme="light"]) .b-hashmap { fill: #3b82f6; }
        :root:not([data-theme="light"]) .b-stdmap { fill: #475569; }
      }
      [data-theme="dark"] .bg, :root[data-theme="dark"] .bg { fill: #0b1220; }
      [data-theme="dark"] .border, :root[data-theme="dark"] .border { stroke: #1e293b; }
      [data-theme="dark"] .grid, :root[data-theme="dark"] .grid { stroke: #16233b; }
      [data-theme="dark"] .axis, :root[data-theme="dark"] .axis { stroke: #334155; }
      [data-theme="dark"] .divider, :root[data-theme="dark"] .divider { stroke: #1e293b; }
      [data-theme="dark"] .t-chart-title, :root[data-theme="dark"] .t-chart-title { fill: #e2e8f0; }
      [data-theme="dark"] .t-chart-sub, :root[data-theme="dark"] .t-chart-sub { fill: #94a3b8; }
      [data-theme="dark"] .t-unit-header, :root[data-theme="dark"] .t-unit-header { fill: #64748b; }
      [data-theme="dark"] .t-axis-label, :root[data-theme="dark"] .t-axis-label { fill: #64748b; }
      [data-theme="dark"] .t-bar-label, :root[data-theme="dark"] .t-bar-label { fill: #e2e8f0; }
      [data-theme="dark"] .t-val-muted, :root[data-theme="dark"] .t-val-muted { fill: #94a3b8; }
      [data-theme="dark"] .t-win, :root[data-theme="dark"] .t-win { fill: #4ade80; }
      [data-theme="dark"] .t-val-accent, :root[data-theme="dark"] .t-val-accent { fill: #4ade80; }
      [data-theme="dark"] .t-val-blue, :root[data-theme="dark"] .t-val-blue { fill: #60a5fa; }
      [data-theme="dark"] .b-expanse, :root[data-theme="dark"] .b-expanse { fill: #22c55e; }
      [data-theme="dark"] .b-hashmap, :root[data-theme="dark"] .b-hashmap { fill: #3b82f6; }
      [data-theme="dark"] .b-stdmap, :root[data-theme="dark"] .b-stdmap { fill: #475569; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <g transform="translate(30, 20)">
    <text x="0" y="0" class="t-chart-title">Ingest: Keys In Order</text>
    <text x="0" y="13" class="t-chart-sub">N=2,000 &#183; ratio vs sorted array</text>
    <text x="0" y="29" class="t-unit-header">&#9660; CPU cycles / op</text>
    <line x1="30" y1="45" x2="250" y2="45" class="grid"/>
    <text x="22" y="48" class="t-axis-label" text-anchor="end">4,000</text>
    <line x1="30" y1="120" x2="250" y2="120" class="grid"/>
    <text x="22" y="123" class="t-axis-label" text-anchor="end">2,000</text>
    <line x1="30" y1="195" x2="250" y2="195" class="axis"/>
    <text x="22" y="198" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="195" class="axis"/>
    <rect x="32" y="63.0" width="46" height="132.0" class="b-expanse" rx="2"/>
    <text x="55" y="54.5" class="t-val-muted">3,520</text>
    <text x="55" y="214" class="t-bar-label" text-anchor="middle">Expanse</text>
    <text x="55" y="228" class="t-chart-sub" text-anchor="middle">2.3&#215; slower</text>
    <rect x="90" y="144.8" width="46" height="50.2" class="b-hashmap" rx="2"/>
    <text x="113" y="136.3" class="t-val-blue">1,337</text>
    <text x="113" y="214" class="t-bar-label" text-anchor="middle">hash</text>
    <text x="113" y="228" class="t-chart-sub" text-anchor="middle">no order</text>
    <rect x="148" y="138.3" width="46" height="56.7" class="b-stdmap" rx="2"/>
    <text x="171" y="129.8" class="t-val-muted">1,513</text>
    <text x="171" y="214" class="t-bar-label" text-anchor="middle">sorted</text>
    <text x="171" y="228" class="t-chart-sub" text-anchor="middle">appends</text>
    <rect x="206" y="144.8" width="46" height="50.2" class="b-stdmap" rx="2"/>
    <text x="229" y="136.3" class="t-val-muted">1,339</text>
    <text x="229" y="214" class="t-bar-label" text-anchor="middle">ring</text>
    <text x="229" y="228" class="t-chart-sub" text-anchor="middle">no index</text>
  </g>

  <line x1="330" y1="20" x2="330" y2="245" class="divider"/>

  <g transform="translate(350, 20)">
    <text x="0" y="0" class="t-chart-title">Ingest: Keys Shuffled</text>
    <text x="0" y="13" class="t-chart-sub">N=2,000 &#183; ratio vs sorted array</text>
    <text x="0" y="29" class="t-unit-header">&#9660; CPU cycles / op</text>
    <line x1="30" y1="45" x2="250" y2="45" class="grid"/>
    <text x="22" y="48" class="t-axis-label" text-anchor="end">50,000</text>
    <line x1="30" y1="120" x2="250" y2="120" class="grid"/>
    <text x="22" y="123" class="t-axis-label" text-anchor="end">25,000</text>
    <line x1="30" y1="195" x2="250" y2="195" class="axis"/>
    <text x="22" y="198" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="195" class="axis"/>
    <rect x="32" y="183.1" width="46" height="11.9" class="b-expanse" rx="2"/>
    <text x="55" y="174.6" class="t-val-accent">3,981</text>
    <text x="55" y="214" class="t-bar-label" text-anchor="middle">Expanse</text>
    <text x="55" y="228" class="t-chart-sub t-win" text-anchor="middle">9.2&#215; faster</text>
    <rect x="90" y="191.0" width="46" height="4.0" class="b-hashmap" rx="2"/>
    <text x="113" y="182.5" class="t-val-blue">1,338</text>
    <text x="113" y="214" class="t-bar-label" text-anchor="middle">hash</text>
    <text x="113" y="228" class="t-chart-sub" text-anchor="middle">no order</text>
    <rect x="148" y="84.9" width="46" height="110.1" class="b-stdmap" rx="2"/>
    <text x="171" y="76.4" class="t-val-muted">36,687</text>
    <text x="171" y="214" class="t-bar-label" text-anchor="middle">sorted</text>
    <text x="171" y="228" class="t-chart-sub" text-anchor="middle">memmove</text>
  </g>

  <line x1="650" y1="20" x2="650" y2="245" class="divider"/>

  <g transform="translate(670, 20)">
    <text x="0" y="0" class="t-chart-title">Range Scan</text>
    <text x="0" y="13" class="t-chart-sub">per key walked &#183; ratio vs sorted array</text>
    <text x="0" y="29" class="t-unit-header">&#9660; CPU cycles / key</text>
    <line x1="30" y1="45" x2="250" y2="45" class="grid"/>
    <text x="22" y="48" class="t-axis-label" text-anchor="end">500</text>
    <line x1="30" y1="120" x2="250" y2="120" class="grid"/>
    <text x="22" y="123" class="t-axis-label" text-anchor="end">250</text>
    <line x1="30" y1="195" x2="250" y2="195" class="axis"/>
    <text x="22" y="198" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="195" class="axis"/>
    <rect x="32" y="66.1" width="46" height="128.9" class="b-expanse" rx="2"/>
    <text x="55" y="57.6" class="t-val-muted">430</text>
    <text x="55" y="214" class="t-bar-label" text-anchor="middle">Expanse</text>
    <text x="55" y="228" class="t-chart-sub" text-anchor="middle">8.1&#215; slower</text>
    <rect x="90" y="151.1" width="46" height="43.9" class="b-hashmap" rx="2"/>
    <text x="113" y="142.6" class="t-val-blue">146</text>
    <text x="113" y="214" class="t-bar-label" text-anchor="middle">hash</text>
    <text x="113" y="228" class="t-chart-sub" text-anchor="middle">scan all</text>
    <rect x="148" y="179.2" width="46" height="15.8" class="b-stdmap" rx="2"/>
    <text x="171" y="170.7" class="t-val-muted">53</text>
    <text x="171" y="214" class="t-bar-label" text-anchor="middle">sorted</text>
    <text x="171" y="228" class="t-chart-sub" text-anchor="middle">contig.</text>
    <rect x="206" y="173.4" width="46" height="21.6" class="b-stdmap" rx="2"/>
    <text x="229" y="164.9" class="t-val-muted">72</text>
    <text x="229" y="214" class="t-bar-label" text-anchor="middle">ring</text>
    <text x="229" y="228" class="t-chart-sub" text-anchor="middle">scan all</text>
  </g>

  <line x1="970" y1="20" x2="970" y2="245" class="divider"/>

  <g transform="translate(990, 20)">
    <text x="0" y="0" class="t-chart-title">Memory Per Key</text>
    <text x="0" y="13" class="t-chart-sub">live heap delta &#183; N=2,000</text>
    <text x="0" y="29" class="t-unit-header">&#9660; bytes / key</text>
    <line x1="30" y1="45" x2="250" y2="45" class="grid"/>
    <text x="22" y="48" class="t-axis-label" text-anchor="end">25 B</text>
    <line x1="30" y1="120" x2="250" y2="120" class="grid"/>
    <text x="22" y="123" class="t-axis-label" text-anchor="end">12 B</text>
    <line x1="30" y1="195" x2="250" y2="195" class="axis"/>
    <text x="22" y="198" class="t-axis-label" text-anchor="end">0</text>
    <line x1="30" y1="40" x2="30" y2="195" class="axis"/>
    <rect x="32" y="161.2" width="46" height="33.8" class="b-expanse" rx="2"/>
    <text x="55" y="152.7" class="t-val-accent">5.64</text>
    <text x="55" y="214" class="t-bar-label" text-anchor="middle">Expanse</text>
    <text x="55" y="228" class="t-chart-sub t-win" text-anchor="middle">1.5&#215; denser</text>
    <rect x="90" y="145.5" width="46" height="49.5" class="b-stdmap" rx="2"/>
    <text x="113" y="137.0" class="t-val-muted">8.25</text>
    <text x="113" y="214" class="t-bar-label" text-anchor="middle">sorted</text>
    <text x="113" y="228" class="t-chart-sub" text-anchor="middle">flat 8B</text>
    <rect x="148" y="84.0" width="46" height="111.0" class="b-hashmap" rx="2"/>
    <text x="171" y="75.5" class="t-val-blue">18.50</text>
    <text x="171" y="214" class="t-bar-label" text-anchor="middle">hash</text>
    <text x="171" y="228" class="t-chart-sub" text-anchor="middle">0.7 load</text>
  </g>

  <text x="30" y="262" class="t-chart-sub">Measured on esp32 rev v301 &#183; 160 MHz &#183; ESP-IDF v6.0-dev-2980-gab149384e1 &#183; engine 0.5.0-dev (v0.5.0-91-ge310a9e7) &#183; 10 reps/arm, BCa 95% CIs.</text>
  <text x="30" y="275" class="t-chart-sub">Every arm runs under the same FreeRTOS recursive mutex, stores the same payload and retires the same set. The sorted array is the same container in both ingest panels: order of arrival is the only difference.</text>
  <text x="30" y="288" class="t-chart-sub">Not shown: BLE point lookup, where Expanse is 1.6x faster than the hash twin, and TTL eviction, where it loses at both expiry regimes measured. Full table in docs/DATABASE.md &#167;5.4.</text>
</svg>

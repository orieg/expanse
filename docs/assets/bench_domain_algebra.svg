    <line x1="88.0" y1="38.0" x2="88.0" y2="234.0" class="grid"/>
    <line x1="121.3" y1="38.0" x2="121.3" y2="234.0" class="grid"/>
    <line x1="154.6" y1="38.0" x2="154.6" y2="234.0" class="grid"/>
    <line x1="187.9" y1="38.0" x2="187.9" y2="234.0" class="grid"/>

  <rect x="325" y="50" width="105" height="17" class="badge-win"/>
  <text x="377.5" y="62.0" class="badge-win-text">30.3x vs v1</text>
    <text x="0" y="115" class="t-bar-label">Clustered</text>
    <rect x="78" y="96" width="56.7" height="8" rx="1.5" class="b-expanse"/>
    <text x="139.7" y="103.5" class="t-val-green">24.3µs</text>
    <rect x="78" y="107" width="83.2" height="8" rx="1.5" class="b-roaring"/>
    <text x="166.2" y="114.5" class="t-val-blue">107.6µs</text>
    <rect x="78" y="118" width="118.6" height="8" rx="1.5" class="b-v1"/>
    <text x="201.6" y="125.5" class="t-val-muted">788µs</text>
  <rect x="325" y="104" width="105" height="17" class="badge-win"/>
  <text x="377.5" y="116.0" class="badge-win-text">32.4x vs v1</text>
    <text x="0" y="169" class="t-bar-label">Sparse</text>
    <rect x="78" y="150" width="60.3" height="8" rx="1.5" class="b-expanse"/>
    <text x="143.3" y="157.5" class="t-val-green">29.8µs</text>
    <rect x="78" y="161" width="59.5" height="8" rx="1.5" class="b-roaring"/>
    <text x="142.5" y="168.5" class="t-val-blue">28.5µs</text>
    <rect x="78" y="172" width="124.8" height="8" rx="1.5" class="b-v1"/>
    <text x="207.8" y="179.5" class="t-val-muted">1.1ms</text>
  <rect x="325" y="158" width="105" height="17" class="badge-win"/>
  <text x="377.5" y="170.0" class="badge-win-text">37.6x vs v1</text>
    <text x="0" y="223" class="t-bar-label">Zipfian</text>
    <rect x="78" y="204" width="69.1" height="8" rx="1.5" class="b-expanse"/>
    <text x="152.1" y="211.5" class="t-val-green">48.9µs</text>
    <rect x="78" y="215" width="62.8" height="8" rx="1.5" class="b-roaring"/>
    <text x="145.8" y="222.5" class="t-val-blue">34.2µs</text>
    <rect x="78" y="226" width="128.9" height="8" rx="1.5" class="b-v1"/>
    <text x="211.9" y="233.5" class="t-val-muted">1.4ms</text>
  <rect x="325" y="212" width="105" height="17" class="badge-win"/>
  <text x="377.5" y="224.0" class="badge-win-text">28.8x vs v1</text>
  </g>

  <line x1="478" y1="68" x2="478" y2="330" class="divider"/>

  <!-- Panel 1B: k-Way Aggregate Algebra (#610) -->

        .divider { stroke: #21262d; }
        .t-title { fill: #f0f6fc; }
        .t-chart-title { fill: #f0f6fc; }
        .t-sub { fill: #94a3b8; }
        .t-unit { fill: #94a3b8; }
        .t-bar-label { fill: #f8fafc; }
        .t-legend { fill: #f8fafc; }
        .t-note { fill: #94a3b8; }
        .t-val-green { fill: #4ade80; }
        .t-val-blue { fill: #38bdf8; }
        .t-val-muted { fill: #94a3b8; }

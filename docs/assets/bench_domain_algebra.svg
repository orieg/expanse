<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 960 670" width="100%" height="100%">
  <title>SET ALGEBRA &amp; INTERNED SET DOMAIN BENCHMARK SUITE</title>
  <defs>
    <style>

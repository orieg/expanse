    <text x="133.9" y="103.5" class="t-val-green">16.9µs</text>
    <rect x="78" y="107" width="57.4" height="8" rx="1.5" class="b-roaring"/>
    <text x="140.4" y="114.5" class="t-val-blue">26.4µs</text>
    <rect x="78" y="118" width="77.8" height="8" rx="1.5" class="b-v1"/>
    <text x="160.8" y="125.5" class="t-val-muted">109µs</text>
  <rect x="320" y="104" width="110" height="17" class="badge-win"/>
  <text x="375.0" y="116.0" class="badge-win-text">6.4x vs fold</text>
    <text x="0" y="169" class="t-bar-label">Zipfian</text>

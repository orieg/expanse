  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <text x="30" y="28" class="t-title">SET ALGEBRA &amp; INTERNED SET DOMAIN BENCHMARK SUITE</text>
  <text x="30" y="44" class="t-sub">Direct emission (#348), k-way aggregate walk (#610), and the interned domain provenance check (#611)</text>
  <g transform="translate(610, 18)">
    <rect x="0" y="0" width="12" height="12" rx="2" class="b-expanse"/>
    <text x="16" y="10" class="t-legend">Expanse (v2 / k-Way)</text>
    <rect x="145" y="0" width="12" height="12" rx="2" class="b-roaring"/>
    <text x="161" y="10" class="t-legend">Roaring</text>
    <rect x="220" y="0" width="12" height="12" rx="2" class="b-v1"/>
    <text x="236" y="10" class="t-legend">v1 / Pairwise Fold</text>
  </g>
  <line x1="30" y1="58" x2="930" y2="58" class="divider"/>


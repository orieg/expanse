    <rect x="78" y="42" width="40.4" height="8" rx="1.5" class="b-expanse"/>
    <text x="123.4" y="49.5" class="t-val-green">9.7µs</text>
    <rect x="78" y="53" width="5.0" height="8" rx="1.5" class="b-roaring"/>

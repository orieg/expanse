  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <text x="30" y="30" class="t-title">MULTITHREADED OCC CONCURRENCY &#183; 100% READ</text>
  <text x="30" y="46" class="t-sub">Read throughput at 16 threads &#183; M ops/sec &#183; higher is better &#183; bounded 2xPOP keyspace (#375)</text>
  <g transform="translate(690, 20)">
    <rect x="0" y="0" width="12" height="12" rx="2" class="b-expanse"/>
    <text x="18" y="10" class="t-legend">Expanse OCC arm</text>
    <rect x="150" y="0" width="12" height="12" rx="2" class="b-other"/>
    <text x="168" y="10" class="t-legend">Baseline</text>
  </g>
  <line x1="30" y1="58" x2="930" y2="58" class="divider"/>
  <text x="30" y="74" class="t-note">Bars are 16-thread throughput on a zero-based linear axis; the badge is that arm's own 1&#8594;16-thread scaling.</text>
  <text x="30" y="88" class="t-note">Two runs of one commit: bars are run 1, labels and badges read run 1 / run 2. Compare arms only within the key type under each name.</text>
  <text x="30" y="113" class="t-bar-label">SyncExpanseSet</text>
  <rect x="300.0" y="104" width="263.2" height="11" rx="2" class="b-expanse"/>
  <text x="571.2" y="113" class="t-row-accent">581.3 / 443.4 M ops/s</text>
  <rect x="800" y="100" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="113" class="badge-win-text">7.31x / 5.51x</text>
  <text x="30" y="125" class="t-note">u64 keys, 1M draws</text>
  <text x="30" y="139" class="t-bar-label">SyncExpanseMap</text>
  <rect x="300.0" y="130" width="155.1" height="11" rx="2" class="b-expanse"/>
  <text x="463.1" y="139" class="t-row-accent">342.5 / 342.0 M ops/s</text>
  <rect x="800" y="126" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="139" class="badge-win-text">8.53x / 8.53x</text>
  <text x="30" y="151" class="t-note">u64 keys, 1M draws</text>
  <text x="30" y="165" class="t-bar-label">SyncExpanseBlobMap</text>
  <rect x="300.0" y="156" width="133.8" height="11" rx="2" class="b-expanse"/>
  <text x="441.8" y="165" class="t-row-accent">295.6 / 301.3 M ops/s</text>
  <rect x="800" y="152" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="165" class="badge-win-text">8.76x / 8.92x</text>
  <text x="30" y="177" class="t-note">u64 -&gt; 128-byte payload, 200k</text>
  <text x="30" y="191" class="t-bar-label">SkipMap&lt;u64, Vec&lt;u8&gt;&gt;</text>
  <rect x="300.0" y="182" width="17.7" height="11" rx="2" class="b-other"/>
  <text x="325.7" y="191" class="t-row-muted">39.2 / 39.1 M ops/s</text>
  <rect x="800" y="178" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="191" class="badge-win-text">11.38x / 11.30x</text>
  <text x="30" y="203" class="t-note">u64 -&gt; 128-byte payload, 200k</text>
  <text x="30" y="217" class="t-bar-label">RwLock&lt;BTreeMap&lt;u64, ...&gt;&gt;</text>
  <rect x="300.0" y="208" width="7.3" height="11" rx="2" class="b-other"/>
  <text x="315.3" y="217" class="t-row-muted">16.2 / 13.9 M ops/s</text>
  <rect x="800" y="204" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="217" class="badge-win-text">1.54x / 1.33x</text>
  <text x="30" y="229" class="t-note">u64 -&gt; 128-byte payload, 200k</text>
  <text x="30" y="243" class="t-bar-label">SyncExpanseBytesMap</text>
  <rect x="300.0" y="234" width="58.9" height="11" rx="2" class="b-expanse"/>
  <text x="366.9" y="243" class="t-row-accent">130.2 / 129.2 M ops/s</text>
  <rect x="800" y="230" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="243" class="badge-win-text">11.32x / 11.30x</text>
  <text x="30" y="255" class="t-note">string keys, 100k</text>
  <text x="30" y="269" class="t-bar-label">SyncExpanseStrMap</text>
  <rect x="300.0" y="260" width="34.3" height="11" rx="2" class="b-expanse"/>
  <text x="342.3" y="269" class="t-row-accent">75.8 / 75.9 M ops/s</text>
  <rect x="800" y="256" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="269" class="badge-win-text">10.84x / 10.87x</text>
  <text x="30" y="281" class="t-note">string keys, 100k</text>
  <text x="30" y="295" class="t-bar-label">DashMap&lt;Vec&lt;u8&gt;, u64&gt;</text>
  <rect x="300.0" y="286" width="59.3" height="11" rx="2" class="b-other"/>
  <text x="367.3" y="295" class="t-row-muted">131.1 / 130.2 M ops/s</text>
  <rect x="800" y="282" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="295" class="badge-win-text">8.34x / 8.37x</text>
  <text x="30" y="307" class="t-note">string keys, 100k</text>

  <line x1="30" y1="324" x2="930" y2="324" class="divider"/>
  <text x="30" y="338" class="t-bar-label">At 50% read / 50% write &#8212; 1&#8594;16 threads, read + write ops/s (a mixed-operation rate), then that arm's scaling in run 1 / run 2:</text>
  <text x="42" y="354" class="t-row-accent">SyncExpanseMap [u64 keys, 1M draws]: 28.3 &#8594; 75.0 &#8594; 94.1 M ops/s (run 1) &#183; 3.33x / 3.60x</text>
  <text x="42" y="370" class="t-row-accent">SyncExpanseSet [u64 keys, 1M draws]: 43.0 &#8594; 119.5 &#8594; 223.8 M ops/s (run 1) &#183; 5.20x / 5.26x</text>
  <text x="42" y="386" class="t-row-muted">SyncExpanseBlobMap [u64 -&gt; 128-byte payload, 200k]: 17.6 &#8594; 9.7 &#8594; 7.2 M ops/s (run 1) &#183; 0.40x / 0.40x</text>
  <text x="42" y="402" class="t-row-accent">SkipMap&lt;u64, Vec&lt;u8&gt;&gt; [u64 -&gt; 128-byte payload, 200k]: 2.0 &#8594; 6.6 &#8594; 17.6 M ops/s (run 1) &#183; 8.63x / 8.50x</text>
  <text x="42" y="418" class="t-row-muted">SyncExpanseBytesMap [string keys, 100k]: 4.3 &#8594; 3.3 &#8594; 1.1 M ops/s (run 1) &#183; 0.26x / 0.32x</text>
  <text x="42" y="434" class="t-row-accent">SyncExpanseStrMap [string keys, 100k]: 5.7 &#8594; 19.8 &#8594; 52.2 M ops/s (run 1) &#183; 9.18x / 9.14x</text>
  <text x="42" y="450" class="t-row-accent">DashMap&lt;Vec&lt;u8&gt;, u64&gt; [string keys, 100k]: 10.8 &#8594; 33.5 &#8594; 83.7 M ops/s (run 1) &#183; 7.74x / 7.81x</text>

  <text x="30" y="482" class="t-note">Measured: reference host -- 12th Gen Intel(R) Core(TM) i9-12900F, pin 0-15 &#183; runs 35533221725 and 35534176465, ref e7c97580</text>
  <text x="30" y="495" class="t-note">threads 1,4,16, 18 interleaved rounds of 500 ms windows, largest foreign busy CPUs over a group 0.05 across both runs</text>
</svg>

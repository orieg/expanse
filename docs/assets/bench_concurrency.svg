<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-concurrency" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="60%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>

    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1px; rx: 12px; }
      .track { fill: #21262d; rx: 6px; }
      .chip-green { fill: rgba(46, 160, 67, 0.15); stroke: rgba(46, 160, 67, 0.4); stroke-width: 1px; rx: 6px; }
      
      .header-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; fill: #8b949e; text-transform: uppercase; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #6e7681; }
      .label-main { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
      .metric-main { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 700; fill: #3fb950; }
      .badge-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #3fb950; }
      .caption { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .card { fill: #f6f8fa; stroke: #d0d7de; }
        .track { fill: #eaeef2; }
        .header-title { fill: #57606a; }
        .sub-title { fill: #8c959f; }
        .label-main { fill: #1f2328; }
        .metric-main { fill: #1a7f37; }
        .badge-text { fill: #1a7f37; }
        .chip-green { fill: rgba(46, 160, 67, 0.1); stroke: rgba(46, 160, 67, 0.3); }
        .caption { fill: #57606a; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <g transform="translate(24, 20)">
    <rect width="832" height="230" class="card"/>
    <text x="24" y="34" class="header-title">MULTITHREADED OCC CONCURRENCY SCALABILITY (SyncExpanseMap)</text>
    <text x="24" y="50" class="sub-title">Throughput (Million ops/sec) across 1,000,000 keys with lock-free optimistic readers (100% Read)</text>

    <!-- 1 Thread -->
    <g transform="translate(24, 76)">
      <text x="0" y="11" class="label-main">1 Thread</text>
      <rect x="110" y="0" width="530" height="12" class="track"/>
      <rect x="110" y="0" width="68" height="12" rx="6" fill="url(#grad-concurrency)"/>
      <text x="655" y="11" class="metric-main">10.1 M ops/s</text>
      <text x="760" y="11" class="sub-title">1.0×</text>
    </g>

    <!-- 4 Threads -->
    <g transform="translate(24, 108)">
      <text x="0" y="11" class="label-main">4 Threads</text>
      <rect x="110" y="0" width="530" height="12" class="track"/>
      <rect x="110" y="0" width="221" height="12" rx="6" fill="url(#grad-concurrency)"/>
      <text x="655" y="11" class="metric-main">32.8 M ops/s</text>
      <text x="760" y="11" class="sub-title">3.2×</text>
    </g>

    <!-- 8 Threads -->
    <g transform="translate(24, 140)">
      <text x="0" y="11" class="label-main">8 Threads</text>
      <rect x="110" y="0" width="530" height="12" class="track"/>
      <rect x="110" y="0" width="269" height="12" rx="6" fill="url(#grad-concurrency)"/>
      <text x="655" y="11" class="metric-main">39.8 M ops/s</text>
      <text x="760" y="11" class="sub-title">3.9×</text>
    </g>

    <!-- 16 Threads -->
    <g transform="translate(24, 172)">
      <text x="0" y="11" class="label-main">16 Threads</text>
      <rect x="110" y="0" width="530" height="12" class="track"/>
      <rect x="110" y="0" width="530" height="12" rx="6" fill="url(#grad-concurrency)"/>
      <text x="655" y="11" class="metric-main">78.4 M ops/s</text>
      <rect x="755" y="-1" width="50" height="16" class="chip-green"/>
      <text x="760" y="11" class="badge-text">7.8× lin</text>
    </g>

    <text x="24" y="212" class="caption">🔒 Readers validate subtrees via per-node version sequence counters with zero locks and zero writer stalls</text>
  </g>
</svg>

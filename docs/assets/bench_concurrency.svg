<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 285" width="100%" height="100%">
  <defs>
    <style>
      /* Default styles: Light theme by default for maximum compatibility */
      .bg { fill: #ffffff; }
      .border { stroke: #e2e8f0; stroke-width: 1px; fill: none; }
      .grid { stroke: #f1f5f9; stroke-width: 1px; stroke-dasharray: 2,3; }
      .axis { stroke: #cbd5e1; stroke-width: 1.5px; }
      
      .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 0.6px; fill: #0f172a; text-transform: uppercase; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; font-weight: 500; fill: #334155; }
      .t-unit { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #475569; }
      .t-tick { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 500; fill: #475569; }
      .t-legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #0f172a; }
      
      .line-occ { fill: none; stroke: #16a34a; stroke-width: 2.5px; stroke-linecap: round; }
      .line-linear { fill: none; stroke: #64748b; stroke-width: 1.5px; stroke-dasharray: 4,4; }
      .dot-occ { fill: #16a34a; stroke: #ffffff; stroke-width: 2px; }
      .t-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #16a34a; }

      /* Dark theme overrides */
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .border { stroke: #30363d; }
        .grid { stroke: #21262d; }
        .axis { stroke: #484f58; }
        .t-title { fill: #f0f6fc; }
        .t-sub { fill: #94a3b8; }
        .t-unit { fill: #94a3b8; }
        .t-tick { fill: #94a3b8; }
        .t-legend { fill: #f8fafc; }
        .line-occ { stroke: #22c55e; }
        .dot-occ { fill: #22c55e; stroke: #0d1117; }
        .line-linear { stroke: #8b949e; }
        .t-tag { fill: #4ade80; }
        .t-win { fill: #4ade80; }
      }

      [data-theme="dark"] .bg, :root[data-theme="dark"] .bg { fill: #0d1117; }
      [data-theme="dark"] .border, :root[data-theme="dark"] .border { stroke: #30363d; }
      [data-theme="dark"] .grid, :root[data-theme="dark"] .grid { stroke: #21262d; }
      [data-theme="dark"] .axis, :root[data-theme="dark"] .axis { stroke: #484f58; }
      [data-theme="dark"] .t-title, :root[data-theme="dark"] .t-title { fill: #f0f6fc; }
      [data-theme="dark"] .t-sub, :root[data-theme="dark"] .t-sub { fill: #94a3b8; }
      [data-theme="dark"] .t-unit, :root[data-theme="dark"] .t-unit { fill: #94a3b8; }
      [data-theme="dark"] .t-tick, :root[data-theme="dark"] .t-tick { fill: #94a3b8; }
      [data-theme="dark"] .t-legend, :root[data-theme="dark"] .t-legend { fill: #f8fafc; }
      [data-theme="dark"] .line-occ, :root[data-theme="dark"] .line-occ { stroke: #22c55e; }
      [data-theme="dark"] .dot-occ, :root[data-theme="dark"] .dot-occ { fill: #22c55e; stroke: #0d1117; }
      [data-theme="dark"] .line-linear, :root[data-theme="dark"] .line-linear { stroke: #8b949e; }
      [data-theme="dark"] .t-tag, :root[data-theme="dark"] .t-tag { fill: #4ade80; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <g transform="translate(30, 20)">
    <text x="35" y="0" class="t-title">MULTITHREADED OCC CONCURRENCY SCALABILITY (SyncExpanseMap)</text>
    <text x="35" y="14" class="t-sub">Concurrent read throughput across 1..16 threads (1,000,000 keys, 100% Read, honeycomb 24-core x86_64)</text>

    <!-- Legend -->
    <g transform="translate(600, 0)">
      <line x1="0" y1="4" x2="16" y2="4" class="line-occ"/>
      <circle cx="8" cy="4" r="3.5" class="dot-occ"/>
      <text x="22" y="7" class="t-legend">SyncExpanseMap</text>

      <line x1="150" y1="4" x2="166" y2="4" class="line-linear"/>
      <text x="172" y="7" class="t-legend">Linear Ideal</text>
    </g>

    <!-- Y Axis Header -->
    <text x="35" y="32" class="t-unit">&#9650; Throughput (M ops / sec)</text>

    <!-- Y Axis: 0 to 300M -->
    <line x1="35" y1="185" x2="865" y2="185" class="axis"/>
    <text x="27" y="188" class="t-tick" text-anchor="end">0</text>

    <line x1="35" y1="138" x2="865" y2="138" class="grid"/>
    <text x="27" y="141" class="t-tick" text-anchor="end">100M</text>

    <line x1="35" y1="92" x2="865" y2="92" class="grid"/>
    <text x="27" y="95" class="t-tick" text-anchor="end">200M</text>

    <line x1="35" y1="45" x2="865" y2="45" class="grid"/>
    <text x="27" y="48" class="t-tick" text-anchor="end">300M</text>

    <line x1="35" y1="40" x2="35" y2="185" class="axis"/>

    <!-- X Ticks -->
    <line x1="90" y1="45" x2="90" y2="185" class="grid"/>
    <text x="90" y="202" class="t-tick" text-anchor="middle">1 Thread</text>

    <line x1="260" y1="45" x2="260" y2="185" class="grid"/>
    <text x="260" y="202" class="t-tick" text-anchor="middle">2 Threads</text>

    <line x1="440" y1="45" x2="440" y2="185" class="grid"/>
    <text x="440" y="202" class="t-tick" text-anchor="middle">4 Threads</text>

    <line x1="630" y1="45" x2="630" y2="185" class="grid"/>
    <text x="630" y="202" class="t-tick" text-anchor="middle">8 Threads</text>

    <line x1="820" y1="45" x2="820" y2="185" class="grid"/>
    <text x="820" y="202" class="t-tick" text-anchor="middle">16 Threads</text>

    <!-- Linear Reference: (90, 174.8) -> (820, 63.2) -->
    <line x1="90" y1="174.8" x2="820" y2="63.2" class="line-linear"/>

    <!-- Data Line:
         1 Thread:  22.1M  -> y = 174.7
         2 Threads: 42.7M  -> y = 165.1
         4 Threads: 83.7M  -> y = 145.9
         8 Threads: 160.7M -> y = 110.0
         16 Threads: 265.8M -> y = 61.0
    -->
    <polyline points="90,174.7 260,165.1 440,145.9 630,110.0 820,61.0" class="line-occ"/>

    <!-- Points and Labels -->
    <circle cx="90" cy="174.7" r="4.5" class="dot-occ"/>
    <text x="90" y="162" class="t-tag" text-anchor="middle">22.1 M/s</text>

    <circle cx="260" cy="165.1" r="4.5" class="dot-occ"/>
    <text x="260" y="180" class="t-tag" text-anchor="middle">42.7 M/s (1.9&#215;)</text>

    <circle cx="440" cy="145.9" r="4.5" class="dot-occ"/>
    <text x="440" y="162" class="t-tag" text-anchor="middle">83.7 M/s (3.8&#215;)</text>

    <circle cx="630" cy="110.0" r="4.5" class="dot-occ"/>
    <text x="630" y="136" class="t-tag" text-anchor="middle">160.7 M/s (7.3&#215;)</text>

    <circle cx="820" cy="61.0" r="4.5" class="dot-occ"/>
    <text x="820" y="48" class="t-tag" text-anchor="middle">265.8 M/s (12.0&#215;)</text>

    <text x="450" y="235" class="t-sub" text-anchor="middle">Measured on honeycomb (24-core x86_64, Ubuntu 22.04 / kernel 6.8), commit 695b98d &#8226; 100% read; write-mixed workloads are seqlock-bound</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .border { stroke: #30363d; stroke-width: 1px; fill: none; }
      .grid { stroke: #21262d; stroke-width: 1px; stroke-dasharray: 2,3; }
      .axis { stroke: #484f58; stroke-width: 1.5px; }
      
      .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.6px; fill: #f0f6fc; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; }
      .t-unit { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #8b949e; }
      .t-tick { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #8b949e; }
      
      .line-occ { fill: none; stroke: #2ea043; stroke-width: 3px; stroke-linecap: round; }
      .line-linear { fill: none; stroke: #6e7681; stroke-width: 1.5px; stroke-dasharray: 4,4; }
      .dot-occ { fill: #2ea043; stroke: #0d1117; stroke-width: 2.5px; }
      .t-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #3fb950; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .border { stroke: #d0d7de; }
        .grid { stroke: #eaeef2; }
        .axis { stroke: #afb8c1; }
        .t-title { fill: #1f2328; }
        .t-sub { fill: #57606a; }
        .t-unit { fill: #57606a; }
        .t-tick { fill: #57606a; }
        .line-occ { stroke: #1a7f37; }
        .dot-occ { fill: #1a7f37; stroke: #ffffff; }
        .t-tag { fill: #1a7f37; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <g transform="translate(30, 25)">
    <text x="40" y="5" class="t-title">MULTITHREADED OCC CONCURRENCY SCALABILITY (SyncExpanseMap)</text>
    <text x="40" y="22" class="t-sub">Concurrent read throughput scaling across 1..16 reader threads (1,000,000 keys, 100% Read)</text>

    <!-- Legend -->
    <g transform="translate(560, 5)">
      <line x1="0" y1="6" x2="20" y2="6" class="line-occ"/>
      <circle cx="10" cy="6" r="4" class="dot-occ"/>
      <text x="28" y="10" class="t-sub" fill="#c9d1d9">SyncExpanseMap (OCC)</text>

      <line x1="190" y1="6" x2="210" y2="6" class="line-linear"/>
      <text x="218" y="10" class="t-sub">Linear Ideal</text>
    </g>

    <!-- Y Axis: 0 to 150 M ops/s -->
    <text x="40" y="44" class="t-unit">&#9650; Throughput (M ops / sec)</text>

    <line x1="40" y1="205" x2="860" y2="205" class="axis"/>
    <text x="32" y="209" class="t-tick" text-anchor="end">0</text>

    <line x1="40" y1="155" x2="860" y2="155" class="grid"/>
    <text x="32" y="159" class="t-tick" text-anchor="end">50M</text>

    <line x1="40" y1="105" x2="860" y2="105" class="grid"/>
    <text x="32" y="109" class="t-tick" text-anchor="end">100M</text>

    <line x1="40" y1="55" x2="860" y2="55" class="grid"/>
    <text x="32" y="59" class="t-tick" text-anchor="end">150M</text>

    <line x1="40" y1="50" x2="40" y2="205" class="axis"/>

    <!-- X Ticks -->
    <line x1="100" y1="55" x2="100" y2="205" class="grid"/>
    <text x="100" y="225" class="t-tick" text-anchor="middle">1 Thread</text>

    <line x1="330" y1="55" x2="330" y2="205" class="grid"/>
    <text x="330" y="225" class="t-tick" text-anchor="middle">4 Threads</text>

    <line x1="560" y1="55" x2="560" y2="205" class="grid"/>
    <text x="560" y="225" class="t-tick" text-anchor="middle">8 Threads</text>

    <line x1="800" y1="55" x2="800" y2="205" class="grid"/>
    <text x="800" y="225" class="t-tick" text-anchor="middle">16 Threads</text>

    <!-- Linear Reference -->
    <line x1="100" y1="194.9" x2="800" y2="55.0" class="line-linear"/>

    <!-- Data Line:
         1 Thread: 10.1M  -> y = 194.9
         4 Threads: 38.4M -> y = 166.6
         8 Threads: 72.8M -> y = 132.2
         16 Threads: 136.2M -> y = 68.8
    -->
    <polyline points="100,194.9 330,166.6 560,132.2 800,68.8" class="line-occ"/>

    <!-- Points and Labels -->
    <circle cx="100" cy="194.9" r="5" class="dot-occ"/>
    <text x="100" y="184" class="t-tag" text-anchor="middle">10.1 M/s (1.0&#215;)</text>

    <circle cx="330" cy="166.6" r="5" class="dot-occ"/>
    <text x="330" y="155" class="t-tag" text-anchor="middle">38.4 M/s (3.8&#215;)</text>

    <circle cx="560" cy="132.2" r="5" class="dot-occ"/>
    <text x="560" y="120" class="t-tag" text-anchor="middle">72.8 M/s (7.2&#215;)</text>

    <circle cx="800" cy="68.8" r="5" class="dot-occ"/>
    <text x="800" y="55" class="t-tag" text-anchor="middle">136.2 M/s (13.5&#215;)</text>

    <text x="450" y="255" class="t-sub" text-anchor="middle">Near-linear scaling across physical cores &#8226; Lock-free optimistic concurrency</text>
  </g>
</svg>

  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <text x="30" y="30" class="t-title">MULTITHREADED OCC CONCURRENCY &#183; 100% READ</text>
  <text x="30" y="46" class="t-sub">Read throughput at 16 threads &#183; M ops/sec &#183; higher is better &#183; bounded 2xPOP keyspace (#375)</text>
  <g transform="translate(690, 20)">
    <rect x="0" y="0" width="12" height="12" rx="2" class="b-expanse"/>
    <text x="18" y="10" class="t-legend">Expanse OCC arm</text>
    <rect x="150" y="0" width="12" height="12" rx="2" class="b-other"/>
    <text x="168" y="10" class="t-legend">Baseline</text>
  </g>
  <line x1="30" y1="58" x2="930" y2="58" class="divider"/>
  <text x="30" y="74" class="t-note">Bars are 16-thread throughput on a zero-based linear axis; the badge is that arm's own 1&#8594;16-thread scaling.</text>
  <text x="30" y="88" class="t-note">Two runs of one commit: bars are run 1, labels and badges read run 1 / run 2. Compare arms only within the key type under each name.</text>
  <text x="30" y="113" class="t-bar-label">SyncExpanseSet</text>
  <rect x="300.0" y="104" width="263.2" height="11" rx="2" class="b-expanse"/>
  <text x="571.2" y="113" class="t-row-accent">605.0 / 602.0 M ops/s</text>
  <rect x="800" y="100" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="113" class="badge-win-text">7.64x / 7.58x</text>
  <text x="30" y="125" class="t-note">u64 keys, 1M draws</text>
  <text x="30" y="139" class="t-bar-label">SyncExpanseMap</text>
  <rect x="300.0" y="130" width="151.3" height="11" rx="2" class="b-expanse"/>
  <text x="459.3" y="139" class="t-row-accent">347.8 / 354.1 M ops/s</text>
  <rect x="800" y="126" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="139" class="badge-win-text">9.07x / 8.83x</text>
  <text x="30" y="151" class="t-note">u64 keys, 1M draws</text>
  <text x="30" y="165" class="t-bar-label">SyncExpanseBlobMap</text>
  <rect x="300.0" y="156" width="127.3" height="11" rx="2" class="b-expanse"/>
  <text x="435.3" y="165" class="t-row-accent">292.7 / 303.8 M ops/s</text>
  <rect x="800" y="152" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="165" class="badge-win-text">8.64x / 9.01x</text>
  <text x="30" y="177" class="t-note">u64 -&gt; 128-byte payload, 200k</text>
  <text x="30" y="191" class="t-bar-label">SkipMap&lt;u64, Vec&lt;u8&gt;&gt;</text>
  <rect x="300.0" y="182" width="16.8" height="11" rx="2" class="b-other"/>
  <text x="324.8" y="191" class="t-row-muted">38.6 / 38.5 M ops/s</text>
  <rect x="800" y="178" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="191" class="badge-win-text">11.14x / 11.14x</text>
  <text x="30" y="203" class="t-note">u64 -&gt; 128-byte payload, 200k</text>
  <text x="30" y="217" class="t-bar-label">RwLock&lt;BTreeMap&lt;u64, ...&gt;&gt;</text>
  <rect x="300.0" y="208" width="6.1" height="11" rx="2" class="b-other"/>
  <text x="314.1" y="217" class="t-row-muted">14.0 / 16.0 M ops/s</text>
  <rect x="800" y="204" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="217" class="badge-win-text">1.33x / 1.53x</text>
  <text x="30" y="229" class="t-note">u64 -&gt; 128-byte payload, 200k</text>
  <text x="30" y="243" class="t-bar-label">SyncExpanseBytesMap</text>
  <rect x="300.0" y="234" width="52.5" height="11" rx="2" class="b-expanse"/>
  <text x="360.5" y="243" class="t-row-accent">120.8 / 116.2 M ops/s</text>
  <rect x="800" y="230" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="243" class="badge-win-text">10.53x / 10.17x</text>
  <text x="30" y="255" class="t-note">string keys, 100k</text>
  <text x="30" y="269" class="t-bar-label">SyncExpanseStrMap</text>
  <rect x="300.0" y="260" width="33.7" height="11" rx="2" class="b-expanse"/>
  <text x="341.7" y="269" class="t-row-accent">77.5 / 77.8 M ops/s</text>
  <rect x="800" y="256" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="269" class="badge-win-text">10.93x / 10.97x</text>
  <text x="30" y="281" class="t-note">string keys, 100k</text>
  <text x="30" y="295" class="t-bar-label">DashMap&lt;Vec&lt;u8&gt;, u64&gt;</text>
  <rect x="300.0" y="286" width="57.0" height="11" rx="2" class="b-other"/>
  <text x="365.0" y="295" class="t-row-muted">131.0 / 130.0 M ops/s</text>
  <rect x="800" y="282" width="130" height="18" class="badge-win"/>
  <text x="865.0" y="295" class="badge-win-text">8.36x / 8.38x</text>
  <text x="30" y="307" class="t-note">string keys, 100k</text>

  <line x1="30" y1="324" x2="930" y2="324" class="divider"/>
  <text x="30" y="338" class="t-bar-label">At 50% read / 50% write &#8212; 1&#8594;16 threads, read + write ops/s (a mixed-operation rate), then that arm's scaling in run 1 / run 2:</text>
  <text x="42" y="354" class="t-row-accent">SyncExpanseMap [u64 keys, 1M draws]: 28.4 &#8594; 74.6 &#8594; 103.6 M ops/s (run 1) &#183; 3.65x / 3.73x</text>
  <text x="42" y="370" class="t-row-accent">SyncExpanseSet [u64 keys, 1M draws]: 42.7 &#8594; 120.7 &#8594; 226.4 M ops/s (run 1) &#183; 5.30x / 5.27x</text>
  <text x="42" y="386" class="t-row-muted">SyncExpanseBlobMap [u64 -&gt; 128-byte payload, 200k]: 17.6 &#8594; 9.8 &#8594; 7.3 M ops/s (run 1) &#183; 0.40x / 0.38x</text>
  <text x="42" y="402" class="t-row-accent">SkipMap&lt;u64, Vec&lt;u8&gt;&gt; [u64 -&gt; 128-byte payload, 200k]: 2.1 &#8594; 6.6 &#8594; 17.5 M ops/s (run 1) &#183; 8.53x / 8.55x</text>
  <text x="42" y="418" class="t-row-accent">SyncExpanseBytesMap [string keys, 100k]: 4.9 &#8594; 14.6 &#8594; 33.6 M ops/s (run 1) &#183; 6.92x / 6.75x</text>
  <text x="42" y="434" class="t-row-accent">SyncExpanseStrMap [string keys, 100k]: 5.8 &#8594; 20.2 &#8594; 53.5 M ops/s (run 1) &#183; 9.25x / 9.14x</text>
  <text x="42" y="450" class="t-row-accent">DashMap&lt;Vec&lt;u8&gt;, u64&gt; [string keys, 100k]: 10.8 &#8594; 33.2 &#8594; 83.6 M ops/s (run 1) &#183; 7.76x / 7.79x</text>

  <text x="30" y="482" class="t-note">Measured: reference host -- 12th Gen Intel(R) Core(TM) i9-12900F, pin 0-15 &#183; runs 35617717693 and 35619244412, ref 0a3ed07a</text>
  <text x="30" y="495" class="t-note">threads 1,4,16, 18 interleaved rounds of 500 ms windows, largest foreign busy CPUs over a group 0.30 across both runs</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 285" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .border { stroke: #30363d; stroke-width: 1px; fill: none; }
      .grid { stroke: #21262d; stroke-width: 1px; stroke-dasharray: 2,3; }
      .axis { stroke: #484f58; stroke-width: 1.5px; }
      
      .t-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 0.8px; fill: #8b949e; text-transform: uppercase; }
      .t-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 10px; fill: #6e7681; }
      .t-unit { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 600; fill: #8b949e; }
      .t-tick { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; fill: #8b949e; }
      
      .line-occ { fill: none; stroke: #2ea043; stroke-width: 2.5px; stroke-linecap: round; }
      .line-linear { fill: none; stroke: #6e7681; stroke-width: 1.5px; stroke-dasharray: 4,4; }
      .dot-occ { fill: #2ea043; stroke: #0d1117; stroke-width: 2px; }
      .t-tag { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; font-weight: 700; fill: #3fb950; }

      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .border { stroke: #d0d7de; }
        .grid { stroke: #eaeef2; }
        .axis { stroke: #afb8c1; }
        .t-title { fill: #57606a; }
        .t-sub { fill: #8c959f; }
        .t-unit { fill: #57606a; }
        .t-tick { fill: #57606a; }
        .line-occ { stroke: #1a7f37; }
        .dot-occ { fill: #1a7f37; stroke: #ffffff; }
        .t-tag { fill: #1a7f37; }
      }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="8"/>
  <rect width="100%" height="100%" class="border" rx="8"/>

  <g transform="translate(30, 20)">
    <text x="35" y="0" class="t-title">MULTITHREADED OCC CONCURRENCY SCALABILITY (SyncExpanseMap)</text>
    <text x="35" y="14" class="t-sub">Concurrent read throughput across 1..16 threads (1,000,000 keys, 100% Read, Honeycomb 16-Core Server)</text>

    <!-- Legend -->
    <g transform="translate(600, 0)">
      <line x1="0" y1="4" x2="16" y2="4" class="line-occ"/>
      <circle cx="8" cy="4" r="3.5" class="dot-occ"/>
      <text x="22" y="7" class="t-sub" fill="#c9d1d9">SyncExpanseMap</text>

      <line x1="150" y1="4" x2="166" y2="4" class="line-linear"/>
      <text x="172" y="7" class="t-sub">Linear Ideal</text>
    </g>

    <!-- Y Axis Header -->
    <text x="35" y="32" class="t-unit">&#9650; Throughput (M ops / sec)</text>

    <!-- Y Axis: 0 to 300M -->
    <line x1="35" y1="185" x2="865" y2="185" class="axis"/>
    <text x="27" y="188" class="t-tick" text-anchor="end">0</text>

    <line x1="35" y1="138" x2="865" y2="138" class="grid"/>
    <text x="27" y="141" class="t-tick" text-anchor="end">100M</text>

    <line x1="35" y1="92" x2="865" y2="92" class="grid"/>
    <text x="27" y="95" class="t-tick" text-anchor="end">200M</text>

    <line x1="35" y1="45" x2="865" y2="45" class="grid"/>
    <text x="27" y="48" class="t-tick" text-anchor="end">300M</text>

    <line x1="35" y1="40" x2="35" y2="185" class="axis"/>

    <!-- X Ticks -->
    <line x1="90" y1="45" x2="90" y2="185" class="grid"/>
    <text x="90" y="202" class="t-tick" text-anchor="middle">1 Thread</text>

    <line x1="260" y1="45" x2="260" y2="185" class="grid"/>
    <text x="260" y="202" class="t-tick" text-anchor="middle">2 Threads</text>

    <line x1="440" y1="45" x2="440" y2="185" class="grid"/>
    <text x="440" y="202" class="t-tick" text-anchor="middle">4 Threads</text>

    <line x1="630" y1="45" x2="630" y2="185" class="grid"/>
    <text x="630" y="202" class="t-tick" text-anchor="middle">8 Threads</text>

    <line x1="820" y1="45" x2="820" y2="185" class="grid"/>
    <text x="820" y="202" class="t-tick" text-anchor="middle">16 Threads</text>

    <!-- Linear Reference: (90, 174.8) -> (820, 63.2) -->
    <line x1="90" y1="174.8" x2="820" y2="63.2" class="line-linear"/>

    <!-- Data Line:
         1 Thread:  21.8M  -> y = 174.8
         2 Threads: 41.7M  -> y = 165.5
         4 Threads: 82.9M  -> y = 146.3
         8 Threads: 156.5M -> y = 112.0
         16 Threads: 260.9M -> y = 63.2
    -->
    <polyline points="90,174.8 260,165.5 440,146.3 630,112.0 820,63.2" class="line-occ"/>

    <!-- Points and Labels -->
    <circle cx="90" cy="174.8" r="4.5" class="dot-occ"/>
    <text x="90" y="162" class="t-tag" text-anchor="middle">21.8 M/s</text>

    <circle cx="260" cy="165.5" r="4.5" class="dot-occ"/>
    <text x="260" y="180" class="t-tag" text-anchor="middle">41.7 M/s (1.9&#215;)</text>

    <circle cx="440" cy="146.3" r="4.5" class="dot-occ"/>
    <text x="440" y="162" class="t-tag" text-anchor="middle">82.9 M/s (3.8&#215;)</text>

    <circle cx="630" cy="112.0" r="4.5" class="dot-occ"/>
    <text x="630" y="138" class="t-tag" text-anchor="middle">156.5 M/s (7.2&#215;)</text>

    <circle cx="820" cy="63.2" r="4.5" class="dot-occ"/>
    <text x="820" y="50" class="t-tag" text-anchor="middle">260.9 M/s (12.0&#215;)</text>

    <text x="450" y="235" class="t-sub" text-anchor="middle">Measured on 16-core Intel i9-12900F &#8226; Lock-free optimistic concurrency reader scaling</text>
  </g>
</svg>
